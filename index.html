function generateWodRows(){
  state.tmp.wodDate = document.getElementById('wodDate').value || todayStr();
  state.tmp.wodName = document.getElementById('wodName').value.trim();
  const isEmom = state.tmp.wodFormat==='emom';
  const tmpl = state.tmp.wodTemplate;

  const effectiveSetsCount = tmpl.map((t,ti)=>{
    const isFollower = ti>0 && tmpl[ti-1].groupWithNext;
    if(isFollower) return null;
    const ex = state.exercises.find(e=>e.id===t.exerciseId);
    const type = getExerciseType(ex);
    const isCardio = type==='cardio' || type==='mobility';
    const pctArr = parsePctList(t.pctList);
    let setsCount = parseInt(t.setsCount) || (isCardio ? 1 : Math.max(pctArr.length,1));
    if(isEmom && !t.setsCount){
      setsCount = parseInt(state.tmp.emomRounds) || setsCount;
    }
    return setsCount;
  });
  for(let ti=1; ti<tmpl.length; ti++){
    if(effectiveSetsCount[ti]==null) effectiveSetsCount[ti] = effectiveSetsCount[ti-1];
  }

  const groupIdArr = new Array(tmpl.length).fill(null);
  let gStart = 0;
  for(let ti=0; ti<tmpl.length; ti++){
    if(ti===tmpl.length-1 || !tmpl[ti].groupWithNext){
      if(ti>gStart){
        const gid = 'g'+gStart;
        for(let k=gStart;k<=ti;k++) groupIdArr[k]=gid;
      }
      gStart = ti+1;
    }
  }

  state.tmp.wodMoves = tmpl.map((t,ti)=>{
    const ex = state.exercises.find(e=>e.id===t.exerciseId);
    const type = getExerciseType(ex);
    const isCardio = type==='cardio' || type==='mobility';
    const pctArr = parsePctList(t.pctList);
    const setsCount = effectiveSetsCount[ti];
    const known1rm = bestE1RM(t.exerciseId);
    const sets = [];
    for(let si=0; si<setsCount; si++){
      if(isCardio){
        sets.push({reps: t.qty || '', weight:'', pct:null, autoFilled: !!t.qty});
      } else {
        const pct = pctForIndex(pctArr, si);
        let weight='', autoFilled=false;
        if(pct && known1rm){
          weight = roundToIncrement(known1rm*pct/100);
          autoFilled = true;
        } else if(t.weight){
          weight = t.weight;
          autoFilled = true;
        }
        sets.push({reps: t.repsTarget || '', weight, pct: pct||null, autoFilled});
      }
    }
    const timing = isEmom ? `Every ${state.tmp.emomMin}:${String(state.tmp.emomSec).padStart(2,'0')}` : t.timing;
    return { exerciseId:t.exerciseId, timing, pctList: isCardio ? '' : t.pctList, setsCountRaw:t.setsCount, unit: isCardio ? t.unit : null, repsTarget: t.repsTarget||'', groupId: groupIdArr[ti], sets };
  });
  state.tmp.wodPhase = 'rows';
  applyFeelingFillIfNeeded();
  render();
}
function backToTemplate(){
  state.tmp.wodPhase = 'template';
  render();
}
function applyFeelingFillIfNeeded(){
  if(!state.tmp.wodNameMatch || !state.tmp.wodFeeling) return;
  state.tmp.wodMoves.forEach((mv,mi)=>{
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    const type = getExerciseType(ex);
    if(type==='cardio' || type==='mobility') return;
    const prevMv = state.tmp.wodNameMatch.movements[mi];
    if(!prevMv) return;
    mv.sets.forEach((s,si)=>{
      if(s.weight==='' || s.autoFilled){
        const prevSet = prevMv.sets[si];
        if(prevSet && prevSet.weight){
          s.weight = roundToIncrement(prevSet.weight * FEELING_ADJUST[state.tmp.wodFeeling]);
          s.autoFilled = true;
        }
      }
    });
  });
}

}

async function saveWod(){
  const date = state.tmp.wodDate || todayStr();
  const name = (state.tmp.wodName||'').trim();
  const note = state.tmp.wodNote || '';
  const movements = state.tmp.wodMoves.map(mv=>{
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    const type = getExerciseType(ex);
    const isQtyBased = type==='cardio' || type==='mobility';
    const sets = isQtyBased
      ? mv.sets.filter(s=>s.reps).map(s=>({ reps: parseFloat(s.reps), weight: null, pct: null }))
      : mv.sets.filter(s=>s.reps && s.weight).map(s=>({ reps: parseInt(s.reps), weight: parseFloat(s.weight), pct: s.pct || null }));
    return { exerciseId: mv.exerciseId, timing: mv.timing || '', unit: isQtyBased ? mv.unit : null, repsTarget: mv.repsTarget || '', groupId: mv.groupId ?? null, sets };
  }).filter(mv=>mv.sets.length>0);
  if(!movements.length){ showToast('Bitte mindestens einen Satz mit gültigen Werten eingeben'); return; }
  state.workouts.push({id:uid(), date, name, note, format: state.tmp.wodFormat, movements});
  await saveKey('workouts', state.workouts);

  state.tmp.wodMoves = null;
  state.tmp.wodPhase = 'template';
  state.tmp.wodDate = null;
  state.tmp.wodName = null;
  state.tmp.wodNameMatch = null;
  state.tmp.wodFeeling = null;
  state.tmp.wodNote = null;
  showToast('Workout gespeichert 🏋️');
  render();
}

/* ---------- SHARED TICK ENGINE (used by Timer tab & Live-Workout rest pause) ---------- */
let tickHandle = null;
let activeTicker = null; // 'timer' | 'live' | null
function startTicking(owner, onTick){
  stopTicking();
  activeTicker = owner;
  tickHandle = setInterval(onTick, 100);
  onTick();
}
function stopTicking(){
  if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  activeTicker = null;
}
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.35);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(200);
}
function fmtClock(ms, withTenths){
  ms = Math.max(0, ms);
  const totalSec = ms/1000;
  const m = Math.floor(totalSec/60);
  const s = Math.floor(totalSec%60);
  const base = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(withTenths){
    const t = Math.floor((ms%1000)/100);
    return `${base}.${t}`;
  }
  return base;
}

/* ---------- GPS-Lauferfassung (Standalone-Format "Run" + Inline-Button bei Run/Lauf-Bewegungen) ---------- */
function haversineMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function formatPace(distanceM, elapsedMs){
  if(distanceM<50 || elapsedMs<=0) return '–:--';
  const paceUnitM = distanceUnitLabel()==='mi' ? M_PER_MILE : 1000;
  const units = distanceM / paceUnitM;
  const secPerUnit = (elapsedMs/1000) / units;
  const m = Math.floor(secPerUnit/60);
  const s = Math.round(secPerUnit%60);
  return `${m}:${String(s).padStart(2,'0')}/${distanceUnitLabel()==='mi'?'mi':'km'}`;
}
function startGpsRun(mode, inlineTarget){
  if(!navigator.geolocation){ showToast('GPS wird von diesem Browser nicht unterstützt'); return; }
  state.tmp.gps = {
    mode, inlineTarget: inlineTarget||null,
    watchId: null, active: true, distanceM: 0, lastFix: null,
    startedAt: Date.now(), elapsedMs: 0, running: true, error: null
  };
  state.tmp.gps.watchId = navigator.geolocation.watchPosition(onGpsFix, onGpsError, {enableHighAccuracy:true, maximumAge:0, timeout:15000});
  startTicking('live', tickGpsRun);
  render();
}
function onGpsFix(pos){
  const g = state.tmp.gps;
  if(!g || !g.active) return;
  const {latitude, longitude, accuracy} = pos.coords;
  if(accuracy!=null && accuracy>30) return; // zu ungenauer Fix, verwerfen
  if(g.lastFix){
    const dt = (pos.timestamp - g.lastFix.t)/1000;
    const segment = haversineMeters(g.lastFix.lat, g.lastFix.lon, latitude, longitude);
    const speed = dt>0 ? segment/dt : 0;
    if(segment>=2 && speed<12){ // Rauschen (zu klein) und GPS-Sprünge (>43km/h) filtern
      g.distanceM += segment;
    }
  }
  g.lastFix = {lat:latitude, lon:longitude, t:pos.timestamp};
  const distEl = document.getElementById('gpsDistanceDisplay');
  if(distEl) distEl.textContent = `${toDisplayDistance(g.distanceM)}${distanceUnitLabel()}`;
  const paceEl = document.getElementById('gpsPaceDisplay');
  if(paceEl) paceEl.textContent = formatPace(g.distanceM, Date.now()-g.startedAt+g.elapsedMs);
}
function onGpsError(err){
  const g = state.tmp.gps;
  if(!g) return;
  const messages = {1:'Standortzugriff verweigert.', 2:'Kein GPS-Signal gefunden.', 3:'Zeitüberschreitung beim Standortabruf.'};
  g.error = messages[err.code] || 'GPS-Fehler.';
  g.active = false;
  g.running = false;
  stopTicking();
  render();
}
function tickGpsRun(){
  const g = state.tmp.gps;
  if(!g || !g.running){ stopTicking(); return; }
  const elapsed = g.elapsedMs + (Date.now()-g.startedAt);
  const el = document.getElementById('gpsTimeDisplay');
  if(el) el.textContent = fmtClock(elapsed,false);
}
function pauseGpsRun(){
  const g = state.tmp.gps;
  if(g && g.running){
    g.elapsedMs += Date.now()-g.startedAt;
    g.running = false;
    stopTicking();
  }
  render();
}
function resumeGpsRun(){
  const g = state.tmp.gps;
  if(!g) return;
  g.startedAt = Date.now();
  g.running = true;
  startTicking('live', tickGpsRun);
  render();
}
function stopGpsRun(){
  const g = state.tmp.gps;
  if(!g) return;
  if(g.watchId!=null) navigator.geolocation.clearWatch(g.watchId);
  stopTicking();
  if(g.running){ g.elapsedMs += Date.now()-g.startedAt; g.running = false; }
  g.active = false;
  if(g.mode==='inline' && g.inlineTarget){
    if(g.inlineTarget.flow==='wod'){
      const mv = state.tmp.wodMoves && state.tmp.wodMoves[g.inlineTarget.mi];
      const s = mv && mv.sets[g.inlineTarget.si];
      if(s){ s.reps = String(Math.round(g.distanceM)); s.autoFilled = false; }
      if(mv) mv.unit = 'm';
    } else if(g.inlineTarget.flow==='for-load'){
      const b = state.tmp.forLoadBuilder;
      if(b){ b.achievedWeight = String(Math.round(g.distanceM)); b.unit = 'm'; }
    } else {
      const builder = g.inlineTarget.flow==='amrap' ? state.tmp.amrapBuilder : state.tmp.forTimeBuilder;
      if(builder && builder.movements[g.inlineTarget.mi]){
        builder.movements[g.inlineTarget.mi].reps = String(Math.round(g.distanceM));
        builder.movements[g.inlineTarget.mi].unit = 'm';
      }
    }
    state.tmp.gps = null;
  }
  render();
}
function renderGpsLiveView(){
  const g = state.tmp.gps;
  const minimal = g.mode==='inline';
  return `
    <div class="card" style="text-align:center;">
      <div class="stat-label">${minimal ? 'Lauf wird getrackt' : 'GPS-Tracking läuft'}</div>
      <div id="gpsDistanceDisplay" class="stat-num" style="font-size:48px;margin:14px 0;">${toDisplayDistance(g.distanceM)}${distanceUnitLabel()}</div>
      ${minimal ? '' : `
      <div class="row" style="margin-bottom:14px;">
        <div><div id="gpsTimeDisplay" class="stat-num" style="font-size:22px;">${fmtClock(g.elapsedMs,false)}</div><div class="stat-label">Zeit</div></div>
        <div><div id="gpsPaceDisplay" class="stat-num" style="font-size:22px;">${formatPace(g.distanceM, g.elapsedMs)}</div><div class="stat-label">Pace</div></div>
      </div>`}
      ${g.error ? `<div class="note" style="color:var(--plate-red);margin-bottom:10px;">${escapeHtml(g.error)}</div>` : ''}
      <div class="row">
        <button class="btn ${g.running?'btn-ghost':'btn-primary'}" onclick="${g.running?'pauseGpsRun()':'resumeGpsRun()'}">${g.running?'Pause':'Weiter'}</button>
        <button class="btn btn-primary" onclick="stopGpsRun()">Stopp</button>
      </div>
    </div>
  `;
}

function pauseStopwatch(){
  const t = state.tmp.timer;
  if(t.swRunning){ t.swElapsed += Date.now()-t.swStartedAt; }
  t.swRunning = false;
  stopTicking();
  render();
}
function resetStopwatch(){
  const t = state.tmp.timer;
  if(t.swRunning) stopTicking();
  t.swRunning = false; t.swElapsed = 0; t.swStartedAt = null; t.swLaps = [];
  render();
}
function lapStopwatch(){
  const t = state.tmp.timer;
  if(!t.swRunning) return;
  t.swLaps.unshift(t.swElapsed + (Date.now()-t.swStartedAt));
  render();
}
/* Countdown */
function updateCountdownInput(field, val){ state.tmp.timer[field] = val; }
function startCountdown(){
  const t = state.tmp.timer;
  if(t.cdRemaining<=0){
    t.cdTotal = (parseInt(t.cdMin)||0)*60000 + (parseInt(t.cdSec)||0)*1000;
    if(t.cdTotal<=0){ showToast('Bitte eine Dauer eingeben'); return; }
    t.cdRemaining = t.cdTotal;
  }
  t.cdRunning = true;
  t.cdStartedAt = Date.now();
  startTicking('timer', tickCountdown);
  render();
}
function tickCountdown(){
  const t = state.tmp.timer;
  const remaining = t.cdRemaining - (Date.now()-t.cdStartedAt);
  const display = document.getElementById('timerBigDisplay');
  if(remaining<=0){
    if(display) display.textContent = fmtClock(0,false);
    t.cdRemaining = 0; t.cdRunning = false;
    stopTicking();
    beep();
    showToast('Countdown beendet ⏰');
    render();
    return;
  }
  if(display) display.textContent = fmtClock(remaining,false);
}
function pauseCountdown(){
  const t = state.tmp.timer;
  if(t.cdRunning){ t.cdRemaining = Math.max(0, t.cdRemaining - (Date.now()-t.cdStartedAt)); }
  t.cdRunning = false;
  stopTicking();
  render();
}
function resetCountdown(){
  const t = state.tmp.timer;
  stopTicking();
  t.cdRunning = false; t.cdRemaining = 0; t.cdTotal = 0; t.cdStartedAt = null;
  render();
}
/* Intervalltimer */
function updateIntervalInput(field, val){ state.tmp.timer[field] = val; }
function startInterval(){
  const t = state.tmp.timer;
  if(t.ivRemaining<=0 || t.ivPhase==='done'){
    t.ivWorkSec = parseInt(t.ivWorkSec)||20;
    t.ivRestSec = parseInt(t.ivRestSec)||0;
    t.ivRounds = parseInt(t.ivRounds)||1;
    t.ivRound = 1;
    t.ivPhase = 'work';
    t.ivRemaining = t.ivWorkSec*1000;
  }
  t.ivRunning = true;
  t.ivStartedAt = Date.now();
  startTicking('timer', tickInterval);
  render();
}
function advanceIntervalRound(t){
  if(t.ivRound >= t.ivRounds){
    t.ivPhase = 'done';
  } else {
    t.ivRound += 1;
    t.ivPhase = 'work';
    t.ivRemaining = t.ivWorkSec*1000;
    t.ivStartedAt = Date.now();
  }
}
function tickInterval(){
  const t = state.tmp.timer;
  const remaining = t.ivRemaining - (Date.now()-t.ivStartedAt);
  const display = document.getElementById('timerBigDisplay');
  if(remaining>0){
    if(display) display.textContent = fmtClock(remaining,false);
    return;
  }
  beep();
  if(t.ivPhase==='work' && t.ivRestSec>0){
    t.ivPhase = 'rest';
    t.ivRemaining = t.ivRestSec*1000;
    t.ivStartedAt = Date.now();
  } else {
    advanceIntervalRound(t);
  }
  if(t.ivPhase==='done'){
    t.ivRunning = false;
    stopTicking();
    showToast('Intervall-Timer fertig 🔥');
  }
  render();
}
function pauseInterval(){
  const t = state.tmp.timer;
  if(t.ivRunning){ t.ivRemaining = Math.max(0, t.ivRemaining - (Date.now()-t.ivStartedAt)); }
  t.ivRunning = false;
  stopTicking();
  render();
}
function resetInterval(){
  const t = state.tmp.timer;
  stopTicking();
  t.ivRunning = false; t.ivRound = 1; t.ivPhase = 'work'; t.ivRemaining = 0; t.ivStartedAt = null;
  render();
}
function renderTimer(){
  const t = state.tmp.timer;
  const modeBtn = (m,label)=>`<button class="btn btn-sm ${t.mode===m?'btn-primary':'btn-ghost'}" style="flex:1;" onclick="switchTimerMode('${m}')">${label}</button>`;
  let body = '';
  if(t.mode==='stopwatch') body = renderStopwatchUI(t);
  if(t.mode==='countdown') body = renderCountdownUI(t);
  if(t.mode==='interval') body = renderIntervalUI(t);
  return `
    <div class="card">
      <h2>Timer</h2>
      <div class="row" style="margin-bottom:16px;">
        ${modeBtn('countdown','Countdown')}
        ${modeBtn('interval','Intervall')}
        ${modeBtn('stopwatch','Stoppuhr')}
      </div>
      ${body}
    </div>
  `;
}
function renderStopwatchUI(t){
  const running = t.swRunning;
  const lapsHtml = t.swLaps.length ? t.swLaps.map((l,i)=>`
    <div class="history-item"><span class="date">Runde ${t.swLaps.length-i}</span><span class="val">${fmtClock(l,true)}</span></div>
  `).join('') : '';
  return `
    <div style="text-align:center;padding:20px 0;">
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;">${fmtClock(t.swElapsed,true)}</div>
    </div>
    <div class="row">
      ${running
        ? `<button class="btn btn-ghost" onclick="pauseStopwatch()">Pause</button><button class="btn btn-primary" onclick="lapStopwatch()">Runde</button>`
        : `<button class="btn btn-primary" onclick="startStopwatch()">${t.swElapsed>0?'Weiter':'Start'}</button><button class="btn btn-ghost" onclick="resetStopwatch()">Reset</button>`
      }
    </div>
    ${lapsHtml ? `<hr class="hairline"><div class="stat-label" style="margin-bottom:6px;">Runden</div>${lapsHtml}` : ''}
  `;
}
function renderCountdownUI(t){
  const running = t.cdRunning;
  const configuring = !running && t.cdRemaining<=0;
  const displayMs = t.cdRemaining>0 ? t.cdRemaining : ((parseInt(t.cdMin)||0)*60000 + (parseInt(t.cdSec)||0)*1000);
  return `
    ${configuring ? `
    <div class="row">
      <div class="field"><label>Minuten</label><input type="number" step="1" min="0" value="${t.cdMin}" oninput="updateCountdownInput('cdMin',this.value)"></div>
      <div class="field"><label>Sekunden</label><input type="number" step="1" min="0" max="59" value="${t.cdSec}" oninput="updateCountdownInput('cdSec',this.value)"></div>
    </div>` : ''}
    <div style="text-align:center;padding:20px 0;">
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;">${fmtClock(displayMs,false)}</div>
    </div>
    <div class="row">
      ${running
        ? `<button class="btn btn-ghost" onclick="pauseCountdown()">Pause</button>`
        : `<button class="btn btn-primary" onclick="startCountdown()">${t.cdRemaining>0?'Weiter':'Start'}</button>`
      }
      <button class="btn btn-ghost" onclick="resetCountdown()">Reset</button>
    </div>
  `;
}
function renderIntervalUI(t){
  const running = t.ivRunning;
  const configuring = !running && t.ivPhase!=='done' && t.ivRemaining<=0;
  const phaseLabel = t.ivPhase==='work' ? 'Belastung' : t.ivPhase==='rest' ? 'Pause' : 'Fertig';
  const displayMs = t.ivRemaining>0 ? t.ivRemaining : ((parseInt(t.ivWorkSec)||0)*1000);
  return `
    ${configuring ? `
    <div class="row">
      <div class="field"><label>Belastung (Sek.)</label><input type="number" step="1" min="1" value="${t.ivWorkSec}" oninput="updateIntervalInput('ivWorkSec',this.value)"></div>
      <div class="field"><label>Pause (Sek.)</label><input type="number" step="1" min="0" value="${t.ivRestSec}" oninput="updateIntervalInput('ivRestSec',this.value)"></div>
    </div>
    <div class="field"><label>Runden</label><input type="number" step="1" min="1" value="${t.ivRounds}" oninput="updateIntervalInput('ivRounds',this.value)"></div>
    ` : `<div class="stat-label" style="text-align:center;">Runde ${t.ivRound}/${t.ivRounds} · <span id="timerSubLabel">${phaseLabel}</span></div>`}
    <div style="text-align:center;padding:20px 0;">
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;">${t.ivPhase==='done'?'FERTIG':fmtClock(displayMs,false)}</div>
    </div>
    <div class="row">
      ${running
        ? `<button class="btn btn-ghost" onclick="pauseInterval()">Pause</button>`
        : `<button class="btn btn-primary" onclick="startInterval()">${t.ivRemaining>0 && t.ivPhase!=='done' ? 'Weiter' : 'Start'}</button>`
      }
      <button class="btn btn-ghost" onclick="resetInterval()">Reset</button>
    </div>
  `;
}

async function savePrEntry(){
  const exId = document.getElementById('prExercise').value;
  const value = parseFloat(document.getElementById('prValue').value);
  const date = document.getElementById('prDate').value || todayStr();
  if(!value){ showToast('Bitte ein Gewicht eingeben'); return; }
  if(state.tmp.editingPrId){
    const entry = state.prEntries.find(p=>p.id===state.tmp.editingPrId);
    if(entry){ entry.exerciseId=exId; entry.value=value; entry.date=date; }
    state.tmp.editingPrId = null;
  } else {
    state.prEntries.push({id:uid(), exerciseId:exId, value, date});
  }
  state.tmp.prExerciseSelection = null;
  await saveKey('prEntries', state.prEntries);
  showToast('1RM gespeichert 🏆');
  render();
}
function editPrEntry(id){
  state.tmp.editingPrId = id;
  render();
}
function updatePrExerciseVariant(variantId){
  const currentId = state.tmp.editingPrId
    ? state.prEntries.find(p=>p.id===state.tmp.editingPrId)?.exerciseId
    : (state.tmp.prExerciseSelection || (state.exercises[0] && state.exercises[0].id));
  const ex = state.exercises.find(e=>e.id===currentId);
  const match = matchLibraryVariant(ex);
  if(!match) return;
  const variant = match.base.variants.find(v=>v.id===variantId);
  if(!variant) return;
  const newId = findOrCreateExerciseId(composeVariantName(match.base, variant, ''), variant.type || match.base.type || 'weighted');
  state.tmp.prExerciseSelection = newId;
  render();
}
function cancelEditPr(){
  state.tmp.editingPrId = null;
  render();
}
async function deletePrEntry(id){
  state.prEntries = state.prEntries.filter(p=>p.id!==id);
  if(state.tmp.editingPrId===id) state.tmp.editingPrId = null;
  await saveKey('prEntries', state.prEntries);
  showToast('Eintrag gelöscht');
  render();
}

function mountNutritionChart(){
  const canvas = document.getElementById('kcalChart');
  if(!canvas || typeof Chart==='undefined') return;
  const days = [];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const totals = days.map(d=> state.nutritionLogs.filter(n=>n.date===d).reduce((s,n)=>s+(n.kcal||0),0));
  if(charts.kcal) charts.kcal.destroy();
  charts.kcal = new Chart(canvas, {
    type:'bar',
    data:{ labels: days.map(d=>fmtDate(d)), datasets:[{ data: totals, backgroundColor:'#C8443C', borderRadius:4 }]},
    options:{ plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:chartTickColor(),font:{size:9}},grid:{display:false}}, y:{ticks:{color:chartTickColor()},grid:{color:chartGridColor()}}}}
  });
}

function renderProgress(){
  const section = state.tmp.progressSection;
  if(section==='1rm') return renderProgress1RM();
  if(section==='times') return renderProgressTimes();
  if(section==='body') return renderProgressBody();
  if(section==='history') return renderProgressHistory();
  return renderProgressMenu();
}
function renderProgressMenu(){
  return `
    <div class="card">
      <h2>Fortschritt</h2>
      <button class="btn btn-ghost" style="justify-content:space-between;margin-bottom:10px;" onclick="setProgressSection('1rm')">🏋️ 1RM</button>
      <button class="btn btn-ghost" style="justify-content:space-between;margin-bottom:10px;" onclick="setProgressSection('times')">⏱️ Bestzeiten</button>
      <button class="btn btn-ghost" style="justify-content:space-between;margin-bottom:10px;" onclick="setProgressSection('body')">📏 Körpermaße</button>
      <button class="btn btn-ghost" style="justify-content:space-between;" onclick="setProgressSection('history')">📋 Verlauf</button>
    </div>
  `;
}
function renderProgressHistory(){
  return `
    <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="setProgressSection(null)">← Zurück</button>
    ${renderWorkoutHistory()}
  `;
}
function setProgressSection(s){ state.tmp.progressSection = s; render(); }
function renderProgress1RM(){
  const exWithLogs = state.exercises.filter(e=>exerciseLogs(e.id).length>0).sort((a,b)=>a.name.localeCompare(b.name,'de'));
  const selectedEx = state.tmp.progressExercise || (exWithLogs[0] && exWithLogs[0].id);
  const exOptions = exWithLogs.map(e=>`<option value="${e.id}" ${e.id===selectedEx?'selected':''}>${e.name}</option>`).join('');

  return `
    <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="setProgressSection(null)">← Zurück</button>
    <div class="card">
      <h2>1RM-Fortschritt</h2>
      ${exWithLogs.length ? `
      <div class="field"><select onchange="setProgressExercise(this.value)">${exOptions}</select></div>
      <div class="chart-wrap"><canvas id="e1rmChart"></canvas></div>
      ` : `<div class="empty-state"><div class="watermark">${iconBarbell()}</div>Noch keine Trainingsdaten vorhanden.</div>`}
    </div>
    ${renderPrCards()}
  `;
}
function renderProgressTimes(){
  return `
    <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="setProgressSection(null)">← Zurück</button>
    ${renderTimeCards()}
  `;
}
function renderProgressBody(){
  const measurementsHtml = state.measurements.slice().reverse().slice(0,6).map(m=>`
    <div class="history-item">
      <span class="date">${fmtDate(m.date)}</span>
      <span class="val">${escapeHtml(formatMeasurementLine(m))}</span>
      <button class="remove-row" onclick="deleteMeasurement('${m.id}')">✕</button>
    </div>`).join('') || `<div class="note">Noch keine Einträge.</div>`;

  const selectedMetric = state.tmp.progressMetric || 'weight';
  const selectedBm = BODY_METRICS.find(bm=>bm.key===selectedMetric);
  const hasDataForSelected = state.measurements.some(m=>m[selectedMetric]!=null);
  const metricButtons = BODY_METRICS.map(bm=>`<button class="btn ${bm.key===selectedMetric?'btn-primary':'btn-ghost'}" style="flex:1 1 30%;" onclick="setProgressMetric('${bm.key}')">${bm.label}</button>`).join('');

  return `
    <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="setProgressSection(null)">← Zurück</button>
    <div class="card">
      <h2>Körpermaße über Zeit</h2>
      <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:14px;">${metricButtons}</div>
      ${hasDataForSelected ? `<div class="chart-wrap"><canvas id="bodyChart"></canvas></div>` : `<div class="empty-state"><div class="watermark">${iconBarbell()}</div>Noch keine ${escapeHtml(selectedBm.label)}-Messungen vorhanden.</div>`}
    </div>
    <div class="card">
      <h2>Neue Messung</h2>
      <div class="field"><label>Datum</label><input type="date" id="measDate" value="${todayStr()}"></div>
      <div class="row">
        <div class="field"><label>Gewicht (kg)</label><input type="number" step="0.1" id="measWeight"></div>
        <div class="field"><label>Taille (cm)</label><input type="number" step="0.5" id="measWaist"></div>
      </div>
      <div class="row">
        <div class="field"><label>Bauch (cm)</label><input type="number" step="0.5" id="measBelly"></div>
        <div class="field"><label>Hüfte (cm)</label><input type="number" step="0.5" id="measHip"></div>
      </div>
      <div class="row">
        <div class="field"><label>Brust (cm)</label><input type="number" step="0.5" id="measChest"></div>
        <div class="field"><label>Arme (cm)</label><input type="number" step="0.5" id="measArms"></div>
      </div>
      <button class="btn btn-primary" onclick="saveMeasurement()">Speichern</button>
    </div>
    <div class="card">
      <h2 class="small">Letzte Messungen</h2>
      ${measurementsHtml}
    </div>
  `;
}
function setProgressExercise(v){ state.tmp.progressExercise = v; render(); }
function setProgressMetric(v){ state.tmp.progressMetric = v; render(); }
async function saveMeasurement(){
  const date = document.getElementById('measDate').value || todayStr();
  const entry = {
    id:uid(), date,
    weight: parseFloat(document.getElementById('measWeight').value)||null,
    waist: parseFloat(document.getElementById('measWaist').value)||null,
    belly: parseFloat(document.getElementById('measBelly').value)||null,
    hip: parseFloat(document.getElementById('measHip').value)||null,
    chest: parseFloat(document.getElementById('measChest').value)||null,
    arms: parseFloat(document.getElementById('measArms').value)||null
  };
  state.measurements.push(entry);
  await saveKey('measurements', state.measurements);
  showToast('Messung gespeichert');
  render();
}
async function deleteMeasurement(id){
  state.measurements = state.measurements.filter(m=>m.id!==id);
  await saveKey('measurements', state.measurements);
  render();
}
function mountProgressCharts(){
  if(typeof Chart==='undefined') return;
  const bCanvas = document.getElementById('bodyChart');
  if(bCanvas){
    const selectedMetric = state.tmp.progressMetric || 'weight';
    const bm = BODY_METRICS.find(x=>x.key===selectedMetric);
    const pts = state.measurements.filter(m=>m[selectedMetric]!=null).sort((a,b)=>a.date.localeCompare(b.date));
    if(charts.body) charts.body.destroy();
    if(bm && pts.length){
      charts.body = new Chart(bCanvas, {
        type:'line',
        data:{ labels: pts.map(p=>fmtDate(p.date)), datasets:[{ data: pts.map(p=>p[selectedMetric]), borderColor: bm.color, backgroundColor: bm.color+'26', fill:true, tension:0.3 }]},
        options:{ plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:chartTickColor(),font:{size:9}},grid:{display:false}}, y:{ticks:{color:chartTickColor()},grid:{color:chartGridColor()}}}}
      });
    }
  }
  const eCanvas = document.getElementById('e1rmChart');
  if(eCanvas){
    const exWithLogs = state.exercises.filter(e=>exerciseLogs(e.id).length>0).sort((a,b)=>a.name.localeCompare(b.name,'de'));
    const selectedEx = state.tmp.progressExercise || (exWithLogs[0] && exWithLogs[0].id);
    const pts = exerciseLogs(selectedEx);
    if(charts.e1rm) charts.e1rm.destroy();
    charts.e1rm = new Chart(eCanvas, {
      type:'line',
      data:{ labels: pts.map(p=>fmtDate(p.date)), datasets:[{ data: pts.map(p=>Math.round(sessionE1RM(p))), borderColor:'#C8443C', backgroundColor:'rgba(200,68,60,0.15)', fill:true, tension:0.3 }]},
      options:{ plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:chartTickColor(),font:{size:9}},grid:{display:false}}, y:{ticks:{color:chartTickColor()},grid:{color:chartGridColor()}}}}
    });
  }
}

/* ---------- PROFILE TAB ---------- */
function renderTrainingPlanCard(){
  const plan = state.trainingPlan;
  const form = state.tmp.planForm || (plan ? {status:plan.status, location:plan.location, frequency:plan.frequency} : {status:'anfaenger', location:'box', frequency:3});

  const summary = plan ? `
    <div class="note" style="margin-bottom:10px;">Aktueller Plan: ${plan.frequency}× / Woche</div>
    ${PLAN_DAY_KEYS.filter(k=>plan.days[k]).map(k=>`
      <div class="history-item"><span class="date">${WEEKDAY_LABELS[PLAN_DAY_KEYS.indexOf(k)]}</span><span class="val">${escapeHtml(planEntryLabel(plan.days[k])||'—')}</span></div>
    `).join('')}
    <hr class="hairline">
  ` : `<div class="note" style="margin-bottom:10px;">Noch kein Plan erstellt.</div>`;

  return `
    <div class="card">
      <h2>Trainingsplan (CrossFit)</h2>
      ${summary}
      <div class="field"><label>Trainingsstatus</label>
        <select id="planStatus" onchange="updatePlanForm('status',this.value)">
          <option value="anfaenger" ${form.status==='anfaenger'?'selected':''}>Anfänger</option>
          <option value="fortgeschritten" ${form.status==='fortgeschritten'?'selected':''}>Fortgeschritten</option>
          <option value="profi" ${form.status==='profi'?'selected':''}>Profi</option>
        </select>
      </div>
      <div class="field"><label>Trainingsort</label>
        <select id="planLocation" onchange="updatePlanForm('location',this.value)">
          <option value="box" ${form.location==='box'?'selected':''}>Box / Fitnessstudio</option>
          <option value="zuhause-geraete" ${form.location==='zuhause-geraete'?'selected':''}>Zuhause mit Geräten</option>
          <option value="zuhause-ohne" ${form.location==='zuhause-ohne'?'selected':''}>Zuhause ohne Geräte</option>
        </select>
      </div>
      <div class="field"><label>Häufigkeit (pro Woche)</label>
        <select id="planFrequency" onchange="updatePlanForm('frequency',this.value)">
          ${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${parseInt(form.frequency)===n?'selected':''}>${n}×</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-primary" onclick="createTrainingPlan()">${plan?'Plan neu erstellen':'Plan erstellen'}</button>
    </div>
  `;
}
function updatePlanForm(field, val){
  if(!state.tmp.planForm){
    const plan = state.trainingPlan;
    state.tmp.planForm = plan ? {status:plan.status, location:plan.location, frequency:plan.frequency} : {status:'anfaenger', location:'box', frequency:3};
  }
  state.tmp.planForm[field] = val;
}
async function createTrainingPlan(){
  const form = state.tmp.planForm || {status:'anfaenger', location:'box', frequency:3};
  state.trainingPlan = generateTrainingPlan(form.status, form.location, form.frequency);
  state.tmp.planForm = null;
  await saveKey('trainingPlan', state.trainingPlan);
  showToast('Trainingsplan erstellt 📋');
  render();
}
function renderProfile(){
  const section = state.tmp.profileSection;
  if(section==='settings') return renderProfileSettings();
  if(section==='data') return renderProfileData();
  return renderProfileMenu();
}
function renderProfileMenu(){
  return `
    <div class="card">
      <h2>Profil</h2>
      <button class="btn btn-ghost" style="justify-content:space-between;margin-bottom:10px;" onclick="setProfileSection('settings')">⚙️ Einstellungen</button>
      <button class="btn btn-ghost" style="justify-content:space-between;" onclick="setProfileSection('data')">🗑️ Daten-Verwaltung</button>
    </div>
  `;
}
function setProfileSection(s){ state.tmp.profileSection = s; render(); }
function renderProfileSettings(){
  const p = state.profile || {};
  const theme = p.theme || 'dark';
  return `
    <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="setProfileSection(null)">← Zurück</button>
    <div class="card">
      <h2 class="small">Hilfe</h2>
      <button class="btn btn-ghost" onclick="reopenOnboarding()">📖 Kurzanleitung erneut zeigen</button>
    </div>
    <div class="card">
      <h2 class="small">Konto</h2>
      <div class="note" style="margin-bottom:10px;">Angemeldet als ${escapeHtml((pb.authStore.record&&pb.authStore.record.email)||'—')}</div>
      ${pb.authStore.record && !pb.authStore.record.verified ? `
        <div class="note" style="color:var(--plate-red);margin-bottom:10px;">E-Mail-Adresse noch nicht bestätigt.</div>
        <button class="btn btn-ghost" style="margin-bottom:10px;" onclick="resendVerification()">Bestätigungs-Mail erneut senden</button>
      ` : ''}
      <button class="btn btn-danger" onclick="logout()">Abmelden</button>
    </div>
    <div class="card">
      <h2>Darstellung</h2>
      <div class="row">
        <button class="btn ${theme==='dark'?'btn-primary':'btn-ghost'}" onclick="setTheme('dark')">Dunkel</button>
        <button class="btn ${theme==='light'?'btn-primary':'btn-ghost'}" onclick="setTheme('light')">Hell</button>
      </div>
    </div>
    <div class="card">
      <h2>Grunddaten</h2>
      <div class="row">
        <div class="field"><label>Größe (cm)</label><input type="number" id="pHeight" value="${p.height||''}"></div>
        <div class="field"><label>Gewicht (kg)</label><input type="number" step="0.1" id="pWeight" value="${p.weight||''}"></div>
      </div>
      <div class="row">
        <div class="field"><label>Alter</label><input type="number" id="pAge" value="${p.age||''}"></div>
        <div class="field"><label>Geschlecht</label>
          <select id="pGender">
            <option value="m" ${p.gender==='m'?'selected':''}>Männlich</option>
            <option value="w" ${p.gender==='w'?'selected':''}>Weiblich</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveProfile()">Speichern</button>
    </div>
    <div class="card">
      <h2 class="small">Einheiten</h2>
      <div class="row">
        <div class="field"><label>Gewicht</label>
          <select id="pWeightUnit">
            <option value="kg" ${(!p.weightUnit||p.weightUnit==='kg')?'selected':''}>kg</option>
            <option value="lbs" ${p.weightUnit==='lbs'?'selected':''}>lbs</option>
          </select>
        </div>
        <div class="field"><label>Distanz</label>
          <select id="pDistanceUnit">
            <option value="m" ${(!p.distanceUnit||p.distanceUnit==='m')?'selected':''}>Meter</option>
            <option value="mi" ${p.distanceUnit==='mi'?'selected':''}>Meilen</option>
          </select>
        </div>
      </div>
      <div class="note" style="margin-bottom:10px;">Gilt für Gewichts- und Distanz-Angaben bei For Time / AMRAP / For Load. Bereits gespeicherte Werte werden intern weiterhin in kg/Meter geführt und nur zur Anzeige umgerechnet.</div>
      <button class="btn btn-primary" onclick="saveProfile()">Speichern</button>
    </div>
    <div class="card">
      <h2 class="small">Skalierung</h2>
      <div class="field">
        <label>Skalierungsstufe</label>
        <select id="pScaleTier">
          <option value="rx" ${(!p.scaleTier||p.scaleTier==='rx')?'selected':''}>Rx</option>
          <option value="intermediate" ${p.scaleTier==='intermediate'?'selected':''}>Intermediate</option>
          <option value="scaled" ${p.scaleTier==='scaled'?'selected':''}>Scaled</option>
        </select>
      </div>
      <div class="note" style="margin-bottom:10px;">Wird beim Foto-Import automatisch für Gewichts-Vorgaben wie "Rx: 22,5/15kg" verwendet (in Kombination mit deinem Geschlecht unter Grunddaten). Bleibt pro Übung weiterhin überschreibbar.</div>
      <button class="btn btn-primary" onclick="saveProfile()">Speichern</button>
    </div>
  `;
}
function renderProfileData(){
  return `
    <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="setProfileSection(null)">← Zurück</button>
    <div class="card">
      <h2>Daten-Verwaltung</h2>
      <div class="note" style="margin-bottom:10px;">Deine Daten werden ausschließlich für dich gespeichert.</div>
      <button class="btn btn-danger" onclick="handleResetClick()">${state.tmp.confirmReset ? 'Wirklich? Ja, alles löschen' : 'Alle Daten löschen'}</button>
      ${state.tmp.confirmReset ? `<button class="btn btn-ghost" style="margin-top:8px;" onclick="cancelResetClick()">Abbrechen</button>` : ''}
    </div>
  `;
}
function handleResetClick(){
  if(state.tmp.confirmReset){ resetAll(); }
  else { state.tmp.confirmReset = true; render(); }
}
function cancelResetClick(){
  state.tmp.confirmReset = false;
  render();
}
async function saveProfile(){
  state.profile = {
    ...state.profile,
    height: parseFloat(document.getElementById('pHeight').value)||null,
    weight: parseFloat(document.getElementById('pWeight').value)||null,
    age: parseInt(document.getElementById('pAge').value)||null,
    gender: document.getElementById('pGender').value,
    weightUnit: document.getElementById('pWeightUnit').value,
    distanceUnit: document.getElementById('pDistanceUnit').value,
    scaleTier: document.getElementById('pScaleTier').value
  };
  await saveKey('profile', state.profile);
  showToast('Profil gespeichert');
  render();
}
async function resetAll(){
  stopTicking();
  await Promise.all(['profile','exercises','workouts','trainingLogs','wods','nutritionLogs','measurements','prEntries','timeRecords','trainingPlan'].map(deleteKey));
  state = {profile:null, exercises: cloneDefaultExercises(), workouts:[], nutritionLogs:[], measurements:[], prEntries:[], timeRecords:[], trainingPlan:null, activeTab:'profile', tmp: defaultTmp()};
  await saveKey('exercises', state.exercises);
  showToast('Daten gelöscht');
  render();
}

/* ---------- Utils ---------- */
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML;
}
function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

boot();
</script>
</body>
</html>
