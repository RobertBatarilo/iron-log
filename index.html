function renderRevenuePieChart(segments){
  const total = segments.reduce((s,seg)=>s+seg.cents, 0);
  const r = 40, cx = 50, cy = 50, circumference = 2*Math.PI*r;
  let cumulative = 0;
  const circles = total>0 ? segments.filter(seg=>seg.cents>0).map(seg=>{
    const pct = seg.cents/total;
    const dash = pct*circumference;
    const offset = -(cumulative*circumference);
    cumulative += pct;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="20" stroke-dasharray="${dash.toFixed(2)} ${(circumference-dash).toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
  }).join('') : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--iron-700)" stroke-width="20"></circle>`;
  const legend = segments.map(seg=>{
    const pct = total>0 ? Math.round(seg.cents/total*100) : 0;
    return `<div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
      <span style="width:12px;height:12px;border-radius:3px;background:${seg.color};flex:0 0 auto;"></span>
      <span style="flex:1;">${escapeHtml(seg.label)}</span>
      <span class="note" style="margin:0;">${fmtEuro(seg.cents)}${total>0?' ('+pct+'%)':''}</span>
    </div>`;
  }).join('');
  return `
    <div style="display:flex;justify-content:center;margin-bottom:6px;">
      <svg viewBox="0 0 100 100" style="width:160px;height:160px;">${circles}</svg>
    </div>
    ${legend}
  `;
}
function renderCreditRevenueScreen(){
  const rev = state.box.creditRevenue;
  const back = `<button class="btn btn-ghost" style="margin-bottom:14px;" onclick="closeCreditRevenueScreen()">← Zurück</button>`;
  if(rev===null || rev===undefined) return `${back}<div class="card"><div class="note">Lädt …</div></div>`;
  if(rev.error) return `${back}<div class="card"><div class="note">Umsatzdaten konnten nicht geladen werden.</div></div>`;

  const { creditOrders, planOrders, allCards, allTx, allPlans } = rev;
  const rowStyle = 'display:flex;justify-content:space-between;';
  const creditRevenueCents = creditOrders.reduce((s,o)=>s+(o.amountCents||0), 0);

  const recurringPlans = allPlans.filter(p=>p.type==='recurring' && p.status==='active');
  const pricedRecurring = recurringPlans.filter(p=>p.priceCents);
  const unpricedRecurringCount = recurringPlans.length - pricedRecurring.length;
  const monthlyRevenueCents = pricedRecurring.reduce((s,p)=>s+(p.priceCents||0), 0);

  // Einmalige Kontingente kommen aus zwei Quellen: Stripe-Selbstkauf (plan_orders) UND
  // manuelle Zuteilung durch den Coach ("Kontingent anlegen", membership_plans ohne
  // zugehoerigen plan_orders-Datensatz) - beide muessen in die Summe/Aufschluesselung.
  // Selbstkaeufe per Stripe (erkennbar an einem zugehoerigen plan_orders-Datensatz) NICHT
  // als "manuell zugeteilt ohne Preis" zaehlen - deren Umsatz ist bereits ueber planOrders
  // erfasst, und /credit/plan-order-fulfilled setzt bei ihnen bewusst kein priceCents
  // (siehe server-deploy/pb_hooks/credit_plan_checkout.pb.js), das sind keine fehlenden
  // Preise, sondern schlicht keine manuellen Zuteilungen.
  const selfPurchasedPlanIds = new Set(planOrders.map(o=>o.membershipPlan).filter(Boolean));
  const manualOneTime = allPlans.filter(p=>p.type==='one-time' && !selfPurchasedPlanIds.has(p.id));
  const pricedManualOneTime = manualOneTime.filter(p=>p.priceCents);
  const unpricedManualOneTimeCount = manualOneTime.length - pricedManualOneTime.length;

  const planRevenueCents = planOrders.reduce((s,o)=>s+(o.amountCents||0), 0)
    + pricedManualOneTime.reduce((s,p)=>s+(p.priceCents||0), 0);
  const totalRevenueCents = creditRevenueCents + planRevenueCents;

  const creditByOffer = {};
  creditOrders.forEach(o=>{
    const title = o.offerSnapshot?.title || 'Unbekanntes Angebot';
    if(!creditByOffer[title]) creditByOffer[title] = { count:0, revenueCents:0 };
    creditByOffer[title].count += 1;
    creditByOffer[title].revenueCents += o.amountCents||0;
  });
  const planByTemplate = {};
  planOrders.forEach(o=>{
    const name = o.templateSnapshot?.name || 'Unbekanntes Paket';
    if(!planByTemplate[name]) planByTemplate[name] = { count:0, revenueCents:0 };
    planByTemplate[name].count += 1;
    planByTemplate[name].revenueCents += o.amountCents||0;
  });
  pricedManualOneTime.forEach(p=>{
    const name = p.name || 'Unbenanntes Kontingent';
    if(!planByTemplate[name]) planByTemplate[name] = { count:0, revenueCents:0 };
    planByTemplate[name].count += 1;
    planByTemplate[name].revenueCents += p.priceCents||0;
  });

  // Bestehende computeCardBalance() wiederverwenden statt Vorzeichen-basiert selbst zu
  // zaehlen - die zaehlt "correction"-Buchungen bereits korrekt separat statt sie
  // faelschlich als "eingeloest"/"ausgegeben" zu werten (index.html:6353-6362).
  let unitsGranted = 0, unitsRedeemed = 0, unitsOutstanding = 0;
  allCards.forEach(c=>{
    const balance = computeCardBalance(c.id, allTx);
    unitsGranted += balance.granted;
    unitsRedeemed += balance.redeemed;
    unitsOutstanding += balance.remaining;
  });

  const creditRows = Object.entries(creditByOffer).sort((a,b)=>b[1].revenueCents-a[1].revenueCents)
    .map(([title,d])=>`<div style="${rowStyle}"><span>${escapeHtml(title)} (${d.count}×)</span><span>${fmtEuro(d.revenueCents)}</span></div>`).join('');
  const planRows = Object.entries(planByTemplate).sort((a,b)=>b[1].revenueCents-a[1].revenueCents)
    .map(([name,d])=>`<div style="${rowStyle}"><span>${escapeHtml(name)} (${d.count}×)</span><span>${fmtEuro(d.revenueCents)}</span></div>`).join('');

  const pieChart = renderRevenuePieChart([
    { label:'Laufende Verträge', cents: monthlyRevenueCents, color:'var(--accent-emom)' },
    { label:'Einmalige Kontingente', cents: planRevenueCents, color:'var(--accent-forload)' },
    { label:'Guthabenkarten', cents: creditRevenueCents, color:'var(--success-green)' }
  ]);

  return `
    ${back}
    <div class="card">
      <h2 class="small">Gesamtumsatz</h2>
      <div class="stat-num" style="margin:6px 0;">${fmtEuro(totalRevenueCents)}</div>
      <div class="note">${creditOrders.length + planOrders.length} bezahlte Bestellungen insgesamt</div>
    </div>
    <div class="card">
      <h2 class="small">Verteilung</h2>
      ${pieChart}
    </div>
    <div class="card">
      <h2 class="small">Laufende Verträge</h2>
      <div class="moves">
        <div style="${rowStyle}"><span>Aktive Verträge</span><span>${recurringPlans.length}</span></div>
        <div style="${rowStyle}"><span>Monatliche Einnahmen</span><span>${fmtEuro(monthlyRevenueCents)}</span></div>
      </div>
      ${unpricedRecurringCount ? `<div class="note" style="margin-top:10px;">${unpricedRecurringCount} von ${recurringPlans.length} Verträgen ohne hinterlegten Preis (nicht in der Summe enthalten) — Preis nachtragen unter "Standardpakete verwalten" oder direkt beim Mitglied.</div>` : ''}
    </div>
    <div class="card">
      <h2 class="small">Einmalige Kontingente</h2>
      <div class="moves">
        <div style="${rowStyle}"><span>Umsatz gesamt</span><span>${fmtEuro(planRevenueCents)}</span></div>
        ${planRows || '<div class="note">Noch keine Käufe.</div>'}
      </div>
      ${unpricedManualOneTimeCount ? `<div class="note" style="margin-top:10px;">${unpricedManualOneTimeCount} von ${manualOneTime.length} manuell zugeteilten Kontingenten ohne hinterlegten Preis (nicht in der Summe enthalten).</div>` : ''}
    </div>

      </div>
      <div class="note" style="margin-top:10px;">Ausgegebene Einheiten: ${unitsGranted} · eingelöst: ${unitsRedeemed} · noch offen: ${unitsOutstanding}</div>
    </div>
  `;
}
async function startCreditQrScan(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showToast('Kamera wird von diesem Browser nicht unterstützt'); return;
  }
  try{ await loadJsQrIfNeeded(); }
  catch(e){ showToast(e.message); return; }
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){
    showToast('Kamerazugriff verweigert oder nicht verfügbar'); return;
  }
  state.tmp.creditScan = {active:true, result:null, stream};
  render();
  const video = document.getElementById('creditScanVideo');
  if(!video){ stopCreditQrScan(false); return; }
  video.srcObject = stream;
  await video.play();
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  function tick(){
    const scan = state.tmp.creditScan;
    if(!scan || !scan.active) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = window.jsQR(imageData.data, imageData.width, imageData.height);
      if(code && code.data){
        let payload = null;
        try{ payload = JSON.parse(code.data); }catch(e){ /* kein gültiges Payload */ }
        if(payload && payload.t){
          scan.result = payload;
          stopCreditQrScan(true);
          render();
          return;
        }
      }
    }
    scan.rafId = requestAnimationFrame(tick);
  }
  state.tmp.creditScan.rafId = requestAnimationFrame(tick);
}
function stopCreditQrScan(keepResult){
  const scan = state.tmp.creditScan;
  if(!scan) return;
  if(scan.rafId) cancelAnimationFrame(scan.rafId);
  if(scan.stream) scan.stream.getTracks().forEach(t=>t.stop());
  scan.active = false;
  scan.stream = null;
  if(!keepResult) scan.result = null;
}
function vibrateIfSupported(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){ /* z.B. iOS Safari ohne Vibration API */ }
}
// Erzeugter Ton statt Audiodatei: Mobile-Browser blockieren oft automatisch abgespielten
// Ton, wenn er nicht von einem direkten Tastendruck ausgeloest wird. unlockAudioContext()
// wird deshalb IM Klick-Handler von "Einlösen" aufgerufen (echte Nutzer-Geste), danach
// kann derselbe AudioContext auch spaeter (z.B. aus dem Polling-Callback) zuverlaessig
// Ton abspielen, ohne erneut vom Browser blockiert zu werden.
function unlockAudioContext(){
  try{
    if(!state.tmp.audioCtx) state.tmp.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(state.tmp.audioCtx.state==='suspended') state.tmp.audioCtx.resume();
  }catch(e){ /* Web Audio API nicht verfuegbar */ }
}
function playSuccessSound(){
  try{
    const ctx = state.tmp.audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    state.tmp.audioCtx = ctx;
    const now = ctx.currentTime;
    [[880,now,0.12],[1320,now+0.1,0.18]].forEach(([freq,start,dur])=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start+dur);
    });
  }catch(e){ /* Web Audio API nicht verfuegbar/blockiert */ }
}
async function confirmCreditRedemption(token){
  try{
    const result = await pb.send('/credit/redemption/confirm', {method:'POST', body:{token}});
    if(!result || !result.ok) throw new Error((result&&result.error)||'Einlösung fehlgeschlagen');
    vibrateIfSupported(200);
    playSuccessSound();
    state.tmp.creditScan = {active:false, result:null, success:result};
    render();
  }catch(e){
    vibrateIfSupported([80,60,80]);
    showToast((e&&e.message)||'Einlösung fehlgeschlagen');
  }
}

async function saveScheduleSlot(id){
  const startTime = document.getElementById('slotStartTime').value.trim();
  const label = document.getElementById('slotLabel').value.trim();
  const coachName = document.getElementById('slotCoachName').value.trim();
  const durationMin = parseInt(document.getElementById('slotDuration').value) || 60;
  const capacity = parseInt(document.getElementById('slotCapacity').value) || 12;
  const minRaw = (document.getElementById('slotMinParticipants')?.value || '').trim();
  const minParticipants = minRaw==='' ? null : parseInt(minRaw);
  const cutoffRaw = (document.getElementById('slotCancellationCutoffHours')?.value || '').trim();
  const cancellationCutoffHours = cutoffRaw==='' ? null : parseInt(cutoffRaw);
  if(!startTime || !label){ showToast('Bitte Uhrzeit und Bezeichnung angeben'); return; }
  const boxId = state.box.membership.box;
  const isOneTime = document.getElementById('slotOneTime')?.checked;
  try{
    if(isOneTime){
      const oneTimeDate = document.getElementById('slotOneTimeDate')?.value;
      if(!oneTimeDate){ showToast('Bitte ein Datum wählen'); return; }
      const weekday = new Date(oneTimeDate+'T00:00:00').getDay();
      const payload = {weekday, oneTimeDate, startTime, label, coachName, durationMin, capacity, minParticipants, cancellationCutoffHours};
      if(id) await pb.collection('schedule_slots').update(id, payload);
      else await pb.collection('schedule_slots').create({box:boxId, ...payload});
    } else if(id){
      const weekday = parseInt(document.getElementById('slotWeekday').value);
      await pb.collection('schedule_slots').update(id, {weekday, oneTimeDate:null, startTime, label, coachName, durationMin, capacity, minParticipants, cancellationCutoffHours});
    } else {
      const weekdays = Array.from(document.querySelectorAll('.slotWeekdayCheck:checked')).map(el=>parseInt(el.value));
      if(!weekdays.length){ showToast('Bitte mindestens einen Wochentag wählen'); return; }
      for(const weekday of weekdays){
        await pb.collection('schedule_slots').create({box:boxId, weekday, oneTimeDate:null, startTime, label, coachName, durationMin, capacity, minParticipants, cancellationCutoffHours});
      }
    }
    state.tmp.boxScheduleEditId = null;
    state.tmp.scheduleEnsuredDates = new Set();
    showToast('Kursplan gespeichert');
    await loadBoxData();
    if(state.tmp.boxSubTab==='schedule' && state.tmp.scheduleSelectedDate){
      await selectScheduleDate(state.tmp.scheduleSelectedDate);
    }
  }catch(e){
    showToast('Speichern fehlgeschlagen');
  }
}

async function publishBoxWorkout(){

const LEADERBOARD_PERIODS = [
  {key:'week', label:'Letzte Woche', days:7},
  {key:'month', label:'Letzter Monat', days:30},
  {key:'quarter', label:'Letztes Quartal', days:90},
  {key:'half', label:'Letztes Halbjahr', days:182},
  {key:'year', label:'Letztes Jahr', days:365},
  {key:'all', label:'All Time', days:null}
];
function computeBoxLeaderboard(periodKey){
  const period = LEADERBOARD_PERIODS.find(p=>p.key===periodKey) || LEADERBOARD_PERIODS[1];
  const bookings = state.box.allAttendedBookings || [];
  const todayD = todayStr();
  let cutoff = null;
  if(period.days!=null){
    const d = new Date(todayD+'T00:00:00');
    d.setDate(d.getDate()-period.days);
    cutoff = localDateStr(d);
  }
  const counts = {};
  for(const b of bookings){
    const date = b.expand?.classInstance?.date;
    if(!date || date>todayD) continue;
    if(cutoff && date<cutoff) continue;
    const uid = b.user;
    if(!counts[uid]) counts[uid] = {userId:uid, name: b.userName || 'Athlet', count:0};
    counts[uid].count++;
  }
  return Object.values(counts).sort((a,b)=>b.count-a.count || a.name.localeCompare(b.name,'de'));
}
function computeMyAttendedDates(periodKey){
  const period = LEADERBOARD_PERIODS.find(p=>p.key===periodKey) || LEADERBOARD_PERIODS[1];
  const bookings = state.box.allAttendedBookings || [];
  const meId = pb.authStore.record?.id;
  const todayD = todayStr();
  let cutoff = null;
  if(period.days!=null){
    const d = new Date(todayD+'T00:00:00');
    d.setDate(d.getDate()-period.days);
    cutoff = localDateStr(d);
  }
  const dates = bookings
    .filter(b=>b.user===meId)
    .map(b=>b.expand?.classInstance?.date)
    .filter(d=>d && d<=todayD && (!cutoff || d>=cutoff));
  return [...new Set(dates)].sort((a,b)=>b.localeCompare(a));
}
function computeAttendanceRecordForPeriod(periodDays){
  const meId = pb.authStore.record?.id;
  const dates = [...new Set((state.box.allAttendedBookings||[])
    .filter(b=>b.user===meId)
    .map(b=>b.expand?.classInstance?.date)
    .filter(Boolean))].sort();
  if(!dates.length) return 0;
  const start = new Date(dates[0]+'T00:00:00');
  const buckets = {};
  dates.forEach(d=>{
    const diffDays = Math.floor((new Date(d+'T00:00:00')-start)/86400000);
    const bucketIdx = Math.floor(diffDays/periodDays);
    buckets[bucketIdx] = (buckets[bucketIdx]||0)+1;
  });
  return Math.max(...Object.values(buckets));
}

// Solange der QR-Code angezeigt wird, fragt das Athleten-Handy periodisch nach, ob die
// Zaehltheke den Code schon bestaetigt hat - es gibt keine Push-/Live-Verbindung dafuer,
// also einfaches Polling ueber die normale PocketBase-Collection-API (die Berechtigungs-
// regel von credit_redemption_proofs erlaubt dem Karteninhaber ohnehin das Lesen seines
// eigenen Nachweises).
function stopRedemptionPolling(){
  if(state.tmp.myCreditPollTimer){ clearInterval(state.tmp.myCreditPollTimer); state.tmp.myCreditPollTimer = null; }
}
function startRedemptionPolling(proofId, cardId, expiresAt){
  stopRedemptionPolling();
  state.tmp.myCreditPollTimer = setInterval(async ()=>{
    if(expiresAt && new Date(expiresAt).getTime() < Date.now()){
      stopRedemptionPolling(); return; // Code laengst abgelaufen, kein Grund mehr weiterzufragen
    }
    let proof;
    try{ proof = await pb.collection('credit_redemption_proofs').getOne(proofId); }
    catch(e){ return; }
    if(proof.status==='consumed'){
      stopRedemptionPolling();
      vibrateIfSupported(200);
      playSuccessSound();
      await loadBoxData();
      const txs = state.box.myCreditTransactions || [];
      const balance = computeCardBalance(cardId, txs);
      state.tmp.myCreditIssuedProof = null;
      state.tmp.myCreditDetailCardId = cardId;
      state.tmp.myCreditRedeemSuccessFlash = {remaining: balance.remaining};
      render();
    } else if(proof.status==='expired' || proof.status==='cancelled'){
      stopRedemptionPolling();
    }
  }, 2000);
}
async function buyCreditOffer(offerId){
  unlockAudioContext(); // synchron im Klick-Handler, damit der Erfolgston bei Rueckkehr von Stripe zuverlaessig spielt
  try{
    const result = await pb.send('/credit/checkout-session', {method:'POST', body:{offerId}});
    if(!result || !result.ok) throw new Error((result&&result.error)||'Kauf konnte nicht gestartet werden');
    location.href = result.checkoutUrl;
  }catch(e){
    showToast((e&&e.message)||'Kauf konnte nicht gestartet werden');
  }
}
async function startCardRedemption(cardId, unitsRequested){
  unlockAudioContext(); // muss synchron im Klick-Handler passieren, nicht erst nach dem await
  try{
    const result = await pb.send('/credit/redemption/issue', {method:'POST', body:{cardId, unitsRequested}});
    if(!result || !result.ok) throw new Error((result&&result.error)||'Einlösung konnte nicht gestartet werden');
    state.tmp.myCreditIssuedProof = result;
    render();
    await loadQrCodeGeneratorIfNeeded();
    const canvas = document.getElementById('myCreditQrCanvas');
    if(canvas && window.QRCode){
      window.QRCode.toCanvas(canvas, JSON.stringify({t: result.token, c: result.cardId}), {width:220});
    }
    startRedemptionPolling(result.proofId, cardId, result.expiresAt);
  }catch(e){
    showToast((e&&e.message)||'Einlösung konnte nicht gestartet werden');
  }
}

let _weekSwipe = null;
function weekSwipeStart(event){
  const t = event.touches ? event.touches[0] : event;
  _weekSwipe = { x: t.clientX, y: t.clientY };
}
function weekSwipeEnd(event, onSwipeLeft, onSwipeRight){
  if(!_weekSwipe) return;
  const t = event.changedTouches ? event.changedTouches[0] : event;
  const dx = t.clientX - _weekSwipe.x, dy = t.clientY - _weekSwipe.y;
  _weekSwipe = null;
  if(Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)*1.5) return;
  (dx < 0 ? onSwipeLeft : onSwipeRight)();
}
const SWIPE_DELETE_WIDTH = 76;
let _cardSwipe = null;
function cardSwipeStart(event, id){
  const wrap = event.currentTarget;
  const content = wrap.querySelector('.swipe-content');
  const t = event.touches ? event.touches[0] : event;
  _cardSwipe = { id, content, startX: t.clientX, startY: t.clientY, dx: 0, locked: null };
  document.querySelectorAll('.swipe-content').forEach(el=>{
    if(el!==content) el.style.transform = 'translateX(0px)';
  });
}
function cardSwipeMove(event){
  if(!_cardSwipe) return;
  const t = event.touches ? event.touches[0] : event;
  const dx = t.clientX - _cardSwipe.startX, dy = t.clientY - _cardSwipe.startY;
  if(_cardSwipe.locked===null && (Math.abs(dx)>6 || Math.abs(dy)>6)){
    _cardSwipe.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if(_cardSwipe.locked!=='x') return;
  const base = state.tmp.swipedWorkoutId===_cardSwipe.id ? -SWIPE_DELETE_WIDTH : 0;
  const clamped = Math.max(-SWIPE_DELETE_WIDTH, Math.min(0, base+dx));
  _cardSwipe.dx = clamped - base;
  _cardSwipe.content.style.transform = `translateX(${clamped}px)`;
}
function cardSwipeEnd(event, id){
  if(!_cardSwipe || _cardSwipe.id!==id){ _cardSwipe = null; return; }
  const wasOpen = state.tmp.swipedWorkoutId===id;
  const finalX = (wasOpen ? -SWIPE_DELETE_WIDTH : 0) + _cardSwipe.dx;
  _cardSwipe = null;
  state.tmp.swipedWorkoutId = finalX < -SWIPE_DELETE_WIDTH/2 ? id : null;
  render();
}

function computeMuscleGroupLoad(days){
  const cutoff = (()=>{ const d=new Date(todayStr()+'T00:00:00'); d.setDate(d.getDate()-days); return localDateStr(d); })();
  const counts = { arme:0, brust:0, bauch:0, beine:0, ruecken:0 };
  state.workouts.filter(w=>w.date>=cutoff).forEach(w=>{
    const groups = new Set();
    if(w.format==='run') groups.add(PATTERN_TO_MUSCLE_GROUP.run);
    workoutExerciseIds(w).forEach(exId=>{
      const ex = state.exercises.find(e=>e.id===exId);
      const group = ex?.movementPattern ? PATTERN_TO_MUSCLE_GROUP[ex.movementPattern] : null;
      if(group) groups.add(group);
    });
    groups.forEach(g=>{ counts[g] = counts[g]+1; });
  });
  return counts;
}

function workoutExerciseIds(w){
  if(w.format==='for-time') return (w.forTime?.movements||[]).map(m=>m.exerciseId).filter(Boolean);
  if(w.format==='amrap') return (w.amrap?.movements||[]).map(m=>m.exerciseId).filter(Boolean);
  if(w.format==='for-load') return w.forLoad?.exerciseId ? [w.forLoad.exerciseId] : [];
  if(w.format==='run') return [];
  return (w.movements||[]).map(m=>m.exerciseId).filter(Boolean);
}
function workoutWeightsForExercise(w, exerciseId){
  const weights = [];
  if(w.format==='for-time') (w.forTime?.movements||[]).forEach(m=>{ if(m.exerciseId===exerciseId && m.weight) weights.push(parseFloat(m.weight)); });
  else if(w.format==='amrap') (w.amrap?.movements||[]).forEach(m=>{ if(m.exerciseId===exerciseId && m.weight) weights.push(parseFloat(m.weight)); });
  else if(w.format==='for-load'){ if(w.forLoad?.exerciseId===exerciseId && w.forLoad?.achievedWeight) weights.push(parseFloat(w.forLoad.achievedWeight)); }
  else (w.movements||[]).forEach(m=>{ if(m.exerciseId===exerciseId) (m.sets||[]).forEach(s=>{ if(s.weight) weights.push(parseFloat(s.weight)); }); });
  return weights.filter(n=>!isNaN(n));
}
function parseWorkoutSearchQuery(query){
  const q = query.toLowerCase().trim();
  const exerciseIds = new Set();
  (state.profile?.exerciseAliases||[]).forEach(a=>{
    const aliasLower = (a.alias||'').toLowerCase();
    if(aliasLower && q.includes(aliasLower) && state.exercises.some(e=>e.id===a.exerciseId)) exerciseIds.add(a.exerciseId);
  });
  state.exercises.forEach(e=>{
    const nameLower = e.name.toLowerCase();
    if(q.includes(nameLower)){ exerciseIds.add(e.id); return; }
    const words = nameLower.split(/[\s-]+/).filter(Boolean);
    if(words.length===1){
      const re = new RegExp(`\\b${words[0]}s?\\b`, 'i');
      if(re.test(q)) exerciseIds.add(e.id);
    }
  });
  let nameFilter = null;
  const knownNames = [...new Set([...CROSSFIT_WODS.map(w=>w.name), ...state.workouts.map(w=>w.name).filter(Boolean)])];
  knownNames.sort((a,b)=>b.length-a.length);
  for(const name of knownNames){
    if(name && q.includes(name.toLowerCase())){ nameFilter = name; break; }
  }
  let minWeightKg = null;
  const weightMatch = q.match(/(?:mindestens|min\.?|über|mehr als|ab)\s*(\d+(?:[.,]\d+)?)\s*kg/i) || q.match(/(\d+(?:[.,]\d+)?)\s*kg/i);
  if(weightMatch) minWeightKg = parseFloat(weightMatch[1].replace(',','.'));
  let maxTimeSec = null;
  const timeMatch = q.match(/(?:unter|weniger als|max\.?)\s*(\d+)\s*(?:minuten|min)\b/i);
  if(timeMatch) maxTimeSec = parseInt(timeMatch[1])*60;
  return { exerciseIds:[...exerciseIds], nameFilter, minWeightKg, maxTimeSec };
}
function searchWorkoutsByQuery(query){
  const q = (query||'').trim();
  if(!q) return [];
  const parsed = parseWorkoutSearchQuery(q);
  const hasStructuredCriteria = parsed.nameFilter || parsed.exerciseIds.length || parsed.minWeightKg!=null || parsed.maxTimeSec!=null;
  let results = state.workouts.slice();
  if(!hasStructuredCriteria){
    results = results.filter(w=>`${w.name||''} ${w.note||''}`.toLowerCase().includes(q.toLowerCase()));
    return results.sort((a,b)=>b.date.localeCompare(a.date));
  }
  if(parsed.nameFilter) results = results.filter(w=>(w.name||'').toLowerCase()===parsed.nameFilter.toLowerCase());
  if(parsed.exerciseIds.length){
    results = results.filter(w=>{
      const ids = workoutExerciseIds(w);
      return parsed.exerciseIds.every(id=>ids.includes(id));
    });
  }
  if(parsed.minWeightKg!=null){
    results = results.filter(w=>{
      const idsToCheck = parsed.exerciseIds.length ? parsed.exerciseIds : workoutExerciseIds(w);
      return idsToCheck.some(id=>workoutWeightsForExercise(w,id).some(kg=>kg>=parsed.minWeightKg));
    });
  }
  if(parsed.maxTimeSec!=null){
    results = results.filter(w=>w.format==='for-time' && w.forTime?.elapsedSec!=null && w.forTime.elapsedSec<=parsed.maxTimeSec);
  }
  return results.sort((a,b)=>b.date.localeCompare(a.date));
}
function renderWorkoutSearchScreen(){
  const query = state.tmp.workoutSearchQuery || '';

function exerciseDisplayName(id){
  const ex = state.exercises.find(e=>e.id===id);
  if(ex) return ex.name;
  if(!id) return '—';
  // Uebungs-IDs sind "<slug-des-namens>-<zufallssuffix>" (siehe slug()) und daher nicht
  // stabil ueber Sessions/Geraete hinweg - bei alten box_workouts findet sich die exacte ID
  // oft nicht mehr in der aktuellen state.exercises-Liste. Als Fallback den Namen aus der
  // ID selbst ableiten, statt nur "—" anzuzeigen.
  const stem = id.replace(/-[a-z0-9]{1,4}$/,'').replace(/-/g,' ').trim();
  return stem ? stem.replace(/\b\w/g,c=>c.toUpperCase()) : '—';
}
function formatMovementLine(m){
  const ex = state.exercises.find(e=>e.id===m.exerciseId);
  const name = exerciseDisplayName(m.exerciseId);
  const type = getExerciseType(ex);
  if(type==='cardio'){

  }
  let line = `${m.reps||0}x ${name}`;

}
function formatBoxWorkoutPreview(w){
  const p = w.payload || {};
  if(w.format==='for-time'){
    const moves = (p.movements||[]).map(formatMovementLine).join(', ');
    const rounds = p.rounds && p.rounds!=='1' ? `${p.rounds} Runden: ` : '';
    const cap = (p.timeCapMin||p.timeCapSec) ? ` (Cap ${p.timeCapMin||0}:${String(p.timeCapSec||0).padStart(2,'0')})` : '';
    return `${p.repScheme?p.repScheme+' — ':''}${rounds}${moves}${cap}`;
  }
  if(w.format==='amrap'){
    const moves = (p.movements||[]).map(formatMovementLine).join(', ');
    const setsCount = parseInt(p.setsCount)||1;
    const header = setsCount>1
      ? `${setsCount}× ${p.durationMin||0}:${String(p.durationSec||0).padStart(2,'0')} AMRAP, ${p.restMin||0}:${String(p.restSec||0).padStart(2,'0')} Pause`
      : `AMRAP ${p.durationMin||0}:${String(p.durationSec||0).padStart(2,'0')}`;
    return `${header} — ${moves}`;
  }
  if(w.format==='for-load'){
    const cap = (p.timeCapMin||p.timeCapSec) ? ` (Cap ${p.timeCapMin||0}:${String(p.timeCapSec||0).padStart(2,'0')})` : '';
    return `${p.targetReps||''}x ${exerciseDisplayName(p.exerciseId)}${cap}`;
  }
  const lines = (p.wodTemplate||[]).map(m=>{
    return `${m.setsCount||''}x${m.repsTarget||''} ${exerciseDisplayName(m.exerciseId)}`.trim();
  });
  if(w.format==='emom'){
    const totalSec = ((p.emomMin||0)*60 + (p.emomSec||0)) *
      (p.emomAlternateCycles>1
        ? (p.wodTemplate||[]).filter((t,i)=>i===0 || !p.wodTemplate[i-1].groupWithNext).length * p.emomAlternateCycles
        : (p.emomRounds||1));
    const header = `EMOM ${Math.floor(totalSec/60)}:${String(totalSec%60).padStart(2,'0')}`;
    if(p.emomAlternateCycles>1){
      const blocks = [];
      let cur = [];
      (p.wodTemplate||[]).forEach(m=>{
        cur.push(`${m.setsCount||''}x${m.repsTarget||''} ${exerciseDisplayName(m.exerciseId)}`.trim());
        if(!m.groupWithNext){ blocks.push(cur.join(' + ')); cur = []; }
      });
      return `${header} (alternierend, ${p.emomAlternateCycles}× je Block)\n` +
        blocks.map((b,i)=>`Minute ${i+1}: ${b}`).join('\n');
    }
    return `${header} × ${p.emomRounds||1} — ${lines.join(', ')}`;
  }
  return lines.join(', ');
}
function workoutPerfScore(w){
  if(w.format==='for-time'){
    const ft = w.forTime || {};
    if(ft.elapsedSec==null || ft.capped) return null;
    return {type:'time', value: ft.elapsedSec};
  }
  if(w.format==='amrap'){
    const am = w.amrap || {};
    if(am.roundsCompleted==null) return null;
    return {type:'rounds', value:(am.roundsCompleted||0) + (parseInt(am.extraReps)||0)/1000};
  }
  if(w.format==='for-load'){
    const fl = w.forLoad || {};
    if(fl.unit || fl.achievedWeight==null || fl.achievedWeight==='') return null;
    return {type:'weight', value: parseFloat(fl.achievedWeight)};
  }
  return null;
}
function perfBetter(type, a, b){
  return type==='time' ? a<b : a>b;
}
function amrapScoreParts(w){
  const am = w.amrap || {};
  return {rounds: am.roundsCompleted||0, reps: parseInt(am.extraReps)||0};
}
function perfDeltaLabel(type, wA, wB){
  if(type==='time'){
    const diff = Math.abs(wA.forTime.elapsedSec - wB.forTime.elapsedSec);
    return fmtClock(Math.round(diff)*1000,false);
  }
  if(type==='weight'){
    const diff = Math.abs(parseFloat(wA.forLoad.achievedWeight) - parseFloat(wB.forLoad.achievedWeight));
    return fmtWeight(diff);
  }
  if(type==='rounds'){
    const a = amrapScoreParts(wA), b = amrapScoreParts(wB);
    const roundsDiff = a.rounds - b.rounds;
    const repsDiff = a.reps - b.reps;
    if(roundsDiff!==0){
      let label = `${Math.abs(roundsDiff)} Runde${Math.abs(roundsDiff)===1?'':'n'}`;
      if(repsDiff!==0 && Math.sign(repsDiff)===Math.sign(roundsDiff)) label += ` + ${Math.abs(repsDiff)} Wdh.`;
      return label;
    }
    return `${Math.abs(repsDiff)} Wdh.`;
  }
  return '';
}
function generateWorkoutAutoSummary(w){
  if(!w.name) return null;
  const score = workoutPerfScore(w);
  if(!score) return null;
  const others = state.workouts
    .filter(o=>o.id!==w.id && o.name===w.name)
    .map(o=>({w:o, score: workoutPerfScore(o)}))
    .filter(o=>o.score && o.score.type===score.type);
  if(!others.length) return `Erstes Mal "${w.name}" geloggt — ab jetzt vergleichbar.`;
  const bestOther = others.reduce((best,o)=> perfBetter(score.type, o.score.value, best.score.value) ? o : best, others[0]);
  const isNewBest = perfBetter(score.type, score.value, bestOther.score.value);
  const compareTarget = isNewBest ? bestOther : others.slice().sort((a,b)=>b.w.date.localeCompare(a.w.date))[0];
  const deltaLabel = perfDeltaLabel(score.type, w, compareTarget.w);
  if(isNewBest){
    return `🏆 Neue Bestleistung bei "${w.name}"${deltaLabel?` — ${deltaLabel} besser als der bisherige Rekord`:''}.`;
  }
  if(score.value===compareTarget.score.value) return `Gleiche Leistung wie beim letzten Versuch am ${fmtDate(compareTarget.w.date)}.`;
  const improved = perfBetter(score.type, score.value, compareTarget.score.value);
  return `${improved?'📈':'📉'} ${deltaLabel} ${improved?'besser':'schwächer'} als beim letzten Versuch am ${fmtDate(compareTarget.w.date)}.`;
}

function loadDoneWorkout(index){
  const doneNames = [...new Set(state.workouts.map(w=>w.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  const name = doneNames[index];
  if(!name) return;
  const w = findWorkoutByName(name);
  if(!w) return;
  const fmt = w.format || 'strength';

  state.tmp.wodName = name;
  state.tmp.wodDate = todayStr();
  state.tmp.wodTemplate = null; state.tmp.wodMoves = null; state.tmp.wodPhase = 'template';
  state.tmp.forTimeBuilder = null; state.tmp.amrapBuilder = null; state.tmp.forLoadBuilder = null;
  state.tmp.gps = null;
  state.tmp.wodFormat = fmt;

  if(fmt==='strength' || fmt==='emom'){
    state.tmp.wodTemplate = w.movements.map((m,mi)=>{
      const pcts = m.sets.map(s=>s.pct).filter(p=>p!=null);
      const next = w.movements[mi+1];
      const isQtyBased = m.unit!=null;
      const firstSet = m.sets[0];
      return {
        exerciseId: m.exerciseId,
        timing: m.timing || '',
        setsCount: String(m.sets.length || ''),
        pctList: pcts.length ? pcts.join(',') : '',
        weight: (!isQtyBased && firstSet) ? String(firstSet.weight ?? '') : '',
        unit: m.unit || 'kcal',
        qty: (isQtyBased && firstSet) ? String(firstSet.reps ?? '') : '',
        repsTarget: m.repsTarget || ((!isQtyBased && firstSet) ? String(firstSet.reps ?? '') : ''),
        groupWithNext: !!(m.groupId!=null && next && next.groupId===m.groupId)
      };
    });
  } else if(fmt==='for-time' && w.forTime){
    ensureForTimeBuilder();
    const ft = w.forTime, b = state.tmp.forTimeBuilder;
    b.movements = ft.movements.map(m=>({exerciseId:m.exerciseId, reps:String(m.reps??''), weight:String(m.weight??''), unit:m.unit||'reps'}));
    b.rounds = String(ft.rounds||1);
    b.repScheme = ft.repScheme||'';
    if(ft.timeCapSec){
      b.timeCapMin = String(Math.floor(ft.timeCapSec/60));
      b.timeCapSec = String(ft.timeCapSec%60);
    }
  } else if(fmt==='amrap' && w.amrap){
    ensureAmrapBuilder();
    const am = w.amrap, b = state.tmp.amrapBuilder;
    b.movements = am.movements.map(m=>({exerciseId:m.exerciseId, reps:String(m.reps??''), weight:String(m.weight??''), unit:m.unit||'reps'}));
    b.durationMin = String(Math.floor((am.durationSec||1200)/60));
    b.durationSec = String((am.durationSec||1200)%60);
  } else if(fmt==='for-load' && w.forLoad){
    ensureForLoadBuilder();
    const fl = w.forLoad, b = state.tmp.forLoadBuilder;
    b.exerciseId = fl.exerciseId;
    b.targetReps = String(fl.targetReps||3);
    b.unit = fl.unit || 'kcal';
    b.achievedWeight = String(fl.achievedWeight ?? '');
    if(fl.timeCapSec){
      b.timeCapMin = String(Math.floor(fl.timeCapSec/60));
      b.timeCapSec = String(fl.timeCapSec%60);
    }
  }
  render();
}

      <div class="field"><label>Intervall Sek.</label><input type="number" step="1" min="0" max="59" value="${state.tmp.emomSec}" onchange="state.tmp.emomSec=this.value; render();"></div>
    </div>
    ${emomGroupCount>1 ? `
    <div class="checkbox-row" style="margin-bottom:14px;">
      <input type="checkbox" id="emomAlternate" ${isAlternating?'checked':''} onchange="toggleEmomAlternate(this.checked)">

    ${isAlternating
      ? `<div class="field"><label>Wiederholungen je Block</label><input type="number" step="1" min="1" value="${state.tmp.emomAlternateCycles}" onchange="state.tmp.emomAlternateCycles=this.value; render();"></div>`
      : `<div class="field"><label>Runden</label><input type="number" step="1" min="1" value="${state.tmp.emomRounds}" onchange="state.tmp.emomRounds=this.value; render();"></div>`
    }
    ${totalEmomSec>0 ? `<div class="note" style="margin-top:-6px;margin-bottom:10px;">Gesamtdauer: ${Math.floor(totalEmomSec/60)}:${String(totalEmomSec%60).padStart(2,'0')} min</div>` : ''}
  ` : '';

  const moveBlocks = state.tmp.wodTemplate.map((t,mi)=>{
    const ex = state.exercises.find(e=>e.id===t.exerciseId);
    const type = getExerciseType(ex);
    const isWeighted = type==='weighted';
    const isBodyweight = type==='bodyweight';
    const isCardio = type==='cardio';
    const isMobility = type==='mobility';
    const isDistanceWeighted = isWeighted && isDistanceWeightedExercise(ex);
    const variantMatch = matchLibraryVariant(ex);
    const variantSelector = variantMatch ? `
      <div class="field"><label>Variante wechseln</label>
        <select onchange="updateTemplateFieldVariant(${mi},this.value)">
          ${variantMatch.base.variants.filter(v=>!v.details || !v.details.length || v.id===variantMatch.variant.id)
            .map(v=>`<option value="${v.id}" ${v.id===variantMatch.variant.id?'selected':''}>${v.id===variantMatch.variant.id?'✓ '+v.label:v.label}</option>`).join('')}
        </select>
      </div>` : '';
    const distanceField = isDistanceWeighted ? `<div class="field" style="margin-bottom:0;"><label>Distanz (${distanceUnitLabel()})</label><input type="number" step="1" value="${toDisplayDistance(t.qty)}" oninput="updateTemplateFieldQty(${mi},this.value)" placeholder="z.B. 15"></div>` : '';
    const repsTargetField = (isWeighted || isBodyweight) && !isDistanceWeighted ? `<div class="field" style="margin-bottom:0;"><label style="white-space:nowrap;">Ziel-WH (pro Satz)</label><input type="text" value="${escapeHtml(t.repsTarget)}" onchange="updateTemplateField(${mi},'repsTarget',this.value)" placeholder="z.B. 1 oder 7,5,3"></div>` : '';
    const pctField = isWeighted && !isDistanceWeighted ? `<div class="field" style="margin-bottom:0;"><label>% vom 1RM</label><input type="text" value="${escapeHtml(t.pctList)}" onchange="updateTemplateField(${mi},'pctList',this.value)" placeholder="z.B. 75"></div>` : '';
    const e1rmSuggestion = isWeighted && !isDistanceWeighted ? bestE1RM(t.exerciseId) : null;
    const weightSuggestionNote = e1rmSuggestion ? `
      <div class="note" style="margin-bottom:8px;">
        e1RM ${fmtWeight(e1rmSuggestion)} —
        ${[60,70,80].map(pct=>{
          const kg = Math.round(e1rmSuggestion*pct/100);
          return `<a href="#" onclick="event.preventDefault();applySuggestedTemplateWeight(${mi},${kg});" style="color:var(--chalk-yellow);">${pct}% ${fmtWeight(kg)}</a>`;
        }).join(' · ')}
      </div>` : '';
    const weightField = isWeighted ? `${weightSuggestionNote}<div class="row"><div class="field" style="margin-bottom:0;"><label>Gewicht (${weightUnitLabel()})</label><input type="number" step="0.5" value="${toDisplayWeight(t.weight)}" oninput="updateTemplateFieldWeight(${mi},this.value)" placeholder="alt. zu %"></div>${isDistanceWeighted ? distanceField : repsTargetField}</div>` : '';
    const unitToggle = isCardio ? `
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ${t.unit==='kcal'?'btn-primary':'btn-ghost'}" onclick="setTemplateMoveUnit(${mi},'kcal')">Kalorien</button>
        <button type="button" class="btn ${t.unit==='m'?'btn-primary':'btn-ghost'}" onclick="setTemplateMoveUnit(${mi},'m')">${distanceUnitLabel()==='mi'?'Meilen':'Meter'}</button>
      </div>` : isMobility ? `
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ${t.unit!=='sec'?'btn-primary':'btn-ghost'}" onclick="setTemplateMoveUnit(${mi},'reps')">Wiederholungen</button>
        <button type="button" class="btn ${t.unit==='sec'?'btn-primary':'btn-ghost'}" onclick="setTemplateMoveUnit(${mi},'sec')">Sekunden</button>
      </div>` : '';
    const qtyField = isCardio ? `<div class="row"><div class="field" style="margin-bottom:0;"><label>Ziel pro Satz (${t.unit==='m'?distanceUnitLabel():'kcal'})</label><input type="number" step="1" value="${t.unit==='m'?toDisplayDistance(t.qty):t.qty}" oninput="updateTemplateFieldQty(${mi},this.value)" placeholder="z.B. 500"></div></div>`
      : isMobility ? `<div class="row"><div class="field" style="margin-bottom:0;"><label>Ziel pro Satz (${t.unit==='sec'?'Sek.':'Wdh.'})</label><input type="number" step="1" value="${t.qty}" oninput="updateTemplateFieldQty(${mi},this.value)" placeholder="z.B. 10"></div></div>` : '';
    const setsField = isEmom
      ? ''
      : `<div class="field" style="margin-bottom:0;"><label>Sets</label><input type="number" step="1" value="${t.setsCount}" onchange="updateTemplateField(${mi},'setsCount',this.value)" placeholder="z.B. 5"></div>`;
    const groupToggle = (isEmom && mi < state.tmp.wodTemplate.length-1) ? `
      <label style="display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:13px;color:var(--chalk-60);">
        <input type="checkbox" ${t.groupWithNext?'checked':''} onchange="updateTemplateField(${mi},'groupWithNext',this.checked)">
        Mit nächster Übung zu einem Komplex kombinieren
      </label>` : '';
    return `
    <div class="wod-move-row" data-idx="${mi}">
      <div class="top">
        <select onchange="updateTemplateField(${mi},'exerciseId',this.value)">
          ${sortedExercises().map(e=>`<option value="${e.id}" ${e.id===t.exerciseId?'selected':''}>${e.name}</option>`).join('')}
        </select>
        <button type="button" class="btn-sm btn-ghost" style="width:auto;flex:0 0 auto;" onclick="openExerciseModal(exId=>updateTemplateField(${mi},'exerciseId',exId))">➕</button>
        ${state.tmp.wodTemplate.length>1 ? `<button class="remove-row" onclick="removeTemplateMove(${mi})">✕</button>` : ''}
      </div>
      ${state.tmp.newlyCreatedExerciseIds?.includes(t.exerciseId) ? `<span class="chip chip-waitlist">🆕 Neue Übung</span>${renderSimilarExerciseHint(t.exerciseId)}` : ''}
      ${variantSelector}
      ${isEmom ? '' : `<div class="field"><label>Zeitliche Angabe</label><input type="text" value="${escapeHtml(t.timing)}" onchange="updateTemplateField(${mi},'timing',this.value)" placeholder="z.B. Every 2:30"></div>`}
      <div class="row" style="margin-bottom:14px;">
        ${setsField}

        ${!isWeighted ? repsTargetField : ''}
      </div>
      ${weightField}
      ${unitToggle}
      ${qtyField}
      ${groupToggle}
    </div>
  `;}).join('');

  return `
    <div class="card">
      <h2>Neues Workout</h2>
      ${headerFields}
      ${emomFields}
      ${refNote}
      ${pr1rmBanner}
      ${moveBlocks}
      <button class="add-move-btn" onclick="addTemplateMove()">+ Bewegung hinzufügen</button>
      <div class="row">
        <button class="btn btn-ghost" onclick="saveWodDraft()">📝 Entwurf speichern</button>
        <button class="btn btn-primary" onclick="generateWodRows()">WOD erstellen</button>
      </div>
      ${isBoxAdminView() ? `<button class="btn btn-ghost" style="margin-top:8px;" onclick="publishBoxWorkout()">📣 An Box veröffentlichen</button>` : ''}

}

function renderWodRowsPhase(headerFields, historyHtml){
  return `
    <div class="card">
      <h2>Neues Workout</h2>
      ${headerFields}
      <button class="btn btn-ghost" style="margin-bottom:10px;" onclick="backToTemplate()">← Vorlage bearbeiten</button>
      <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="startLiveWorkout()">▶ Workout starten</button>
      <div class="field"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Beschreibung, Runden, Zeit-Cap …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
    </div>
    ${historyHtml}

}

/* ---------- LIVE-MODUS (geführte Trainingsdurchführung) ---------- */
function startLiveWorkout(){
  const moves = state.tmp.wodMoves;
  const flat = [];
  const groups = [];
  let i = 0;
  while(i < moves.length){
    const gid = moves[i].groupId;
    let j = i;
    if(gid!=null){
      while(j+1 < moves.length && moves[j+1].groupId===gid) j++;
    }
    const groupIdx = [];
    for(let k=i;k<=j;k++) groupIdx.push(k);
    groups.push(groupIdx);
    i = j+1;
  }
  const alternateCycles = parseInt(state.tmp.emomAlternateCycles) || 0;
  if(state.tmp.wodFormat==='emom' && alternateCycles > 1){
    for(let si=0; si<alternateCycles; si++){
      groups.forEach(groupIdx=>{
        flat.push(groupIdx.map(mi=>({mi, si})));
      });
    }
  } else {
    groups.forEach(groupIdx=>{
      const setsCount = moves[groupIdx[0]].sets.length;
      for(let si=0; si<setsCount; si++){
        flat.push(groupIdx.map(mi=>({mi,si})));
      }
    });
  }
  if(!flat.length){ showToast('Keine Sätze vorhanden'); return; }
  state.tmp.live = {
    startedAt: Date.now(),
    flat,
    pos: 0,
    resting: false,
    restRunning: false,
    restRemaining: 0,
    restTotal: 0,
    restStartedAt: null,
    emomRunning: false,
    emomRemaining: 0,
    emomTotal: 0,
    emomStartedAt: null,
    finished: false
  };
  state.tmp.wodPhase = 'live';
  if(state.tmp.wodFormat==='emom'){
    const live = state.tmp.live;
    live.emomTotal = getEmomIntervalSec()*1000;
    live.emomRemaining = live.emomTotal;
    live.emomStartedAt = Date.now();
    live.emomRunning = true;
    startTicking('live', tickEmomLive);
  }
  render();
  window.scrollTo(0,0);
}
function renderLiveGroupBlocks(group){
  return group.map(({mi,si})=>{
    const mv = state.tmp.wodMoves[mi];
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    const s = mv.sets[si];
    const type = getExerciseType(ex);
    const isCardio = type==='cardio';
    const isMobility = type==='mobility';
    const isDistanceWeighted = type==='weighted' && mv.unit==='m';
    const qtyLabel = isCardio ? (mv.unit==='m' ? `Distanz (${distanceUnitLabel()})` : 'Kalorien')
      : isMobility ? (mv.unit==='sec' ? 'Sekunden' : 'Wiederholungen')
      : isDistanceWeighted ? `Distanz (${distanceUnitLabel()})`
      : 'Wiederholungen';
    const qtyValue = (mv.unit==='m') ? toDisplayDistance(s.reps) : s.reps;
    const gpsButton = isCardio && isRunExercise(ex) && mv.unit==='m'
      ? `<div style="text-align:center;margin-bottom:10px;"><button type="button" class="btn-sm btn-ghost" onclick="startGpsRun('inline',{flow:'wod',mi:${mi},si:${si}})">📍 Lauf starten</button></div>` : '';
    const prescriptionBits = [];
    if(mv.repsTarget) prescriptionBits.push(mv.repsTarget+' Wdh.');
    if(s.pct) prescriptionBits.push(s.pct+'% 1RM');
    return `
      <div style="margin-bottom:16px;">
        <h3 style="margin:0 0 6px;">${ex?ex.name:'—'}</h3>
        ${prescriptionBits.length ? `<div class="note" style="margin-bottom:8px;">Vorgabe: ${escapeHtml(prescriptionBits.join(' · '))}</div>` : ''}
        <div class="row">
          <div class="field"><label>${qtyLabel}</label><input type="number" step="1" id="liveReps_${mi}" value="${qtyValue}" placeholder="z.B. 5"></div>
          ${type!=='weighted' ? '' : `<div class="field"><label>kg</label><input type="number" step="0.5" id="liveWeight_${mi}" value="${s.weight}" placeholder="z.B. 48"></div>`}
        </div>
        ${gpsButton}
      </div>`;
  }).join('');
}
function goToPreviousLiveRound(){
  const live = state.tmp.live;
  if(!live || live.pos<=0) return;
  captureLiveGroupValues(live.flat[live.pos]);
  live.pos -= 1;
  live.resting = false;
  live.restRunning = false;
  if(state.tmp.wodFormat==='emom'){
    live.emomRemaining = live.emomTotal;
    live.emomStartedAt = Date.now();
    if(live.emomRunning) startTicking('live', tickEmomLive);
  }
  render();
}
function goToNextLiveRound(){
  const live = state.tmp.live;
  if(!live || live.pos>=live.flat.length-1) return;
  captureLiveGroupValues(live.flat[live.pos]);
  live.pos += 1;
  live.resting = false;
  live.restRunning = false;
  if(state.tmp.wodFormat==='emom'){
    live.emomRemaining = live.emomTotal;
    live.emomStartedAt = Date.now();
    if(live.emomRunning) startTicking('live', tickEmomLive);
  }
  render();
}
function renderWodLivePhase(){
  const live = state.tmp.live;
  if(live.finished) return renderWodSummaryPhase();
  if(state.tmp.wodFormat==='emom') return renderEmomLivePhase(live);
  if(live.resting) return renderRestScreen(live);

  const group = live.flat[live.pos];
  const isComplex = group.length>1;
  const blocks = renderLiveGroupBlocks(group);
  const timing = state.tmp.wodMoves[group[0].mi].timing;

  return `
    <div class="card">
      <div class="stat-label">${isComplex?'Runde':'Satz'} ${live.pos+1} / ${live.flat.length}</div>
      ${timing ? `<div class="note" style="margin-bottom:10px;">${escapeHtml(timing)}</div>` : ''}
      ${blocks}
      <button class="btn btn-primary" onclick="completeLiveSet()">✓ ${isComplex?'Runde':'Satz'} erledigt</button>
      <div class="row" style="margin-top:10px;">
        ${live.pos>0 ? `<button class="btn btn-ghost" onclick="goToPreviousLiveRound()">← Zurück</button>` : ''}
        ${live.pos<live.flat.length-1 ? `<button class="btn btn-ghost" onclick="goToNextLiveRound()">Vor →</button>` : ''}
        <button class="btn btn-ghost" onclick="exitLiveWorkout()">Geführten Modus verlassen</button>
      </div>
    </div>
  `;
}
function renderEmomLivePhase(live){
  const group = live.flat[live.pos];
  const isComplex = group.length>1;
  const blocks = renderLiveGroupBlocks(group);
  return `
    <div class="card" style="text-align:center;">
      <div class="stat-label">${isComplex?'Runde':'Satz'} ${live.pos+1} / ${live.flat.length}</div>
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;margin:14px 0;">${fmtClock(live.emomRemaining,false)}</div>
      <div style="text-align:left;">${blocks}</div>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn btn-ghost" onclick="${live.emomRunning?'pauseEmomLiveTimer()':'resumeEmomLiveTimer()'}">${live.emomRunning?'Pause':'Weiter'}</button>
        <button class="btn btn-ghost" onclick="captureLiveGroupValues(state.tmp.live.flat[state.tmp.live.pos]); showToast('Werte gespeichert'); render();">Werte speichern</button>
      </div>
      <div class="row">
        ${live.pos>0 ? `<button class="btn btn-ghost" onclick="goToPreviousLiveRound()">← Zurück</button>` : ''}
        ${live.pos<live.flat.length-1 ? `<button class="btn btn-ghost" onclick="goToNextLiveRound()">Vor →</button>` : ''}
        <button class="btn btn-ghost" onclick="exitLiveWorkout()">Geführten Modus verlassen</button>
      </div>
    </div>
  `;
}
function captureLiveGroupValues(group){
  group.forEach(({mi,si})=>{
    const mv = state.tmp.wodMoves[mi];
    const repsEl = document.getElementById(`liveReps_${mi}`);
    if(repsEl){
      const rawReps = repsEl.value;
      mv.sets[si].reps = (mv.unit==='m') ? String(fromDisplayDistance(rawReps)) : rawReps;
    }
    const weightEl = document.getElementById(`liveWeight_${mi}`);
    if(weightEl) mv.sets[si].weight = weightEl.value;
    mv.sets[si].autoFilled = false;
  });
}
function completeLiveSet(){
  const live = state.tmp.live;
  captureLiveGroupValues(live.flat[live.pos]);

  if(live.pos >= live.flat.length-1){
    live.finished = true;
    render();
    return;
  }
  live.pos += 1;
  const restSec = (state.tmp.wodFormat==='emom' && getEmomIntervalSec()>0) ? getEmomIntervalSec() : 90;
  beginRest(restSec);
}
function beginRest(seconds){
  const live = state.tmp.live;
  live.resting = true;
  live.restTotal = seconds*1000;
  live.restRemaining = live.restTotal;
  live.restStartedAt = Date.now();
  live.restRunning = true;
  startTicking('live', tickRest);
  render();
}
function tickRest(){
  const live = state.tmp.live;
  if(!live || !live.resting){ stopTicking(); return; }
  const remaining = live.restRemaining - (Date.now()-live.restStartedAt);
  const display = document.getElementById('timerBigDisplay');
  if(remaining<=0){
    live.restRemaining = 0;
    live.restRunning = false;
    stopTicking();
    beep();
    finishRest();
    return;
  }
  if(display) display.textContent = fmtClock(remaining,false);
}
function finishRest(){
  state.tmp.live.resting = false;
  render();
}
function setRestPreset(seconds){ beginRest(seconds); }
function pauseRest(){
  const live = state.tmp.live;
  if(live.restRunning){ live.restRemaining = Math.max(0, live.restRemaining - (Date.now()-live.restStartedAt)); }
  live.restRunning = false;
  stopTicking();
  render();
}
function resumeRest(){
  const live = state.tmp.live;
  live.restStartedAt = Date.now();
  live.restRunning = true;
  startTicking('live', tickRest);
  render();
}
function pauseLiveRest(){
  const live = state.tmp.live;
  if(live && live.emomRunning){ pauseEmomLiveTimer(); return; }
  if(live && live.resting && live.restRunning){ pauseRest(); return; }
  const ft = state.tmp.forTimeBuilder;
  if(ft && ft.phase==='running' && ft.running){ pauseForTimeClock(); return; }
  const am = state.tmp.amrapBuilder;
  if(am && am.phase==='running' && am.running){ pauseAmrapClock(); return; }
  const fl = state.tmp.forLoadBuilder;
  if(fl && fl.phase==='running' && fl.running){ pauseForLoadClock(); return; }
  const g = state.tmp.gps;
  if(g && g.active && g.running){ pauseGpsRun(); return; }
}
function skipRest(){
  stopTicking();
  finishRest();
}
function renderRestScreen(live){
  return `
    <div class="card" style="text-align:center;">
      <div class="stat-label">Pause</div>
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;margin:14px 0;">${fmtClock(live.restRemaining,false)}</div>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn btn-ghost" onclick="setRestPreset(60)">1 Min</button>
        <button class="btn btn-ghost" onclick="setRestPreset(120)">2 Min</button>
        <button class="btn btn-ghost" onclick="setRestPreset(180)">3 Min</button>
      </div>
      <div class="row">
        <button class="btn btn-ghost" onclick="${live.restRunning?'pauseRest()':'resumeRest()'}">${live.restRunning?'Pause':'Weiter'}</button>
        <button class="btn btn-primary" onclick="skipRest()">Weiter zum nächsten Satz</button>
      </div>
    </div>
  `;
}
function exitLiveWorkout(){
  stopTicking();
  state.tmp.wodPhase = 'rows';
  state.tmp.live = null;
  render();
  window.scrollTo(0,0);
}
function tickEmomLive(){
  const live = state.tmp.live;
  if(!live || !live.emomRunning){ stopTicking(); return; }
  const remaining = live.emomRemaining - (Date.now()-live.emomStartedAt);
  const display = document.getElementById('timerBigDisplay');
  if(remaining>0){
    if(display) display.textContent = fmtClock(remaining,false);
    return;
  }
  beep();
  captureLiveGroupValues(live.flat[live.pos]);
  if(live.pos >= live.flat.length-1){
    live.emomRunning = false;
    live.finished = true;
    stopTicking();
    render();
    return;
  }
  live.pos += 1;
  live.emomRemaining = live.emomTotal;
  live.emomStartedAt = Date.now();
  render();
}
function pauseEmomLiveTimer(){
  const live = state.tmp.live;
  if(live.emomRunning){ live.emomRemaining = Math.max(0, live.emomRemaining - (Date.now()-live.emomStartedAt)); }
  live.emomRunning = false;
  stopTicking();
  render();
}
function resumeEmomLiveTimer(){
  const live = state.tmp.live;
  live.emomStartedAt = Date.now();
  live.emomRunning = true;
  startTicking('live', tickEmomLive);
  render();
}
function renderWodSummaryPhase(){
  const live = state.tmp.live;
  const durationMs = Date.now() - live.startedAt;
  let totalWeight = 0, totalSets = 0;
  state.tmp.wodMoves.forEach(mv=>{
    mv.sets.forEach(s=>{
      if(s.reps && s.weight){ totalWeight += parseFloat(s.weight)*parseInt(s.reps); totalSets++; }
    });
  });
  return `
    <div class="card" style="text-align:center;">
      <h2>Workout abgeschlossen 🏁</h2>
      <div class="row" style="margin:16px 0;">
        <div><div class="stat-num">${fmtClock(durationMs,false)}</div><div class="stat-label">Dauer</div></div>
        <div><div class="stat-num">${Math.round(totalWeight)}</div><div class="stat-label">kg gesamt</div></div>
        <div><div class="stat-num">${totalSets}</div><div class="stat-label">Sätze</div></div>
      </div>
      <div class="field" style="text-align:left;"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Beschreibung, Runden, Zeit-Cap …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
      <button class="btn btn-primary" onclick="finishAndSaveWorkout()">Workout speichern</button>
    </div>
  `;
}
function finishAndSaveWorkout(){
  stopTicking();
  const liveFlat = state.tmp.live?.flat || null;
  state.tmp.live = null;
  saveWod(liveFlat);
}

/* ---------- FOR TIME ---------- */
function blankForTimeMove(){
  const ex = state.exercises[0];
  return {exerciseId: ex?.id, reps:'', weight:'', unit: getExerciseType(ex)==='cardio' ? 'kcal' : 'reps'};
}
function ensureForTimeBuilder(){
  if(!state.tmp.forTimeBuilder){
    state.tmp.forTimeBuilder = { phase:'build', movements:[blankForTimeMove()], rounds:'1', repScheme:'', timeCapMin:'', timeCapSec:'', startedAt:null, elapsedMs:0, running:false, timeCapMs:0, capped:false, finalElapsedSec:null, roundsCompleted:0, roundsLog:[] };
  }
}
function renderForTimeFlow(historyHtml){
  ensureForTimeBuilder();
  const b = state.tmp.forTimeBuilder;
  if(b.phase==='summary') return renderForTimeSummary(b);
  if(b.phase==='running') return renderForTimeRunning(b);

  const uniqueNames = [...new Set(state.workouts.map(w=>w.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  const headerFields = buildHeaderFields(uniqueNames);
  const moveBlocks = b.movements.map((m,mi)=>{
    const ex = state.exercises.find(e=>e.id===m.exerciseId);
    const type = getExerciseType(ex);
    const isCardio = type==='cardio';
    const isMobility = type==='mobility';
    const qtyLabel = isCardio ? (m.unit==='m' ? `Distanz (${distanceUnitLabel()})` : 'Kalorien')
      : isMobility ? (m.unit==='sec' ? 'Sekunden' : 'Wiederholungen')
      : 'Wiederholungen';
    const qtyValue = isCardio && m.unit==='m' ? toDisplayDistance(m.reps) : m.reps;
    const qtyHandler = isCardio ? `updateForTimeMoveQty(${mi},this.value)` : `updateForTimeMove(${mi},'reps',this.value)`;
    const unitToggle = isCardio ? `
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ${m.unit==='kcal'?'btn-primary':'btn-ghost'}" onclick="setForTimeMoveUnit(${mi},'kcal')">Kalorien</button>
        <button type="button" class="btn ${m.unit==='m'?'btn-primary':'btn-ghost'}" onclick="setForTimeMoveUnit(${mi},'m')">${distanceUnitLabel()==='mi'?'Meilen':'Meter'}</button>
      </div>` : isMobility ? `
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ${m.unit!=='sec'?'btn-primary':'btn-ghost'}" onclick="setForTimeMoveUnit(${mi},'reps')">Wiederholungen</button>
        <button type="button" class="btn ${m.unit==='sec'?'btn-primary':'btn-ghost'}" onclick="setForTimeMoveUnit(${mi},'sec')">Sekunden</button>
      </div>` : '';
    const weightField = type==='weighted' ? `
        <div class="field" style="margin-bottom:0;"><label>Gewicht (${weightUnitLabel()})</label><input type="number" step="0.5" value="${toDisplayWeight(m.weight)}" oninput="updateForTimeMoveWeight(${mi},this.value)" placeholder="z.B. 48"></div>` : '';
    const gpsButton = isRunExercise(ex) && m.unit==='m' ? `<div style="text-align:center;"><button type="button" class="btn-sm btn-ghost" onclick="startGpsRun('inline',{flow:'for-time',mi:${mi}})">📍 Lauf starten</button></div>` : '';
    const variantMatch = matchLibraryVariant(ex);
    const variantSelector = variantMatch ? `
      <div class="field"><label>Variante wechseln</label>
        <select onchange="updateForTimeMoveVariant(${mi},this.value)">
          ${variantMatch.base.variants.filter(v=>!v.details || !v.details.length || v.id===variantMatch.variant.id)
            .map(v=>`<option value="${v.id}" ${v.id===variantMatch.variant.id?'selected':''}>${v.id===variantMatch.variant.id?'✓ '+v.label:v.label}</option>`).join('')}
        </select>
      </div>` : '';
    return `
    <div class="wod-move-row" data-idx="${mi}">
      <div class="top">
        <select onchange="updateForTimeMove(${mi},'exerciseId',this.value)">
          ${sortedExercises().map(e=>`<option value="${e.id}" ${e.id===m.exerciseId?'selected':''}>${e.name}</option>`).join('')}
        </select>
        <button type="button" class="btn-sm btn-ghost" style="width:auto;flex:0 0 auto;" onclick="openExerciseModal(exId=>updateForTimeMove(${mi},'exerciseId',exId))">➕</button>
        ${b.movements.length>1 ? `<button class="remove-row" onclick="removeForTimeMove(${mi})">✕</button>` : ''}
      </div>
      ${state.tmp.newlyCreatedExerciseIds?.includes(m.exerciseId) ? `<span class="chip chip-waitlist">🆕 Neue Übung</span>${renderSimilarExerciseHint(m.exerciseId)}` : ''}
      ${variantSelector}
      ${unitToggle}
      <div class="row">
        <div class="field" style="margin-bottom:0;"><label>${qtyLabel}</label><input type="number" step="1" value="${qtyValue}" oninput="${qtyHandler}" placeholder="z.B. 30"></div>
        ${weightField}
      </div>
      ${gpsButton}
    </div>`;
  }).join('');

  const refNote = state.tmp.wodNameMatch
    ? `<div class="note" style="margin-bottom:10px;">Vorlage aus "${escapeHtml(state.tmp.wodNameMatch.name)}" vom ${fmtDate(state.tmp.wodNameMatch.date)} übernommen — passt gerne an.</div>`
    : '';
  return `
    <div class="card">
      <h2>Neues For Time</h2>
      ${headerFields}
      ${refNote}
      ${moveBlocks}
      <button class="add-move-btn" onclick="addForTimeMove()">+ Bewegung hinzufügen</button>
      <div class="row">
        <div class="field"><label>Runden</label><input type="number" step="1" min="1" value="${b.rounds}" oninput="updateForTimeField('rounds',this.value)"></div>
        <div class="field"><label>Rep-Schema</label><input type="text" value="${escapeHtml(b.repScheme)}" oninput="updateForTimeField('repScheme',this.value)" placeholder="z.B. 21-15-9"></div>
      </div>
      <div class="note" style="margin-bottom:14px;">Rep-Schema überschreibt bei Angabe die Wiederholungen oben — z.B. "21-15-9" erzeugt 3 Runden mit diesen Werten für jede Übung.</div>
      <div class="row">
        <div class="field"><label>Time Cap Min.</label><input type="number" step="1" min="0" value="${b.timeCapMin}" oninput="updateForTimeField('timeCapMin',this.value)"></div>
        <div class="field"><label>Time Cap Sek.</label><input type="number" step="1" min="0" max="59" value="${b.timeCapSec}" oninput="updateForTimeField('timeCapSec',this.value)"></div>
      </div>
      <div class="row">
        <button class="btn btn-ghost" onclick="saveWodDraft()">📝 Entwurf speichern</button>
        <button class="btn btn-primary" onclick="startForTimeWod()">WOD starten</button>
      </div>
      <button class="btn btn-ghost" style="margin-top:8px;" onclick="skipForTimeTimer()">✍️ Ohne Timer eintragen</button>
      ${isBoxAdminView() ? `<button class="btn btn-ghost" style="margin-top:8px;" onclick="publishBoxWorkout()">📣 An Box veröffentlichen</button>` : ''}
    </div>
    ${historyHtml}
  `;
}
function updateForTimeMove(mi, field, val){
  const b = state.tmp.forTimeBuilder;
  b.movements[mi][field] = val;
  if(field==='exerciseId'){
    const ex = state.exercises.find(e=>e.id===val);
    const type = getExerciseType(ex);
    b.movements[mi].unit = isRunExercise(ex) ? 'm' : (type==='cardio' ? 'kcal' : 'reps');
    if(type!=='weighted') b.movements[mi].weight = '';
    render();
  }
}
function updateForTimeMoveVariant(mi, variantId){
  const b = state.tmp.forTimeBuilder;
  const ex = state.exercises.find(e=>e.id===b.movements[mi].exerciseId);
  const match = matchLibraryVariant(ex);
  if(!match) return;
  const variant = match.base.variants.find(v=>v.id===variantId);
  if(!variant) return;
  const newId = findOrCreateExerciseId(composeVariantName(match.base, variant, ''), variant.type || match.base.type || 'weighted');
  updateForTimeMove(mi, 'exerciseId', newId);
}
function updateForTimeMoveQty(mi, displayVal){
  const b = state.tmp.forTimeBuilder;
  const m = b.movements[mi];
  m.reps = (m.unit==='m' && displayVal!=='') ? String(fromDisplayDistance(displayVal)) : displayVal;
}
function updateForTimeMoveWeight(mi, displayVal){
  const b = state.tmp.forTimeBuilder;
  b.movements[mi].weight = displayVal==='' ? '' : String(fromDisplayWeight(displayVal));
}
function setForTimeMoveUnit(mi, unit){
  state.tmp.forTimeBuilder.movements[mi].unit = unit;
  render();
}
function addForTimeMove(){
  state.tmp.forTimeBuilder.movements.push(blankForTimeMove());
  render();
}
function removeForTimeMove(mi){
  const b = state.tmp.forTimeBuilder;
  b.movements.splice(mi,1);
  if(!b.movements.length) b.movements.push(blankForTimeMove());
  render();
}
function updateForTimeField(field, val){
  state.tmp.forTimeBuilder[field] = val;
}
function startForTimeWod(){
  const b = state.tmp.forTimeBuilder;
  state.tmp.wodDate = document.getElementById('wodDate').value || todayStr();
  state.tmp.wodName = document.getElementById('wodName').value.trim();
  if(!b.movements.length){ showToast('Bitte mindestens eine Übung hinzufügen'); return; }
  b.timeCapMs = (parseInt(b.timeCapMin)||0)*60000 + (parseInt(b.timeCapSec)||0)*1000;
  b.capped = false;
  b.elapsedMs = 0;
  b.roundsCompleted = 0;
  b.roundsLog = buildForTimeRoundsLog(b);
  b.startedAt = Date.now();
  b.running = true;
  b.phase = 'running';
  startTicking('live', tickForTime);
  render();
  window.scrollTo(0,0);
}
function buildForTimeRoundsLog(b){
  const schemeArr = parseRepScheme(b.repScheme);
  const hasPerMovementReps = b.movements.some(m=>m.reps);
  const roundsCount = hasPerMovementReps
    ? Math.max(1, parseInt(b.rounds)||1)
    : Math.max(1, parseInt(b.rounds)||1, schemeArr.length);
  const roundsLog = [];
  for(let ri=0; ri<roundsCount; ri++){
    roundsLog.push(b.movements.map(m=>{
      const target = String(m.reps || (schemeArr.length ? pctForIndex(schemeArr, ri) : ''));
      return { target, reps: target, done:false, edited:false };
    }));
  }
  return roundsLog;
}
function tickForTime(){
  const b = state.tmp.forTimeBuilder;
  if(!b || b.phase!=='running'){ stopTicking(); return; }
  const elapsed = b.elapsedMs + (Date.now()-b.startedAt);
  const display = document.getElementById('timerBigDisplay');
  if(b.timeCapMs>0 && elapsed>=b.timeCapMs){
    b.elapsedMs = b.timeCapMs;
    b.running = false;
    b.capped = true;
    stopTicking();
    beep();
    finishForTime();
    return;
  }
  if(display) display.textContent = fmtClock(elapsed,false);
}
function finishForTime(){
  const b = state.tmp.forTimeBuilder;
  if(b.running){ b.elapsedMs += Date.now()-b.startedAt; b.running=false; }
  stopTicking();
  b.finalElapsedSec = Math.round(b.elapsedMs/1000);
  if(b.roundsLog && b.roundsLog.length){
    b.roundsCompleted = b.roundsLog.filter(round=>round.every(item=>item.done)).length;
  }
  b.phase = 'summary';
  render();
}
function pauseForTimeClock(){
  const b = state.tmp.forTimeBuilder;
  if(b && b.running){
    b.elapsedMs += Date.now()-b.startedAt;
    b.running = false;
    stopTicking();
  }
  render();
}
function resumeForTimeClock(){
  const b = state.tmp.forTimeBuilder;
  b.startedAt = Date.now();
  b.running = true;
  startTicking('live', tickForTime);
  render();
}
function toggleForTimeRoundDone(ri, mi){
  const b = state.tmp.forTimeBuilder;
  const item = b.roundsLog[ri][mi];
  item.done = !item.done;
  const scrollTop = document.getElementById('ftChecklist')?.scrollTop;
  render();
  const el = document.getElementById('ftChecklist');
  if(el && scrollTop!=null) el.scrollTop = scrollTop;
}
function updateForTimeRoundValue(ri, mi, val){
  const b = state.tmp.forTimeBuilder;
  const item = b.roundsLog[ri][mi];
  item.reps = val;
  item.edited = true;
  item.done = item.target!=='' && val===item.target;
  const cb = document.getElementById(`ftRoundCheck_${ri}_${mi}`);
  if(cb) cb.checked = item.done;
}
function forTimeQtyUnitSuffix(m){
  const ex = state.exercises.find(e=>e.id===m.exerciseId);
  const type = getExerciseType(ex);
  if(type==='cardio') return m.unit==='m' ? distanceUnitLabel() : 'kcal';
  if(type==='mobility') return m.unit==='sec' ? 's' : 'reps';
  return 'reps';
}
function renderForTimeRunning(b){
  const displayMs = b.timeCapMs>0 ? Math.max(0, b.timeCapMs-b.elapsedMs) : b.elapsedMs;
  const checklistHtml = (b.roundsLog||[]).map((round,ri)=>{
    const rowsHtml = round.map((item,mi)=>{

            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(ex?ex.name:'—')}</span>

    return `<div style="margin-bottom:14px;">

  return `
    <div class="card" style="text-align:center;">
      ${state.tmp.confirmCancelWod ? `
        <div class="note" style="color:var(--plate-red);margin-bottom:8px;">Fortschritt geht verloren.</div>
        <div class="row" style="margin-bottom:14px;">
          <button class="btn btn-ghost" onclick="cancelCancelWodRunning()">Weiter trainieren</button>
          <button class="btn btn-danger" onclick="cancelForTimeRunning()">Ja, abbrechen</button>
        </div>
      ` : `<button class="btn btn-ghost" style="margin-bottom:10px;" onclick="requestCancelWodRunning()">✕ Abbrechen</button>`}
      <div class="stat-label">${b.timeCapMs>0?'Verbleibend (Time Cap)':'Zeit läuft'}</div>
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;margin:14px 0;">${fmtClock(displayMs,false)}</div>
      <div id="ftChecklist" style="text-align:left;max-height:360px;overflow-y:auto;margin-bottom:14px;">
        ${checklistHtml}
      </div>
      <div class="row">
        <button class="btn ${b.running?'btn-ghost':'btn-primary'}" onclick="${b.running?'pauseForTimeClock()':'resumeForTimeClock()'}">${b.running?'Pause':'Weiter'}</button>
        <button class="btn btn-primary" onclick="finishForTime()">Fertig</button>
      </div>
    </div>
  `;
}
function findPossibleDuplicateWorkout(date, name, format){
  if(!name) return null;
  return state.workouts.find(w=>w.date===date && w.format===format && (w.name||'').toLowerCase()===name.toLowerCase());
}
function renderDuplicateWarning(format){
  const date = state.tmp.wodDate || todayStr();
  const name = (state.tmp.wodName||'').trim();
  const dup = findPossibleDuplicateWorkout(date, name, format);
  return dup ? `<div class="note" style="color:var(--plate-red);margin-bottom:10px;">⚠️ Du hast heute schon ein Workout namens "${escapeHtml(name)}" gespeichert. Trotzdem nochmal speichern?</div>` : '';
}
function renderForTimeSummary(b){
  return `
    <div class="card" style="text-align:center;">
      <h2>Workout abgeschlossen 🏁</h2>
      ${renderDuplicateWarning('for-time')}
      <div class="field" style="text-align:left;max-width:180px;margin:14px auto;">

        <input type="text" id="forTimeManualTime" value="${fmtClock((b.finalElapsedSec||0)*1000,false)}" placeholder="z.B. 12:34" style="text-align:center;font-size:28px;">
      </div>
      ${b.capped ? `<div class="chip">Time Cap erreicht</div>` : ''}
      <div class="field" style="text-align:left;margin-top:14px;"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Beschreibung, Runden, Zeit-Cap …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
      <label class="checkbox-row"><input type="checkbox" id="forTimeSaveAsBest" checked> Als Bestzeit in Erfolge speichern</label>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="saveForTimeWorkout()">Workout speichern</button>
    </div>
  `;
}
function skipForTimeTimer(){
  const b = state.tmp.forTimeBuilder;
  b.finalElapsedSec = 0;
  b.roundsCompleted = parseInt(b.rounds)||1;
  b.capped = false;
  b.phase = 'summary';
  render();
  window.scrollTo(0,0);
}
function parseClockToSec(str){
  const parts = String(str||'').trim().split(':').map(p=>parseInt(p,10));
  if(!parts.length || parts.some(isNaN)) return null;
  if(parts.length===1) return parts[0];
  if(parts.length===2) return parts[0]*60+parts[1];
  if(parts.length===3) return parts[0]*3600+parts[1]*60+parts[2];
  return null;
}
async function saveForTimeWorkout(){
  const b = state.tmp.forTimeBuilder;
  const manualTimeSec = parseClockToSec(document.getElementById('forTimeManualTime')?.value);
  if(manualTimeSec!=null) b.finalElapsedSec = manualTimeSec;
  const date = state.tmp.wodDate || todayStr();
  const name = (state.tmp.wodName||'').trim();
  const note = state.tmp.wodNote || '';
  const singleRoundActuals = (b.roundsLog && b.roundsLog.length===1) ? b.roundsLog[0] : null;
  const movements = b.movements.map((m,mi)=>{
    let reps = m.reps||'';
    const item = singleRoundActuals && singleRoundActuals[mi];
    if(item) reps = (item.done || item.edited) ? (item.reps||'') : '0';
    return {exerciseId:m.exerciseId, reps, unit:m.unit||'reps', weight:m.weight||''};
  }).filter(m=>m.exerciseId);
  const prMovements = buildPrMovementsFromFlat(movements);
  const workout = {
    id: uid(), date, name, note, format:'for-time', movements: prMovements,
    forTime: { movements, rounds: parseInt(b.rounds)||1, repScheme: b.repScheme||'', timeCapSec: b.timeCapMs ? Math.round(b.timeCapMs/1000) : null, elapsedSec: b.finalElapsedSec, capped: !!b.capped, roundsCompleted: b.roundsCompleted||0, roundsLog: b.roundsLog||[] }
  };
  const isNewBestTime = !!(name && b.finalElapsedSec!=null && !b.capped && (()=>{
    const priorSecs = state.timeRecords.filter(t=>t.name.toLowerCase()===name.toLowerCase()).map(t=>parseClockToSec(t.time)).filter(s=>s!=null);
    return priorSecs.length>0 && b.finalElapsedSec < Math.min(...priorSecs);
  })());
  showPRToastIfAny(prMovements);
  state.workouts.push(workout);
  await saveKey('workouts', state.workouts);
  if(name && document.getElementById('forTimeSaveAsBest')?.checked && b.finalElapsedSec!=null){
    state.timeRecords.push({id:uid(), name, time: fmtClock(b.finalElapsedSec*1000,false), date, note: b.capped?'Time Cap':''});
    await saveKey('timeRecords', state.timeRecords);
  }
  if(state.tmp.loadedDraftId){
    state.drafts = state.drafts.filter(d=>d.id!==state.tmp.loadedDraftId);
    await saveKey('drafts', state.drafts);
  }
  state.tmp.forTimeBuilder = null;
  state.tmp.wodDate = null; state.tmp.wodName = null; state.tmp.wodNote = null; state.tmp.loadedDraftId = null;
  showToast(generateWorkoutAutoSummary(workout) || (isNewBestTime ? `🏆 Neue Bestzeit bei "${name}"!` : 'Workout gespeichert 🏋️'));
  render();
}

/* ---------- AMRAP ---------- */
function blankAmrapMove(){
  const ex = state.exercises[0];
  return {exerciseId: ex?.id, reps:'', weight:'', unit: getExerciseType(ex)==='cardio' ? 'kcal' : 'reps'};
}
function ensureAmrapBuilder(){
  if(!state.tmp.amrapBuilder){
    state.tmp.amrapBuilder = { phase:'build', movements:[blankAmrapMove()], durationMin:'20', durationSec:'0', startedAt:null, running:false, remainingMs:0, durationMs:0, roundsCompleted:0, extraReps:'', timedOut:false,
      setsCount:'1', restMin:'0', restSec:'0', currentSet:1, setPhase:'work', setsLog:[] };
  }
}
// Gemeinsame Payload-Form fuer Entwurf/Box-Veroeffentlichung/-Import (bisher an 5 Stellen
// kopiert, mit abweichenden Defaults zwischen Speichern und Wiederherstellen) - hier EINMAL
// definiert, damit ein kuenftiges neues Feld nicht an mehreren Stellen von Hand nachgezogen
// werden muss.
function amrapPayloadFromBuilder(b){
  return { movements: JSON.parse(JSON.stringify(b.movements)), durationMin:b.durationMin, durationSec:b.durationSec, setsCount:b.setsCount, restMin:b.restMin, restSec:b.restSec };

function applyAmrapPayloadToBuilder(p){

function updateAmrapMove(mi, field, val){
  const b = state.tmp.amrapBuilder;
  b.movements[mi][field] = val;
  if(field==='exerciseId'){
    const ex = state.exercises.find(e=>e.id===val);
    const type = getExerciseType(ex);
    b.movements[mi].unit = isRunExercise(ex) ? 'm' : (type==='cardio' ? 'kcal' : 'reps');
    if(type!=='weighted') b.movements[mi].weight = '';
    render();
  }
}
function updateAmrapMoveVariant(mi, variantId){
  const b = state.tmp.amrapBuilder;
  const ex = state.exercises.find(e=>e.id===b.movements[mi].exerciseId);
  const match = matchLibraryVariant(ex);
  if(!match) return;
  const variant = match.base.variants.find(v=>v.id===variantId);
  if(!variant) return;
  const newId = findOrCreateExerciseId(composeVariantName(match.base, variant, ''), variant.type || match.base.type || 'weighted');
  updateAmrapMove(mi, 'exerciseId', newId);
}
function updateAmrapMoveQty(mi, displayVal){
  const b = state.tmp.amrapBuilder;

}
function updateAmrapMoveWeight(mi, displayVal){

function setAmrapMoveUnit(mi, unit){

function updateAmrapField(field, val){

function startAmrapWod(){
  const b = state.tmp.amrapBuilder;
  state.tmp.wodDate = document.getElementById('wodDate').value || todayStr();
  state.tmp.wodName = document.getElementById('wodName').value.trim();
  if(!b.movements.length){ showToast('Bitte mindestens eine Übung hinzufügen'); return; }
  b.durationMs = (parseInt(b.durationMin)||0)*60000 + (parseInt(b.durationSec)||0)*1000;
  if(b.durationMs<=0){ showToast('Bitte eine Dauer eingeben'); return; }
  b.remainingMs = b.durationMs;
  b.roundsCompleted = 0;
  b.timedOut = false;
  b.currentSet = 1;
  b.setPhase = 'work';
  b.setsLog = [];
  b.startedAt = Date.now();
  b.running = true;
  b.phase = 'running';
  startTicking('live', tickAmrap);
  render();
  window.scrollTo(0,0);
}
function tickAmrap(){
  const b = state.tmp.amrapBuilder;
  if(!b || b.phase!=='running'){ stopTicking(); return; }
  const remaining = b.remainingMs - (Date.now()-b.startedAt);
  const display = document.getElementById('timerBigDisplay');
  if(remaining<=0){
    b.remainingMs = 0;
    b.running = false;
    stopTicking();
    beep();
    if(b.setPhase==='rest'){
      b.setPhase = 'work';
      b.remainingMs = b.durationMs;
      b.startedAt = Date.now();
      b.running = true;
      startTicking('live', tickAmrap);
      render();
      return;
    }
    b.timedOut = true;
    render();
    return;
  }
  if(display) display.textContent = fmtClock(remaining,false);
}
function incrementAmrapRound(delta){
  const b = state.tmp.amrapBuilder;
  b.roundsCompleted = Math.max(0, b.roundsCompleted + delta);
  render();
}
function finishAmrap(){
  const b = state.tmp.amrapBuilder;
  if(b.running){ b.remainingMs = Math.max(0, b.remainingMs - (Date.now()-b.startedAt)); b.running=false; }
  stopTicking();
  b.timedOut = true;
  render();
}
function pauseAmrapClock(){
  const b = state.tmp.amrapBuilder;
  if(b && b.running){
    b.remainingMs = Math.max(0, b.remainingMs - (Date.now()-b.startedAt));
    b.running = false;
    stopTicking();
  }
  render();
}
function resumeAmrapClock(){
  const b = state.tmp.amrapBuilder;
  b.startedAt = Date.now();
  b.running = true;
  startTicking('live', tickAmrap);
  render();
}
function confirmAmrapExtraReps(){
  const b = state.tmp.amrapBuilder;
  b.extraReps = document.getElementById('amrapExtraReps').value || '0';
  const setsCount = parseInt(b.setsCount)||1;
  if(setsCount>1){
    b.setsLog.push({roundsCompleted: b.roundsCompleted, extraReps: parseInt(b.extraReps)||0});
    if(b.currentSet < setsCount){
      b.currentSet += 1;
      b.roundsCompleted = 0;
      b.extraReps = '';
      b.timedOut = false;
      const restMs = (parseInt(b.restMin)||0)*60000 + (parseInt(b.restSec)||0)*1000;
      b.setPhase = restMs>0 ? 'rest' : 'work';
      b.remainingMs = restMs>0 ? restMs : b.durationMs;
      b.startedAt = Date.now();
      b.running = true;
      startTicking('live', tickAmrap);
      render();
      return;
    }
  }
  b.phase = 'summary';
  render();
}

      <button class="btn btn-primary" style="margin-top:10px;" onclick="saveAmrapWorkout()">Workout speichern</button>
