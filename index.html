<style>

  :root{
    --graphite-900:#1B1D21;
    --graphite-800:#232629;
    --iron-700:#333740;
    --iron-600:#40454F;
    --iron-500:#565C68;
    --chalk-50:#F1EDE4;
    --chalk-200:#D8D2C2;
    --plate-red:#C8443C;
    --plate-red-dim:#8E2F2A;
    --chalk-yellow:#E8B93F;
    --success-green:#6B9E63;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{

  .box-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}

<script>
/* ---------- Storage helpers ---------- */
async function loadKey(key, fallback){
  try{
    const raw = localStorage.getItem('ironlog:'+key);
    return raw!=null ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback;
  }
}
async function saveKey(key, value){
  try{
    localStorage.setItem('ironlog:'+key, JSON.stringify(value));
  }catch(e){
    console.error('Speichern fehlgeschlagen', key, e);
  }
  syncKeyToCloud(key, value);
}
async function deleteKey(key){
  try{ localStorage.removeItem('ironlog:'+key); }catch(e){}
}

/* ---------- Cloud-Sync (PocketBase) ---------- */
const pb = new PocketBase('https://api.formelfuchs.at');
const VAPID_PUBLIC_KEY = 'BCmc8m4Fy3Wpc25lQJFw9yadMVleGwvce_4LgbKkalHMYTh_vvihKsDsnOktyiGi8ysXeMazXnkbSlCF2YYntZI';
async function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return null;
  try{ return await navigator.serviceWorker.register('sw.js'); }
  catch(e){ console.error('SW-Registrierung fehlgeschlagen', e); return null; }
}
registerServiceWorker();
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function enablePushNotifications(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    showToast('Push-Benachrichtigungen werden auf diesem Gerät nicht unterstützt');
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){ showToast('Berechtigung nicht erteilt'); return; }
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const j = sub.toJSON();
    const existing = await pb.collection('push_subscriptions').getFullList({
      filter: pb.filter('user = {:u} && endpoint = {:e}', {u: pb.authStore.record.id, e: j.endpoint}),
      requestKey: null
    });
    if(!existing.length){
      await pb.collection('push_subscriptions').create({
        user: pb.authStore.record.id, endpoint: j.endpoint,
        p256dh: j.keys.p256dh, auth: j.keys.auth
      });
    }
    showToast('Push-Benachrichtigungen aktiviert');
    render();
  }catch(e){
    console.error(e);
    showToast('Aktivierung fehlgeschlagen');
  }
}
const NOTIFICATION_CATEGORIES = [
  {key:'waitlistPromoted', label:'Warteliste rückt nach'},
  {key:'courseReminder', label:'Kurs beginnt bald'},
  {key:'courseAtRisk', label:'Kurs droht auszufallen'},
  {key:'reactivation', label:'Lange nicht trainiert (Erinnerung)'},
  {key:'newWorkout', label:'Neues WOD veröffentlicht'},
  {key:'newPoll', label:'Neue Umfrage'},
  {key:'postComment', label:'Kommentar auf deinen Beitrag'},
  {key:'joinRequest', label:'Neue Beitrittsanfrage (Coach)'},
  {key:'joinApproved', label:'Beitrittsanfrage angenommen'},
  {key:'announcement', label:'Box-Ankündigungen'}
];
function renderNotificationSettings(){
  const me = pb.authStore.record;
  const prefs = me?.notificationPrefs || {};
  return `
    <div class="note" style="margin-bottom:6px;">Einzelne Kategorien abschalten:</div>
    ${NOTIFICATION_CATEGORIES.map(c=>`
      <div class="row" style="align-items:center;justify-content:space-between;margin:10px 0;">

async function toggleNotificationPref(key, checked){

const SYNC_KEYS = ['profile','exercises','workouts','drafts','nutritionLogs','measurements','prEntries','timeRecords','readinessLogs','trainingPlan'];
function getPendingSync(){
  try{ return JSON.parse(localStorage.getItem('ironlog:_pendingSync')||'[]'); }catch(e){ return []; }
}
function setPendingSync(list){
  try{ localStorage.setItem('ironlog:_pendingSync', JSON.stringify([...new Set(list)])); }catch(e){}
}
function markPendingSync(key){
  const list = getPendingSync();
  if(!list.includes(key)){ list.push(key); setPendingSync(list); }
}
function clearPendingSync(key){
  setPendingSync(getPendingSync().filter(k=>k!==key));
}
async function pushKeyToCloud(key, value){
  if(!pb.authStore.isValid) return false;
  try{
    const userId = pb.authStore.record.id;
    let existing;
    try{
      existing = await pb.collection('user_data').getFirstListItem(pb.filter('user = {:user} && key = {:key}', {user:userId, key}));
    }catch(e){ existing = null; }
    if(existing){
      await pb.collection('user_data').update(existing.id, { value });
    } else {
      await pb.collection('user_data').create({ user: userId, key, value });
    }
    return true;
  }catch(e){
    return false;
  }
}
function syncKeyToCloud(key, value){
  if(!pb.authStore.isValid || !SYNC_KEYS.includes(key)) return;
  pushKeyToCloud(key, value).then(ok=>{ ok ? clearPendingSync(key) : markPendingSync(key); });
}
async function flushPendingSync(){
  if(!pb.authStore.isValid) return;
  for(const key of getPendingSync()){
    const value = await loadKey(key, null);
    if(value===null) continue;
    if(await pushKeyToCloud(key, value)) clearPendingSync(key);
  }
}
async function pullAllFromCloud(){
  if(!pb.authStore.isValid) return {hadCloudData:false};
  const userId = pb.authStore.record.id;
  const records = await pb.collection('user_data').getFullList({filter: pb.filter('user = {:user}', {user:userId})});
  records.forEach(r=>{ localStorage.setItem('ironlog:'+r.key, JSON.stringify(r.value)); });
  return {hadCloudData: records.length>0};
}
async function pushAllLocalToCloud(){
  for(const key of SYNC_KEYS){
    const value = await loadKey(key, null);
    if(value!==null) await pushKeyToCloud(key, value);
  }
}
function hasAnyLocalData(){
  return SYNC_KEYS.some(key=>localStorage.getItem('ironlog:'+key)!=null);
}

/* ---------- Math ---------- */
function estimate1RM(weight, reps){
  reps = Math.max(1, reps);
  if(reps === 1) return weight;
  return weight * (1 + reps/30);
}
function weightForReps(e1rm, reps){
  reps = Math.max(1, reps);
  if(reps === 1) return e1rm;
  return e1rm / (1 + reps/30);
}
function roundToIncrement(v, inc=2.5){
  return Math.round(v/inc)*inc;
}

EXERCISE_LIBRARY.sort((a,b)=>a.name.localeCompare(b.name,'de'));
EXERCISE_LIBRARY.forEach(b=>{
  const standard = b.variants[0];
  const rest = b.variants.slice(1).sort((v1,v2)=>v1.label.localeCompare(v2.label,'de'));
  b.variants = [standard, ...rest];
});
function composeVariantName(base, variant, detailVals){
  if(!variant || variant.id==='standard') return base.name;
  let name = `${variant.label} ${base.name}`;
  const vals = (detailVals && typeof detailVals === 'object') ? detailVals : {};
  if(variant.details && variant.details.length){
    const parts = [];
    variant.details.forEach(d=>{
      const raw = vals[d.key];
      if(raw===undefined || raw===null || raw==='') return;
      const val = d.numeric ? `${d.signed===false?'':'+'}${raw}${d.unit||'kg'}` : raw;
      parts.push(val);
    });
    if(parts.length) name += ` (${parts.join(', ')})`;
  }
  return name;
}
function matchLibraryVariant(ex){
  if(!ex) return null;
  const n = ex.name.toLowerCase();
  for(const base of EXERCISE_LIBRARY){
    for(const variant of base.variants){
      const composed = composeVariantName(base, variant, '').toLowerCase();
      if(n === composed || (variant.details && variant.details.length && n.startsWith(composed))) return {base, variant};
    }
  }
  return null;
}

};
const WEEKDAY_LABELS = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const PLAN_DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const PLAN_LEVEL_RANK = {beginner:0, intermediate:1, advanced:2};
const PLAN_STATUS_TO_LEVEL = {anfaenger:'beginner', fortgeschritten:'intermediate', profi:'advanced'};

const PLAN_FREQUENCY_DAY_PATTERNS = {
  1:['wed'], 2:['mon','thu'], 3:['mon','wed','fri'], 4:['mon','tue','thu','fri'],
  5:['mon','tue','wed','thu','fri'], 6:['mon','tue','wed','thu','fri','sat'],
  7:['mon','tue','wed','thu','fri','sat','sun']
};
function generateTrainingPlan(status, location, frequency){
  frequency = Math.min(7, Math.max(1, parseInt(frequency)||3));
  const selectedDays = PLAN_FREQUENCY_DAY_PATTERNS[frequency];
  const allowedEquipment = LOCATION_EQUIPMENT[location] || [];
  const targetLevel = PLAN_STATUS_TO_LEVEL[status] || 'beginner';
  const fitsEquipment = (eq)=> (eq||[]).every(tag=>allowedEquipment.includes(tag));
  const fitsLevel = (lvl)=> PLAN_LEVEL_RANK[lvl] <= PLAN_LEVEL_RANK[targetLevel];

  let wodPool = CROSSFIT_WODS.filter(w=>fitsEquipment(w.equipment) && fitsLevel(w.level));
  if(!wodPool.length) wodPool = CROSSFIT_WODS.filter(w=>fitsEquipment(w.equipment));
  let progPool = STRENGTH_PROGRESSIONS.filter(p=>fitsEquipment(p.equipment) && fitsLevel(p.level));
  if(!progPool.length) progPool = STRENGTH_PROGRESSIONS.filter(p=>fitsEquipment(p.equipment));

  const days = {};
  let wodCounter = 0, progCounter = 0;
  selectedDays.forEach((dayKey, i)=>{
    const useWod = i % 2 === 0;
    if(useWod && wodPool.length){
      days[dayKey] = { type:'wod', refId: wodPool[wodCounter % wodPool.length].id };
      wodCounter++;
    } else if(progPool.length){
      days[dayKey] = { type:'strength', refId: progPool[progCounter % progPool.length].id };
      progCounter++;
    } else if(wodPool.length){
      days[dayKey] = { type:'wod', refId: wodPool[wodCounter % wodPool.length].id };
      wodCounter++;
    }
  });
  return { status, location, frequency, days };
}
function todaysPlanKey(){
  return PLAN_DAY_KEYS[(new Date().getDay()+6)%7];

function isRunExercise(ex){
  return !!ex && getExerciseType(ex)==='cardio' && GPS_RUN_NAMES.some(n=>ex.name.toLowerCase().includes(n));
}
const DISTANCE_WEIGHTED_NAMES = ['lunge','farmers carry','farmer carry','farmers walk','farmer walk','sandbag carry','yoke carry','suitcase carry','sled push','sled pull','sled drag'];
function isDistanceWeightedExercise(ex){
  if(!ex || getExerciseType(ex)!=='weighted') return false;
  const n = ex.name.toLowerCase();
  return DISTANCE_WEIGHTED_NAMES.some(k=>n.includes(k));
}
function guessExerciseType(name){
  const n = name.toLowerCase();
  if(CARDIO_MACHINE_NAMES.some(c=>new RegExp('\\b'+c.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(n))) return 'cardio';
  const libMatch = EXERCISE_LIBRARY.find(b=>n.includes(b.name.toLowerCase()));
  if(libMatch) return libMatch.type;
  return 'weighted';
}
function findOrCreateExerciseId(name, type){
  const existing = state.exercises.find(e=>e.name.toLowerCase()===name.toLowerCase());
  if(existing) return existing.id;
  const ex = {id: slug(name), name, custom:true, type: type || guessExerciseType(name), movementPattern: guessMovementPattern(name)};
  state.exercises.push(ex);
  saveKey('exercises', state.exercises);
  return ex.id;
}
function buildLibraryMovement(m){
  const cleanName = m.name.replace(/\s+\d+m$/i, '');
  const exId = findOrCreateExerciseId(cleanName);
  const type = getExerciseType(state.exercises.find(e=>e.id===exId));
  return {exerciseId: exId, reps: m.reps ? String(m.reps) : '', weight:'', unit: type==='cardio' ? 'm' : 'reps'};
}

function updateExerciseModal(field, val){
  const m = state.tmp.exerciseModal;

    const base = EXERCISE_LIBRARY.find(b=>b.id===val);
    m.variantId = base ? base.variants[0].id : '';

function confirmExerciseModal(){
  const m = state.tmp.exerciseModal;
  let name, type;
  if(m.mode==='custom'){
    name = (m.customName||'').trim();
    if(!name){ showToast('Bitte einen Namen eingeben'); return; }
    type = m.customType || 'weighted';
  } else {
    const base = EXERCISE_LIBRARY.find(b=>b.id===m.baseId);
    if(!base){ showToast('Bitte eine Grundübung wählen'); return; }
    const variant = base.variants.find(v=>v.id===m.variantId) || base.variants[0];
    if(variant.details && variant.details.length){
      for(const d of variant.details){
        if(!String((m.variantDetail||{})[d.key]||'').trim()){
          showToast(`Bitte ${d.label} angeben`);
          return;
        }
      }
    }
    name = composeVariantName(base, variant, m.variantDetail);
    type = variant.type || base.type || 'weighted';
  }
  let exId;
  if(m.editId){
    const ex = state.exercises.find(e=>e.id===m.editId);
    if(!ex){ showToast('Übung nicht gefunden'); state.tmp.exerciseModal = null; render(); return; }
    ex.name = name;
    ex.type = type;
    saveKey('exercises', state.exercises);
    exId = ex.id;
    showToast('Übung aktualisiert');
  } else {
    exId = findOrCreateExerciseId(name, type);
  }
  const cb = m.onSelect;
  state.tmp.exerciseModal = null;
  if(cb) cb(exId);
  render();
}

/* ---------- Migration (old separate Training/WOD format -> unified Workout format) ---------- */
function migrateToWorkouts(oldTrainingLogs, oldWods){
  const workouts = [];
  (oldWods||[]).forEach(w=>{
    const movements = (w.movements||[]).map(m=>{
      let sets;
      if(m.sets){
        sets = m.sets.map(s=>({
          reps: s.reps!==undefined ? s.reps : '',
          weight: s.weight!==undefined ? s.weight : (s.calcWeight||''),
          rmCheck: !!(s.percent),
          pct: s.percent||null,
          rmReps: s.percent ? 1 : null
        }));
      } else {
        sets = [{reps:'', weight:m.calcWeight||'', rmCheck: !!m.percent, pct:m.percent||null, rmReps: m.percent?1:null}];
      }
      return { exerciseId:m.exerciseId, sets };
    });
    workouts.push({ id:w.id, date:w.date, name:w.name||'', note:w.note||'', movements });
  });
  (oldTrainingLogs||[]).forEach(e=>{
    const sets = (e.sets||[{weight:e.weight,reps:e.reps}]).map(s=>({reps:s.reps, weight:s.weight, rmCheck:false, pct:null, rmReps:null}));
    workouts.push({ id:e.id, date:e.date, name:'', note:'', movements:[{exerciseId:e.exerciseId, sets}] });
  });
  return workouts;
}

};

function hexToHsl(hex){
  hex = (hex||'').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.substring(0,2),16)/255, g = parseInt(hex.substring(2,4),16)/255, b = parseInt(hex.substring(4,6),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h=0, s=0; const l=(max+min)/2;
  if(max!==min){
    const d = max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    if(max===r) h = (g-b)/d + (g<b?6:0);
    else if(max===g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60;
  }
  return [h, s*100, l*100];
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const c = (1-Math.abs(2*l-1))*s, x = c*(1-Math.abs((h/60)%2-1)), m = l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  const toHex = v => Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#'+toHex(r)+toHex(g)+toHex(b);
}
function deriveAccentPair(baseHex){
  const [h,s,l] = hexToHsl(baseHex);
  const darkL = Math.min(80, Math.max(50, l));
  const lightL = Math.min(45, Math.max(25, l*0.6));
  return { dark: hslToHex(h,s,darkL), light: hslToHex(h,s,lightL) };
}
function resolveAccentPair(){
  const hex = state.profile?.accentColorByMode?.[currentViewMode()];
  if(hex) return deriveAccentPair(hex);
  return state.box.membership?.role==='member' ? ACCENT_DEFAULTS.member : ACCENT_DEFAULTS.owner;
}

  theme = theme || document.documentElement.dataset.theme || 'dark';

}

  state.exercises.forEach(ex=>{

    const correctType = match.variant.type || match.base.type;

}
function migrateMovementPatterns(){

  state.exercises.forEach(ex=>{
    if(ex.movementPattern) return;
    const def = DEFAULT_EXERCISES.find(d=>d.id===ex.id || d.name.toLowerCase()===ex.name.toLowerCase());
    const pattern = def ? def.movementPattern : guessMovementPattern(ex.name);
    if(pattern){

function migrateMovementsForPR(){
  let changed = false;
  state.workouts.forEach(w=>{
    if(w.movements && w.movements.length) return;
    let flat = null;
    if(w.format==='for-time' && w.forTime) flat = w.forTime.movements;
    else if(w.format==='amrap' && w.amrap) flat = w.amrap.movements;
    else if(w.format==='for-load' && w.forLoad) flat = [{exerciseId:w.forLoad.exerciseId, reps:w.forLoad.targetReps, weight:w.forLoad.achievedWeight}];
    if(!flat) return;
    const built = buildPrMovementsFromFlat(flat);
    if(built.length){ w.movements = built; changed = true; }
  });
  return changed;
}
function decodeJwtPayload(token){
  try{
    const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(atob(base64));
  }catch{
    return null;
  }
}
let pendingJoinCode = null;
let pendingStripeOnboardingRefresh = false;
let pendingPurchaseSuccessCheck = null;
function boot(){
  const joinCode = new URLSearchParams(location.search).get('join');
  if(joinCode){
    pendingJoinCode = joinCode;
    history.replaceState(null, '', location.pathname);
  }
  if(new URLSearchParams(location.search).get('stripeOnboarding')==='done'){
    pendingStripeOnboardingRefresh = true;
    history.replaceState(null, '', location.pathname);
  }
  const returnParams = new URLSearchParams(location.search);
  const planOrderId = returnParams.get('planOrder');
  const creditOrderId = returnParams.get('creditOrder');
  if((planOrderId || creditOrderId) && returnParams.get('status')){
    if(returnParams.get('status')==='success'){
      pendingPurchaseSuccessCheck = planOrderId ? {type:'plan', id:planOrderId} : {type:'credit', id:creditOrderId};
    }
    history.replaceState(null, '', location.pathname);
  }
  const token = new URLSearchParams(location.search).get('token');
  if(token){
    history.replaceState(null, '', location.pathname);
    const payload = decodeJwtPayload(token);
    if(payload && payload.type==='verification'){
      handleVerificationToken(token);
      return;
    }
    state.tmp.auth = {screen:'reset', email:'', password:'', passwordConfirm:'', error:'', info:'', loading:false, resetToken:token};
    renderBoot();
    return;
  }
  if(pb.authStore.isValid){
    initApp();
  } else {
    state.tmp.auth = {screen: pendingJoinCode?'register':'login', email:'', password:'', passwordConfirm:'', error:'', info:'', loading:false, resetToken:null};
    renderBoot();
  }
}
async function handleVerificationToken(token){
  state.tmp.auth = {screen:'verifying', email:'', password:'', passwordConfirm:'', error:'', info:'', loading:true, resetToken:null};
  renderBoot();
  try{
    await pb.collection('users').confirmVerification(token);
    if(pb.authStore.isValid) await pb.collection('users').authRefresh();
    state.tmp.auth = {screen:'verified', email:'', password:'', passwordConfirm:'', error:'', info:'', loading:false, resetToken:null};
  }catch(e){
    state.tmp.auth = {screen:'verified', email:'', password:'', passwordConfirm:'', error:'Link ungültig oder abgelaufen.', info:'', loading:false, resetToken:null};
  }
  renderBoot();

async function submitAuth(){
  const a = state.tmp.auth;
  const email = a.email.trim();
  const password = a.password;
  const isRegister = a.screen==='register';
  if(!email || !password){ a.error = 'Bitte E-Mail und Passwort eingeben'; renderBoot(); return; }
  if(isRegister && password!==a.passwordConfirm){ a.error = 'Passwörter stimmen nicht überein'; renderBoot(); return; }
  a.loading = true; a.error = '';
  renderBoot();
  try{
    if(isRegister){
      await pb.collection('users').create({email, password, passwordConfirm:a.passwordConfirm});
    }
    await pb.collection('users').authWithPassword(email, password);
    if(isRegister){
      try{ await pb.collection('users').requestVerification(email); }catch{}
    }
    await afterAuthSuccess();
  }catch(e){
    a.loading = false;
    a.error = (e && e.response && e.response.message) || 'Anmeldung fehlgeschlagen. Bitte Angaben prüfen.';
    renderBoot();
  }

  if(!state.profile.onboardingSeen) state.tmp.onboarding = {open:true, step:0};
  state.trainingPlan = trainingPlan;
  if(exercises && exercises.length){
    state.exercises = exercises;
    let exercisesChanged = migrateStaleExerciseTypes();
    if(migrateMovementPatterns()) exercisesChanged = true;
    if(exercisesChanged) await saveKey('exercises', state.exercises);
  } else {
    state.exercises = cloneDefaultExercises();
    await saveKey('exercises', state.exercises);
  }
  if(workoutsStored){
    state.workouts = workoutsStored;
  } else {
    state.workouts = migrateToWorkouts(oldTrainingLogs, oldWods);
    await saveKey('workouts', state.workouts);
  }
  if(migrateMovementsForPR()) await saveKey('workouts', state.workouts);
  state.nutritionLogs = nutritionLogs;
  state.measurements = measurements;
  state.prEntries = prEntries;
  state.timeRecords = timeRecords;
  state.readinessLogs = readinessLogs;
  state.drafts = drafts || [];

  // Beim Neuladen der Seite auf dem zuletzt besuchten Tab bleiben, statt immer auf
  // "Today" zurueckzufallen - rein lokal (nicht ueber saveKey/Cloud-Sync), da es sich um
  // eine geraetespezifische UI-Praeferenz handelt, keine "echten" Nutzerdaten.
  let restoredTab = null;
  try{ restoredTab = localStorage.getItem('ironlog:lastActiveTab'); }catch(e){}
  if(restoredTab && ['today','workout','box','progress','profile'].includes(restoredTab)) state.activeTab = restoredTab;

  let restoredBoxSubTab = null;
  try{ restoredBoxSubTab = localStorage.getItem('ironlog:lastBoxSubTab'); }catch(e){}
  if(restoredBoxSubTab && ['home','schedule','workouts','social'].includes(restoredBoxSubTab)) state.tmp.boxSubTab = restoredBoxSubTab;

  document.getElementById('app').innerHTML = appShell();
  render();
  // im Hintergrund, damit Rollen-Badge (Profil/Box-Tab) unabhängig vom besuchten Tab verfügbar ist -
  // .then() holt danach die Datenlade-Seiteneffekte nach, die setBoxSubTab() beim Klick ausloest
  // (state.box.membership existiert erst nach loadBoxData(), sonst haengt die wiederhergestellte
  // Unteransicht dauerhaft bei "Laedt ...").
  loadBoxData().then(()=>{
    if(state.box.membership?.status !== 'active') return;
    if(state.tmp.boxSubTab==='schedule'){
      selectScheduleDate(state.tmp.scheduleSelectedDate || todayStr());
    } else if(state.tmp.boxSubTab==='workouts'){
      selectWorkoutsDate(state.tmp.workoutsSelectedDate || todayStr());
    } else if(state.tmp.boxSubTab==='social' && !state.box.socialLoaded){
      loadSocialFeed(state.box.membership.box);
    }
  });
  if(pendingJoinCode){
    const code = pendingJoinCode;
    pendingJoinCode = null;
    state.activeTab = 'box';
    render();
    joinBoxByCode(code);
  }
  if(pendingPurchaseSuccessCheck) checkPendingPurchaseSuccess();
}
// Nach Rueckkehr von Stripe (?planOrder=/?creditOrder=...&status=success): fragt kurz
// nach, bis der Webhook die Bestellung als bezahlt markiert hat (Zustellung ist asynchron,
// kann ein paar Sekunden dauern), dann Vibration + Ton + Bestaetigung + Datenaktualisierung.
async function checkPendingPurchaseSuccess(){
  const check = pendingPurchaseSuccessCheck;
  pendingPurchaseSuccessCheck = null;
  if(!check) return;
  const collection = check.type==='plan' ? 'plan_orders' : 'credit_orders';
  for(let i=0; i<20; i++){
    let order;
    try{ order = await pb.collection(collection).getOne(check.id); }
    catch(e){ return; }
    if(order.status==='paid'){
      vibrateIfSupported(200);
      playSuccessSound();
      await loadBoxData();
      const label = check.type==='plan'
        ? (order.templateSnapshot?.name || 'Kontingent')
        : (order.offerSnapshot?.name || order.offerSnapshot?.title || 'Karte');
      showToast(`🎉 Kauf bestätigt: ${label}`);
      return;
    }
    if(order.status==='expired' || order.status==='failed') return;
    await new Promise(r=>setTimeout(r, 1500));
  }
}

function weekDates(offsetWeeks){
  offsetWeeks = offsetWeeks||0;
  const today = new Date();
  const dayIdx = (today.getDay()+6)%7; // 0=Mo
  const monday = new Date(today); monday.setDate(today.getDate()-dayIdx+offsetWeeks*7);
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    days.push(localDateStr(d));
  }
  return days;
}

function startPlannedWorkout(){
  const planDay = state.trainingPlan.days[todaysPlanKey()];
  if(!planDay){ setTab('workout'); return; }
  if(planDay.type==='wod' || planDay.type==='ai-wod'){
    const wod = planDay.type==='ai-wod' ? planDay.wod : CROSSFIT_WODS.find(w=>w.id===planDay.refId);
    if(wod){
      state.tmp.wodName = wod.name;
      if(wod.format==='amrap'){
        state.tmp.wodFormat = 'amrap';
        state.tmp.amrapBuilder = buildAmrapBuilderFromWod(wod);
      } else {
        state.tmp.wodFormat = 'for-time';
        state.tmp.forTimeBuilder = buildForTimeBuilderFromWod(wod);
      }
    }
  } else {
    const prog = planDay.type==='ai-strength' ? planDay.prog : STRENGTH_PROGRESSIONS.find(p=>p.id===planDay.refId);
    const template = buildTemplateFromProgression(prog);
    if(template){
      state.tmp.wodFormat = 'strength';
      state.tmp.wodTemplate = template;
      state.tmp.wodName = planEntryLabel(planDay) || '';
      state.tmp.wodPhase = 'template';
    }
  }
  setTab('workout');
}

/* ---------- WORKOUT TAB (merged Training + WOD, two-phase: template -> generated rows) ---------- */
function exerciseLogs(exId){
  const out = [];
  state.workouts.forEach(w=>{
    (w.movements||[]).forEach(m=>{
      if(m.exerciseId===exId){
        const sets = m.sets.filter(s=>s.weight && s.reps);
        if(sets.length) out.push({ date: w.date, sets });
      }
    });
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function topSet(entry){
  return entry.sets.reduce((best,s)=> estimate1RM(s.weight,s.reps) > estimate1RM(best.weight,best.reps) ? s : best, entry.sets[0]);
}
function sessionE1RM(entry){
  return entry.sets.reduce((max,s)=> Math.max(max, estimate1RM(s.weight,s.reps)), 0);
}
function computedBest(exId){
  const logs = exerciseLogs(exId);
  return logs.length ? logs.reduce((max,e)=>Math.max(max, sessionE1RM(e)), 0) : null;
}
function bestByRepScheme(exId){
  const byReps = {};
  exerciseLogs(exId).forEach(entry=>{
    entry.sets.forEach(s=>{
      const reps = parseInt(s.reps), weight = parseFloat(s.weight);
      if(!reps || !weight) return;
      if(!byReps[reps] || weight > byReps[reps].weight) byReps[reps] = { reps, weight, date: entry.date };
    });
  });
  return Object.values(byReps).sort((a,b)=>a.reps-b.reps);
}
function buildPrMovementsFromFlat(list){
  return (list||[]).map(mv=>{
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    if(!ex || getExerciseType(ex)!=='weighted') return null;
    const reps = parseFloat(mv.reps), weight = parseFloat(mv.weight);
    if(!reps || !weight) return null;
    return { exerciseId: mv.exerciseId, sets:[{reps: mv.reps, weight: mv.weight, pct:null}] };
  }).filter(Boolean);
}
function detectNewPRs(movements){
  const prs = [];
  (movements||[]).forEach(mv=>{
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    if(!ex) return;
    const priorBest = {};
    bestByRepScheme(mv.exerciseId).forEach(b=>{ priorBest[b.reps] = b.weight; });
    (mv.sets||[]).forEach(s=>{
      const reps = parseInt(s.reps), weight = parseFloat(s.weight);
      if(!reps || !weight) return;
      if(!priorBest[reps] || weight > priorBest[reps]){
        prs.push({ name: ex.name, reps, weight });
        priorBest[reps] = weight;
      }
    });
  });
  return prs;
}
function showPRToastIfAny(movements){
  const prs = detectNewPRs(movements);
  if(prs.length) showToast('🏆 Neuer Rekord: ' + prs.map(p=>`${p.reps} WH ${p.name} @ ${p.weight}kg`).join(', '));
}
function prEntriesFor(exId){
  return state.prEntries.filter(p=>p.exerciseId===exId).sort((a,b)=> b.value-a.value || b.date.localeCompare(a.date));
}
function manualBest(exId){
  const list = prEntriesFor(exId);
  return list.length ? list[0].value : null;
}
// Kombiniert errechnete Session-e1RM-Werte (aus geloggten Workouts) UND manuelle 1RM-
// Eintraege zu EINER chronologischen Zeitreihe fuer die Trendgrafik (Pro-Feature) - pro Datum
// wird der jeweils hoechste Wert genommen, falls an einem Tag beides vorliegt.
function buildE1RMTrendSeries(exId){
  const byDate = {};
  exerciseLogs(exId).forEach(entry=>{
    const v = sessionE1RM(entry);
    if(!byDate[entry.date] || v > byDate[entry.date]) byDate[entry.date] = v;
  });
  prEntriesFor(exId).forEach(p=>{
    if(!byDate[p.date] || p.value > byDate[p.date]) byDate[p.date] = p.value;
  });
  return Object.entries(byDate).map(([date,value])=>({date, value})).sort((a,b)=>a.date.localeCompare(b.date));
}
function renderE1RMTrendChart(exId){
  const series = buildE1RMTrendSeries(exId);
  if(series.length < 2) return `<div class="note" style="margin-bottom:8px;">Noch nicht genug Datenpunkte für eine Trendgrafik.</div>`;
  const width = 320, height = 110, padX = 8, padY = 16;
  const values = series.map(p=>p.value);
  const minV = Math.min(...values), maxV = Math.max(...values);
  const range = (maxV - minV) || 1;
  const n = series.length;
  const points = series.map((p,i)=>{
    const x = padX + (n>1 ? (i/(n-1)) : 0.5) * (width - padX*2);
    const y = height - padY - ((p.value - minV)/range) * (height - padY*2);
    return {x, y, ...p};
  });
  const pathD = points.map((p,i)=> (i===0?'M':'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const dots = points.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="var(--chalk-yellow)"></circle>`).join('');
  return `
    <div class="note" style="margin-bottom:4px;">Trend (${Math.round(minV)}–${Math.round(maxV)}kg)</div>
    <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;">
      <path d="${pathD}" fill="none" stroke="var(--chalk-yellow)" stroke-width="2"></path>
      ${dots}
    </svg>
    <div class="row" style="justify-content:space-between;margin-bottom:8px;">
      <span class="note" style="margin:0;">${fmtDate(series[0].date)}</span>
      <span class="note" style="margin:0;">${fmtDate(series[n-1].date)}</span>
    </div>
  `;
}
function bestE1RM(exId){
  const c = computedBest(exId), m = manualBest(exId);
  if(c==null && m==null) return null;
  return Math.max(c||0, m||0);
}

function loadTesseractIfNeeded(){
  if(window.Tesseract) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Texterkennung konnte nicht geladen werden (Internetverbindung nötig).'));
    document.head.appendChild(s);
  });

function handlePhotoImportFile(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const pi = state.tmp.photoImport;
  if(pi.imgSrc) URL.revokeObjectURL(pi.imgSrc);
  pi.error = '';
  pi.sourceFile = file;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>{
    pi.imgSrc = url;
    pi.naturalWidth = img.naturalWidth;
    pi.naturalHeight = img.naturalHeight;
    pi.cropTop = 0; pi.cropBottom = 1;
    pi.stage = 'crop';
    render();
  };
  img.onerror = ()=>{
    URL.revokeObjectURL(url);
    pi.error = 'Bild konnte nicht geladen werden — bitte Text unten manuell eingeben.';
    pi.stage = 'review';
    render();
  };
  img.src = url;
}

function sourceToBase64(source){
  return new Promise((resolve, reject)=>{
    if(source instanceof HTMLCanvasElement){
      const dataUrl = source.toDataURL('image/png');
      resolve({ mimeType:'image/png', base64: dataUrl.split(',')[1] });
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      const dataUrl = reader.result;
      const mimeType = (dataUrl.match(/^data:([^;]+);/)||[])[1] || 'image/jpeg';
      resolve({ mimeType, base64: dataUrl.split(',')[1] });
    };
    reader.onerror = ()=>reject(new Error('Bild konnte nicht gelesen werden'));
    reader.readAsDataURL(source);
  });
}
async function runAiParseOnSource(source){
  const pi = state.tmp.photoImport;
  cleanupPhotoImportImage();
  pi.loading = true; pi.error = '';
  render();

  try{
    const { mimeType, base64 } = await sourceToBase64(source);
    const result = await pb.send('/ai-photo-parse', { method:'POST', body:{ imageBase64: base64, mimeType } });
    if(!result || !result.ok) throw new Error((result && result.error) || 'KI-Erkennung fehlgeschlagen');
    await playMuscleUpFinishAndWait();
    teardownMuscleUpLottie();
    applyParsedWorkout(result);

    stopMuscleUpForError();
    teardownMuscleUpLottie();

    pi.loading = false;
    render();
  }
}

let _cropDrag = null;
const CROP_MIN_GAP = 0.05;
function startCropDrag(event, which){
  event.preventDefault();
  const container = document.getElementById('cropContainer');
  if(!container) return;
  const rect = container.getBoundingClientRect();
  const pi = state.tmp.photoImport;
  _cropDrag = {
    which, rectTop: rect.top, rectHeight: rect.height,
    handleEl: document.getElementById(which==='top' ? 'cropHandleTop' : 'cropHandleBottom'),
    overlayTopEl: document.getElementById('cropOverlayTop'),
    overlayBottomEl: document.getElementById('cropOverlayBottom'),
    otherFraction: which==='top' ? pi.cropBottom : pi.cropTop,
    lastFraction: which==='top' ? pi.cropTop : pi.cropBottom
  };
  const el = event.currentTarget;
  el.setPointerCapture(event.pointerId);
  el.addEventListener('pointermove', onCropDragMove);
  el.addEventListener('pointerup', endCropDrag);
  el.addEventListener('pointercancel', endCropDrag);
}
function onCropDragMove(event){
  if(!_cropDrag) return;
  const d = _cropDrag;
  let frac = (event.clientY - d.rectTop) / d.rectHeight;
  frac = Math.max(0, Math.min(1, frac));
  if(d.which==='top') frac = Math.max(0, Math.min(frac, d.otherFraction - CROP_MIN_GAP));
  else frac = Math.min(1, Math.max(frac, d.otherFraction + CROP_MIN_GAP));
  d.lastFraction = frac;
  const pct = (frac*100).toFixed(2) + '%';
  d.handleEl.style.top = `calc(${pct} - 14px)`;
  if(d.which==='top') d.overlayTopEl.style.height = pct;
  else d.overlayBottomEl.style.height = ((1-frac)*100).toFixed(2) + '%';
}
function endCropDrag(event){
  if(!_cropDrag) return;
  const d = _cropDrag;
  const pi = state.tmp.photoImport;
  if(pi){ if(d.which==='top') pi.cropTop = d.lastFraction; else pi.cropBottom = d.lastFraction; }
  const el = event.currentTarget;
  el.removeEventListener('pointermove', onCropDragMove);
  el.removeEventListener('pointerup', endCropDrag);
  el.removeEventListener('pointercancel', endCropDrag);
  try{ el.releasePointerCapture(event.pointerId); }catch(e){}
  _cropDrag = null;
}
const OPTION_LINE_RE = /^option\s+([a-z0-9]+)\s*[:.\-]?\s*(.*)$/i;
function detectPhotoImportOptions(text){
  const lines = text.split('\n');
  const options = [];
  lines.forEach(line=>{
    const t = line.trim();
    const m = t.match(OPTION_LINE_RE);
    if(m) options.push({ id: t, label: m[1].toUpperCase(), content: m[2].trim() || t });
  });
  return { lines, options };
}
function confirmPhotoImport(){
  const pi = state.tmp.photoImport;
  const text = (pi.rawText || '').trim();
  if(!text){ showToast('Bitte Text eingeben oder Foto wählen'); return; }
  if(pi.aiMode && state.profile?.hasPro){
    runAiTextParse(text);
    return;
  }
  const { lines, options } = detectPhotoImportOptions(text);
  if(options.length >= 2){
    pi.optionLines = lines;
    pi.optionChoices = options;
    pi.stage = 'chooseOption';
    render();
    return;
  }
  applyParsedWorkout(text);
}
function choosePhotoImportOption(idx){
  const pi = state.tmp.photoImport;
  const chosen = pi.optionChoices && pi.optionChoices[idx];
  if(!chosen) return;
  const reconstructed = pi.optionLines
    .filter(line=>{
      const t = line.trim();
      return !OPTION_LINE_RE.test(t) || t === chosen.id;
    })
    .map(line=> line.trim()===chosen.id ? chosen.content : line)
    .join('\n');
  applyParsedWorkout(reconstructed);
}

let _muscleUpLottie = null;

function prefersReducedMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function mountMuscleUpLottie(){
  const container = document.getElementById('muscleUpLottie');
  const fallback = document.getElementById('muscleUpFallbackSvg');
  if(!container || _muscleUpLottie) return;
  if(typeof lottie==='undefined'){ if(fallback) fallback.style.display='block'; return; }
  try{
    _muscleUpTargetFrame = 0;
    _muscleUpLottie = lottie.loadAnimation({
      container, renderer:'svg', loop:false, autoplay:false, path:'muscle-up-upload.json'
    });
    _muscleUpLottie.addEventListener('data_failed', ()=>{
      if(fallback) fallback.style.display='block';
      container.style.display='none';
    });
    _muscleUpLottie.addEventListener('DOMLoaded', ()=>{
      if(!_muscleUpLottie) return;
      _muscleUpLottie.goToAndStop(0, true);
      if(!prefersReducedMotion()) startMuscleUpCrawl();
    });
  }catch(e){
    if(fallback) fallback.style.display='block';
  }
}
function startMuscleUpCrawl(){
  clearInterval(_muscleUpCrawlTimer);
  _muscleUpCrawlTimer = setInterval(()=>{
    if(!_muscleUpLottie || _muscleUpTargetFrame>=120){ clearInterval(_muscleUpCrawlTimer); return; }
    _muscleUpTargetFrame = Math.min(120, _muscleUpTargetFrame+2);
    _muscleUpLottie.goToAndStop(_muscleUpTargetFrame, true);
  }, 90);
}
function setMuscleUpProgress(frac){
  if(!_muscleUpLottie || prefersReducedMotion()) return;
  const target = Math.max(_muscleUpTargetFrame, Math.min(120, Math.round(frac*120)));
  if(target>_muscleUpTargetFrame){
    _muscleUpTargetFrame = target;
    _muscleUpLottie.goToAndStop(target, true);
  }
}
function playMuscleUpFinishAndWait(){
  return new Promise(resolve=>{
    clearInterval(_muscleUpCrawlTimer);
    if(!_muscleUpLottie){ resolve(); return; }
    if(prefersReducedMotion()){
      _muscleUpLottie.goToAndStop(179, true);
      resolve();
      return;
    }
    const onComplete = ()=>{ if(_muscleUpLottie) _muscleUpLottie.removeEventListener('complete', onComplete); resolve(); };
    _muscleUpLottie.addEventListener('complete', onComplete);
    _muscleUpLottie.playSegments([_muscleUpTargetFrame, 179], true);
  });
}
function stopMuscleUpForError(){
  clearInterval(_muscleUpCrawlTimer);
  if(_muscleUpLottie) _muscleUpLottie.stop();
}
function teardownMuscleUpLottie(){
  clearInterval(_muscleUpCrawlTimer);

  for(let i=0;i<=m;i++){ dp.push([i]); }
  for(let j=1;j<=n;j++){ dp[0][j] = j; }
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);

  }
  return dp[m][n];

function parseForTimeText(lines){

  const leftover = [];

    let consumed = false;
    const cap = line.match(/time\s*cap[:\s]*(\d+)\s*:?\s*(\d*)/i);
    if(cap){ timeCapMin = cap[1]; timeCapSec = cap[2]||'0'; consumed = true; }
    const roundsM = matchRoundsCount(line);
    if(roundsM){ rounds = roundsM[1]; consumed = true; }
    if(/^\d+(-\d+){1,}$/.test(line)){ repScheme = line; consumed = true; }
    if(consumed) return;
    const mv = parseMovementLine(line);
    if(mv){ movements.push(mv); return; }
    leftover.push(line);
  });
  return { movements, rounds: String(rounds), repScheme, timeCapMin, timeCapSec, leftover };
}
function parseAmrapText(lines){
  const movements = [];
  const leftover = [];
  let durationMin = '20', durationSec = '0';
  let setsCount = '1', restMin = '0', restSec = '0';

  const multiSetRe = () => [/(\d+)\s*sets?\s*(?:of\s*)?(\d+)\s*:\s*(\d+)?\s*amrap/i, /(\d+)\s*x\s*(\d+)\s*:\s*(\d+)?\s*amrap/i];

  if(multiSet){ setsCount = multiSet[1]; durationMin = multiSet[2]; durationSec = multiSet[3] || '0'; }
  const restM = restRe().reduce((m,re)=>m||fullText.match(re), null);
  if(restM){ restMin = restM[1]; restSec = restM[2] || '0'; }
  lines.forEach(line=>{
    let consumed = false;
    if(multiSet){
      if(multiSetRe().some(re=>re.test(line)) || restRe().some(re=>re.test(line))) consumed = true;
    } else {
      const dur = line.match(/amrap\D*(\d+)/i) || line.match(/(\d+)\D*min.*amrap/i);
      if(dur){ durationMin = dur[1]; consumed = true; }
    }
    if(consumed) return;
    const mv = parseMovementLine(line);
    if(mv){ movements.push(mv); return; }
    leftover.push(line);
  });
  return { movements, durationMin, durationSec, setsCount, restMin, restSec, leftover };
}

    let consumed = false;

    if(interval){ intervalMin = interval[1]; intervalSec = interval[2]; consumed = true; }
    const totalDur = !interval && line.match(/^(\d+)(?::(\d+))?\s*(?:min\.?)?\s*emom\b/i);
    if(totalDur){ totalDurationMin = parseInt(totalDur[1]) + (totalDur[2] ? parseInt(totalDur[2])/60 : 0); consumed = true; }
    const roundsM = matchRoundsCount(line) || line.match(/emom\D*(\d+)/i);
    if(roundsM){ rounds = roundsM[1]; consumed = true; }
    const minuteMatch = !consumed && line.match(/^minute\s+(\d+)\s*:\s*(.+)$/i);
    if(minuteMatch){ minuteBlocks.push({ num: parseInt(minuteMatch[1]), content: minuteMatch[2].trim(), raw: [line] }); return; }
    if(consumed) return;
    // OCR-Zeilenumbruch: eine unvollständige "Minute N:"-Zeile endet oft mitten in einem
    // Übungsnamen (z.B. "...+ 1"), die fehlende Fortsetzung landet als eigene Zeile darunter.
    const lastBlock = minuteBlocks[minuteBlocks.length-1];
    if(lastBlock && /(?:\+|\d)\s*$/.test(lastBlock.content)){
      lastBlock.content += ' ' + line;
      lastBlock.raw.push(line);
      return;
    }
    const mv = parseMovementLine(line);
    if(mv){ movements.push(mv); return; }
    leftover.push(line);
  });

  let minuteBlockCount = 0;
  let blockMovementGroups = [];
  let cyclesCount = 0;
  if(minuteBlocks.length >= 2 && totalDurationMin){
    minuteBlockCount = minuteBlocks.length;
    intervalMin = '1';
    intervalSec = '0';
    rounds = String(Math.round(totalDurationMin));
    cyclesCount = Math.round(totalDurationMin / minuteBlockCount);
    movements.length = 0;
    minuteBlocks.sort((a,b)=>a.num-b.num).forEach(block=>{
      const blockMovs = [];
      block.content.split('+').forEach(seg=>{
        const segMv = parseMovementLine(seg.trim());

  }

  } else {
    const p = structured ? { movements: input.movements||[], rounds: input.rounds||'1', repScheme: input.repScheme||'', timeCapMin: input.timeCapMin||'', timeCapSec: input.timeCapSec||'', leftover: [] } : parseForTimeText(parseLines);
    state.tmp.wodFormat = 'for-time';
    ensureForTimeBuilder();
    const b = state.tmp.forTimeBuilder;
    b.rounds = p.rounds; b.repScheme = p.repScheme; b.timeCapMin = p.timeCapMin; b.timeCapSec = p.timeCapSec;
    if(p.movements.length) b.movements = p.movements.map(mv=>{
      const exerciseId = resolveExerciseIdFromName(mv.name);
      const {unit, reps} = resolveStructuredMoveUnitReps(mv, exerciseId);
      return {exerciseId, reps, weight: mv.weight||'', unit};
    });
    activeMovements = b.movements;
    leftoverLines = p.leftover;
  }

  if(nameInfo.name) state.tmp.wodName = nameInfo.name;

  const chosenScaleTier = state.tmp.photoImport?.scaleTier;
  const substitutionNotes = [];
  if(Object.keys(scalingInfo.tiers).length && state.profile && chosenScaleTier && activeMovements){
    const tier = scalingInfo.tiers[chosenScaleTier];
    if(tier){
      if(state.profile.gender){
        const kg = state.profile.gender==='w' ? tier.female : tier.male;
        const cal = state.profile.gender==='w' ? tier.calFemale : tier.calMale;
        activeMovements.forEach(mv=>{
          const ex = state.exercises.find(e=>e.id===mv.exerciseId);
          if(!ex) return;
          const type = getExerciseType(ex);
          if(type==='weighted' && kg!=null && !isNaN(kg)) mv.weight = String(kg);
          if(type==='cardio' && mv.unit==='kcal' && cal!=null && !isNaN(cal)) mv.reps = String(cal);
        });
      }
      // Reine Wiederholungszahl-Abweichung und/oder komplette Ersatzuebung pro Bewegung
      // (z.B. "Int: 9 Pull-Ups" bzw. "Bas: 12 Ring Rows or Jumping Pull-Ups"), ueber
      // Namensabgleich mit den bereits erkannten Bewegungen des Workouts zugeordnet - unabhaengig
      // vom Geschlecht, da weder Wiederholungszahlen noch Ersatzuebungen geschlechtsspezifisch sind.
      (tier.moves||[]).forEach(tm=>{
        const tmWords = (tm.name||'').toLowerCase().split(/\s+/).filter(Boolean);
        if(!tmWords.length) return;
        const tmNormalized = normalizeExerciseName(tm.name);
        // Exakten/normalisierten Treffer IMMER vor dem lockeren Teilwort-Test bevorzugen -
        // sonst kann bei mehreren Bewegungen mit ueberlappenden Woertern (z.B. "Pull-Ups"
        // UND "Chest-to-Bar Pull-Ups" im selben Workout) die falsche Bewegung getroffen
        // werden, da .find() sonst den ERSTEN Teilwort-Treffer nimmt statt des korrekten.
        const exactMatch = activeMovements.find(mv=>{
          const ex = state.exercises.find(e=>e.id===mv.exerciseId);
          if(!ex) return false;
          return ex.name.toLowerCase()===tm.name.toLowerCase() || normalizeExerciseName(ex.name)===tmNormalized;
        });
        const match = exactMatch || activeMovements.find(mv=>{
          const ex = state.exercises.find(e=>e.id===mv.exerciseId);
          if(!ex) return false;
          const exWords = ex.name.toLowerCase().split(/\s+/);
          return exWords.every(w=>tmWords.includes(w)) || tmWords.every(w=>exWords.includes(w));
        });
        if(!match) return;
        if(tm.substitutes && tm.substitutes.length){
          const originalName = state.exercises.find(e=>e.id===match.exerciseId)?.name || tm.name;
          // Alle genannten Alternativen anlegen/aufloesen (auch die nicht gewaehlten), damit
          // sie im bereits vorhandenen Uebungs-Dropdown der Bewegungszeile sofort waehlbar
          // sind - keine eigene Auswahl-UI noetig, der Athlet tauscht dort bei Bedarf selbst.
          const substituteIds = tm.substitutes.map(name=>resolveSubstituteExerciseId(name, match.exerciseId)).filter(Boolean);
          if(substituteIds.length){
            match.exerciseId = substituteIds[0];
            match.weight = '';
            const substituteName = state.exercises.find(e=>e.id===substituteIds[0])?.name || tm.substitutes[0];
            substitutionNotes.push(`${substituteName} statt ${originalName}${substituteIds.length>1?' (Alternative in Übungsliste wählbar)':''}`);
          }
        }
        if(tm.reps) match.reps = tm.reps;
      });
    }
  }
  if(chosenScaleTier && state.profile && state.profile.scaleTier !== chosenScaleTier){
    state.profile.scaleTier = chosenScaleTier;
    saveKey('profile', state.profile);
  }

  applyTargetingRepsFromLeftover(leftoverLines, state.tmp.wodTemplate);

  if(leftoverLines.length) state.tmp.wodNote = leftoverLines.join('\n');

  const warn = missing1RMWarnings(state.tmp.wodTemplate);
  state.tmp.missing1RMWarning = warn.length ? warn : null;

  state.tmp.newlyCreatedExerciseIds = state.exercises.filter(e=>!existingExerciseIds.has(e.id)).map(e=>e.id);

  state.tmp.photoImport = null;
  showToast('Aus Foto übernommen — bitte kurz prüfen 👀' + (substitutionNotes.length ? ' · Ersatzübung: '+substitutionNotes.join(', ') : ''));
  render();
}
function parseQuickEntryText(text){
  const raw = (text||'').trim();
  if(!raw) return null;
  const commaParts = raw.split(',').map(s=>s.trim()).filter(Boolean);
  const nameCandidate = commaParts[0] || raw.split(/\s+/).slice(0,2).join(' ');
  let bestWod = null, bestDist = Infinity;
  CROSSFIT_WODS.forEach(w=>{
    const dist = levenshtein(nameCandidate.toLowerCase(), w.name.toLowerCase());
    const threshold = Math.max(1, Math.round(w.name.length*0.3));
    if(dist<=threshold && dist<bestDist){ bestWod = w; bestDist = dist; }
  });
  let remainder = raw;
  if(bestWod){
    remainder = remainder.replace(new RegExp(bestWod.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i'), '').replace(/^,\s*/, '').trim();
  }
  const weightMatch = remainder.match(/(\d+(?:[.,]\d+)?)\s*(?:kg|kilo)/i);
  const weightKg = weightMatch ? parseFloat(weightMatch[1].replace(',','.')) : null;
  if(weightMatch) remainder = remainder.replace(weightMatch[0], '').trim();
  const timeMatch = remainder.match(/\b(\d{1,2}:\d{2})\b/);
  const elapsedSec = timeMatch ? parseClockToSec(timeMatch[1]) : null;
  if(timeMatch) remainder = remainder.replace(timeMatch[0], '').trim();
  const roundsMatch = remainder.match(/(\d+)\s*(?:runden|rounds)/i);
  const rounds = roundsMatch ? parseInt(roundsMatch[1]) : null;
  if(roundsMatch) remainder = remainder.replace(roundsMatch[0], '').trim();
  remainder = remainder.replace(/^[,.\s]+|[,.\s]+$/g, '').trim();
  return { wod: bestWod, weightKg, elapsedSec, rounds, note: remainder };
}
function applyQuickEntry(){
  const text = document.getElementById('quickEntryText')?.value || '';
  const parsed = parseQuickEntryText(text);
  if(!parsed || !parsed.wod){ showToast('WOD nicht erkannt — bitte manuell eintragen'); return; }
  loadBenchmarkWod(parsed.wod.id);

async function saveWodDraft(){
  const format = state.tmp.wodFormat;
  const date = document.getElementById('wodDate')?.value || todayStr();
  const name = (document.getElementById('wodName')?.value || '').trim();
  let payload;
  if(format==='for-time'){
    ensureForTimeBuilder();
    const b = state.tmp.forTimeBuilder;
    payload = { movements: JSON.parse(JSON.stringify(b.movements)), rounds:b.rounds, repScheme:b.repScheme, timeCapMin:b.timeCapMin, timeCapSec:b.timeCapSec };
  } else if(format==='amrap'){
    ensureAmrapBuilder();
    const b = state.tmp.amrapBuilder;
    payload = amrapPayloadFromBuilder(b);
  } else if(format==='for-load'){
    ensureForLoadBuilder();
    const b = state.tmp.forLoadBuilder;
    payload = { exerciseId:b.exerciseId, targetReps:b.targetReps, timeCapMin:b.timeCapMin, timeCapSec:b.timeCapSec, unit:b.unit };
  } else if(format==='run'){
    return;
  } else {
    ensureWodTemplate();
    payload = { wodTemplate: JSON.parse(JSON.stringify(state.tmp.wodTemplate)), emomMin:state.tmp.emomMin, emomSec:state.tmp.emomSec, emomRounds:state.tmp.emomRounds, emomAlternateCycles:state.tmp.emomAlternateCycles };
  }

  // Nur aktualisieren, wenn diese Session zuvor explizit über "Fortsetzen" an einen
  // bestehenden Entwurf gebunden wurde (loadedDraftId). Ein frisch erstellter Entwurf
  // wird NICHT automatisch verknüpft — sonst würde ein zweites "Entwurf speichern" in
  // derselben Sitzung (z.B. ein zweites Workout für denselben Tag) den ersten Entwurf
  // überschreiben statt einen eigenen Eintrag anzulegen. Ein Entwurf verschwindet daher
  // ausschließlich durch explizites Löschen ("✕") oder durch Fertigstellen des Workouts.
  const linked = state.tmp.loadedDraftId ? state.drafts.find(d=>d.id===state.tmp.loadedDraftId) : null;
  if(linked){
    linked.format = format; linked.date = date; linked.name = name; linked.payload = payload;
  } else {
    state.drafts.push({ id: uid(), format, date, name, createdAt: Date.now(), payload });
  }
  await saveKey('drafts', state.drafts);
  showToast('Entwurf gespeichert 📝');
  render();
}
function loadDraftIntoBuilder(id){
  const draft = state.drafts.find(d=>d.id===id);
  if(!draft){ showToast('Entwurf nicht gefunden'); return; }

  state.tmp.wodFormat = draft.format;
  state.tmp.wodTemplate = null; state.tmp.wodMoves = null; state.tmp.wodPhase = 'template';
  state.tmp.forTimeBuilder = null; state.tmp.amrapBuilder = null; state.tmp.forLoadBuilder = null; state.tmp.gps = null;

  const p = draft.payload;
  if(draft.format==='for-time'){
    ensureForTimeBuilder();
    Object.assign(state.tmp.forTimeBuilder, { movements: JSON.parse(JSON.stringify(p.movements)), rounds:p.rounds, repScheme:p.repScheme, timeCapMin:p.timeCapMin, timeCapSec:p.timeCapSec, phase:'build' });
  } else if(draft.format==='amrap'){
    ensureAmrapBuilder();
    Object.assign(state.tmp.amrapBuilder, applyAmrapPayloadToBuilder(p));
  } else if(draft.format==='for-load'){
    ensureForLoadBuilder();
    Object.assign(state.tmp.forLoadBuilder, { exerciseId:p.exerciseId, targetReps:p.targetReps, timeCapMin:p.timeCapMin, timeCapSec:p.timeCapSec, unit:p.unit, phase:'build' });
  } else {
    state.tmp.wodTemplate = JSON.parse(JSON.stringify(p.wodTemplate));
    state.tmp.emomMin = p.emomMin; state.tmp.emomSec = p.emomSec; state.tmp.emomRounds = p.emomRounds; state.tmp.emomAlternateCycles = p.emomAlternateCycles;
  }

  state.tmp.wodDate = draft.date;
  state.tmp.wodName = draft.name;
  state.tmp.loadedDraftId = draft.id;
  state.tmp.workoutMenu = null;
  setTab('workout');
}
async function deleteDraft(id){
  state.drafts = state.drafts.filter(d=>d.id!==id);

  await saveKey('drafts', state.drafts);
  showToast('Entwurf gelöscht');

}

function addMinutesToTime(hhmm, minutes){
  const parts = (hhmm||'00:00').split(':').map(Number);
  const total = parts[0]*60 + parts[1] + (parseInt(minutes)||0);
  const hh = Math.floor(((total%1440)+1440)%1440/60), mm = ((total%60)+60)%60;
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}

    state.tmp.avatarEdit = { kind: kind||'avatar', imgSrc:url, naturalWidth:img.naturalWidth, naturalHeight:img.naturalHeight, panX:0, panY:0 };
    render();
  };
  img.onerror = ()=>{
    URL.revokeObjectURL(url);
    showToast('Bild konnte nicht geladen werden');
  };
  img.src = url;

function cleanupAvatarEdit(){
  if(state.tmp.avatarEdit?.imgSrc) URL.revokeObjectURL(state.tmp.avatarEdit.imgSrc);
  state.tmp.avatarEdit = null;
  render();
}
let _avatarDrag = null;
function startAvatarDrag(event){
  event.preventDefault();
  const st = state.tmp.avatarEdit;
  if(!st) return;
  _avatarDrag = { startClientX:event.clientX, startClientY:event.clientY, startPanX:st.panX, startPanY:st.panY };
  const el = event.currentTarget;
  el.setPointerCapture(event.pointerId);
  el.addEventListener('pointermove', onAvatarDragMove);
  el.addEventListener('pointerup', endAvatarDrag);
  el.addEventListener('pointercancel', endAvatarDrag);
}
function onAvatarDragMove(event){
  if(!_avatarDrag) return;
  const st = state.tmp.avatarEdit;
  if(!st) return;
  const coverScale = Math.max(AVATAR_EDIT_SIZE/st.naturalWidth, AVATAR_EDIT_SIZE/st.naturalHeight);
  const dispW = st.naturalWidth*coverScale, dispH = st.naturalHeight*coverScale;
  const maxPanX = Math.max(0,(dispW-AVATAR_EDIT_SIZE)/2), maxPanY = Math.max(0,(dispH-AVATAR_EDIT_SIZE)/2);
  let panX = _avatarDrag.startPanX + (event.clientX-_avatarDrag.startClientX);
  let panY = _avatarDrag.startPanY + (event.clientY-_avatarDrag.startClientY);
  panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
  panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
  st.panX = panX; st.panY = panY;
  const img = document.getElementById('avatarEditImg');
  if(img) img.style.transform = `translate(-50%,-50%) translate(${panX}px,${panY}px)`;
}
function endAvatarDrag(event){
  if(!_avatarDrag) return;
  const el = event.currentTarget;
  el.removeEventListener('pointermove', onAvatarDragMove);
  el.removeEventListener('pointerup', endAvatarDrag);
  el.removeEventListener('pointercancel', endAvatarDrag);
  try{ el.releasePointerCapture(event.pointerId); }catch(e){}
  _avatarDrag = null;
}
function confirmAvatarCrop(){
  const st = state.tmp.avatarEdit;
  if(!st) return;
  const coverScale = Math.max(AVATAR_EDIT_SIZE/st.naturalWidth, AVATAR_EDIT_SIZE/st.naturalHeight);
  const dispW = st.naturalWidth*coverScale, dispH = st.naturalHeight*coverScale;
  const imgLeft = (AVATAR_EDIT_SIZE-dispW)/2 + st.panX;
  const imgTop = (AVATAR_EDIT_SIZE-dispH)/2 + st.panY;
  const srcX = -imgLeft/coverScale, srcY = -imgTop/coverScale;
  const srcSize = AVATAR_EDIT_SIZE/coverScale;
  const img = document.getElementById('avatarEditImg');
  if(!img){ showToast('Bild nicht gefunden'); return; }
  const OUTPUT = 400;
  const canvas = document.createElement('canvas');
  canvas.width = OUTPUT; canvas.height = OUTPUT;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, srcX, srcY, srcSize, srcSize, 0, 0, OUTPUT, OUTPUT);
  canvas.toBlob(blob=>{
    if(!blob){ showToast('Zuschneiden fehlgeschlagen'); return; }
    const kind = st.kind||'avatar';
    const file = new File([blob], kind+'.png', {type:'image/png'});
    cleanupAvatarEdit();
    if(kind==='boxLogo') uploadBoxLogo(file); else uploadAvatar(file);
  }, 'image/png', 0.92);
}
function renderAvatarEditor(){
  const st = state.tmp.avatarEdit;
  if(!st) return '';
  const coverScale = Math.max(AVATAR_EDIT_SIZE/st.naturalWidth, AVATAR_EDIT_SIZE/st.naturalHeight);
  const dispW = st.naturalWidth*coverScale, dispH = st.naturalHeight*coverScale;
  return `
    <div style="text-align:center;margin:10px 0;">
      <div id="avatarEditBox" style="position:relative;width:${AVATAR_EDIT_SIZE}px;height:${AVATAR_EDIT_SIZE}px;margin:0 auto;overflow:hidden;border-radius:50%;touch-action:none;background:var(--iron-700);cursor:grab;" onpointerdown="startAvatarDrag(event)">
        <img id="avatarEditImg" src="${st.imgSrc}" draggable="false" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translate(${st.panX}px,${st.panY}px);width:${dispW}px;height:${dispH}px;max-width:none;pointer-events:none;">
      </div>
      <div class="note" style="margin-top:8px;">Bild ziehen, um den Ausschnitt zu wählen</div>
      <div class="row" style="margin-top:10px;max-width:${AVATAR_EDIT_SIZE}px;margin-left:auto;margin-right:auto;">
        <button class="btn btn-ghost" onclick="cleanupAvatarEdit()">Abbrechen</button>
        <button class="btn btn-primary" onclick="confirmAvatarCrop()">Übernehmen</button>

    </div>
  `;
}

const SOCIAL_REACTION_EMOJIS = ['👍','❤️','💪','🔥','😂','👏','🎉','😮'];
function pbFilterIn(field, ids){
  return ids.map((id,i)=>pb.filter(`${field} = {:v${i}}`, {['v'+i]: id})).join(' || ');
}
function fmtSocialTime(created){
  if(!created) return '';
  const dt = new Date(created);
  return dt.toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' · ' + dt.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
}
async function loadSocialFeed(boxId, opts){
  if(!boxId) return;
  const more = opts?.more;
  const page = more ? (state.box.socialPage+1) : 1;
  try{
    const res = await pb.collection('social_posts').getList(page, 20, {
      filter: pb.filter('box = {:box}', {box:boxId}),
      sort: '-created',
      expand: 'author'
    });
    state.box.socialPosts = more ? state.box.socialPosts.concat(res.items) : res.items;
    state.box.socialPage = page;
    state.box.socialHasMore = page < res.totalPages;
    await loadSocialExtrasForVisiblePosts(res.items);
  }catch(e){
    console.error('Social-Feed konnte nicht geladen werden', e);
  }
  state.box.socialLoaded = true;
  render();
}
async function loadSocialExtrasForVisiblePosts(posts){
  const ids = posts.map(p=>p.id);
  if(!ids.length) return;
  const userId = pb.authStore.record?.id;
  ids.forEach(id=>{
    state.box.socialReactionsByPost[id] = {counts:{}, mine:null};
    state.box.socialPollTallyByPost[id] = {counts:{}, totalVoters:0};
  });
  try{
    const [reactions, votes] = await Promise.all([
      pb.collection('social_reactions').getFullList({filter: pbFilterIn('post', ids)}),
      pb.collection('social_poll_votes').getFullList({filter: pbFilterIn('post', ids)})
    ]);
    reactions.forEach(r=>{
      const bucket = state.box.socialReactionsByPost[r.post];
      if(!bucket) return;
      bucket.counts[r.emoji] = (bucket.counts[r.emoji]||0) + 1;
      if(r.user===userId) bucket.mine = r;
    });
    votes.forEach(v=>{
      const tally = state.box.socialPollTallyByPost[v.post];
      if(!tally) return;
      tally.totalVoters += 1;
      (v.optionIds||[]).forEach(oid=>{ tally.counts[oid] = (tally.counts[oid]||0) + 1; });
      if(v.user===userId) state.box.socialMyVoteByPost[v.post] = v;
    });
  }catch(e){
    console.error('Social-Zusatzdaten konnten nicht geladen werden', e);
  }
}

function attendanceStats(bookings){
  const todayD = todayStr(), startOfWeek = weekDates()[0], monthPrefix = todayD.slice(0,7), yearPrefix = todayD.slice(0,4);
  const dates = bookings.filter(b=>b.status==='attended').map(b=>b.expand?.classInstance?.date).filter(Boolean);
  return {
    week: dates.filter(d=>d>=startOfWeek && d<=todayD).length,
    month: dates.filter(d=>d.startsWith(monthPrefix)).length,
    year: dates.filter(d=>d.startsWith(yearPrefix)).length,
    allTime: dates.length
  };
}
/* ---- Athleten-Kontingent (membership_plans) ---- */
function isConsumingBooking(b){
  return b.status==='attended' || (b.status==='cancelled' && b.lateCancel===true);
}
function planLabel(plan){
  if(plan.name) return plan.name;
  return plan.type==='recurring' ? 'Laufende Buchung' : 'Einmalige Buchung';
}
function computePlanQuota(plan, bookings){
  const todayD = todayStr();
  const grant = parseInt(plan.amount)||0;
  const notStartedYet = plan.startDate && plan.startDate.slice(0,10) > todayD;
  let usable, used;
  if(plan.type==='recurring'){
    const monthPrefix = todayD.slice(0,7);
    usable = !notStartedYet && (plan.status==='active' || (plan.status==='cancelled' && plan.cancelledAt && plan.cancelledAt.slice(0,7)===monthPrefix));
    used = bookings.filter(b=>b.membershipPlan===plan.id && isConsumingBooking(b) && b.expand?.classInstance?.date?.startsWith(monthPrefix)).length;
  } else {
    usable = !notStartedYet && plan.status==='active';
    used = bookings.filter(b=>b.membershipPlan===plan.id && isConsumingBooking(b)).length;
  }
  const remaining = usable ? Math.max(0, grant-used) : 0;
  return {usable, grant, used, remaining};
}
function isPlanArchived(plan, bookings){
  if(plan.status==='cancelled') return true;
  if(plan.type!=='one-time') return false;
  const notStartedYet = plan.startDate && plan.startDate.slice(0,10) > todayStr();
  if(notStartedYet) return false;
  return computePlanQuota(plan, bookings).remaining===0;
}
function splitPlansByArchived(plans, bookings){
  return { active: plans.filter(p=>!isPlanArchived(p,bookings)), archived: plans.filter(p=>isPlanArchived(p,bookings)) };
}
function renderPlanRow(p, bookings, opts){
  opts = opts || {};
  const q = computePlanQuota(p, bookings);
  const statusChip = p.status==='cancelled' ? '<span class="chip chip-full">Gekündigt</span>' : '<span class="chip chip-reserved">Aktiv</span>';
  return `
    <div class="history-item">

        <span class="val">${escapeHtml(planLabel(p))} ${statusChip}</span>
        <span class="note" style="margin:0;">${q.remaining} / ${q.grant} übrig${p.note?' · '+escapeHtml(p.note):''}</span>
      </span>
      ${(opts.showCancelButton && p.status==='active') ? `<button class="btn-sm btn-ghost" style="width:auto;" onclick="cancelMembershipPlan('${p.id}','${opts.membershipId}')">Kündigen</button>` : ''}
    </div>`;
}
function getNextUpcomingBooking(bookings){
  const todayD = todayStr();
  const upcoming = bookings.filter(b=>(b.status==='reserved'||b.status==='attended') && b.expand?.classInstance?.date>=todayD);
  upcoming.sort((a,b)=>(a.expand.classInstance.date+a.expand.classInstance.startTime).localeCompare(b.expand.classInstance.date+b.expand.classInstance.startTime));
  return upcoming.length ? {booking:upcoming[0], instance:upcoming[0].expand.classInstance} : null;
}
async function ensureClassInstancesForDate(boxId, dateStr){
  const key = boxId+'|'+dateStr;
  state.tmp.scheduleEnsuredDates = state.tmp.scheduleEnsuredDates || new Set();
  if(state.tmp.scheduleEnsuredDates.has(key)) return;
  try{
    const weekday = new Date(dateStr+'T00:00:00').getDay();
    const slotsForWeekday = state.box.scheduleSlots.filter(s=>s.oneTimeDate ? s.oneTimeDate===dateStr : s.weekday===weekday);
    const existing = await pb.collection('class_instances').getFullList({filter: pb.filter('box = {:box} && date = {:date}', {box:boxId, date:dateStr}), requestKey:null});
    const existingBySlot = new Map(existing.map(ci=>[ci.scheduleSlot, ci]));

    const toCreate = slotsForWeekday.filter(s=>!existingBySlot.has(s.id));
    if(toCreate.length){
      await Promise.all(toCreate.map(s=>pb.collection('class_instances').create({
        box:boxId, scheduleSlot:s.id, date:dateStr, startTime:s.startTime, label:s.label, coachName:s.coachName||'', capacity:s.capacity
      }, {requestKey:null})));
    }

    const activeSlotIds = new Set(slotsForWeekday.map(s=>s.id));
    const orphans = existing.filter(ci=>!activeSlotIds.has(ci.scheduleSlot));
    if(orphans.length){
      const bookingCounts = await Promise.all(orphans.map(ci=>
        pb.collection('bookings').getFullList({filter: pb.filter('classInstance = {:id} && status != "cancelled"', {id:ci.id}), requestKey:null})
      ));
      await Promise.all(orphans.map((ci,idx)=> bookingCounts[idx].length===0
        ? pb.collection('class_instances').delete(ci.id).catch(e=>console.error('Orphan-Termin konnte nicht gelöscht werden', e))
        : Promise.resolve()
      ));
    }
    state.tmp.scheduleEnsuredDates.add(key);
  }catch(e){
    console.error('Termine konnten nicht erzeugt werden', e);
  }
}
async function loadClassInstancesForDate(boxId, dateStr){
  try{
    const instances = await pb.collection('class_instances').getFullList({filter: pb.filter('box = {:box} && date = {:date}', {box:boxId, date:dateStr}), sort:'startTime'});
    let bookings = instances.length
      ? await pb.collection('bookings').getFullList({filter: instances.map(i=>pb.filter('classInstance = {:id}',{id:i.id})).join(' || '), requestKey: null})
      : [];
    const myId = pb.authStore.record.id;
    const promotions = [];
    for(const inst of instances){
      const instBookings = bookings.filter(b=>b.classInstance===inst.id);
      const mine = instBookings.find(b=>b.user===myId);
      if(!mine || mine.status!=='waitlist') continue;
      const activeCount = instBookings.filter(b=>b.status==='reserved'||b.status==='attended').length;
      if(activeCount >= inst.capacity) continue;
      const waitlist = instBookings.filter(b=>b.status==='waitlist').sort((a,b)=>(a.created||'').localeCompare(b.created||''));
      if(waitlist[0]?.id === mine.id) promotions.push(mine.id);
    }
    if(promotions.length){
      await Promise.all(promotions.map(id=>pb.collection('bookings').update(id, {status:'reserved'}).catch(e=>console.error('Selbst-Nachrücken fehlgeschlagen', e))));
      bookings = instances.length
        ? await pb.collection('bookings').getFullList({filter: instances.map(i=>pb.filter('classInstance = {:id}',{id:i.id})).join(' || '), requestKey: null})
        : [];
    }
    if(state.box.tabWorkoutsDate===dateStr){
      for(const inst of instances){
        const mine = bookings.find(b=>b.classInstance===inst.id && b.user===myId && (b.status==='reserved'||b.status==='attended'));
        if(mine) await ensureDraftsForBooking(inst);
      }
    }
    state.box.scheduleDate = dateStr;
    state.box.classInstances = instances;
    state.box.classBookings = bookings;
  }catch(e){
    state.box.scheduleDate = dateStr;
    state.box.classInstances = [];
    state.box.classBookings = [];
  }
  render();
}

function classInstanceStatus(instance){
  const myId = pb.authStore.record.id;
  const mine = state.box.classBookings.find(b=>b.classInstance===instance.id && b.user===myId && b.status!=='cancelled') || null;
  const activeCount = state.box.classBookings.filter(b=>b.classInstance===instance.id && (b.status==='reserved'||b.status==='attended')).length;
  const spotsLeft = instance.capacity - activeCount;
  let pill;
  if(mine && (mine.status==='reserved'||mine.status==='attended')) pill='RESERVIERT';
  else if(mine && mine.status==='waitlist') pill='WARTELISTE';
  else pill = spotsLeft>0 ? 'VERFÜGBAR' : 'AUSGEBUCHT';
  return {pill, mine, spotsLeft, activeCount};
}
function cancellationDeadline(instance){
  const slot = state.box.scheduleSlots.find(s=>s.id===instance.scheduleSlot);
  const cutoffHours = (slot && slot.cancellationCutoffHours != null && slot.cancellationCutoffHours !== '') ? Number(slot.cancellationCutoffHours) : 3;
  const start = new Date(instance.date+'T'+(instance.startTime||'00:00')+':00');
  return new Date(start.getTime() - cutoffHours*3600*1000);
}
function canCancelBooking(instance){
  return new Date() < cancellationDeadline(instance);
}
function instanceStart(instance){
  return new Date(instance.date+'T'+(instance.startTime||'00:00')+':00');
}
function instanceHasStarted(instance){
  return new Date() >= instanceStart(instance);
}
function fmtTime(d){
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function resolveBookingPlan(instanceId){
  const plans = state.box.membershipPlans;
  if(!plans.length) return {mode:'none'};
  const usable = plans
    .map(p=>({id:p.id, label:planLabel(p), q:computePlanQuota(p, state.box.myBookings)}))
    .filter(x=>x.q.remaining>0);
  if(!usable.length) return {mode:'blocked'};
  if(usable.length===1) return {mode:'single', planId:usable[0].id};
  return {mode:'picker', candidates: usable.map(u=>({id:u.id, label: u.label+' · '+u.q.remaining+' übrig'}))};
}

async function performBooking(instanceId, membershipPlanId){
  const instance = state.box.classInstances.find(i=>i.id===instanceId);
  if(!instance) return;
  const st = classInstanceStatus(instance);
  const myId = pb.authStore.record.id;
  const myRow = state.box.classBookings.find(b=>b.classInstance===instanceId && b.user===myId) || null;
  try{
    if(myRow){
      await pb.collection('bookings').update(myRow.id, {status: st.spotsLeft>0?'reserved':'waitlist', membershipPlan: membershipPlanId||null});
      showToast(st.spotsLeft>0?'Gebucht':'Auf Warteliste gesetzt');
    } else {
      const myName = pb.authStore.record.name || pb.authStore.record.email || '';
      await pb.collection('bookings').create({classInstance:instanceId, user:myId, box:state.box.membership.box, status: st.spotsLeft>0?'reserved':'waitlist', userName: myName, membershipPlan: membershipPlanId||null});
      showToast(st.spotsLeft>0?'Gebucht':'Auf Warteliste gesetzt');
    }
    await loadClassInstancesForDate(state.box.membership.box, state.box.scheduleDate);
    await loadMyBookings(state.box.membership.box);
  }catch(e){
    showToast('Aktion fehlgeschlagen');
  }
}
async function toggleBooking(instanceId){
  const instance = state.box.classInstances.find(i=>i.id===instanceId);
  if(!instance) return;
  const st = classInstanceStatus(instance);
  const isBookingAction = !(st.mine && (st.mine.status==='reserved'||st.mine.status==='attended'||st.mine.status==='waitlist'));
  if(isBookingAction && !isBoxOwner() && instanceHasStarted(instance)){
    showToast('Buchung nach Trainingsbeginn nicht mehr möglich');
    return;
  }
  if(st.mine && (st.mine.status==='reserved' || st.mine.status==='attended')){
    if(!canCancelBooking(instance)){
      showToast('Stornierung nicht mehr möglich (Frist war: '+fmtTime(cancellationDeadline(instance))+' Uhr)');
      return;
    }
    try{
      await pb.collection('bookings').update(st.mine.id, {status:'cancelled'});
      showToast('Buchung storniert');
      await loadClassInstancesForDate(state.box.membership.box, state.box.scheduleDate);
      await loadMyBookings(state.box.membership.box);
    }catch(e){ showToast('Aktion fehlgeschlagen'); }
    return;
  }
  if(st.mine && st.mine.status==='waitlist'){
    try{
      await pb.collection('bookings').update(st.mine.id, {status:'cancelled'});
      showToast('Von Warteliste entfernt');
      await loadClassInstancesForDate(state.box.membership.box, state.box.scheduleDate);
      await loadMyBookings(state.box.membership.box);
    }catch(e){ showToast('Aktion fehlgeschlagen'); }
    return;
  }
  const resolved = resolveBookingPlan(instanceId);
  if(resolved.mode==='blocked'){ showToast('Kontingent aufgebraucht'); return; }
  if(resolved.mode==='picker'){ openPlanPicker(resolved.candidates, 'confirmSelfBookingPlan', {instanceId}); return; }
  await performBooking(instanceId, resolved.mode==='single' ? resolved.planId : null);
}

function archiveWorkoutTemplates(){
  // Ein Archiv-Eintrag pro Name: das Trainingsarchiv ist eine Vorlagen-Bibliothek zum
  // Wiederverwenden, keine Historie "wann haben wir X gemacht" - bei mehrfach veroeffentlichten
  // WODs desselben Namens zaehlt nur die zuletzt erstellte Fassung.
  const byName = new Map();
  for(const w of state.box.allWorkouts){
    const key = w.name || w.id;
    const existing = byName.get(key);
    if(!existing || (w.date||'') > (existing.date||'')) byName.set(key, w);
  }
  return [...byName.values()].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
function renderArchivedWorkoutCard(w){
  const bodyHtml = w.mode==='freeform'

       <div class="note" style="margin-top:4px;white-space:pre-wrap;">${escapeHtml(formatBoxWorkoutPreview(w))}</div>`;
  const manageHtml = isBoxAdminView() ? `
    <div class="row" style="gap:8px;margin-top:8px;">
      <button class="btn-sm btn-ghost" style="width:auto;" onclick="editBoxWorkout('${w.id}')">✎ Bearbeiten</button>
      <button class="btn-sm btn-ghost" style="width:auto;" onclick="deleteBoxWorkout('${w.id}')">✕ Löschen</button>

  ` : '';
  const assignOpen = state.tmp.archiveAssignId===w.id;
  return `
    <div class="wod-card">
      <div class="wname">${escapeHtml(w.name)||'Workout'} <span class="wdate">zuletzt ${fmtDate(w.date)}</span></div>
      ${bodyHtml}

      <div class="row" style="margin-top:10px;">

async function savePlanTemplate(id){
  const name = (document.getElementById('mpTplName')?.value||'').trim();
  const type = document.getElementById('mpTplType')?.value || 'recurring';
  const amount = parseInt(document.getElementById('mpTplAmount')?.value)||0;
  // Preis bei "one-time" loest den Athleten-Selbstkauf aus (siehe renderMyPlansScreen-Filter
  // auf type==='one-time'). Bei "recurring" ist der Preis rein informativ fuer die
  // Umsatz-Uebersicht - laufende Pakete bleiben bewusst nicht selbst kaeuflich (monatliche
  // Zahlung/Kuendigung soll dem Coach vorbehalten bleiben).
  const priceRaw = (document.getElementById('mpTplPrice')?.value||'').trim();
  const priceCents = priceRaw ? Math.round(parseFloat(priceRaw.replace(',','.'))*100) : null;
  if(!name){ showToast('Bitte einen Namen eingeben'); return; }
  if(!amount){ showToast('Bitte eine Menge eingeben'); return; }
  try{
    if(id){
      await pb.collection('membership_plan_templates').update(id, {name, type, amount, priceCents});
    } else {
      await pb.collection('membership_plan_templates').create({box: state.box.membership.box, name, type, amount, priceCents});
    }
    showToast('Standardpaket gespeichert');
    state.tmp.mpTemplateEditId = null;
    state.tmp.mpTplTypeDraft = null;
    await loadPlanTemplates();
  }catch(e){
    showToast('Speichern fehlgeschlagen');
  }
}

async function loadBoxMemberDetail(membershipId){
  const m = (state.tmp.mpMembersList||[]).find(x=>x.id===membershipId);
  if(!m) return;
  try{
    const tasks = [
      pb.collection('membership_plans').getFullList({filter: pb.filter('membership = {:m}', {m:membershipId}), sort:'-created'}),
      pb.collection('bookings').getFullList({filter: pb.filter('box = {:box} && user = {:u}', {box:state.box.membership.box, u:m.user}), expand:'classInstance', requestKey:null}),
      pb.collection('credit_cards').getFullList({filter: pb.filter('box = {:box} && owner = {:u}', {box:state.box.membership.box, u:m.user}), sort:'-created', requestKey:null}).catch(()=>[])
    ];
    if(pb.authStore.record?.isAppAdmin) tasks.push(pb.collection('users').getOne(m.user));
    const [plans, bookings, creditCards, user] = await Promise.all(tasks);
    state.tmp.mpMemberDetailPlans = plans;
    state.tmp.mpMemberDetailBookings = bookings;
    state.tmp.mpMemberDetailCreditCards = creditCards;
    state.tmp.mpMemberDetailCreditTransactions = creditCards.length
      ? await pb.collection('credit_transactions').getFullList({
          filter: creditCards.map(c=>pb.filter('card = {:c}', {c:c.id})).join(' || '),
          sort:'created', requestKey:null
        }).catch(()=>[])
      : [];
    if(user) state.tmp.mpMemberDetailUser = user;
  }catch(e){
    state.tmp.mpMemberDetailPlans = [];
    state.tmp.mpMemberDetailBookings = [];
    state.tmp.mpMemberDetailCreditCards = [];
    state.tmp.mpMemberDetailCreditTransactions = [];
    showToast('Kontingente konnten nicht geladen werden');
  }
  render();
}

function fmtEuro(cents){
  return ((cents||0)/100).toLocaleString('de-AT', {style:'currency', currency:'EUR'});
}
// Client-Entsprechung des serverseitigen computeCardBalance() in
// server-deploy/pb_hooks/credit_helpers.js - NUR fuer die Anzeige. Die verbindliche
// Abbuchungs-Entscheidung passiert immer serverseitig im Einloese-Hook.
function computeCardBalance(cardId, transactions){
  let granted=0, redeemed=0, correction=0;
  (transactions||[]).filter(t=>t.card===cardId).forEach(t=>{
    const delta = parseFloat(t.deltaUnits)||0;
    if(t.type==='purchase_grant'||t.type==='bonus_grant') granted += delta;
    else if(t.type==='redemption') redeemed += Math.abs(delta);
    else if(t.type==='correction') correction += delta;
  });
  return {granted, redeemed, correction, remaining: Math.max(0, granted-redeemed+correction)};
}
