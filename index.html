<body>
<div class="app" id="app">
  <div class="loading" id="loadingScreen">Lade deine Daten …</div>
</div>

<script>
/* ---------- Storage helpers ---------- */
async function loadKey(key, fallback){
  try{
    const raw = localStorage.getItem('ironlog:'+key);
    return raw!=null ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback;
  }
}
async function saveKey(key, value){
  try{
    localStorage.setItem('ironlog:'+key, JSON.stringify(value));
  }catch(e){
    console.error('Speichern fehlgeschlagen', key, e);
  }
  syncKeyToCloud(key, value);
}
async function deleteKey(key){
  try{ localStorage.removeItem('ironlog:'+key); }catch(e){}
}

/* ---------- Cloud-Sync (PocketBase) ---------- */
const pb = new PocketBase('https://api.formelfuchs.at');
const SYNC_KEYS = ['profile','exercises','workouts','nutritionLogs','measurements','prEntries','timeRecords','trainingPlan'];
function getPendingSync(){
  try{ return JSON.parse(localStorage.getItem('ironlog:_pendingSync')||'[]'); }catch(e){ return []; }
}
function setPendingSync(list){
  try{ localStorage.setItem('ironlog:_pendingSync', JSON.stringify([...new Set(list)])); }catch(e){}
}
function markPendingSync(key){
  const list = getPendingSync();
  if(!list.includes(key)){ list.push(key); setPendingSync(list); }
}
function clearPendingSync(key){
  setPendingSync(getPendingSync().filter(k=>k!==key));
}
async function pushKeyToCloud(key, value){
  if(!pb.authStore.isValid) return false;
  try{
    const userId = pb.authStore.record.id;
    let existing;
    try{
      existing = await pb.collection('user_data').getFirstListItem(pb.filter('user = {:user} && key = {:key}', {user:userId, key}));
    }catch(e){ existing = null; }
    if(existing){
      await pb.collection('user_data').update(existing.id, { value });
    } else {
      await pb.collection('user_data').create({ user: userId, key, value });
    }
    return true;
  }catch(e){
    return false;
  }
}
function syncKeyToCloud(key, value){
  if(!pb.authStore.isValid || !SYNC_KEYS.includes(key)) return;
  pushKeyToCloud(key, value).then(ok=>{ ok ? clearPendingSync(key) : markPendingSync(key); });
}
async function flushPendingSync(){
  if(!pb.authStore.isValid) return;
  for(const key of getPendingSync()){
    const value = await loadKey(key, null);
    if(value===null) continue;
    if(await pushKeyToCloud(key, value)) clearPendingSync(key);
  }
}
async function pullAllFromCloud(){
  if(!pb.authStore.isValid) return {hadCloudData:false};
  const userId = pb.authStore.record.id;
  const records = await pb.collection('user_data').getFullList({filter: pb.filter('user = {:user}', {user:userId})});
  records.forEach(r=>{ localStorage.setItem('ironlog:'+r.key, JSON.stringify(r.value)); });
  return {hadCloudData: records.length>0};
}
async function pushAllLocalToCloud(){
  for(const key of SYNC_KEYS){
    const value = await loadKey(key, null);
    if(value!==null) await pushKeyToCloud(key, value);
  }
}
function hasAnyLocalData(){
  return SYNC_KEYS.some(key=>localStorage.getItem('ironlog:'+key)!=null);
}
pb.authStore.onChange(()=>{ if(!pb.authStore.isValid) boot(); });
window.addEventListener('online', flushPendingSync);

/* ---------- App State ---------- */
const DEFAULT_EXERCISES_RAW = [
  {name:'Back Squat', type:'weighted'}, {name:'Front Squat', type:'weighted'}, {name:'Deadlift', type:'weighted'},
  {name:'Bench Press', type:'weighted'}, {name:'Overhead Press', type:'weighted'}, {name:'Push Press', type:'weighted'},
  {name:'Strict Press', type:'weighted'}, {name:'Clean', type:'weighted'}, {name:'Power Clean', type:'weighted'},
  {name:'Snatch', type:'weighted'}, {name:'Power Snatch', type:'weighted'}, {name:'Clean & Jerk', type:'weighted'},
  {name:'Thruster', type:'weighted'}, {name:'Pull-up', type:'bodyweight'}, {name:'Bent-over Row', type:'weighted'},
  {name:'Row', type:'cardio'}, {name:'Air Bike', type:'cardio'}, {name:'Bike', type:'cardio'}, {name:'Ski Erg', type:'cardio'}, {name:'Run', type:'cardio'}
];
const DEFAULT_EXERCISES = DEFAULT_EXERCISES_RAW.map(e => ({id: slug(e.name), name: e.name, custom:false, type: e.type}));
function cloneDefaultExercises(){ return DEFAULT_EXERCISES.map(e=>({...e})); }
function getExerciseType(ex){ return (ex && ex.type) || 'weighted'; }
function sortedExercises(){ return state.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name,'de')); }

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+ '-' + Math.random().toString(36).slice(2,6);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'2-digit'});
}

function defaultTmp(){
  return {
    wodFormat:'strength',
    wodPhase:'template', wodTemplate:null, wodMoves:null, wodDate:null, wodName:null, wodNameMatch:null, wodFeeling:null, wodNote:null, editingPrId:null, editingTimeId:null,
    live:null,
    forTimeBuilder:null, amrapBuilder:null, forLoadBuilder:null, runBuilder:null,
    emomMin:1, emomSec:30, emomRounds:10,
    gps:null,
    timer:{
      mode:'stopwatch',
      swRunning:false, swElapsed:0, swStartedAt:null, swLaps:[],
      cdRunning:false, cdMin:1, cdSec:0, cdRemaining:0, cdTotal:0, cdStartedAt:null,
      ivRunning:false, ivWorkSec:20, ivRestSec:10, ivRounds:8, ivRound:1, ivPhase:'work', ivRemaining:0, ivStartedAt:null
    },
    planForm:null,
    exerciseModal:null,
    photoImport:null,
    onboarding:null,
    auth:{screen:'login', email:'', password:'', passwordConfirm:'', error:'', info:'', loading:false, resetToken:null},
    historyNameFilter:null,
    prExerciseSelection:null,
    confirmReset:false,
    historyCollapsed:false,
    dayDetailDate:null,
    workoutMenu:'formats'
  };
}

let state = {
  profile:null,
  exercises:[],
  workouts:[],
  nutritionLogs:[],
  measurements:[],
  prEntries:[],
  timeRecords:[],
  trainingPlan:null,
  activeTab:'today',
  tmp: defaultTmp() // transient UI state
};

let charts = {}; // chart.js instances keyed by canvas id
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function chartTickColor(){ return cssVar('--iron-500'); }
function chartGridColor(){ return cssVar('--iron-700'); }

/* ---------- Math ---------- */
function estimate1RM(weight, reps){
  reps = Math.max(1, reps);
  if(reps === 1) return weight;
  return weight * (1 + reps/30);
}
function weightForReps(e1rm, reps){
  reps = Math.max(1, reps);
  if(reps === 1) return e1rm;
  return e1rm / (1 + reps/30);
}
function roundToIncrement(v, inc=2.5){
  return Math.round(v/inc)*inc;
}

/* ---------- Einheiten (Gewicht kg/lbs, Distanz m/mi) — intern immer kg/Meter ---------- */
const KG_PER_LBS = 0.453592;
const M_PER_MILE = 1609.34;
function weightUnitLabel(){ return (state.profile && state.profile.weightUnit==='lbs') ? 'lbs' : 'kg'; }
function distanceUnitLabel(){ return (state.profile && state.profile.distanceUnit==='mi') ? 'mi' : 'm'; }
function toDisplayWeight(kg){
  if(kg===null || kg===undefined || kg===''){ return ''; }
  const v = weightUnitLabel()==='lbs' ? kg/KG_PER_LBS : kg;
  return Math.round(v*100)/100;
}
function fromDisplayWeight(val){
  const v = parseFloat(val)||0;
  return weightUnitLabel()==='lbs' ? v*KG_PER_LBS : v;
}
function toDisplayDistance(m){
  if(m===null || m===undefined || m===''){ return ''; }
  const v = distanceUnitLabel()==='mi' ? m/M_PER_MILE : m;
  return Math.round(v*100)/100;
}
function fromDisplayDistance(val){
  const v = parseFloat(val)||0;
  return distanceUnitLabel()==='mi' ? v*M_PER_MILE : v;
}
function fmtWeight(kg){
  const v = toDisplayWeight(kg);
  return v===''? '' : `${v.toLocaleString('de-AT')}${weightUnitLabel()}`;
}
const FEELING_LABELS = {
  schlechter:'Schlechter', gleich:'Gleich', besser:'Besser', viel_besser:'Viel besser'
};
const FEELING_ADJUST = {
  schlechter:0.95, gleich:1.01, besser:1.03, viel_besser:1.06
};

/* ---------- Grundübungen + Skalierungen (Bodyweight/Gymnastics) ---------- */
const EXERCISE_LIBRARY = [
  { id:"pull-up", name:"Pull-up", type:"bodyweight", variants:[
    {id:'assisted', label:'Assisted', details:[{key:'band', label:'Band-Farbe', placeholder:'z.B. Grün'}]},
    {id:'banded', label:'Banded', details:[{key:'band', label:'Band-Farbe', placeholder:'z.B. Grün'}]},
    {id:'jumping', label:'Jumping', details:null},
    {id:'kipping', label:'Kipping', details:null},
    {id:'butterfly', label:'Butterfly', details:null},
    {id:'strict', label:'Strict', details:null},

  const standard = b.variants[0];
  const rest = b.variants.slice(1).sort((v1,v2)=>v1.label.localeCompare(v2.label,'de'));
  b.variants = [standard, ...rest];

function composeVariantName(base, variant, detailVals){
  if(!variant || variant.id==='standard') return base.name;
  let name = `${variant.label} ${base.name}`;
  const vals = (detailVals && typeof detailVals === 'object') ? detailVals : {};
  if(variant.details && variant.details.length){
    const parts = [];
    variant.details.forEach(d=>{
      const raw = vals[d.key];
      if(raw===undefined || raw===null || raw==='') return;
      const val = d.numeric ? `${d.signed===false?'':'+'}${raw}${d.unit||'kg'}` : raw;
      parts.push(val);
    });
    if(parts.length) name += ` (${parts.join(', ')})`;
  }
  return name;
}
function matchLibraryVariant(ex){
  if(!ex) return null;
  const n = ex.name.toLowerCase();
  for(const base of EXERCISE_LIBRARY){
    for(const variant of base.variants){
      const composed = composeVariantName(base, variant, '').toLowerCase();
      if(n === composed || (variant.details && variant.details.length && n.startsWith(composed))) return {base, variant};
    }
  }
  return null;
}

const PLAN_DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const PLAN_LEVEL_RANK = {beginner:0, intermediate:1, advanced:2};
const PLAN_STATUS_TO_LEVEL = {anfaenger:'beginner', fortgeschritten:'intermediate', profi:'advanced'};

function generateTrainingPlan(status, location, frequency){
  frequency = Math.min(7, Math.max(1, parseInt(frequency)||3));
  const patterns = {
    1:['wed'], 2:['mon','thu'], 3:['mon','wed','fri'], 4:['mon','tue','thu','fri'],
    5:['mon','tue','wed','thu','fri'], 6:['mon','tue','wed','thu','fri','sat'],
    7:['mon','tue','wed','thu','fri','sat','sun']
  };
  const selectedDays = patterns[frequency];
  const allowedEquipment = LOCATION_EQUIPMENT[location] || [];
  const targetLevel = PLAN_STATUS_TO_LEVEL[status] || 'beginner';
  const fitsEquipment = (eq)=> (eq||[]).every(tag=>allowedEquipment.includes(tag));
  const fitsLevel = (lvl)=> PLAN_LEVEL_RANK[lvl] <= PLAN_LEVEL_RANK[targetLevel];

  let wodPool = CROSSFIT_WODS.filter(w=>fitsEquipment(w.equipment) && fitsLevel(w.level));
  if(!wodPool.length) wodPool = CROSSFIT_WODS.filter(w=>fitsEquipment(w.equipment));
  let progPool = STRENGTH_PROGRESSIONS.filter(p=>fitsEquipment(p.equipment) && fitsLevel(p.level));
  if(!progPool.length) progPool = STRENGTH_PROGRESSIONS.filter(p=>fitsEquipment(p.equipment));

  const days = {};
  let wodCounter = 0, progCounter = 0;
  selectedDays.forEach((dayKey, i)=>{
    const useWod = i % 2 === 0;
    if(useWod && wodPool.length){
      days[dayKey] = { type:'wod', refId: wodPool[wodCounter % wodPool.length].id };
      wodCounter++;
    } else if(progPool.length){
      days[dayKey] = { type:'strength', refId: progPool[progCounter % progPool.length].id };
      progCounter++;
    } else if(wodPool.length){
      days[dayKey] = { type:'wod', refId: wodPool[wodCounter % wodPool.length].id };
      wodCounter++;
    }
  });

const CARDIO_MACHINE_NAMES = ['Row','Air Bike','Bike','Ski Erg','Run'];
const GPS_RUN_NAMES = ['run','lauf'];
function isRunExercise(ex){
  return !!ex && getExerciseType(ex)==='cardio' && GPS_RUN_NAMES.some(n=>ex.name.toLowerCase().includes(n));
}
function guessExerciseType(name){
  const n = name.toLowerCase();
  if(CARDIO_MACHINE_NAMES.some(c=>new RegExp('\\b'+c.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(n))) return 'cardio';
  const libMatch = EXERCISE_LIBRARY.find(b=>n.includes(b.name.toLowerCase()));
  if(libMatch) return libMatch.type;
  return 'weighted';
}
function findOrCreateExerciseId(name, type){
  const existing = state.exercises.find(e=>e.name.toLowerCase()===name.toLowerCase());
  if(existing) return existing.id;
  const ex = {id: slug(name), name, custom:true, type: type || guessExerciseType(name)};
  state.exercises.push(ex);
  saveKey('exercises', state.exercises);
  return ex.id;
}
function buildLibraryMovement(m){
  const cleanName = m.name.replace(/\s+\d+m$/i, '');
  const exId = findOrCreateExerciseId(cleanName);
  const type = getExerciseType(state.exercises.find(e=>e.id===exId));
  return {exerciseId: exId, reps: m.reps ? String(m.reps) : '', weight:'', unit: type==='cardio' ? 'm' : 'reps'};
}
function buildForTimeBuilderFromWod(wod){
  return {
    phase:'build',
    movements: wod.movements.map(buildLibraryMovement),
    rounds: String(wod.rounds||1),
    repScheme: wod.repScheme||'',
    timeCapMin:'', timeCapSec:'',
    startedAt:null, elapsedMs:0, running:false, timeCapMs:0, capped:false, finalElapsedSec:null
  };
}
function buildAmrapBuilderFromWod(wod){
  const totalSec = wod.durationSec||1200;
  return {
    phase:'build',
    movements: wod.movements.map(buildLibraryMovement),
    durationMin: String(Math.floor(totalSec/60)), durationSec: String(totalSec%60),
    startedAt:null, running:false, remainingMs:0, durationMs:0, roundsCompleted:0, extraReps:'', timedOut:false
  };
}
function buildTemplateFromProgression(prog){
  if(!prog) return null;
  return [{
    exerciseId: findOrCreateExerciseId(prog.exerciseName),
    timing: '',
    setsCount: String(prog.setsCount||5),
    pctList: prog.pctList || ''
  }];
}

/* ---------- Migration (old separate Training/WOD format -> unified Workout format) ---------- */
function migrateToWorkouts(oldTrainingLogs, oldWods){
  const workouts = [];
  (oldWods||[]).forEach(w=>{
    const movements = (w.movements||[]).map(m=>{
      let sets;
      if(m.sets){
        sets = m.sets.map(s=>({
          reps: s.reps!==undefined ? s.reps : '',
          weight: s.weight!==undefined ? s.weight : (s.calcWeight||''),
          rmCheck: !!(s.percent),
          pct: s.percent||null,
          rmReps: s.percent ? 1 : null
        }));
      } else {
        sets = [{reps:'', weight:m.calcWeight||'', rmCheck: !!m.percent, pct:m.percent||null, rmReps: m.percent?1:null}];
      }
      return { exerciseId:m.exerciseId, sets };
    });
    workouts.push({ id:w.id, date:w.date, name:w.name||'', note:w.note||'', movements });
  });
  (oldTrainingLogs||[]).forEach(e=>{
    const sets = (e.sets||[{weight:e.weight,reps:e.reps}]).map(s=>({reps:s.reps, weight:s.weight, rmCheck:false, pct:null, rmReps:null}));
    workouts.push({ id:e.id, date:e.date, name:'', note:'', movements:[{exerciseId:e.exerciseId, sets}] });
  });
  return workouts;
}

function migrateStaleExerciseTypes(){
  let changed = false;
  state.exercises.forEach(ex=>{
    const match = matchLibraryVariant(ex);

    const correctType = match.variant.type || match.base.type;

function decodeJwtPayload(token){
  try{
    const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(atob(base64));
  }catch{
    return null;
  }
}
function boot(){
  const token = new URLSearchParams(location.search).get('token');
  if(token){
    history.replaceState(null, '', location.pathname);
    const payload = decodeJwtPayload(token);
    if(payload && payload.type==='verification'){
      handleVerificationToken(token);
      return;
    }
    state.tmp.auth = {screen:'reset', email:'', password:'', passwordConfirm:'', error:'', info:'', loading:false, resetToken:token};
    renderBoot();
    return;
  }
  if(pb.authStore.isValid){
    initApp();
  } else {
    state.tmp.auth = {screen:'login', email:'', password:'', passwordConfirm:'', error:'', info:'', loading:false, resetToken:null};
    renderBoot();
  }
}
async function handleVerificationToken(token){
  state.tmp.auth = {screen:'verifying', email:'', password:'', passwordConfirm:'', error:'', info:'', loading:true, resetToken:null};
  renderBoot();
  try{
    await pb.collection('users').confirmVerification(token);
    if(pb.authStore.isValid) await pb.collection('users').authRefresh();
    state.tmp.auth = {screen:'verified', email:'', password:'', passwordConfirm:'', error:'', info:'', loading:false, resetToken:null};
  }catch(e){
    state.tmp.auth = {screen:'verified', email:'', password:'', passwordConfirm:'', error:'Link ungültig oder abgelaufen.', info:'', loading:false, resetToken:null};
  }
  renderBoot();
}
function continueAfterVerification(){
  if(pb.authStore.isValid){ initApp(); } else { backToLogin(); }
}

  document.getElementById('app').innerHTML = renderAuthScreen();
}
function toggleAuthMode(){
  state.tmp.auth.screen = state.tmp.auth.screen==='register' ? 'login' : 'register';
  state.tmp.auth.error = '';

async function submitAuth(){
  const a = state.tmp.auth;
  const email = a.email.trim();
  const password = a.password;
  const isRegister = a.screen==='register';
  if(!email || !password){ a.error = 'Bitte E-Mail und Passwort eingeben'; renderBoot(); return; }
  if(isRegister && password!==a.passwordConfirm){ a.error = 'Passwörter stimmen nicht überein'; renderBoot(); return; }
  a.loading = true; a.error = '';
  renderBoot();
  try{
    if(isRegister){
      await pb.collection('users').create({email, password, passwordConfirm:a.passwordConfirm});
    }
    await pb.collection('users').authWithPassword(email, password);
    if(isRegister){
      try{ await pb.collection('users').requestVerification(email); }catch{}
    }
    await afterAuthSuccess();
  }catch(e){
    a.loading = false;
    a.error = (e && e.response && e.response.message) || 'Anmeldung fehlgeschlagen. Bitte Angaben prüfen.';
    renderBoot();
  }
}
async function afterAuthSuccess(){
  try{
    const {hadCloudData} = await pullAllFromCloud();
    if(!hadCloudData && hasAnyLocalData()){
      state.tmp.auth.loading = false;
      state.tmp.auth.screen = 'migration';
      renderBoot();
    } else {
      await initApp();
    }
  }catch(e){
    state.tmp.auth.loading = false;
    state.tmp.auth.error = 'Verbindung zum Server fehlgeschlagen. Bitte erneut versuchen.';
    renderBoot();
  }
}

  const [profile, exercises, workoutsStored, oldTrainingLogs, oldWods, nutritionLogs, measurements, prEntries, timeRecords, trainingPlan] = await Promise.all([
    loadKey('profile', null),
    loadKey('exercises', null),

    loadKey('wods', []),

  ]);

  if(exercises && exercises.length){
    state.exercises = exercises;
    if(migrateStaleExerciseTypes()) await saveKey('exercises', state.exercises);

}

function weekDates(){
  const today = new Date();
  const dayIdx = (today.getDay()+6)%7; // 0=Mo
  const monday = new Date(today); monday.setDate(today.getDate()-dayIdx);
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}

function startPlannedWorkout(){
  const planDay = state.trainingPlan.days[todaysPlanKey()];

    const wod = CROSSFIT_WODS.find(w=>w.id===planDay.refId);
    if(wod){
      state.tmp.wodName = wod.name;
      if(wod.format==='amrap'){
        state.tmp.wodFormat = 'amrap';
        state.tmp.amrapBuilder = buildAmrapBuilderFromWod(wod);
      } else {
        state.tmp.wodFormat = 'for-time';
        state.tmp.forTimeBuilder = buildForTimeBuilderFromWod(wod);
      }
    }
  } else {
    const template = buildTemplateFromProgression(STRENGTH_PROGRESSIONS.find(p=>p.id===planDay.refId));
    if(template){
      state.tmp.wodFormat = 'strength';
      state.tmp.wodTemplate = template;
      state.tmp.wodName = planEntryLabel(planDay) || '';
      state.tmp.wodPhase = 'template';
    }
  }

}

/* ---------- WORKOUT TAB (merged Training + WOD, two-phase: template -> generated rows) ---------- */
function exerciseLogs(exId){
  const out = [];
  state.workouts.forEach(w=>{
    (w.movements||[]).forEach(m=>{
      if(m.exerciseId===exId){
        const sets = m.sets.filter(s=>s.weight && s.reps);
        if(sets.length) out.push({ date: w.date, sets });
      }
    });
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function topSet(entry){
  return entry.sets.reduce((best,s)=> estimate1RM(s.weight,s.reps) > estimate1RM(best.weight,best.reps) ? s : best, entry.sets[0]);
}
function sessionE1RM(entry){
  return entry.sets.reduce((max,s)=> Math.max(max, estimate1RM(s.weight,s.reps)), 0);
}
function computedBest(exId){
  const logs = exerciseLogs(exId);
  return logs.length ? logs.reduce((max,e)=>Math.max(max, sessionE1RM(e)), 0) : null;
}
function prEntriesFor(exId){
  return state.prEntries.filter(p=>p.exerciseId===exId).sort((a,b)=> b.value-a.value || b.date.localeCompare(a.date));
}
function manualBest(exId){
  const list = prEntriesFor(exId);
  return list.length ? list[0].value : null;
}
function bestE1RM(exId){
  const c = computedBest(exId), m = manualBest(exId);
  if(c==null && m==null) return null;
  return Math.max(c||0, m||0);
}
function parsePctList(str){
  return (str||'').split(/[,\/\s]+/).map(s=>parseFloat(s)).filter(n=>!isNaN(n));
}
function pctForIndex(arr, i){
  if(!arr.length) return null;
  return arr[i] !== undefined ? arr[i] : arr[arr.length-1];
}
function parseRepScheme(str){
  return (str||'').split(/[-,\/\s]+/).map(s=>parseInt(s)).filter(n=>!isNaN(n));
}
function blankRowSet(){ return {reps:'', weight:'', pct:null, autoFilled:false}; }
function blankTemplateMove(){ return {exerciseId: state.exercises[0]?.id, timing:'', setsCount:'', pctList:'', weight:'', unit:'kcal', qty:'', repsTarget:'', groupWithNext:false}; }
function ensureWodTemplate(){

}
function isTemplateEmpty(){

function findWorkoutByName(name, format){
  const n = (name||'').trim().toLowerCase();
  if(!n) return null;
  let matches = state.workouts.filter(w=>(w.name||'').trim().toLowerCase()===n);
  if(format) matches = matches.filter(w=>(w.format||'strength')===format);
  matches.sort((a,b)=>a.date.localeCompare(b.date));
  return matches.length ? matches[matches.length-1] : null;
}

function isWodInProgress(){
  if(state.tmp.wodPhase==='rows' || state.tmp.wodPhase==='live') return true;
  const b = state.tmp.forTimeBuilder;

  const a = state.tmp.amrapBuilder;
  if(a && a.phase!=='build') return true;

function openPhotoImportModal(){

function loadTesseractIfNeeded(){
  if(window.Tesseract) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Texterkennung konnte nicht geladen werden (Internetverbindung nötig).'));
    document.head.appendChild(s);
  });
}
async function handlePhotoImportFile(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const pi = state.tmp.photoImport;
  pi.loading = true; pi.error = '';
  render();
  try{
    await loadTesseractIfNeeded();
    const result = await Tesseract.recognize(file, 'deu+eng');
    pi.rawText = (result.data.text || '').trim();
  } catch(err){
    pi.error = (err && err.message) ? err.message : 'Texterkennung fehlgeschlagen — bitte Text unten manuell eingeben.';
  }
  pi.stage = 'review';
  pi.loading = false;
  render();
}
const OPTION_LINE_RE = /^option\s+([a-z0-9]+)\s*[:.\-]?\s*(.*)$/i;
function detectPhotoImportOptions(text){
  const lines = text.split('\n');
  const options = [];
  lines.forEach(line=>{
    const t = line.trim();
    const m = t.match(OPTION_LINE_RE);
    if(m) options.push({ id: t, label: m[1].toUpperCase(), content: m[2].trim() || t });
  });
  return { lines, options };
}
function confirmPhotoImport(){
  const pi = state.tmp.photoImport;
  const text = (pi.rawText || '').trim();
  if(!text){ showToast('Bitte Text eingeben oder Foto wählen'); return; }
  const { lines, options } = detectPhotoImportOptions(text);
  if(options.length >= 2){
    pi.optionLines = lines;
    pi.optionChoices = options;
    pi.stage = 'chooseOption';
    render();
    return;
  }
  applyParsedWorkout(text);
}
function choosePhotoImportOption(idx){
  const pi = state.tmp.photoImport;
  const chosen = pi.optionChoices && pi.optionChoices[idx];
  if(!chosen) return;
  const reconstructed = pi.optionLines
    .filter(line=>{
      const t = line.trim();
      return !OPTION_LINE_RE.test(t) || t === chosen.id;
    })
    .map(line=> line.trim()===chosen.id ? chosen.content : line)
    .join('\n');
  applyParsedWorkout(reconstructed);
}

  const pi = state.tmp.photoImport;

  const pickBody = `

  const nameWords = name.toLowerCase().split(/\s+/);
  const partial = state.exercises.find(e=>{
    const exWords = e.name.toLowerCase().split(/\s+/);

      <div><span>Distanz</span><span>${toDisplayDistance(r.distanceM)}${distanceUnitLabel()}</span></div>
      <div><span>Zeit</span><span>${r.elapsedSec!=null?fmtClock(r.elapsedSec*1000,false):'—'}</span></div>
      <div><span>Ø Pace</span><span>${formatPace(r.distanceM||0, (r.elapsedSec||0)*1000)}</span></div>
    </div>`;
  } else {
    body = `<div class="moves">
      ${w.movements.map(m=>{
        const ex = state.exercises.find(e=>e.id===m.exerciseId);
        const type = getExerciseType(ex);
        const isCardio = type==='cardio';
        const isMobility = type==='mobility';
        const prefix = (m.timing ? `[${escapeHtml(m.timing)}] ` : '') + (m.groupId!=null ? '🔗 ' : '');
        if(isCardio){
          return m.sets.map(s=>{
            const qty = m.unit==='m' ? `${toDisplayDistance(s.reps)}${distanceUnitLabel()}` : `${s.reps||0} kcal`;
            return `<div><span>${prefix}${ex?ex.name:'—'}: ${qty}</span></div>`;
          }).join('');
        }
        if(isMobility){
          return m.sets.map(s=>{
            const qty = m.unit==='sec' ? `${s.reps||0}s` : `${s.reps||0}x`;
            return `<div><span>${prefix}${ex?ex.name:'—'}: ${qty}</span></div>`;
          }).join('');
        }
        return m.sets.map(s=>`<div><span>${prefix}${ex?ex.name:'—'}: ${s.reps}×${s.weight}kg${s.pct? ' ('+s.pct+'% 1RM)':''}</span></div>`).join('');
      }).join('')}
    </div>`;
  }
  return `
    <div class="wod-card">
      <div class="wname">${escapeHtml(w.name)||'Workout'} <span class="wdate">${fmtDate(w.date)}</span></div>
      ${body}
      ${w.note ? `<div class="note">${escapeHtml(w.note)}</div>` : ''}
    </div>
  `;
}

function renderWorkout(){
  if(state.tmp.gps && state.tmp.gps.active) return renderGpsLiveView();
  if(!state.tmp.wodFormat) state.tmp.wodFormat = 'strength';
  const historyHtml = ''; // Verlauf ist jetzt unter Fortschritt zu finden
  const inProgress = isWodInProgress();
  const formatSelector = inProgress ? '' : renderFormatSelector();

  if(!inProgress && state.tmp.workoutMenu==='timer'){
    return formatSelector + renderTimer() + historyHtml;
  }

  if(state.tmp.wodFormat==='for-time') return formatSelector + renderForTimeFlow(historyHtml);
  if(state.tmp.wodFormat==='amrap') return formatSelector + renderAmrapFlow(historyHtml);
  if(state.tmp.wodFormat==='for-load') return formatSelector + renderForLoadFlow(historyHtml);
  if(state.tmp.wodFormat==='run') return formatSelector + renderRunFlow(historyHtml);

  ensureWodTemplate();
  const uniqueNames = [...new Set(state.workouts.map(w=>w.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  const headerFields = buildHeaderFields(uniqueNames);

  if(state.tmp.wodPhase==='live') return renderWodLivePhase();
  return formatSelector + (state.tmp.wodPhase==='rows'
    ? renderWodRowsPhase(headerFields, historyHtml)
    : renderWodTemplatePhase(headerFields, historyHtml));
}

function loadDoneWorkout(index){
  const doneNames = [...new Set(state.workouts.map(w=>w.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  const name = doneNames[index];
  if(!name) return;
  const w = findWorkoutByName(name);
  if(!w) return;
  const fmt = w.format || 'strength';

  state.tmp.wodName = name;
  state.tmp.wodDate = todayStr();
  state.tmp.wodTemplate = null; state.tmp.wodMoves = null; state.tmp.wodPhase = 'template';
  state.tmp.forTimeBuilder = null; state.tmp.amrapBuilder = null; state.tmp.forLoadBuilder = null;
  state.tmp.gps = null;
  state.tmp.wodFormat = fmt;

  if(fmt==='strength' || fmt==='emom'){
    state.tmp.wodTemplate = w.movements.map((m,mi)=>{
      const pcts = m.sets.map(s=>s.pct).filter(p=>p!=null);
      const next = w.movements[mi+1];
      const isQtyBased = m.unit!=null;
      const firstSet = m.sets[0];
      return {
        exerciseId: m.exerciseId,
        timing: m.timing || '',
        setsCount: String(m.sets.length || ''),
        pctList: pcts.length ? pcts.join(',') : '',
        weight: (!isQtyBased && firstSet) ? String(firstSet.weight ?? '') : '',
        unit: m.unit || 'kcal',
        qty: (isQtyBased && firstSet) ? String(firstSet.reps ?? '') : '',
        repsTarget: m.repsTarget || ((!isQtyBased && firstSet) ? String(firstSet.reps ?? '') : ''),
        groupWithNext: !!(m.groupId!=null && next && next.groupId===m.groupId)
      };
    });
  } else if(fmt==='for-time' && w.forTime){
    ensureForTimeBuilder();
    const ft = w.forTime, b = state.tmp.forTimeBuilder;
    b.movements = ft.movements.map(m=>({exerciseId:m.exerciseId, reps:String(m.reps??''), weight:String(m.weight??''), unit:m.unit||'reps'}));
    b.rounds = String(ft.rounds||1);
    b.repScheme = ft.repScheme||'';
    if(ft.timeCapSec){
      b.timeCapMin = String(Math.floor(ft.timeCapSec/60));
      b.timeCapSec = String(ft.timeCapSec%60);
    }
  } else if(fmt==='amrap' && w.amrap){
    ensureAmrapBuilder();
    const am = w.amrap, b = state.tmp.amrapBuilder;
    b.movements = am.movements.map(m=>({exerciseId:m.exerciseId, reps:String(m.reps??''), weight:String(m.weight??''), unit:m.unit||'reps'}));
    b.durationMin = String(Math.floor((am.durationSec||1200)/60));
    b.durationSec = String((am.durationSec||1200)%60);
  } else if(fmt==='for-load' && w.forLoad){
    ensureForLoadBuilder();
    const fl = w.forLoad, b = state.tmp.forLoadBuilder;
    b.exerciseId = fl.exerciseId;
    b.targetReps = String(fl.targetReps||3);
    b.unit = fl.unit || 'kcal';
    b.achievedWeight = String(fl.achievedWeight ?? '');
    if(fl.timeCapSec){
      b.timeCapMin = String(Math.floor(fl.timeCapSec/60));
      b.timeCapSec = String(fl.timeCapSec%60);
    }
  }
  render();
}
function buildHeaderFields(uniqueNames){
  const disabledAttr = isWodInProgress() ? 'disabled' : '';
  return `
    <div class="row">
      <div class="field"><label>Datum</label><input type="date" id="wodDate" value="${state.tmp.wodDate||todayStr()}" ${disabledAttr} onchange="state.tmp.wodDate=this.value"></div>
      <div class="field">
        <label>Name</label>
        <input type="text" id="wodName" list="wodNameList" value="${escapeHtml(state.tmp.wodName||'')}" ${disabledAttr} onchange="onWodNameChange(this.value)" placeholder="z.B. Fran">
        <datalist id="wodNameList">${uniqueNames.map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist>
      </div>
    </div>
  `;
}

function getEmomIntervalSec(){
  return (parseInt(state.tmp.emomMin)||0)*60 + (parseInt(state.tmp.emomSec)||0);
}

    const isBodyweight = type==='bodyweight';

    const repsTargetField = (isWeighted || isBodyweight) ? `<div class="field" style="margin-bottom:0;"><label>Ziel-WH</label><input type="number" step="1" value="${escapeHtml(t.repsTarget)}" onchange="updateTemplateField(${mi},'repsTarget',this.value)" placeholder="z.B. 1"></div>` : '';
    const pctField = isWeighted ? `<div class="field" style="margin-bottom:0;"><label>% vom 1RM</label><input type="text" value="${escapeHtml(t.pctList)}" onchange="updateTemplateField(${mi},'pctList',this.value)" placeholder="z.B. 75"></div>` : '';
    const weightField = isWeighted ? `<div class="row"><div class="field" style="margin-bottom:0;"><label>Gewicht (${weightUnitLabel()})</label><input type="number" step="0.5" value="${toDisplayWeight(t.weight)}" oninput="updateTemplateFieldWeight(${mi},this.value)" placeholder="alt. zu %"></div>${repsTargetField}</div>` : '';
    const unitToggle = isCardio ? `
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ${t.unit==='kcal'?'btn-primary':'btn-ghost'}" onclick="setTemplateMoveUnit(${mi},'kcal')">Kalorien</button>
        <button type="button" class="btn ${t.unit==='m'?'btn-primary':'btn-ghost'}" onclick="setTemplateMoveUnit(${mi},'m')">${distanceUnitLabel()==='mi'?'Meilen':'Meter'}</button>
      </div>` : isMobility ? `
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ${t.unit!=='sec'?'btn-primary':'btn-ghost'}" onclick="setTemplateMoveUnit(${mi},'reps')">Wiederholungen</button>
        <button type="button" class="btn ${t.unit==='sec'?'btn-primary':'btn-ghost'}" onclick="setTemplateMoveUnit(${mi},'sec')">Sekunden</button>
      </div>` : '';
    const qtyField = isCardio ? `<div class="row"><div class="field" style="margin-bottom:0;"><label>Ziel pro Satz (${t.unit==='m'?distanceUnitLabel():'kcal'})</label><input type="number" step="1" value="${t.unit==='m'?toDisplayDistance(t.qty):t.qty}" oninput="updateTemplateFieldQty(${mi},this.value)" placeholder="z.B. 500"></div></div>`
      : isMobility ? `<div class="row"><div class="field" style="margin-bottom:0;"><label>Ziel pro Satz (${t.unit==='sec'?'Sek.':'Wdh.'})</label><input type="number" step="1" value="${t.qty}" oninput="updateTemplateFieldQty(${mi},this.value)" placeholder="z.B. 10"></div></div>` : '';
    const setsField = isEmom
      ? ''
      : `<div class="field" style="margin-bottom:0;"><label>Sets</label><input type="number" step="1" value="${t.setsCount}" onchange="updateTemplateField(${mi},'setsCount',this.value)" placeholder="z.B. 5"></div>`;
    const groupToggle = (isEmom && mi < state.tmp.wodTemplate.length-1) ? `
      <label style="display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:13px;color:var(--chalk-60);">
        <input type="checkbox" ${t.groupWithNext?'checked':''} onchange="updateTemplateField(${mi},'groupWithNext',this.checked)">
        Mit nächster Übung zu einem Komplex kombinieren
      </label>` : '';
    return `
    <div class="wod-move-row" data-idx="${mi}">
      <div class="top">
        <select onchange="updateTemplateField(${mi},'exerciseId',this.value)">

        </select>
        <button type="button" class="btn-sm btn-ghost" style="width:auto;flex:0 0 auto;" onclick="openExerciseModal(exId=>updateTemplateField(${mi},'exerciseId',exId))">➕</button>
        ${state.tmp.wodTemplate.length>1 ? `<button class="remove-row" onclick="removeTemplateMove(${mi})">✕</button>` : ''}
      </div>
      ${variantSelector}
      ${isEmom ? '' : `<div class="field"><label>Zeitliche Angabe</label><input type="text" value="${escapeHtml(t.timing)}" onchange="updateTemplateField(${mi},'timing',this.value)" placeholder="z.B. Every 2:30"></div>`}
      <div class="row">
        ${setsField}

      <button class="btn btn-primary" onclick="generateWodRows()">WOD erstellen</button>

}

function renderWodRowsPhase(headerFields, historyHtml){
  let refBlock = '';
  if(state.tmp.wodNameMatch){
    refBlock += `<div class="note" style="margin-bottom:10px;">Letztes Mal <strong style="color:var(--chalk-50)">"${escapeHtml(state.tmp.wodNameMatch.name)}"</strong> am ${fmtDate(state.tmp.wodNameMatch.date)} gemacht.</div>`;
    refBlock += `<div class="stat-label" style="margin-bottom:6px;">Wie fühlst du dich heute im Vergleich zum letzten Mal?</div>`;
    refBlock += `<div class="feel-grid">`;
    Object.keys(FEELING_LABELS).forEach(f=>{
      refBlock += `<button class="feel-btn ${state.tmp.wodFeeling===f?'active':''}" onclick="pickWodFeeling('${f}')">${FEELING_LABELS[f]}</button>`;
    });
    refBlock += `</div>`;
  }

  const moveBlocks = state.tmp.wodMoves.map((mv,mi)=>{
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    const prescriptionBits = [];
    if(mv.timing) prescriptionBits.push(mv.timing);
    if(mv.setsCountRaw) prescriptionBits.push(mv.setsCountRaw+' Sätze');
    if(mv.repsTarget) prescriptionBits.push(mv.repsTarget+' Wdh.');
    if(mv.pctList) prescriptionBits.push(mv.pctList+'% 1RM');
    const known1rm = bestE1RM(mv.exerciseId);
    const type = getExerciseType(ex);
    const isCardio = type==='cardio';
    const isMobility = type==='mobility';

    const setsHtml = mv.sets.map((s,si)=>{
      if(isCardio){
        const qtyLabel = mv.unit==='m' ? `Distanz (${distanceUnitLabel()})` : 'Kalorien';
        const qtyValue = mv.unit==='m' ? toDisplayDistance(s.reps) : s.reps;
        const gpsButton = isRunExercise(ex) && mv.unit==='m'
          ? `<div style="text-align:center;"><button type="button" class="btn-sm btn-ghost" onclick="startGpsRun('inline',{flow:'wod',mi:${mi},si:${si}})">📍 Lauf starten</button></div>` : '';
        return `
      <div class="set-block">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span class="stat-label" style="margin:0;">Satz ${si+1}</span>
          ${mv.sets.length>1 ? `<button class="remove-row" onclick="removeWodSet(${mi},${si})">✕</button>` : ''}
        </div>
        <div class="field" style="margin-bottom:8px;"><label>${qtyLabel}</label><input type="number" step="1" value="${qtyValue}" oninput="updateWodSetQty(${mi},${si},this.value)" placeholder="z.B. 500"></div>
        ${gpsButton}
      </div>`;
      }
      if(isMobility){
        const qtyLabel = mv.unit==='sec' ? 'Sekunden' : 'Wiederholungen';
        return `
      <div class="set-block">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span class="stat-label" style="margin:0;">Satz ${si+1}</span>
          ${mv.sets.length>1 ? `<button class="remove-row" onclick="removeWodSet(${mi},${si})">✕</button>` : ''}
        </div>
        <div class="field" style="margin-bottom:8px;"><label>${qtyLabel}</label><input type="number" step="1" value="${s.reps}" oninput="updateWodSetQty(${mi},${si},this.value)" placeholder="z.B. 10"></div>
      </div>`;
      }
      return `
      <div class="set-block">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span class="stat-label" style="margin:0;">Satz ${si+1}${s.pct?' — '+s.pct+'% 1RM':''}</span>
          ${mv.sets.length>1 ? `<button class="remove-row" onclick="removeWodSet(${mi},${si})">✕</button>` : ''}
        </div>
        <div class="row">
          <div class="field" style="margin-bottom:0;"><label>Wiederholungen</label><input type="number" step="1" value="${s.reps}" oninput="updateSetField(${mi},${si},'reps',this.value)" placeholder="z.B. 5"></div>
          <div class="field" style="margin-bottom:0;"><label>kg</label><input type="number" step="0.5" value="${s.weight}" oninput="updateSetField(${mi},${si},'weight',this.value)" placeholder="z.B. 48"></div>
        </div>
      </div>`;
    }).join('');

    return `
    <div class="wod-move-row" data-idx="${mi}">
      <div class="wname" style="font-size:16px;margin-bottom:2px;">${ex?ex.name:'—'}${mv.groupId!=null?' 🔗':''}</div>
      ${mv.groupId!=null ? `<div class="note" style="margin-bottom:4px;">Teil eines Komplexes</div>` : ''}
      ${prescriptionBits.length ? `<div class="note" style="margin-bottom:8px;">Vorgabe: ${escapeHtml(prescriptionBits.join(' · '))}</div>` : ''}
      ${known1rm ? `<div class="note" style="margin-bottom:10px;">bisher bestes 1RM: <strong style="color:var(--chalk-50)">${Math.round(known1rm)}kg</strong></div>` : ''}
      ${setsHtml}
      <button class="add-move-btn" onclick="addWodSet(${mi})">+ Satz hinzufügen</button>
    </div>`;
  }).join('');

  return `
    <div class="card">
      <h2>Neues Workout</h2>
      ${headerFields}
      <button class="btn btn-ghost" style="margin-bottom:10px;" onclick="backToTemplate()">← Vorlage bearbeiten</button>
      <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="startLiveWorkout()">▶ Workout starten</button>
      ${refBlock}
      ${moveBlocks}
      <div class="field"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Beschreibung, Runden, Zeit-Cap …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
      <button class="btn btn-primary" onclick="saveWod()">Workout speichern</button>
    </div>
    ${historyHtml}
  `;
}

/* ---------- LIVE-MODUS (geführte Trainingsdurchführung) ---------- */
function startLiveWorkout(){
  const moves = state.tmp.wodMoves;
  const flat = [];
  let i = 0;
  while(i < moves.length){
    const gid = moves[i].groupId;
    let j = i;
    if(gid!=null){
      while(j+1 < moves.length && moves[j+1].groupId===gid) j++;
    }
    const groupIdx = [];
    for(let k=i;k<=j;k++) groupIdx.push(k);
    const setsCount = moves[groupIdx[0]].sets.length;
    for(let si=0; si<setsCount; si++){
      flat.push(groupIdx.map(mi=>({mi,si})));
    }
    i = j+1;
  }
  if(!flat.length){ showToast('Keine Sätze vorhanden'); return; }
  state.tmp.live = {
    startedAt: Date.now(),
    flat,
    pos: 0,
    resting: false,
    restRunning: false,
    restRemaining: 0,
    restTotal: 0,
    restStartedAt: null,
    finished: false
  };
  state.tmp.wodPhase = 'live';
  render();
}
function renderWodLivePhase(){
  const live = state.tmp.live;
  if(live.finished) return renderWodSummaryPhase();
  if(live.resting) return renderRestScreen(live);

  const group = live.flat[live.pos];
  const isComplex = group.length>1;
  const blocks = group.map(({mi,si})=>{
    const mv = state.tmp.wodMoves[mi];
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    const s = mv.sets[si];
    const type = getExerciseType(ex);
    const isCardio = type==='cardio';
    const isMobility = type==='mobility';
    const qtyLabel = isCardio ? (mv.unit==='m' ? `Distanz (${distanceUnitLabel()})` : 'Kalorien')
      : isMobility ? (mv.unit==='sec' ? 'Sekunden' : 'Wiederholungen')
      : 'Wiederholungen';
    const qtyValue = isCardio ? (mv.unit==='m' ? toDisplayDistance(s.reps) : s.reps) : s.reps;
    const gpsButton = isCardio && isRunExercise(ex) && mv.unit==='m'
      ? `<div style="text-align:center;margin-bottom:10px;"><button type="button" class="btn-sm btn-ghost" onclick="startGpsRun('inline',{flow:'wod',mi:${mi},si:${si}})">📍 Lauf starten</button></div>` : '';
    const prescriptionBits = [];
    if(mv.repsTarget) prescriptionBits.push(mv.repsTarget+' Wdh.');
    if(s.pct) prescriptionBits.push(s.pct+'% 1RM');
    return `
      <div style="margin-bottom:16px;">
        <h3 style="margin:0 0 6px;">${ex?ex.name:'—'}</h3>
        ${prescriptionBits.length ? `<div class="note" style="margin-bottom:8px;">Vorgabe: ${escapeHtml(prescriptionBits.join(' · '))}</div>` : ''}
        <div class="row">
          <div class="field"><label>${qtyLabel}</label><input type="number" step="1" id="liveReps_${mi}" value="${qtyValue}" placeholder="z.B. 5"></div>
          ${(isCardio || isMobility) ? '' : `<div class="field"><label>kg</label><input type="number" step="0.5" id="liveWeight_${mi}" value="${s.weight}" placeholder="z.B. 48"></div>`}
        </div>
        ${gpsButton}
      </div>`;
  }).join('');
  const timing = state.tmp.wodMoves[group[0].mi].timing;

  return `
    <div class="card">
      <div class="stat-label">${isComplex?'Runde':'Satz'} ${live.pos+1} / ${live.flat.length}</div>
      ${timing ? `<div class="note" style="margin-bottom:10px;">${escapeHtml(timing)}</div>` : ''}
      ${blocks}
      <button class="btn btn-primary" onclick="completeLiveSet()">✓ ${isComplex?'Runde':'Satz'} erledigt</button>
      <button class="btn btn-ghost" style="margin-top:10px;" onclick="exitLiveWorkout()">Geführten Modus verlassen</button>
    </div>
  `;
}
function completeLiveSet(){
  const live = state.tmp.live;
  const group = live.flat[live.pos];
  group.forEach(({mi,si})=>{
    const mv = state.tmp.wodMoves[mi];
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    const isCardio = getExerciseType(ex)==='cardio';
    const rawReps = document.getElementById(`liveReps_${mi}`).value;
    mv.sets[si].reps = (isCardio && mv.unit==='m') ? String(fromDisplayDistance(rawReps)) : rawReps;
    const weightEl = document.getElementById(`liveWeight_${mi}`);
    if(weightEl) mv.sets[si].weight = weightEl.value;
    mv.sets[si].autoFilled = false;
  });

  if(live.pos >= live.flat.length-1){
    live.finished = true;
    render();
    return;
  }
  live.pos += 1;
  const restSec = (state.tmp.wodFormat==='emom' && getEmomIntervalSec()>0) ? getEmomIntervalSec() : 90;
  beginRest(restSec);
}
function beginRest(seconds){
  const live = state.tmp.live;
  live.resting = true;
  live.restTotal = seconds*1000;
  live.restRemaining = live.restTotal;
  live.restStartedAt = Date.now();
  live.restRunning = true;
  startTicking('live', tickRest);
  render();
}
function tickRest(){
  const live = state.tmp.live;
  if(!live || !live.resting){ stopTicking(); return; }
  const remaining = live.restRemaining - (Date.now()-live.restStartedAt);
  const display = document.getElementById('timerBigDisplay');
  if(remaining<=0){
    live.restRemaining = 0;
    live.restRunning = false;
    stopTicking();
    beep();
    finishRest();
    return;
  }
  if(display) display.textContent = fmtClock(remaining,false);
}
function finishRest(){
  state.tmp.live.resting = false;
  render();
}
function setRestPreset(seconds){ beginRest(seconds); }
function pauseRest(){
  const live = state.tmp.live;
  if(live.restRunning){ live.restRemaining = Math.max(0, live.restRemaining - (Date.now()-live.restStartedAt)); }
  live.restRunning = false;
  stopTicking();
  render();
}
function resumeRest(){
  const live = state.tmp.live;
  live.restStartedAt = Date.now();
  live.restRunning = true;
  startTicking('live', tickRest);
  render();
}
function pauseLiveRest(){
  const live = state.tmp.live;
  if(live && live.resting && live.restRunning){ pauseRest(); return; }
  const ft = state.tmp.forTimeBuilder;
  if(ft && ft.phase==='running' && ft.running){ pauseForTimeClock(); return; }
  const am = state.tmp.amrapBuilder;
  if(am && am.phase==='running' && am.running){ pauseAmrapClock(); return; }
  const fl = state.tmp.forLoadBuilder;
  if(fl && fl.phase==='running' && fl.running){ pauseForLoadClock(); return; }
  const g = state.tmp.gps;
  if(g && g.active && g.running){ pauseGpsRun(); return; }
}
function skipRest(){
  stopTicking();
  finishRest();
}
function renderRestScreen(live){
  return `
    <div class="card" style="text-align:center;">
      <div class="stat-label">Pause</div>
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;margin:14px 0;">${fmtClock(live.restRemaining,false)}</div>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn btn-ghost" onclick="setRestPreset(60)">1 Min</button>
        <button class="btn btn-ghost" onclick="setRestPreset(120)">2 Min</button>
        <button class="btn btn-ghost" onclick="setRestPreset(180)">3 Min</button>
      </div>
      <div class="row">
        <button class="btn btn-ghost" onclick="${live.restRunning?'pauseRest()':'resumeRest()'}">${live.restRunning?'Pause':'Weiter'}</button>
        <button class="btn btn-primary" onclick="skipRest()">Weiter zum nächsten Satz</button>
      </div>
    </div>
  `;
}
function exitLiveWorkout(){
  stopTicking();
  state.tmp.wodPhase = 'rows';
  state.tmp.live = null;
  render();
}
function renderWodSummaryPhase(){
  const live = state.tmp.live;
  const durationMs = Date.now() - live.startedAt;
  let totalWeight = 0, totalSets = 0;
  state.tmp.wodMoves.forEach(mv=>{
    mv.sets.forEach(s=>{
      if(s.reps && s.weight){ totalWeight += parseFloat(s.weight)*parseInt(s.reps); totalSets++; }
    });
  });
  return `
    <div class="card" style="text-align:center;">
      <h2>Workout abgeschlossen 🏁</h2>
      <div class="row" style="margin:16px 0;">
        <div><div class="stat-num">${fmtClock(durationMs,false)}</div><div class="stat-label">Dauer</div></div>
        <div><div class="stat-num">${Math.round(totalWeight)}</div><div class="stat-label">kg gesamt</div></div>
        <div><div class="stat-num">${totalSets}</div><div class="stat-label">Sätze</div></div>
      </div>
      <div class="field" style="text-align:left;"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Beschreibung, Runden, Zeit-Cap …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
      <button class="btn btn-primary" onclick="finishAndSaveWorkout()">Workout speichern</button>
    </div>
  `;
}
function finishAndSaveWorkout(){
  stopTicking();
  state.tmp.live = null;
  saveWod();
}

/* ---------- FOR TIME ---------- */
function blankForTimeMove(){
  const ex = state.exercises[0];
  return {exerciseId: ex?.id, reps:'', weight:'', unit: getExerciseType(ex)==='cardio' ? 'kcal' : 'reps'};
}
function ensureForTimeBuilder(){
  if(!state.tmp.forTimeBuilder){
    state.tmp.forTimeBuilder = { phase:'build', movements:[blankForTimeMove()], rounds:'1', repScheme:'', timeCapMin:'', timeCapSec:'', startedAt:null, elapsedMs:0, running:false, timeCapMs:0, capped:false, finalElapsedSec:null, roundsCompleted:0, roundsLog:[] };
  }
}
function renderForTimeFlow(historyHtml){
  ensureForTimeBuilder();

    const qtyValue = isCardio && m.unit==='m' ? toDisplayDistance(m.reps) : m.reps;

      </div>` : isMobility ? `
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ${m.unit!=='sec'?'btn-primary':'btn-ghost'}" onclick="setForTimeMoveUnit(${mi},'reps')">Wiederholungen</button>
        <button type="button" class="btn ${m.unit==='sec'?'btn-primary':'btn-ghost'}" onclick="setForTimeMoveUnit(${mi},'sec')">Sekunden</button>
      </div>` : '';
    const weightField = type==='weighted' ? `
        <div class="field" style="margin-bottom:0;"><label>Gewicht (${weightUnitLabel()})</label><input type="number" step="0.5" value="${toDisplayWeight(m.weight)}" oninput="updateForTimeMoveWeight(${mi},this.value)" placeholder="z.B. 48"></div>` : '';
    const gpsButton = isRunExercise(ex) && m.unit==='m' ? `<div style="text-align:center;"><button type="button" class="btn-sm btn-ghost" onclick="startGpsRun('inline',{flow:'for-time',mi:${mi}})">📍 Lauf starten</button></div>` : '';
    const variantMatch = matchLibraryVariant(ex);
    const variantSelector = variantMatch ? `
      <div class="field"><label>Variante</label>
        <select onchange="updateForTimeMoveVariant(${mi},this.value)">
          ${variantMatch.base.variants.filter(v=>!v.details || !v.details.length || v.id===variantMatch.variant.id)
            .map(v=>`<option value="${v.id}" ${v.id===variantMatch.variant.id?'selected':''}>${v.label}</option>`).join('')}

    return `

        </select>

  const refNote = state.tmp.wodNameMatch

  return `
    <div class="card">

      <button class="add-move-btn" onclick="addForTimeMove()">+ Bewegung hinzufügen</button>
      <div class="row">
        <div class="field"><label>Runden</label><input type="number" step="1" min="1" value="${b.rounds}" oninput="updateForTimeField('rounds',this.value)"></div>
        <div class="field"><label>Rep-Schema</label><input type="text" value="${escapeHtml(b.repScheme)}" oninput="updateForTimeField('repScheme',this.value)" placeholder="z.B. 21-15-9"></div>
      </div>
      <div class="note" style="margin-bottom:14px;">Rep-Schema überschreibt bei Angabe die Wiederholungen oben — z.B. "21-15-9" erzeugt 3 Runden mit diesen Werten für jede Übung.</div>
      <div class="row">
        <div class="field"><label>Time Cap Min.</label><input type="number" step="1" min="0" value="${b.timeCapMin}" oninput="updateForTimeField('timeCapMin',this.value)"></div>
        <div class="field"><label>Time Cap Sek.</label><input type="number" step="1" min="0" max="59" value="${b.timeCapSec}" oninput="updateForTimeField('timeCapSec',this.value)"></div>
      </div>
      <button class="btn btn-primary" onclick="startForTimeWod()">WOD starten</button>
    </div>
    ${historyHtml}

}
function updateForTimeMove(mi, field, val){
  const b = state.tmp.forTimeBuilder;
  b.movements[mi][field] = val;
  if(field==='exerciseId'){
    const ex = state.exercises.find(e=>e.id===val);
    const type = getExerciseType(ex);
    b.movements[mi].unit = isRunExercise(ex) ? 'm' : (type==='cardio' ? 'kcal' : 'reps');
    if(type!=='weighted') b.movements[mi].weight = '';
    render();
  }
}
function updateForTimeMoveVariant(mi, variantId){
  const b = state.tmp.forTimeBuilder;
  const ex = state.exercises.find(e=>e.id===b.movements[mi].exerciseId);
  const match = matchLibraryVariant(ex);
  if(!match) return;
  const variant = match.base.variants.find(v=>v.id===variantId);
  if(!variant) return;
  const newId = findOrCreateExerciseId(composeVariantName(match.base, variant, ''), variant.type || match.base.type || 'weighted');
  updateForTimeMove(mi, 'exerciseId', newId);
}
function updateForTimeMoveQty(mi, displayVal){
  const b = state.tmp.forTimeBuilder;
  const m = b.movements[mi];
  m.reps = (m.unit==='m' && displayVal!=='') ? String(fromDisplayDistance(displayVal)) : displayVal;
}
function updateForTimeMoveWeight(mi, displayVal){
  const b = state.tmp.forTimeBuilder;
  b.movements[mi].weight = displayVal==='' ? '' : String(fromDisplayWeight(displayVal));
}
function setForTimeMoveUnit(mi, unit){
  state.tmp.forTimeBuilder.movements[mi].unit = unit;
  render();
}
function addForTimeMove(){
  state.tmp.forTimeBuilder.movements.push(blankForTimeMove());
  render();
}
function removeForTimeMove(mi){
  const b = state.tmp.forTimeBuilder;
  b.movements.splice(mi,1);
  if(!b.movements.length) b.movements.push(blankForTimeMove());
  render();
}
function updateForTimeField(field, val){
  state.tmp.forTimeBuilder[field] = val;
}
function startForTimeWod(){
  const b = state.tmp.forTimeBuilder;
  state.tmp.wodDate = document.getElementById('wodDate').value || todayStr();
  state.tmp.wodName = document.getElementById('wodName').value.trim();
  if(!b.movements.length){ showToast('Bitte mindestens eine Übung hinzufügen'); return; }
  b.timeCapMs = (parseInt(b.timeCapMin)||0)*60000 + (parseInt(b.timeCapSec)||0)*1000;
  b.capped = false;
  b.elapsedMs = 0;
  b.roundsCompleted = 0;
  b.roundsLog = buildForTimeRoundsLog(b);
  b.startedAt = Date.now();
  b.running = true;
  b.phase = 'running';
  startTicking('live', tickForTime);
  render();
}
function buildForTimeRoundsLog(b){
  const roundsCount = Math.max(1, parseInt(b.rounds)||1);
  const schemeArr = parseRepScheme(b.repScheme);
  const roundsLog = [];
  for(let ri=0; ri<roundsCount; ri++){
    roundsLog.push(b.movements.map(m=>{
      const target = String(schemeArr.length ? pctForIndex(schemeArr, ri) : (m.reps||''));
      return { target, reps: target, done:false };
    }));
  }
  return roundsLog;
}
function tickForTime(){
  const b = state.tmp.forTimeBuilder;
  if(!b || b.phase!=='running'){ stopTicking(); return; }
  const elapsed = b.elapsedMs + (Date.now()-b.startedAt);
  const display = document.getElementById('timerBigDisplay');
  if(b.timeCapMs>0 && elapsed>=b.timeCapMs){
    b.elapsedMs = b.timeCapMs;
    b.running = false;
    b.capped = true;
    stopTicking();
    beep();
    finishForTime();
    return;
  }
  if(display) display.textContent = fmtClock(elapsed,false);
}
function finishForTime(){
  const b = state.tmp.forTimeBuilder;
  if(b.running){ b.elapsedMs += Date.now()-b.startedAt; b.running=false; }
  stopTicking();
  b.finalElapsedSec = Math.round(b.elapsedMs/1000);
  if(b.roundsLog && b.roundsLog.length){
    b.roundsCompleted = b.roundsLog.filter(round=>round.every(item=>item.done)).length;
  }
  b.phase = 'summary';
  render();
}
function pauseForTimeClock(){
  const b = state.tmp.forTimeBuilder;
  if(b && b.running){
    b.elapsedMs += Date.now()-b.startedAt;
    b.running = false;
    stopTicking();
  }
  render();
}
function resumeForTimeClock(){
  const b = state.tmp.forTimeBuilder;
  b.startedAt = Date.now();
  b.running = true;
  startTicking('live', tickForTime);
  render();
}
function toggleForTimeRoundDone(ri, mi){
  const b = state.tmp.forTimeBuilder;
  const item = b.roundsLog[ri][mi];
  item.done = !item.done;
  if(item.done) item.reps = item.target;
  render();
}
function updateForTimeRoundValue(ri, mi, val){
  const b = state.tmp.forTimeBuilder;
  const item = b.roundsLog[ri][mi];
  item.reps = val;
  item.done = item.target!=='' && val===item.target;
  const cb = document.getElementById(`ftRoundCheck_${ri}_${mi}`);
  if(cb) cb.checked = item.done;
}
function forTimeQtyUnitSuffix(m){
  const ex = state.exercises.find(e=>e.id===m.exerciseId);
  const type = getExerciseType(ex);
  if(type==='cardio') return m.unit==='m' ? distanceUnitLabel() : 'kcal';
  if(type==='mobility') return m.unit==='sec' ? 's' : 'reps';
  return 'reps';
}
function renderForTimeRunning(b){
  const displayMs = b.timeCapMs>0 ? Math.max(0, b.timeCapMs-b.elapsedMs) : b.elapsedMs;
  const checklistHtml = (b.roundsLog||[]).map((round,ri)=>{
    const rowsHtml = round.map((item,mi)=>{
      const m = b.movements[mi];
      const ex = state.exercises.find(e=>e.id===m.exerciseId);
      return `
        <div class="checkbox-row" style="justify-content:space-between;margin-bottom:6px;">
          <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
            <span style="font-size:12px;color:var(--chalk-60);flex:0 0 auto;width:34px;">${forTimeQtyUnitSuffix(m)}</span>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(ex?ex.name:'—')}</span>
          </div>
          <input type="number" step="1" id="ftRoundVal_${ri}_${mi}" value="${item.reps}" oninput="updateForTimeRoundValue(${ri},${mi},this.value)" style="width:64px;flex:0 0 auto;" placeholder="${escapeHtml(item.target)}">
          <input type="checkbox" id="ftRoundCheck_${ri}_${mi}" ${item.done?'checked':''} onchange="toggleForTimeRoundDone(${ri},${mi})" style="flex:0 0 auto;">
        </div>`;
    }).join('');
    return `<div style="margin-bottom:14px;">
      <div class="stat-label" style="margin-bottom:6px;">Runde ${ri+1}${b.roundsLog.length>1?` / ${b.roundsLog.length}`:''}</div>
      ${rowsHtml}
    </div>`;
  }).join('');
  return `
    <div class="card" style="text-align:center;">
      <div class="stat-label">${b.timeCapMs>0?'Verbleibend (Time Cap)':'Zeit läuft'}</div>
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;margin:14px 0;">${fmtClock(displayMs,false)}</div>
      <div style="text-align:left;max-height:360px;overflow-y:auto;margin-bottom:14px;">
        ${checklistHtml}
      </div>
      <div class="row">
        <button class="btn ${b.running?'btn-ghost':'btn-primary'}" onclick="${b.running?'pauseForTimeClock()':'resumeForTimeClock()'}">${b.running?'Pause':'Weiter'}</button>
        <button class="btn btn-primary" onclick="finishForTime()">Fertig</button>
      </div>
    </div>
  `;
}
function renderForTimeSummary(b){
  return `
    <div class="card" style="text-align:center;">
      <h2>Workout abgeschlossen 🏁</h2>
      <div class="stat-num" style="font-size:40px;margin:14px 0;">${fmtClock((b.finalElapsedSec||0)*1000,false)}</div>
      ${b.capped ? `<div class="chip">Time Cap erreicht</div>` : ''}
      <div class="field" style="text-align:left;margin-top:14px;"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Beschreibung, Runden, Zeit-Cap …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
      <label class="checkbox-row"><input type="checkbox" id="forTimeSaveAsBest" checked> Als Bestzeit in Erfolge speichern</label>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="saveForTimeWorkout()">Workout speichern</button>
    </div>
  `;
}
async function saveForTimeWorkout(){
  const b = state.tmp.forTimeBuilder;
  const date = state.tmp.wodDate || todayStr();
  const name = (state.tmp.wodName||'').trim();
  const note = state.tmp.wodNote || '';
  const movements = b.movements.filter(m=>m.exerciseId).map(m=>({exerciseId:m.exerciseId, reps:m.reps||'', unit:m.unit||'reps', weight:m.weight||''}));
  const workout = {
    id: uid(), date, name, note, format:'for-time', movements: [],
    forTime: { movements, rounds: parseInt(b.rounds)||1, repScheme: b.repScheme||'', timeCapSec: b.timeCapMs ? Math.round(b.timeCapMs/1000) : null, elapsedSec: b.finalElapsedSec, capped: !!b.capped, roundsCompleted: b.roundsCompleted||0, roundsLog: b.roundsLog||[] }
  };
  state.workouts.push(workout);
  await saveKey('workouts', state.workouts);
  if(name && document.getElementById('forTimeSaveAsBest')?.checked && b.finalElapsedSec!=null){
    state.timeRecords.push({id:uid(), name, time: fmtClock(b.finalElapsedSec*1000,false), date, note: b.capped?'Time Cap':''});
    await saveKey('timeRecords', state.timeRecords);
  }
  state.tmp.forTimeBuilder = null;
  state.tmp.wodDate = null; state.tmp.wodName = null; state.tmp.wodNote = null;
  showToast('Workout gespeichert 🏋️');
  render();
}

/* ---------- RUN (eigenständiges, GPS-getracktes Format) ---------- */
function renderRunFlow(historyHtml){

  if(g && g.mode==='standalone' && !g.active) return renderRunSummary(g);

      <h2>Neuer Lauf</h2>

      <button class="btn btn-primary" onclick="startGpsRunFromBuild()">📍 GPS-Tracking starten</button>
    </div>
    ${historyHtml}
  `;
}
function startGpsRunFromBuild(){
  state.tmp.wodDate = document.getElementById('wodDate').value || todayStr();
  state.tmp.wodName = document.getElementById('wodName').value.trim();
  startGpsRun('standalone', null);
}
function renderRunSummary(g){
  return `
    <div class="card" style="text-align:center;">
      <h2>Lauf abgeschlossen 🏁</h2>
      <div class="stat-num" style="font-size:40px;margin:14px 0;">${toDisplayDistance(g.distanceM)}${distanceUnitLabel()}</div>
      ${g.error ? `<div class="note" style="color:var(--plate-red);margin-bottom:10px;">${escapeHtml(g.error)}</div>` : ''}
      <div class="row" style="margin-bottom:14px;">
        <div><div class="stat-num" style="font-size:20px;">${fmtClock(g.elapsedMs,false)}</div><div class="stat-label">Zeit</div></div>
        <div><div class="stat-num" style="font-size:20px;">${formatPace(g.distanceM, g.elapsedMs)}</div><div class="stat-label">Ø Pace</div></div>
      </div>
      <div class="field" style="text-align:left;"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Strecke, Wetter, Gefühl …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="saveGpsRun()">Workout speichern</button>
    </div>
  `;
}
async function saveGpsRun(){
  const g = state.tmp.gps;
  const date = state.tmp.wodDate || todayStr();
  const name = (state.tmp.wodName||'').trim();
  const note = state.tmp.wodNote || '';
  const workout = {
    id: uid(), date, name, note, format:'run', movements: [],
    run: { distanceM: Math.round(g.distanceM), elapsedSec: Math.round(g.elapsedMs/1000) }
  };
  state.workouts.push(workout);
  await saveKey('workouts', state.workouts);
  state.tmp.gps = null;
  state.tmp.wodDate = null; state.tmp.wodName = null; state.tmp.wodNote = null;
  showToast('Lauf gespeichert 🏃');
  render();
}

/* ---------- AMRAP ---------- */
function blankAmrapMove(){
  const ex = state.exercises[0];
  return {exerciseId: ex?.id, reps:'', weight:'', unit: getExerciseType(ex)==='cardio' ? 'kcal' : 'reps'};
}
function ensureAmrapBuilder(){
  if(!state.tmp.amrapBuilder){
    state.tmp.amrapBuilder = { phase:'build', movements:[blankAmrapMove()], durationMin:'20', durationSec:'0', startedAt:null, running:false, remainingMs:0, durationMs:0, roundsCompleted:0, extraReps:'', timedOut:false };
  }
}
function renderAmrapFlow(historyHtml){
  ensureAmrapBuilder();
  const b = state.tmp.amrapBuilder;
  if(b.phase==='summary') return renderAmrapSummary(b);
  if(b.phase==='running') return renderAmrapRunning(b);

  const uniqueNames = [...new Set(state.workouts.map(w=>w.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  const headerFields = buildHeaderFields(uniqueNames);
  const moveBlocks = b.movements.map((m,mi)=>{
    const ex = state.exercises.find(e=>e.id===m.exerciseId);
    const type = getExerciseType(ex);
    const isCardio = type==='cardio';
    const isMobility = type==='mobility';
    const qtyLabel = isCardio ? (m.unit==='m' ? `Distanz (${distanceUnitLabel()})` : 'Kalorien')
      : isMobility ? (m.unit==='sec' ? 'Sekunden pro Runde' : 'WH pro Runde')
      : 'WH pro Runde';
    const qtyValue = isCardio && m.unit==='m' ? toDisplayDistance(m.reps) : m.reps;
    const qtyHandler = isCardio ? `updateAmrapMoveQty(${mi},this.value)` : `updateAmrapMove(${mi},'reps',this.value)`;
    const unitToggle = isCardio ? `
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ${m.unit==='kcal'?'btn-primary':'btn-ghost'}" onclick="setAmrapMoveUnit(${mi},'kcal')">Kalorien</button>
        <button type="button" class="btn ${m.unit==='m'?'btn-primary':'btn-ghost'}" onclick="setAmrapMoveUnit(${mi},'m')">${distanceUnitLabel()==='mi'?'Meilen':'Meter'}</button>
      </div>` : isMobility ? `
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ${m.unit!=='sec'?'btn-primary':'btn-ghost'}" onclick="setAmrapMoveUnit(${mi},'reps')">Wiederholungen</button>
        <button type="button" class="btn ${m.unit==='sec'?'btn-primary':'btn-ghost'}" onclick="setAmrapMoveUnit(${mi},'sec')">Sekunden</button>
      </div>` : '';
    const weightField = type==='weighted' ? `
        <div class="field" style="margin-bottom:0;"><label>Gewicht (${weightUnitLabel()})</label><input type="number" step="0.5" value="${toDisplayWeight(m.weight)}" oninput="updateAmrapMoveWeight(${mi},this.value)" placeholder="z.B. 48"></div>` : '';
    const gpsButton = isRunExercise(ex) && m.unit==='m' ? `<div style="text-align:center;"><button type="button" class="btn-sm btn-ghost" onclick="startGpsRun('inline',{flow:'amrap',mi:${mi}})">📍 Lauf starten</button></div>` : '';
    const variantMatch = matchLibraryVariant(ex);
    const variantSelector = variantMatch ? `
      <div class="field"><label>Variante</label>
        <select onchange="updateAmrapMoveVariant(${mi},this.value)">
          ${variantMatch.base.variants.filter(v=>!v.details || !v.details.length || v.id===variantMatch.variant.id)
            .map(v=>`<option value="${v.id}" ${v.id===variantMatch.variant.id?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>` : '';
    return `
    <div class="wod-move-row" data-idx="${mi}">
      <div class="top">
        <select onchange="updateAmrapMove(${mi},'exerciseId',this.value)">
          ${sortedExercises().map(e=>`<option value="${e.id}" ${e.id===m.exerciseId?'selected':''}>${e.name}</option>`).join('')}
        </select>
        <button type="button" class="btn-sm btn-ghost" style="width:auto;flex:0 0 auto;" onclick="openExerciseModal(exId=>updateAmrapMove(${mi},'exerciseId',exId))">➕</button>
        ${b.movements.length>1 ? `<button class="remove-row" onclick="removeAmrapMove(${mi})">✕</button>` : ''}
      </div>
      ${variantSelector}
      ${unitToggle}
      <div class="row">
        <div class="field" style="margin-bottom:0;"><label>${qtyLabel}</label><input type="number" step="1" value="${qtyValue}" oninput="${qtyHandler}" placeholder="z.B. 10"></div>
        ${weightField}
      </div>
      ${gpsButton}
    </div>`;
  }).join('');

  const refNote = state.tmp.wodNameMatch
    ? `<div class="note" style="margin-bottom:10px;">Vorlage aus "${escapeHtml(state.tmp.wodNameMatch.name)}" vom ${fmtDate(state.tmp.wodNameMatch.date)} übernommen — passt gerne an.</div>`
    : '';
  return `
    <div class="card">
      <h2>Neues AMRAP</h2>
      ${headerFields}
      ${refNote}
      ${moveBlocks}
      <button class="add-move-btn" onclick="addAmrapMove()">+ Bewegung hinzufügen</button>
      <div class="row">
        <div class="field"><label>Dauer Min.</label><input type="number" step="1" min="0" value="${b.durationMin}" oninput="updateAmrapField('durationMin',this.value)"></div>
        <div class="field"><label>Dauer Sek.</label><input type="number" step="1" min="0" max="59" value="${b.durationSec}" oninput="updateAmrapField('durationSec',this.value)"></div>
      </div>
      <button class="btn btn-primary" onclick="startAmrapWod()">AMRAP starten</button>
    </div>
    ${historyHtml}
  `;
}
function updateAmrapMove(mi, field, val){
  const b = state.tmp.amrapBuilder;
  b.movements[mi][field] = val;
  if(field==='exerciseId'){
    const ex = state.exercises.find(e=>e.id===val);
    const type = getExerciseType(ex);
    b.movements[mi].unit = isRunExercise(ex) ? 'm' : (type==='cardio' ? 'kcal' : 'reps');
    if(type!=='weighted') b.movements[mi].weight = '';
    render();
  }
}
function updateAmrapMoveVariant(mi, variantId){
  const b = state.tmp.amrapBuilder;
  const ex = state.exercises.find(e=>e.id===b.movements[mi].exerciseId);
  const match = matchLibraryVariant(ex);
  if(!match) return;
  const variant = match.base.variants.find(v=>v.id===variantId);
  if(!variant) return;
  const newId = findOrCreateExerciseId(composeVariantName(match.base, variant, ''), variant.type || match.base.type || 'weighted');
  updateAmrapMove(mi, 'exerciseId', newId);
}
function updateAmrapMoveQty(mi, displayVal){
  const b = state.tmp.amrapBuilder;
  const m = b.movements[mi];
  m.reps = (m.unit==='m' && displayVal!=='') ? String(fromDisplayDistance(displayVal)) : displayVal;
}
function updateAmrapMoveWeight(mi, displayVal){
  const b = state.tmp.amrapBuilder;
  b.movements[mi].weight = displayVal==='' ? '' : String(fromDisplayWeight(displayVal));
}
function setAmrapMoveUnit(mi, unit){
  state.tmp.amrapBuilder.movements[mi].unit = unit;
  render();
}
function addAmrapMove(){
  state.tmp.amrapBuilder.movements.push(blankAmrapMove());
  render();
}
function removeAmrapMove(mi){
  const b = state.tmp.amrapBuilder;
  b.movements.splice(mi,1);
  if(!b.movements.length) b.movements.push(blankAmrapMove());
  render();
}
function updateAmrapField(field, val){
  state.tmp.amrapBuilder[field] = val;
}
function startAmrapWod(){
  const b = state.tmp.amrapBuilder;
  state.tmp.wodDate = document.getElementById('wodDate').value || todayStr();
  state.tmp.wodName = document.getElementById('wodName').value.trim();
  if(!b.movements.length){ showToast('Bitte mindestens eine Übung hinzufügen'); return; }
  b.durationMs = (parseInt(b.durationMin)||0)*60000 + (parseInt(b.durationSec)||0)*1000;
  if(b.durationMs<=0){ showToast('Bitte eine Dauer eingeben'); return; }
  b.remainingMs = b.durationMs;
  b.roundsCompleted = 0;
  b.timedOut = false;
  b.startedAt = Date.now();
  b.running = true;
  b.phase = 'running';
  startTicking('live', tickAmrap);
  render();
}
function tickAmrap(){
  const b = state.tmp.amrapBuilder;
  if(!b || b.phase!=='running'){ stopTicking(); return; }
  const remaining = b.remainingMs - (Date.now()-b.startedAt);
  const display = document.getElementById('timerBigDisplay');
  if(remaining<=0){
    b.remainingMs = 0;
    b.running = false;
    b.timedOut = true;
    stopTicking();
    beep();
    render();
    return;
  }
  if(display) display.textContent = fmtClock(remaining,false);
}
function incrementAmrapRound(delta){
  const b = state.tmp.amrapBuilder;
  b.roundsCompleted = Math.max(0, b.roundsCompleted + delta);
  render();
}
function finishAmrap(){
  const b = state.tmp.amrapBuilder;
  if(b.running){ b.remainingMs = Math.max(0, b.remainingMs - (Date.now()-b.startedAt)); b.running=false; }
  stopTicking();
  b.timedOut = true;
  render();
}
function pauseAmrapClock(){
  const b = state.tmp.amrapBuilder;
  if(b && b.running){
    b.remainingMs = Math.max(0, b.remainingMs - (Date.now()-b.startedAt));
    b.running = false;
    stopTicking();
  }
  render();
}
function resumeAmrapClock(){
  const b = state.tmp.amrapBuilder;
  b.startedAt = Date.now();
  b.running = true;
  startTicking('live', tickAmrap);
  render();
}
function confirmAmrapExtraReps(){
  const b = state.tmp.amrapBuilder;
  b.extraReps = document.getElementById('amrapExtraReps').value || '0';
  b.phase = 'summary';
  render();
}
function renderAmrapRunning(b){
  if(b.timedOut){
    return `
      <div class="card" style="text-align:center;">
        <div class="stat-label">Zeit abgelaufen</div>
        <div class="stat-num accent" style="margin:10px 0;">${b.roundsCompleted} Runden</div>
        <div class="field" style="text-align:left;"><label>Weitere Wiederholungen in der laufenden Runde</label><input type="number" step="1" min="0" id="amrapExtraReps" value="${b.extraReps}" placeholder="z.B. 12"></div>
        <button class="btn btn-primary" onclick="confirmAmrapExtraReps()">Weiter</button>
      </div>
    `;
  }
  return `
    <div class="card" style="text-align:center;">
      <div class="stat-label">Verbleibend</div>
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;margin:10px 0;">${fmtClock(b.remainingMs,false)}</div>
      <div class="moves" style="text-align:left;margin-bottom:14px;">
        ${b.movements.map(m=>`<div>${escapeHtml(formatMovementLine(m))}</div>`).join('')}
      </div>
      <div class="stat-num" style="margin:10px 0;">${b.roundsCompleted}<span style="font-size:16px;"> Runden</span></div>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn btn-ghost" onclick="incrementAmrapRound(-1)">-1 Runde</button>
        <button class="btn btn-primary" onclick="incrementAmrapRound(1)">+1 Runde</button>
      </div>
      <div class="row">
        <button class="btn ${b.running?'btn-ghost':'btn-primary'}" onclick="${b.running?'pauseAmrapClock()':'resumeAmrapClock()'}">${b.running?'Pause':'Weiter'}</button>
        <button class="btn btn-primary" onclick="finishAmrap()">Fertig</button>
      </div>
    </div>
  `;
}
function renderAmrapSummary(b){
  return `
    <div class="card" style="text-align:center;">
      <h2>Workout abgeschlossen 🏁</h2>
      <div class="stat-num" style="font-size:34px;margin:14px 0;">${b.roundsCompleted} Runden${parseInt(b.extraReps)?' + '+b.extraReps+' Wdh.':''}</div>
      <div class="field" style="text-align:left;"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Beschreibung, Runden, Zeit-Cap …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="saveAmrapWorkout()">Workout speichern</button>
    </div>
  `;
}
async function saveAmrapWorkout(){
  const b = state.tmp.amrapBuilder;
  const date = state.tmp.wodDate || todayStr();
  const name = (state.tmp.wodName||'').trim();
  const note = state.tmp.wodNote || '';
  const movements = b.movements.filter(m=>m.exerciseId).map(m=>({exerciseId:m.exerciseId, reps:m.reps||'', unit:m.unit||'reps', weight:m.weight||''}));
  const workout = {
    id: uid(), date, name, note, format:'amrap', movements: [],
    amrap: { movements, durationSec: Math.round(b.durationMs/1000), roundsCompleted: b.roundsCompleted, extraReps: parseInt(b.extraReps)||0 }
  };
  state.workouts.push(workout);
  await saveKey('workouts', state.workouts);
  state.tmp.amrapBuilder = null;
  state.tmp.wodDate = null; state.tmp.wodName = null; state.tmp.wodNote = null;
  showToast('Workout gespeichert 🏋️');
  render();
}

/* ---------- FOR LOAD ---------- */

function setForLoadUnit(unit){

function updateForLoadQty(val){

}
function updateForLoadFieldVariant(variantId){

  const ex = state.exercises.find(e=>e.id===b.exerciseId);

  if(!match) return;

function startForLoadWod(){

function updateForLoadWeight(val){

function finishForLoad(){

function renderForLoadSummary(b){

  }
  if(isCardio){
    const qty = b.unit==='m' ? `${toDisplayDistance(b.achievedWeight)}${distanceUnitLabel()}` : `${b.achievedWeight||0} kcal`;
    return `
      <div class="card" style="text-align:center;">
        <h2>Workout abgeschlossen 🏁</h2>
        <div class="stat-num" style="font-size:34px;margin:14px 0;">${qty}</div>
        <div class="field" style="text-align:left;margin-top:14px;"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Beschreibung, Runden, Zeit-Cap …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
        <button class="btn btn-primary" style="margin-top:10px;" onclick="saveForLoadWorkout()">Workout speichern</button>
      </div>
    `;
  }
  const weight = parseFloat(b.achievedWeight)||0;
  const reps = parseInt(b.targetReps)||1;
  const est = weight ? estimate1RM(weight, reps) : 0;
  return `
    <div class="card" style="text-align:center;">
      <h2>Workout abgeschlossen 🏁</h2>
      <div class="stat-num" style="font-size:34px;margin:14px 0;">${fmtWeight(weight)} <span style="font-size:16px;">@ ${reps} Wdh.</span></div>
      ${weight ? `<div class="note">geschätztes 1RM: ${fmtWeight(est)}</div>` : ''}
      <div class="field" style="text-align:left;margin-top:14px;"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Beschreibung, Runden, Zeit-Cap …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
      <label class="checkbox-row"><input type="checkbox" id="forLoadSaveAsPr" ${weight?'checked':''}> Als 1RM-Rekord in Erfolge übernehmen</label>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="saveForLoadWorkout()">Workout speichern</button>
    </div>
  `;
}

function updateTemplateFieldVariant(mi, variantId){

function onWodNameChange(val){

  const match = findWorkoutByName(val, fmt);

      state.tmp.wodTemplate = match.movements.map((m,mi)=>{

          repsTarget: m.repsTarget || '',
          groupWithNext: !!(m.groupId!=null && next && next.groupId===m.groupId)
        };
      });

      const ft = match.forTime;

      state.tmp.amrapBuilder.durationMin = String(Math.floor((am.durationSec||1200)/60));
      state.tmp.amrapBuilder.durationSec = String((am.durationSec||1200)%60);

        state.tmp.forLoadBuilder.timeCapMin = String(Math.floor(fl.timeCapSec/60));
        state.tmp.forLoadBuilder.timeCapSec = String(fl.timeCapSec%60);
      }
