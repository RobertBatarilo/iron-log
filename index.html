async function saveAmrapWorkout(){
  const b = state.tmp.amrapBuilder;
  const date = state.tmp.wodDate || todayStr();
  const name = (state.tmp.wodName||'').trim();
  const note = state.tmp.wodNote || '';
  const movements = b.movements.filter(m=>m.exerciseId).map(m=>({exerciseId:m.exerciseId, reps:m.reps||'', unit:m.unit||'reps', weight:m.weight||''}));
  const prMovements = buildPrMovementsFromFlat(movements);
  const durationSec = Math.round(b.durationMs/1000);
  const setsCount = parseInt(b.setsCount)||1;
  let roundsCompleted, extraReps, multiSetFields = {};
  if(setsCount>1 && b.setsLog.length){
    roundsCompleted = b.setsLog.reduce((s,x)=>s+x.roundsCompleted,0);
    extraReps = b.setsLog.reduce((s,x)=>s+x.extraReps,0);
    multiSetFields = { setsCount, restSec:(parseInt(b.restMin)||0)*60+(parseInt(b.restSec)||0), sets: b.setsLog };
  } else {
    roundsCompleted = b.roundsCompleted;
    extraReps = parseInt(b.extraReps)||0;
  }
  const workout = {
    id: uid(), date, name, note, format:'amrap', movements: prMovements,
    amrap: { movements, durationSec, roundsCompleted, extraReps, ...multiSetFields }
  };
  const isNewRoundsPR = !!(name && (()=>{
    const priorAmraps = state.workouts.filter(w=>w.format==='amrap' && (w.name||'').toLowerCase()===name.toLowerCase() && w.amrap?.durationSec===durationSec && (parseInt(w.amrap?.setsCount)||1)===setsCount);
    if(!priorAmraps.length) return false;
    return priorAmraps.every(a=>roundsCompleted>a.amrap.roundsCompleted || (roundsCompleted===a.amrap.roundsCompleted && extraReps>a.amrap.extraReps));
  })());
  showPRToastIfAny(prMovements);
  state.workouts.push(workout);
  await saveKey('workouts', state.workouts);
  if(state.tmp.loadedDraftId){
    state.drafts = state.drafts.filter(d=>d.id!==state.tmp.loadedDraftId);
    await saveKey('drafts', state.drafts);
  }
  state.tmp.amrapBuilder = null;
  state.tmp.wodDate = null; state.tmp.wodName = null; state.tmp.wodNote = null; state.tmp.loadedDraftId = null;
  showToast(generateWorkoutAutoSummary(workout) || (isNewRoundsPR ? `🏆 Neue Bestleistung bei "${name}"!` : 'Workout gespeichert 🏋️'));
  render();
}

function generateWodRows(){
  state.tmp.wodDate = document.getElementById('wodDate').value || todayStr();
  state.tmp.wodName = document.getElementById('wodName').value.trim();
  const isEmom = state.tmp.wodFormat==='emom';
  const tmpl = state.tmp.wodTemplate;

  const effectiveSetsCount = tmpl.map((t,ti)=>{
    const isFollower = ti>0 && tmpl[ti-1].groupWithNext;
    if(isFollower) return null;
    const ex = state.exercises.find(e=>e.id===t.exerciseId);
    const type = getExerciseType(ex);
    const isCardio = type==='cardio' || type==='mobility';
    const pctArr = parsePctList(t.pctList);
    let setsCount = parseInt(t.setsCount) || (isCardio ? 1 : Math.max(pctArr.length,1));
    if(isEmom && !t.setsCount){
      setsCount = parseInt(state.tmp.emomAlternateCycles) || parseInt(state.tmp.emomRounds) || setsCount;
    }
    return setsCount;
  });
  for(let ti=1; ti<tmpl.length; ti++){
    if(effectiveSetsCount[ti]==null) effectiveSetsCount[ti] = effectiveSetsCount[ti-1];
  }

  const groupIdArr = new Array(tmpl.length).fill(null);
  let gStart = 0;
  for(let ti=0; ti<tmpl.length; ti++){
    if(ti===tmpl.length-1 || !tmpl[ti].groupWithNext){
      if(ti>gStart){
        const gid = 'g'+gStart;
        for(let k=gStart;k<=ti;k++) groupIdArr[k]=gid;
      }
      gStart = ti+1;
    }
  }

  state.tmp.wodMoves = tmpl.map((t,ti)=>{
    const ex = state.exercises.find(e=>e.id===t.exerciseId);
    const type = getExerciseType(ex);
    const isCardio = type==='cardio' || type==='mobility';
    const isDistanceWeighted = type==='weighted' && t.unit==='m';
    const pctArr = parsePctList(t.pctList);
    const repsArr = parseRepScheme(t.repsTarget);
    const setsCount = effectiveSetsCount[ti];
    const known1rm = bestE1RM(t.exerciseId);
    const sets = [];
    for(let si=0; si<setsCount; si++){
      if(isCardio){
        sets.push({reps: t.qty || '', weight:'', pct:null, autoFilled: !!t.qty});
      } else if(isDistanceWeighted){
        sets.push({reps: t.qty || '', weight: t.weight||'', pct:null, autoFilled: !!t.weight});
      } else {
        const pct = pctForIndex(pctArr, si);
        const reps = repsArr.length>1 ? String(pctForIndex(repsArr, si)) : (t.repsTarget || '');
        let weight='', autoFilled=false;
        if(pct && known1rm){
          weight = roundToIncrement(known1rm*pct/100);
          autoFilled = true;
        } else if(t.weight){
          weight = t.weight;
          autoFilled = true;
        }
        sets.push({reps, weight, pct: pct||null, autoFilled});
      }
    }
    const timing = isEmom ? `Every ${state.tmp.emomMin}:${String(state.tmp.emomSec).padStart(2,'0')}` : t.timing;
    return { exerciseId:t.exerciseId, timing, pctList: isCardio ? '' : t.pctList, setsCountRaw:t.setsCount, unit: (isCardio || isDistanceWeighted) ? t.unit : null, repsTarget: t.repsTarget||'', groupId: groupIdArr[ti], sets };
  });
  state.tmp.wodPhase = 'rows';
  applyFeelingFillIfNeeded();
  render();
  window.scrollTo(0,0);
}

function applyFeelingFillIfNeeded(){
  if(!state.tmp.wodNameMatch || !state.tmp.wodFeeling) return;
  state.tmp.wodMoves.forEach((mv,mi)=>{
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    const type = getExerciseType(ex);
    if(type==='cardio' || type==='mobility') return;
    const prevMv = state.tmp.wodNameMatch.movements[mi];

    mv.sets.forEach((s,si)=>{

          s.weight = roundToIncrement(prevSet.weight * FEELING_ADJUST[state.tmp.wodFeeling]);
          s.autoFilled = true;

    });

async function saveWod(liveFlat){

      ? mv.sets.filter(s=>s.reps).map(s=>({ reps: parseFloat(s.reps), weight: null, pct: null }))
      : isWeighted
        ? mv.sets.filter(s=>s.reps && s.weight).map(s=>({ reps: parseInt(s.reps), weight: parseFloat(s.weight), pct: s.pct || null }))
        : mv.sets.filter(s=>s.reps).map(s=>({ reps: parseInt(s.reps), weight: null, pct: null }));
    return { exerciseId: mv.exerciseId, timing: mv.timing || '', unit: isQtyBased ? mv.unit : null, repsTarget: mv.repsTarget || '', groupId: mv.groupId ?? null, sets };
  }).filter(mv=>mv.sets.length>0);
  if(!movements.length){ showToast('Bitte mindestens einen Satz mit gültigen Werten eingeben'); return; }
  showPRToastIfAny(movements);
  const roundsLog = (state.tmp.wodFormat==='emom' && liveFlat && liveFlat.length)
    ? liveFlat.map(group => group.map(({mi,si})=>{
        const mv = state.tmp.wodMoves[mi];
        return { exerciseId: mv.exerciseId, reps: mv.sets[si].reps, weight: mv.sets[si].weight };
      }).filter(e=>e.reps!=='' && e.reps!=null)).filter(round=>round.length>0)
    : null;
  state.workouts.push({id:uid(), date, name, note, format: state.tmp.wodFormat, movements, roundsLog});
  await saveKey('workouts', state.workouts);
  if(state.tmp.loadedDraftId){
    state.drafts = state.drafts.filter(d=>d.id!==state.tmp.loadedDraftId);
    await saveKey('drafts', state.drafts);
  }
  state.tmp.wodTemplate = null;
  state.tmp.wodMoves = null;
  state.tmp.wodPhase = 'template';
  state.tmp.wodDate = null;
  state.tmp.wodName = null;
  state.tmp.wodNameMatch = null;
  state.tmp.wodFeeling = null;
  state.tmp.wodNote = null;
  state.tmp.loadedDraftId = null;
  showToast('Workout gespeichert 🏋️');
  render();
}

/* ---------- SHARED TICK ENGINE (used by Timer tab & Live-Workout rest pause) ---------- */
let tickHandle = null;
let activeTicker = null; // 'timer' | 'live' | null
function startTicking(owner, onTick){
  stopTicking();
  activeTicker = owner;
  tickHandle = setInterval(onTick, 100);
  onTick();
}
function stopTicking(){
  if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  activeTicker = null;
}
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.35);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(200);
}
function fmtClock(ms, withTenths){
  ms = Math.max(0, ms);
  const totalSec = ms/1000;
  const m = Math.floor(totalSec/60);
  const s = Math.floor(totalSec%60);
  const base = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(withTenths){
    const t = Math.floor((ms%1000)/100);
    return `${base}.${t}`;
  }
  return base;
}

/* ---------- GPS-Lauferfassung (Standalone-Format "Run" + Inline-Button bei Run/Lauf-Bewegungen) ---------- */
function haversineMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function formatPace(distanceM, elapsedMs){
  if(distanceM<50 || elapsedMs<=0) return '–:--';
  const paceUnitM = distanceUnitLabel()==='mi' ? M_PER_MILE : 1000;
  const units = distanceM / paceUnitM;
  const secPerUnit = (elapsedMs/1000) / units;
  const m = Math.floor(secPerUnit/60);
  const s = Math.round(secPerUnit%60);
  return `${m}:${String(s).padStart(2,'0')}/${distanceUnitLabel()==='mi'?'mi':'km'}`;
}
function startGpsRun(mode, inlineTarget){
  if(!navigator.geolocation){ showToast('GPS wird von diesem Browser nicht unterstützt'); return; }
  state.tmp.gps = {
    mode, inlineTarget: inlineTarget||null,
    watchId: null, active: true, distanceM: 0, lastFix: null,
    startedAt: Date.now(), elapsedMs: 0, running: true, error: null
  };
  state.tmp.gps.watchId = navigator.geolocation.watchPosition(onGpsFix, onGpsError, {enableHighAccuracy:true, maximumAge:0, timeout:15000});
  startTicking('live', tickGpsRun);
  render();
}
function onGpsFix(pos){
  const g = state.tmp.gps;
  if(!g || !g.active) return;
  const {latitude, longitude, accuracy} = pos.coords;
  if(accuracy!=null && accuracy>30) return; // zu ungenauer Fix, verwerfen
  if(g.lastFix){
    const dt = (pos.timestamp - g.lastFix.t)/1000;
    const segment = haversineMeters(g.lastFix.lat, g.lastFix.lon, latitude, longitude);
    const speed = dt>0 ? segment/dt : 0;
    if(segment>=2 && speed<12){ // Rauschen (zu klein) und GPS-Sprünge (>43km/h) filtern
      g.distanceM += segment;
    }
  }
  g.lastFix = {lat:latitude, lon:longitude, t:pos.timestamp};
  const distEl = document.getElementById('gpsDistanceDisplay');
  if(distEl) distEl.textContent = `${toDisplayDistance(g.distanceM)}${distanceUnitLabel()}`;
  const paceEl = document.getElementById('gpsPaceDisplay');
  if(paceEl) paceEl.textContent = formatPace(g.distanceM, Date.now()-g.startedAt+g.elapsedMs);
}
function onGpsError(err){
  const g = state.tmp.gps;
  if(!g) return;
  const messages = {1:'Standortzugriff verweigert.', 2:'Kein GPS-Signal gefunden.', 3:'Zeitüberschreitung beim Standortabruf.'};
  g.error = messages[err.code] || 'GPS-Fehler.';
  g.active = false;
  g.running = false;
  stopTicking();
  render();
}
function tickGpsRun(){
  const g = state.tmp.gps;
  if(!g || !g.running){ stopTicking(); return; }
  const elapsed = g.elapsedMs + (Date.now()-g.startedAt);
  const el = document.getElementById('gpsTimeDisplay');
  if(el) el.textContent = fmtClock(elapsed,false);
}
function pauseGpsRun(){
  const g = state.tmp.gps;
  if(g && g.running){
    g.elapsedMs += Date.now()-g.startedAt;
    g.running = false;
    stopTicking();
  }
  render();
}
function resumeGpsRun(){
  const g = state.tmp.gps;
  if(!g) return;
  g.startedAt = Date.now();
  g.running = true;
  startTicking('live', tickGpsRun);
  render();
}
function stopGpsRun(){
  const g = state.tmp.gps;
  if(!g) return;
  if(g.watchId!=null) navigator.geolocation.clearWatch(g.watchId);
  stopTicking();
  if(g.running){ g.elapsedMs += Date.now()-g.startedAt; g.running = false; }
  g.active = false;
  if(g.mode==='inline' && g.inlineTarget){
    if(g.inlineTarget.flow==='wod'){
      const mv = state.tmp.wodMoves && state.tmp.wodMoves[g.inlineTarget.mi];
      const s = mv && mv.sets[g.inlineTarget.si];
      if(s){ s.reps = String(Math.round(g.distanceM)); s.autoFilled = false; }
      if(mv) mv.unit = 'm';
    } else if(g.inlineTarget.flow==='for-load'){
      const b = state.tmp.forLoadBuilder;
      if(b){ b.achievedWeight = String(Math.round(g.distanceM)); b.unit = 'm'; }
    } else {
      const builder = g.inlineTarget.flow==='amrap' ? state.tmp.amrapBuilder : state.tmp.forTimeBuilder;
      if(builder && builder.movements[g.inlineTarget.mi]){
        builder.movements[g.inlineTarget.mi].reps = String(Math.round(g.distanceM));
        builder.movements[g.inlineTarget.mi].unit = 'm';
      }
    }
    state.tmp.gps = null;
  }
  render();
}
function renderGpsLiveView(){
  const g = state.tmp.gps;
  const minimal = g.mode==='inline';
  return `
    <div class="card" style="text-align:center;">
      <div class="stat-label">${minimal ? 'Lauf wird getrackt' : 'GPS-Tracking läuft'}</div>
      <div id="gpsDistanceDisplay" class="stat-num" style="font-size:48px;margin:14px 0;">${toDisplayDistance(g.distanceM)}${distanceUnitLabel()}</div>
      ${minimal ? '' : `
      <div class="row" style="margin-bottom:14px;">
        <div><div id="gpsTimeDisplay" class="stat-num" style="font-size:22px;">${fmtClock(g.elapsedMs,false)}</div><div class="stat-label">Zeit</div></div>
        <div><div id="gpsPaceDisplay" class="stat-num" style="font-size:22px;">${formatPace(g.distanceM, g.elapsedMs)}</div><div class="stat-label">Pace</div></div>
      </div>`}
      ${g.error ? `<div class="note" style="color:var(--plate-red);margin-bottom:10px;">${escapeHtml(g.error)}</div>` : ''}
      <div class="row">
        <button class="btn ${g.running?'btn-ghost':'btn-primary'}" onclick="${g.running?'pauseGpsRun()':'resumeGpsRun()'}">${g.running?'Pause':'Weiter'}</button>
        <button class="btn btn-primary" onclick="stopGpsRun()">Stopp</button>
      </div>
    </div>
  `;
}

function pauseActiveTimer(){

/* Stoppuhr */
function startStopwatch(){
  const t = state.tmp.timer;

  t.swStartedAt = Date.now();

function tickStopwatch(){

  const currentElapsed = t.swElapsed + (Date.now()-t.swStartedAt);

function pauseStopwatch(){

function resetStopwatch(){

}
function lapStopwatch(){

/* Countdown */
function updateCountdownInput(field, val){ state.tmp.timer[field] = val; }
function startCountdown(){
  const t = state.tmp.timer;
  if(t.cdRemaining<=0){
    t.cdTotal = (parseInt(t.cdMin)||0)*60000 + (parseInt(t.cdSec)||0)*1000;
    if(t.cdTotal<=0){ showToast('Bitte eine Dauer eingeben'); return; }
    t.cdRemaining = t.cdTotal;
  }
  t.cdRunning = true;
  t.cdStartedAt = Date.now();
  startTicking('timer', tickCountdown);
  render();
}
function tickCountdown(){
  const t = state.tmp.timer;
  const remaining = t.cdRemaining - (Date.now()-t.cdStartedAt);
  const display = document.getElementById('timerBigDisplay');
  if(remaining<=0){
    if(display) display.textContent = fmtClock(0,false);
    t.cdRemaining = 0; t.cdRunning = false;
    stopTicking();
    beep();
    showToast('Countdown beendet ⏰');
    render();
    return;
  }
  if(display) display.textContent = fmtClock(remaining,false);
}
function pauseCountdown(){
  const t = state.tmp.timer;
  if(t.cdRunning){ t.cdRemaining = Math.max(0, t.cdRemaining - (Date.now()-t.cdStartedAt)); }
  t.cdRunning = false;
  stopTicking();
  render();
}
function resetCountdown(){
  const t = state.tmp.timer;
  stopTicking();
  t.cdRunning = false; t.cdRemaining = 0; t.cdTotal = 0; t.cdStartedAt = null;
  render();
}
/* Intervalltimer */
function updateIntervalInput(field, val){ state.tmp.timer[field] = val; }
function startInterval(){
  const t = state.tmp.timer;
  if(t.ivRemaining<=0 || t.ivPhase==='done'){
    t.ivWorkSec = parseInt(t.ivWorkSec)||20;
    t.ivRestSec = parseInt(t.ivRestSec)||0;
    t.ivRounds = parseInt(t.ivRounds)||1;
    t.ivRound = 1;
    t.ivPhase = 'work';
    t.ivRemaining = t.ivWorkSec*1000;
  }
  t.ivRunning = true;
  t.ivStartedAt = Date.now();
  startTicking('timer', tickInterval);
  render();
}
function advanceIntervalRound(t){
  if(t.ivRound >= t.ivRounds){
    t.ivPhase = 'done';
  } else {
    t.ivRound += 1;
    t.ivPhase = 'work';
    t.ivRemaining = t.ivWorkSec*1000;
    t.ivStartedAt = Date.now();
  }
}
function tickInterval(){
  const t = state.tmp.timer;
  const remaining = t.ivRemaining - (Date.now()-t.ivStartedAt);
  const display = document.getElementById('timerBigDisplay');
  if(remaining>0){
    if(display) display.textContent = fmtClock(remaining,false);
    return;
  }
  beep();
  if(t.ivPhase==='work' && t.ivRestSec>0){
    t.ivPhase = 'rest';
    t.ivRemaining = t.ivRestSec*1000;
    t.ivStartedAt = Date.now();
  } else {
    advanceIntervalRound(t);
  }
  if(t.ivPhase==='done'){
    t.ivRunning = false;
    stopTicking();
    showToast('Intervall-Timer fertig 🔥');
  }
  render();
}
function pauseInterval(){
  const t = state.tmp.timer;
  if(t.ivRunning){ t.ivRemaining = Math.max(0, t.ivRemaining - (Date.now()-t.ivStartedAt)); }
  t.ivRunning = false;
  stopTicking();
  render();
}
function resetInterval(){
  const t = state.tmp.timer;
  stopTicking();
  t.ivRunning = false; t.ivRound = 1; t.ivPhase = 'work'; t.ivRemaining = 0; t.ivStartedAt = null;
  render();
}
function renderTimer(){
  const t = state.tmp.timer;
  const modeBtn = (m,label)=>`<button class="btn btn-sm ${t.mode===m?'btn-primary':'btn-ghost'}" style="flex:1;" onclick="switchTimerMode('${m}')">${label}</button>`;
  let body = '';
  if(t.mode==='stopwatch') body = renderStopwatchUI(t);
  if(t.mode==='countdown') body = renderCountdownUI(t);

  return `
    <div class="card">
      <h2>Timer</h2>
      <div class="row" style="margin-bottom:16px;">
        ${modeBtn('countdown','Countdown')}
        ${modeBtn('interval','Intervall')}

      </div>
      ${body}

  `;
}

      }

}
function renderCountdownUI(t){
  const running = t.cdRunning;
  const configuring = !running && t.cdRemaining<=0;
  const displayMs = t.cdRemaining>0 ? t.cdRemaining : ((parseInt(t.cdMin)||0)*60000 + (parseInt(t.cdSec)||0)*1000);
  return `

    <div style="text-align:center;padding:20px 0;">
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;">${fmtClock(displayMs,false)}</div>
    </div>
    <div class="row">
      ${running
        ? `<button class="btn btn-ghost" onclick="pauseCountdown()">Pause</button>`
        : `<button class="btn btn-primary" onclick="startCountdown()">${t.cdRemaining>0?'Weiter':'Start'}</button>`
      }
      <button class="btn btn-ghost" onclick="resetCountdown()">Reset</button>

function renderIntervalUI(t){
  const running = t.ivRunning;
  const configuring = !running && t.ivPhase!=='done' && t.ivRemaining<=0;

  return `

    <div class="row">

async function savePrEntry(){
  const exId = document.getElementById('prExercise').value;
  const value = parseFloat(document.getElementById('prValue').value);
  const date = document.getElementById('prDate').value || todayStr();
  if(!value){ showToast('Bitte ein Gewicht eingeben'); return; }
  if(state.tmp.editingPrId){
    const entry = state.prEntries.find(p=>p.id===state.tmp.editingPrId);
    if(entry){ entry.exerciseId=exId; entry.value=value; entry.date=date; }
    state.tmp.editingPrId = null;
  } else {
    state.prEntries.push({id:uid(), exerciseId:exId, value, date});
  }
  state.tmp.prExerciseSelection = null;
  await saveKey('prEntries', state.prEntries);
  showToast('1RM gespeichert 🏆');
  render();
}

function updatePrExerciseVariant(variantId){
  const currentId = state.tmp.editingPrId
    ? state.prEntries.find(p=>p.id===state.tmp.editingPrId)?.exerciseId
    : (state.tmp.prExerciseSelection || (state.exercises[0] && state.exercises[0].id));
  const ex = state.exercises.find(e=>e.id===currentId);
  const match = matchLibraryVariant(ex);
  if(!match) return;
  const variant = match.base.variants.find(v=>v.id===variantId);
  if(!variant) return;
  const newId = findOrCreateExerciseId(composeVariantName(match.base, variant, ''), variant.type || match.base.type || 'weighted');
  state.tmp.prExerciseSelection = newId;
  render();
}

async function saveEditWorkout(){
  const w = state.workouts.find(x=>x.id===state.tmp.editingWorkoutId);
  if(!w) return;
  const format = w.format || 'strength';
  if(format==='for-time'){
    const ft = w.forTime;
    const sec = parseClockToSec(document.getElementById('edit_ft_time').value);
    if(sec!=null) ft.elapsedSec = sec;
    ft.capped = !!document.getElementById('edit_ft_capped').checked;
    const roundsEl = document.getElementById('edit_ft_rounds');
    if(roundsEl) ft.roundsCompleted = parseInt(roundsEl.value)||0;
    (ft.movements||[]).forEach((m,i)=>{
      const el = document.getElementById(`edit_ft_weight_${i}`);
      if(el) m.weight = fromDisplayWeight(el.value);
    });
  } else if(format==='amrap'){
    const am = w.amrap;
    if(am.sets && am.sets.length){
      am.sets.forEach((s,i)=>{
        s.roundsCompleted = parseInt(document.getElementById(`edit_am_set_rounds_${i}`).value)||0;
        s.extraReps = parseInt(document.getElementById(`edit_am_set_extra_${i}`).value)||0;
      });
      am.roundsCompleted = am.sets.reduce((sum,s)=>sum+s.roundsCompleted,0);
      am.extraReps = am.sets.reduce((sum,s)=>sum+s.extraReps,0);
    } else {
      am.roundsCompleted = parseInt(document.getElementById('edit_am_rounds').value)||0;
      am.extraReps = parseInt(document.getElementById('edit_am_extra').value)||0;
    }
    (am.movements||[]).forEach((m,i)=>{
      const el = document.getElementById(`edit_am_weight_${i}`);
      if(el) m.weight = fromDisplayWeight(el.value);
    });
  } else if(format==='for-load'){
    const fl = w.forLoad;
    if(fl.unit){
      const val = parseFloat(document.getElementById('edit_fl_qty').value)||0;
      fl.achievedWeight = fl.unit==='m' ? fromDisplayDistance(val) : val;
    } else {
      fl.achievedWeight = fromDisplayWeight(document.getElementById('edit_fl_weight').value);
      fl.targetReps = parseInt(document.getElementById('edit_fl_reps').value)||fl.targetReps;
    }
  } else if(format==='run'){
    const r = w.run;
    r.distanceM = fromDisplayDistance(document.getElementById('edit_run_distance').value);
    const sec = parseClockToSec(document.getElementById('edit_run_time').value);
    if(sec!=null) r.elapsedSec = sec;
  } else {
    (w.movements||[]).forEach((m,mi)=>{
      const ex = state.exercises.find(e=>e.id===m.exerciseId);
      const isQty = getExerciseType(ex)==='cardio' || getExerciseType(ex)==='mobility';
      (m.sets||[]).forEach((s,si)=>{
        const repsEl = document.getElementById(`edit_st_reps_${mi}_${si}`);
        if(repsEl){
          const v = parseFloat(repsEl.value)||0;
          s.reps = (isQty && m.unit==='m') ? fromDisplayDistance(v) : v;
        }
        if(!isQty){
          const wEl = document.getElementById(`edit_st_weight_${mi}_${si}`);
          if(wEl) s.weight = fromDisplayWeight(wEl.value);
        }
      });
    });
  }
  w.note = document.getElementById('editWorkoutNote').value;
  state.tmp.editingWorkoutId = null;
  await saveKey('workouts', state.workouts);
  showToast('Workout aktualisiert');
  render();
}

function mountNutritionChart(){
  const canvas = document.getElementById('kcalChart');
  if(!canvas || typeof Chart==='undefined') return;
  const days = [];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const totals = days.map(d=> state.nutritionLogs.filter(n=>n.date===d).reduce((s,n)=>s+(n.kcal||0),0));
  if(charts.kcal) charts.kcal.destroy();
  charts.kcal = new Chart(canvas, {
    type:'bar',

  const idx = sorted.findIndex(x=>x.id===m.id);
  for(let i=idx-1; i>=0; i--){

}

function updateAiPlanForm(field, val){
  if(!state.tmp.aiPlanForm){
    const plan = state.trainingPlan;
    state.tmp.aiPlanForm = plan
      ? {status:plan.status, location:plan.location, frequency:plan.frequency, goal: plan.goal||'ausgewogen', focus: plan.focus||'fortsetzen'}
      : {status:'anfaenger', location:'box', frequency:3, goal:'ausgewogen', focus:'fortsetzen'};
  }
  state.tmp.aiPlanForm[field] = val;
}
function normalizeAiWodDay(wod){
  return {
    name: String(wod?.name || 'KI-WOD').slice(0,80),
    format: wod?.format==='amrap' ? 'amrap' : 'for-time',
    movements: Array.isArray(wod?.movements) ? wod.movements.filter(m=>m && m.name).map(m=>({name:String(m.name).slice(0,60), reps: m.reps!=null ? parseInt(m.reps)||undefined : undefined})) : [],
    rounds: parseInt(wod?.rounds)||1,
    repScheme: String(wod?.repScheme||''),
    durationSec: parseInt(wod?.durationSec)||1200
  };
}
function normalizeAiStrengthDay(prog){
  return {
    name: String(prog?.name || 'KI-Kraft').slice(0,80),
    exerciseName: String(prog?.exerciseName || '').slice(0,60),
    setsCount: parseInt(prog?.setsCount)||5,
    pctList: String(prog?.pctList||'')
  };
}
async function generateAiTrainingPlan(){
  const form = state.tmp.aiPlanForm || {status:'anfaenger', location:'box', frequency:3, goal:'ausgewogen', focus:'fortsetzen'};
  state.tmp.aiPlanLoading = true;
  state.tmp.aiPlanError = '';
  render();
  try{
    const frequency = Math.min(7, Math.max(1, parseInt(form.frequency)||3));
    const body = {
      goal: form.goal, focus: form.focus, status: form.status, location: form.location, frequency,
      muscleGroupLoad: computeMuscleGroupLoad(14),
      recentExercises: recentExerciseNamesForAiPlan(14)
    };
    const result = await pb.send('/ai-training-plan', { method:'POST', body });
    if(!result || !result.ok) throw new Error((result && result.error) || 'KI-Plan konnte nicht erstellt werden');
    const aiDays = Array.isArray(result.days) ? result.days : [];
    const selectedDays = PLAN_FREQUENCY_DAY_PATTERNS[frequency];
    const days = {};
    selectedDays.forEach((dayKey, i)=>{
      const entry = aiDays[i];
      if(!entry) return;
      if(entry.kind==='strength' && entry.prog){
        days[dayKey] = {type:'ai-strength', prog: normalizeAiStrengthDay(entry.prog)};
      } else if(entry.wod){
        days[dayKey] = {type:'ai-wod', wod: normalizeAiWodDay(entry.wod)};
      }
    });
    state.trainingPlan = {
      status: form.status, location: form.location, frequency, days,
      aiGenerated: true, goal: form.goal, focus: form.focus,
      aiNote: String(result.summaryNote||'').slice(0,300)
    };
    state.tmp.aiPlanForm = null;
    state.tmp.aiPlanLoading = false;
    await saveKey('trainingPlan', state.trainingPlan);
    showToast('KI-Trainingsplan erstellt ✨');
    render();
  } catch(err){
    state.tmp.aiPlanLoading = false;
    state.tmp.aiPlanError = (err && err.message) ? err.message : 'KI-Plan konnte nicht erstellt werden';
    render();
  }
}

async function deleteUserCascade(userId){
  const ownedCollections = ['memberships','bookings','social_posts','social_comments','social_reactions','social_poll_votes','push_subscriptions'];
  for(const coll of ownedCollections){
    const records = await pb.collection(coll).getFullList({filter: pb.filter('user = {:u}', {u:userId})});
    await Promise.all(records.map(r=>pb.collection(coll).delete(r.id)));
  }
  await pb.collection('users').delete(userId);
}

      <button class="btn btn-ghost" style="justify-content:space-between;margin-bottom:10px;" onclick="setProfileSection('notifications')">🔔 Benachrichtigungen →</button>
      <button class="btn btn-ghost" style="justify-content:space-between;${adminView ? '' : 'margin-bottom:10px;'}" onclick="setProfileSection('data')">🗑️ Daten-Verwaltung →</button>
      ${adminView ? '' : `<button class="btn btn-ghost" style="justify-content:space-between;" onclick="reopenOnboarding()">📖 Kurzanleitung erneut zeigen</button>`}
    </div>
  `;
}
function renderProfileNotificationsPage(){
  return `
    <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="setProfileSection('appsettings')">← Zurück</button>
    <div class="card">
      <h2 class="small">Benachrichtigungen</h2>
      <div class="note" style="margin-bottom:10px;">Erhalte Push-Benachrichtigungen zu deiner Box — auch wenn die App gerade geschlossen ist.</div>
      <button class="btn btn-primary" onclick="enablePushNotifications()">🔔 Push-Benachrichtigungen aktivieren</button>
      ${(!('serviceWorker' in navigator) || !('PushManager' in window)) ? '<div class="note" style="color:var(--plate-red);margin-top:8px;">Auf diesem Gerät/Browser nicht unterstützt.</div>' : ''}
      <div style="margin-top:14px;">${renderNotificationSettings()}</div>
    </div>
  `;
}
function renderProfileData(){
  return `
    <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="setProfileSection('appsettings')">← Zurück</button>
    <div class="card">
      <h2>Daten-Verwaltung</h2>
      <div class="note" style="margin-bottom:10px;">Deine Daten werden ausschließlich für dich gespeichert.</div>
      <button class="btn btn-danger" onclick="handleResetClick()">${state.tmp.confirmReset ? 'Wirklich? Ja, alles löschen' : 'Alle Daten löschen'}</button>
      ${state.tmp.confirmReset ? `<button class="btn btn-ghost" style="margin-top:8px;" onclick="cancelResetClick()">Abbrechen</button>` : ''}
    </div>
    <div class="card">
      <a href="datenschutz.html" target="_blank" rel="noopener">Datenschutzerklärung</a>
    </div>
  `;
}
function handleResetClick(){
  if(state.tmp.confirmReset){ resetAll(); }
  else { state.tmp.confirmReset = true; render(); }
}
function cancelResetClick(){
  state.tmp.confirmReset = false;
  render();
}
async function saveProfile(){
  const birthDateEl = document.getElementById('pBirthDate');
  const weightUnitEl = document.getElementById('pWeightUnit');
  const distanceUnitEl = document.getElementById('pDistanceUnit');
  state.profile = {
    ...state.profile,
    birthDate: birthDateEl ? (birthDateEl.value || null) : state.profile?.birthDate,
    weightUnit: weightUnitEl ? weightUnitEl.value : state.profile?.weightUnit,
    distanceUnit: distanceUnitEl ? distanceUnitEl.value : state.profile?.distanceUnit
  };
  await saveKey('profile', state.profile);
  showToast('Profil gespeichert');
  render();
}
async function resetAll(){
  stopTicking();
  await Promise.all(['profile','exercises','workouts','drafts','trainingLogs','wods','nutritionLogs','measurements','prEntries','timeRecords','readinessLogs','trainingPlan'].map(deleteKey));
  state = {profile:null, exercises: cloneDefaultExercises(), workouts:[], drafts:[], nutritionLogs:[], measurements:[], prEntries:[], timeRecords:[], readinessLogs:[], trainingPlan:null, activeTab:'profile', box:{ loaded:false, membership:null, scheduleSlots:[], pendingMemberships:[], classInstances:[], classBookings:[], scheduleDate:null, myBookings:[], tabWorkouts:[], tabWorkoutsDate:null, workoutResults:{}, socialPosts:[], socialLoaded:false, socialPage:1, socialHasMore:false, socialReactionsByPost:{}, socialMyVoteByPost:{}, socialPollTallyByPost:{}, allWorkouts:[], allWorkoutsLoaded:false, allAttendedBookings:[] }, tmp: defaultTmp()};
  await saveKey('exercises', state.exercises);
  showToast('Daten gelöscht');
  render();
}

/* ---------- Utils ---------- */
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML;
}
function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  const duration = msg.length > 40 ? 4200 : 2200;
  setTimeout(()=>el.remove(), duration);
}

boot();
</script>
</body>
</html>
