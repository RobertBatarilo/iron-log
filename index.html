<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WOD Ledger — Trainingstracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1B1D21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WOD Ledger">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --graphite-900:#1B1D21;
    --graphite-800:#232629;
    --iron-700:#333740;
    --iron-600:#40454F;
    --iron-500:#565C68;
    --chalk-50:#F1EDE4;
    --chalk-200:#D8D2C2;
    --plate-red:#C8443C;
    --plate-red-dim:#8E2F2A;
    --chalk-yellow:#E8B93F;
    --success-green:#6B9E63;
    --font-display:'Oswald',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  :root[data-theme="light"]{
    --graphite-900:#F1EDE4;
    --graphite-800:#FFFFFF;
    --iron-700:#D8D2C2;
    --iron-600:#C7C0AE;
    --iron-500:#8A8578;
    --chalk-50:#1B1D21;
    --chalk-200:#40454F;
    --chalk-yellow:#A9790A;
    --success-green:#4F7A48;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--graphite-900);
    color:var(--chalk-50);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--chalk-yellow);color:var(--graphite-900);}
  button{font-family:inherit;}
  input,select,textarea{
    font-family:var(--font-body);
    background:var(--graphite-800);
    border:1px solid var(--iron-600);
    color:var(--chalk-50);
    border-radius:8px;
    padding:10px 12px;
    font-size:15px;
    width:100%;
  }
  input:focus,select:focus,textarea:focus{
    outline:2px solid var(--chalk-yellow);
    outline-offset:1px;
    border-color:var(--chalk-yellow);
  }
  label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--chalk-200);
    margin-bottom:4px;
    font-weight:600;
  }
  .field{margin-bottom:14px;}
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:var(--graphite-900);
  }
  header.top{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--iron-700);
    position:sticky;
    top:0;
    background:var(--graphite-900);
    z-index:5;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{width:40px;height:40px;border-radius:10px;flex-shrink:0;}
  header.top h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    letter-spacing:0.03em;
    margin:0;
    color:var(--chalk-50);
  }
  header.top h1 span{color:var(--plate-red);}
  header.top p{
    margin:2px 0 0;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--iron-500);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  main#content{
    flex:1;
    padding:18px 20px 100px;
  }
  .card{
    background:var(--graphite-800);
    border:1px solid var(--iron-700);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:var(--font-display);
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin:0 0 12px;
    color:var(--chalk-yellow);
    font-weight:600;
  }
  .card h2.small{font-size:12px;color:var(--iron-500);}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:9px;
    padding:12px 16px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    width:100%;
  }
  .btn-primary{background:var(--plate-red);color:var(--chalk-50);}
  .btn-primary:active{background:var(--plate-red-dim);}
  .btn-ghost{background:var(--iron-700);color:var(--chalk-50);}
  .btn-ghost:active{background:var(--iron-600);}
  .btn-sm{padding:8px 10px;font-size:12px;width:auto;}
  .btn-danger{background:transparent;color:var(--plate-red);border:1px solid var(--plate-red-dim);}
  .feel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}
  .feel-btn{
    background:var(--graphite-900);
    border:1px solid var(--iron-600);
    color:var(--chalk-50);
    border-radius:9px;
    padding:10px 6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .feel-btn.active{background:var(--chalk-yellow);color:var(--graphite-900);border-color:var(--chalk-yellow);}
  .stat-num{
    font-family:var(--font-mono);
    font-weight:600;
    font-size:30px;
    color:var(--chalk-50);
    line-height:1;
  }
  .stat-num.accent{color:var(--plate-red);}
  .stat-label{
    font-size:11px;
    color:var(--iron-500);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-top:4px;
  }
  .suggestion-box{
    background:var(--graphite-900);
    border:1px dashed var(--chalk-yellow);
    border-radius:10px;
    padding:14px;
    margin:12px 0;
    text-align:center;
  }
  .suggestion-box .stat-num{color:var(--chalk-yellow);font-size:34px;}
  .last-perf{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:10px 0;
    border-bottom:1px solid var(--iron-700);
    margin-bottom:10px;
  }
  .history-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--iron-700);
    font-size:13px;
  }
  .history-item:last-child{border-bottom:none;}
  .history-item .date{color:var(--iron-500);font-family:var(--font-mono);font-size:11px;}
  .history-item .val{font-family:var(--font-mono);font-weight:600;}
  .wod-move-row{
    background:var(--graphite-900);
    border:1px solid var(--iron-700);
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
  }
  .wod-move-row .top{display:flex;gap:8px;margin-bottom:8px;}
  .set-block{
    background:var(--graphite-800);
    border-top:1px dashed var(--iron-600);
    padding:10px 0 4px;
    margin-top:6px;
  }
  .set-block:first-of-type{border-top:none;padding-top:0;margin-top:0;}
  .checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--chalk-200);
    margin:8px 0 4px;
    cursor:pointer;
  }
  .checkbox-row input[type="checkbox"]{width:auto;accent-color:var(--chalk-yellow);}
  .wod-result{
    font-family:var(--font-mono);
    color:var(--plate-red);
    font-weight:600;
    font-size:22px;
    text-align:right;
    margin-top:6px;
  }
  .wod-result small{font-family:var(--font-body);color:var(--iron-500);font-weight:400;font-size:11px;}
  .remove-row{background:none;border:none;color:var(--iron-500);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;}
  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--iron-500);
  }
  .empty-state .glyph{font-size:32px;display:block;margin-bottom:8px;}
  .wod-card{

    padding-left:12px;
    margin-bottom:14px;
  }

  .wod-card .wdate{font-family:var(--font-mono);font-size:11px;color:var(--iron-500);}

  .chip{
    display:inline-block;
    font-size:10px;
    font-family:var(--font-mono);
    background:var(--iron-700);
    color:var(--chalk-200);
    padding:2px 7px;
    border-radius:20px;
    margin-left:6px;
  }
  nav.bottom{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:480px;
    margin:0 auto;
    background:var(--graphite-800);
    border-top:1px solid var(--iron-700);
    display:flex;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav.bottom button{
    flex:1;
    background:none;
    border:none;
    color:var(--iron-500);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:10px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.03em;
    cursor:pointer;
    padding:6px 2px;
  }
  nav.bottom button.active{color:var(--chalk-yellow);}
  nav.bottom svg{width:20px;height:20px;}
  .toast{
    position:fixed;
    bottom:90px;left:50%;
    transform:translateX(-50%);
    background:var(--chalk-yellow);
    color:var(--graphite-900);
    padding:10px 18px;
    border-radius:20px;
    font-weight:600;
    font-size:13px;
    z-index:20;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  .chart-wrap{position:relative;height:180px;margin-top:6px;}
  .add-move-btn{
    background:none;
    border:1px dashed var(--iron-600);
    color:var(--chalk-200);
    border-radius:9px;
    padding:10px;
    width:100%;
    font-size:13px;
    cursor:pointer;
    margin-bottom:6px;
  }
  .loading{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;color:var(--iron-500);font-family:var(--font-mono);font-size:13px;
  }
  hr.hairline{border:none;border-top:1px solid var(--iron-700);margin:14px 0;}
  .note{font-size:12px;color:var(--iron-500);margin-top:4px;}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .modal-box{
    background:var(--graphite-800);
    border:1px solid var(--iron-700);
    border-radius:16px 16px 0 0;
    padding:20px;
    width:100%; max-width:480px;
    max-height:85vh; overflow-y:auto;
  }
  .modal-box h2{
    font-family:var(--font-display); font-size:16px; text-transform:uppercase;
    letter-spacing:0.05em; margin:0 0 14px; color:var(--chalk-yellow); font-weight:600;

<script>
/* ---------- Storage helpers ---------- */
async function loadKey(key, fallback){
  try{
    const raw = localStorage.getItem('ironlog:'+key);
    return raw!=null ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback;
  }
}
async function saveKey(key, value){
  try{
    localStorage.setItem('ironlog:'+key, JSON.stringify(value));
  }catch(e){
    console.error('Speichern fehlgeschlagen', key, e);
  }
}
async function deleteKey(key){
  try{ localStorage.removeItem('ironlog:'+key); }catch(e){}
}

/* ---------- App State ---------- */
const DEFAULT_EXERCISES_RAW = [
  {name:'Back Squat', type:'weighted'}, {name:'Front Squat', type:'weighted'}, {name:'Deadlift', type:'weighted'},
  {name:'Bench Press', type:'weighted'}, {name:'Overhead Press', type:'weighted'}, {name:'Push Press', type:'weighted'},
  {name:'Strict Press', type:'weighted'}, {name:'Clean', type:'weighted'}, {name:'Power Clean', type:'weighted'},
  {name:'Snatch', type:'weighted'}, {name:'Power Snatch', type:'weighted'}, {name:'Clean & Jerk', type:'weighted'},
  {name:'Thruster', type:'weighted'}, {name:'Pull-up', type:'bodyweight'}, {name:'Bent-over Row', type:'weighted'},
  {name:'Row', type:'cardio'}, {name:'Air Bike', type:'cardio'}, {name:'Bike', type:'cardio'}, {name:'Ski Erg', type:'cardio'}, {name:'Run', type:'cardio'}
];
const DEFAULT_EXERCISES = DEFAULT_EXERCISES_RAW.map(e => ({id: slug(e.name), name: e.name, custom:false, type: e.type}));
function cloneDefaultExercises(){ return DEFAULT_EXERCISES.map(e=>({...e})); }
function getExerciseType(ex){ return (ex && ex.type) || 'weighted'; }
function sortedExercises(){ return state.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name,'de')); }

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+ '-' + Math.random().toString(36).slice(2,6);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'2-digit'});
}

function defaultTmp(){
  return {
    wodFormat:'strength',
    wodPhase:'template', wodTemplate:null, wodMoves:null, wodDate:null, wodName:null, wodNameMatch:null, wodFeeling:null, wodNote:null, editingPrId:null, editingTimeId:null,
    live:null,
    forTimeBuilder:null, amrapBuilder:null, forLoadBuilder:null, runBuilder:null,
    emomMin:1, emomSec:30, emomRounds:10,
    gps:null,
    timer:{
      mode:'stopwatch',
      swRunning:false, swElapsed:0, swStartedAt:null, swLaps:[],
      cdRunning:false, cdMin:1, cdSec:0, cdRemaining:0, cdTotal:0, cdStartedAt:null,
      ivRunning:false, ivWorkSec:20, ivRestSec:10, ivRounds:8, ivRound:1, ivPhase:'work', ivRemaining:0, ivStartedAt:null
    },
    planForm:null,
    exerciseModal:null,
    prExerciseSelection:null,
    confirmReset:false
  };
}

let state = {
  profile:null,
  exercises:[],
  workouts:[],
  nutritionLogs:[],
  measurements:[],
  prEntries:[],
  timeRecords:[],
  trainingPlan:null,
  activeTab:'today',
  tmp: defaultTmp() // transient UI state
};

let charts = {}; // chart.js instances keyed by canvas id
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function chartTickColor(){ return cssVar('--iron-500'); }
function chartGridColor(){ return cssVar('--iron-700'); }

/* ---------- Math ---------- */
function estimate1RM(weight, reps){
  reps = Math.max(1, reps);
  if(reps === 1) return weight;
  return weight * (1 + reps/30);
}
function weightForReps(e1rm, reps){
  reps = Math.max(1, reps);
  if(reps === 1) return e1rm;
  return e1rm / (1 + reps/30);
}
function roundToIncrement(v, inc=2.5){
  return Math.round(v/inc)*inc;
}

/* ---------- Einheiten (Gewicht kg/lbs, Distanz m/mi) — intern immer kg/Meter ---------- */
const KG_PER_LBS = 0.453592;
const M_PER_MILE = 1609.34;
function weightUnitLabel(){ return (state.profile && state.profile.weightUnit==='lbs') ? 'lbs' : 'kg'; }
function distanceUnitLabel(){ return (state.profile && state.profile.distanceUnit==='mi') ? 'mi' : 'm'; }
function toDisplayWeight(kg){
  if(kg===null || kg===undefined || kg===''){ return ''; }
  const v = weightUnitLabel()==='lbs' ? kg/KG_PER_LBS : kg;
  return Math.round(v*100)/100;
}
function fromDisplayWeight(val){
  const v = parseFloat(val)||0;
  return weightUnitLabel()==='lbs' ? v*KG_PER_LBS : v;
}
function toDisplayDistance(m){
  if(m===null || m===undefined || m===''){ return ''; }
  const v = distanceUnitLabel()==='mi' ? m/M_PER_MILE : m;
  return Math.round(v*100)/100;
}
function fromDisplayDistance(val){
  const v = parseFloat(val)||0;
  return distanceUnitLabel()==='mi' ? v*M_PER_MILE : v;
}
function fmtWeight(kg){
  const v = toDisplayWeight(kg);
  return v===''? '' : `${v.toLocaleString('de-AT')}${weightUnitLabel()}`;
}
const FEELING_LABELS = {
  schlechter:'Schlechter', gleich:'Gleich', besser:'Besser', viel_besser:'Viel besser'
};
const FEELING_ADJUST = {
  schlechter:0.95, gleich:1.01, besser:1.03, viel_besser:1.06
};

function composeVariantName(base, variant, detailVal){
  if(!variant || variant.id==='standard') return base.name;
  let name = `${variant.label} ${base.name}`;
  if(variant.detail && detailVal){
    const d = variant.detail;
    const val = d.numeric ? `${d.signed===false?'':'+'}${detailVal}${d.unit||'kg'}` : detailVal;
    name += ` (${val})`;
  }
  return name;
}
function matchLibraryVariant(ex){
  if(!ex) return null;
  const n = ex.name.toLowerCase();
  for(const base of EXERCISE_LIBRARY){
    for(const variant of base.variants){
      const composed = composeVariantName(base, variant, '').toLowerCase();
      if(n === composed || (variant.detail && n.startsWith(composed))) return {base, variant};
    }
  }
  return null;
}

};

const PLAN_LEVEL_RANK = {beginner:0, intermediate:1, advanced:2};
const PLAN_STATUS_TO_LEVEL = {anfaenger:'beginner', fortgeschritten:'intermediate', profi:'advanced'};

function generateTrainingPlan(status, location, frequency){
  frequency = Math.min(7, Math.max(1, parseInt(frequency)||3));
  const patterns = {
    1:['wed'], 2:['mon','thu'], 3:['mon','wed','fri'], 4:['mon','tue','thu','fri'],
    5:['mon','tue','wed','thu','fri'], 6:['mon','tue','wed','thu','fri','sat'],
    7:['mon','tue','wed','thu','fri','sat','sun']
  };
  const selectedDays = patterns[frequency];
  const allowedEquipment = LOCATION_EQUIPMENT[location] || [];
  const targetLevel = PLAN_STATUS_TO_LEVEL[status] || 'beginner';
  const fitsEquipment = (eq)=> (eq||[]).every(tag=>allowedEquipment.includes(tag));
  const fitsLevel = (lvl)=> PLAN_LEVEL_RANK[lvl] <= PLAN_LEVEL_RANK[targetLevel];

  let wodPool = CROSSFIT_WODS.filter(w=>fitsEquipment(w.equipment) && fitsLevel(w.level));
  if(!wodPool.length) wodPool = CROSSFIT_WODS.filter(w=>fitsEquipment(w.equipment));
  let progPool = STRENGTH_PROGRESSIONS.filter(p=>fitsEquipment(p.equipment) && fitsLevel(p.level));
  if(!progPool.length) progPool = STRENGTH_PROGRESSIONS.filter(p=>fitsEquipment(p.equipment));

  const days = {};
  let wodCounter = 0, progCounter = 0;
  selectedDays.forEach((dayKey, i)=>{
    const useWod = i % 2 === 0;
    if(useWod && wodPool.length){
      days[dayKey] = { type:'wod', refId: wodPool[wodCounter % wodPool.length].id };
      wodCounter++;
    } else if(progPool.length){
      days[dayKey] = { type:'strength', refId: progPool[progCounter % progPool.length].id };
      progCounter++;
    } else if(wodPool.length){
      days[dayKey] = { type:'wod', refId: wodPool[wodCounter % wodPool.length].id };
      wodCounter++;
    }
  });
  return { status, location, frequency, days };
}
function todaysPlanKey(){
  return PLAN_DAY_KEYS[(new Date().getDay()+6)%7];
}
const CARDIO_MACHINE_NAMES = ['Row','Air Bike','Bike','Ski Erg','Run'];

function isRunExercise(ex){
  return !!ex && getExerciseType(ex)==='cardio' && GPS_RUN_NAMES.some(n=>ex.name.toLowerCase().includes(n));
}
function guessExerciseType(name){
  const n = name.toLowerCase();
  if(CARDIO_MACHINE_NAMES.some(c=>n.includes(c.toLowerCase()))) return 'cardio';
  if(EXERCISE_LIBRARY.some(b=>n.includes(b.name.toLowerCase()))) return 'bodyweight';
  return 'weighted';
}
function findOrCreateExerciseId(name, type){
  const existing = state.exercises.find(e=>e.name.toLowerCase()===name.toLowerCase());
  if(existing) return existing.id;
  const ex = {id: slug(name), name, custom:true, type: type || guessExerciseType(name)};
  state.exercises.push(ex);
  saveKey('exercises', state.exercises);
  return ex.id;
}
function buildLibraryMovement(m){

/* ---------- Migration (old separate Training/WOD format -> unified Workout format) ---------- */
function migrateToWorkouts(oldTrainingLogs, oldWods){
  const workouts = [];
  (oldWods||[]).forEach(w=>{
    const movements = (w.movements||[]).map(m=>{
      let sets;
      if(m.sets){
        sets = m.sets.map(s=>({
          reps: s.reps!==undefined ? s.reps : '',
          weight: s.weight!==undefined ? s.weight : (s.calcWeight||''),
          rmCheck: !!(s.percent),
          pct: s.percent||null,
          rmReps: s.percent ? 1 : null
        }));
      } else {
        sets = [{reps:'', weight:m.calcWeight||'', rmCheck: !!m.percent, pct:m.percent||null, rmReps: m.percent?1:null}];
      }
      return { exerciseId:m.exerciseId, sets };
    });
    workouts.push({ id:w.id, date:w.date, name:w.name||'', note:w.note||'', movements });
  });
  (oldTrainingLogs||[]).forEach(e=>{
    const sets = (e.sets||[{weight:e.weight,reps:e.reps}]).map(s=>({reps:s.reps, weight:s.weight, rmCheck:false, pct:null, rmReps:null}));
    workouts.push({ id:e.id, date:e.date, name:'', note:'', movements:[{exerciseId:e.exerciseId, sets}] });
  });
  return workouts;
}

  const trainedDates = new Set(state.workouts.map(w=>w.date));
  const todayD = todayStr();

  const weekStrip = dates.map((d,i)=>{
    const trained = trainedDates.has(d);
    const isToday = d===todayD;
    const circleStyle = isToday
      ? 'background:var(--chalk-yellow);color:var(--graphite-900);'
      : trained
        ? 'background:var(--success-green);color:var(--chalk-50);'
        : 'border:1px solid var(--iron-700);color:var(--iron-500);';
    return `
      <div style="text-align:center;flex:1;">
        <div class="stat-label">${WEEKDAY_LABELS[i]}</div>
        <div style="width:34px;height:34px;margin:4px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:600;${circleStyle}">${d.slice(8,10)}</div>
      </div>`;
  }).join('');

  const planDay = state.trainingPlan && state.trainingPlan.days ? state.trainingPlan.days[todaysPlanKey()] : null;
  let planHtml;
  if(planDay){
    planHtml = `
      <div class="suggestion-box">
        <div class="stat-label">Heute geplant</div>
        <div class="stat-num" style="font-size:22px;">${escapeHtml(planEntryLabel(planDay)||'Training')}</div>
      </div>
      <button class="btn btn-primary" onclick="startPlannedWorkout()">Training starten</button>
    `;
  } else if(state.trainingPlan){
    planHtml = `
      <div class="note" style="text-align:center;">Heute ist laut Plan kein Training vorgesehen.</div>
      <button class="btn btn-ghost" style="margin-top:10px;" onclick="setTab('workout')">Trotzdem trainieren</button>
    `;
  } else {
    planHtml = `
      <div class="empty-state">Noch kein Trainingsplan erstellt.</div>
      <button class="btn btn-primary" style="margin-top:12px;" onclick="setTab('profile')">Plan erstellen</button>
    `;
  }

  const lastWorkout = state.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];

  return `
    <div class="card">
      <h2 class="small">Diese Woche</h2>
      <div class="row" style="gap:4px;">${weekStrip}</div>
    </div>
    <div class="card">
      <h2>Heute</h2>
      ${planHtml}
    </div>
    <div class="card">
      <h2 class="small">Letztes Training</h2>
      ${lastWorkout
        ? `<div class="history-item"><span class="date">${fmtDate(lastWorkout.date)}</span><span class="val">${escapeHtml(lastWorkout.name)||'Workout'}</span></div>`
        : `<div class="note">Noch kein Training erfasst.</div>`}
      <button class="btn btn-ghost" style="margin-top:12px;" onclick="setTab('workout')">Neues Workout erfassen</button>
    </div>
  `;
}
function startPlannedWorkout(){
  const planDay = state.trainingPlan.days[todaysPlanKey()];
  if(!planDay){ setTab('workout'); return; }
  if(planDay.type==='wod'){
    const wod = CROSSFIT_WODS.find(w=>w.id===planDay.refId);
    if(wod){
      state.tmp.wodName = wod.name;
      if(wod.format==='amrap'){
        state.tmp.wodFormat = 'amrap';
        state.tmp.amrapBuilder = buildAmrapBuilderFromWod(wod);
      } else {
        state.tmp.wodFormat = 'for-time';
        state.tmp.forTimeBuilder = buildForTimeBuilderFromWod(wod);
      }
    }
  } else {
    const template = buildTemplateFromProgression(STRENGTH_PROGRESSIONS.find(p=>p.id===planDay.refId));
    if(template){
      state.tmp.wodFormat = 'strength';
      state.tmp.wodTemplate = template;
      state.tmp.wodName = planEntryLabel(planDay) || '';
      state.tmp.wodPhase = 'template';
    }
  }
  setTab('workout');
}

/* ---------- WORKOUT TAB (merged Training + WOD, two-phase: template -> generated rows) ---------- */
function exerciseLogs(exId){
  const out = [];
  state.workouts.forEach(w=>{
    (w.movements||[]).forEach(m=>{
      if(m.exerciseId===exId){
        const sets = m.sets.filter(s=>s.weight && s.reps);
        if(sets.length) out.push({ date: w.date, sets });
      }
    });
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function topSet(entry){
  return entry.sets.reduce((best,s)=> estimate1RM(s.weight,s.reps) > estimate1RM(best.weight,best.reps) ? s : best, entry.sets[0]);
}
function sessionE1RM(entry){
  return entry.sets.reduce((max,s)=> Math.max(max, estimate1RM(s.weight,s.reps)), 0);
}
function computedBest(exId){
  const logs = exerciseLogs(exId);
  return logs.length ? logs.reduce((max,e)=>Math.max(max, sessionE1RM(e)), 0) : null;
}
function prEntriesFor(exId){
  return state.prEntries.filter(p=>p.exerciseId===exId).sort((a,b)=> b.value-a.value || b.date.localeCompare(a.date));
}
function manualBest(exId){
  const list = prEntriesFor(exId);
  return list.length ? list[0].value : null;
}
function bestE1RM(exId){
  const c = computedBest(exId), m = manualBest(exId);
  if(c==null && m==null) return null;
  return Math.max(c||0, m||0);
}
function parsePctList(str){
  return (str||'').split(/[,\/\s]+/).map(s=>parseFloat(s)).filter(n=>!isNaN(n));
}
function pctForIndex(arr, i){
  if(!arr.length) return null;
  return arr[i] !== undefined ? arr[i] : arr[arr.length-1];
}
function blankRowSet(){ return {reps:'', weight:'', pct:null, autoFilled:false}; }
function blankTemplateMove(){ return {exerciseId: state.exercises[0]?.id, timing:'', setsCount:'', pctList:'', weight:'', unit:'kcal', qty:'', repsTarget:'', groupWithNext:false}; }
function ensureWodTemplate(){
  if(!state.tmp.wodTemplate){
    state.tmp.wodTemplate = [blankTemplateMove()];
    state.tmp.wodPhase = 'template';
  }
}
function isTemplateEmpty(){
  return state.tmp.wodTemplate.length<=1 && state.tmp.wodTemplate.every(t=>!t.timing && !t.setsCount && !t.pctList && !t.weight && !t.qty && !t.repsTarget);
}
function findWorkoutByName(name){
  const n = (name||'').trim().toLowerCase();
  if(!n) return null;
  const matches = state.workouts.filter(w=>(w.name||'').trim().toLowerCase()===n).sort((a,b)=>a.date.localeCompare(b.date));
  return matches.length ? matches[matches.length-1] : null;
}

function isWodInProgress(){
  if(state.tmp.wodPhase==='rows' || state.tmp.wodPhase==='live') return true;
  const b = state.tmp.forTimeBuilder;
  if(b && b.phase!=='build') return true;
  const a = state.tmp.amrapBuilder;
  if(a && a.phase!=='build') return true;
  const f = state.tmp.forLoadBuilder;
  if(f && f.phase!=='build') return true;
  if(state.tmp.gps) return true;
  return false;
}
function renderFormatSelector(){
  const formats = [
    {id:'amrap', label:'AMRAP', hint:'So viele Runden wie möglich in der Zeit.'},
    {id:'emom', label:'EMOM', hint:'Every x:xx — feste Intervalle, Sätze sind relevant.'},
    {id:'for-load', label:'For Load', hint:'Bestes Gewicht in einem Zeitfenster finden.'},
    {id:'for-time', label:'For Time', hint:'Feste Aufgabe, Stoppuhr läuft, optional Time-Cap.'},
    {id:'run', label:'Run', hint:'GPS-getrackter Lauf — Distanz, Zeit, Pace.'},
    {id:'strength', label:'Strength', hint:'Sätze × Wdh. × Gewicht — klassisches Krafttraining.'}
  ];
  const current = formats.find(f=>f.id===state.tmp.wodFormat) || formats[0];
  const girlWods = CROSSFIT_WODS.filter(w=>w.category==='girl').sort((a,b)=>a.name.localeCompare(b.name,'de'));
  const heroWods = CROSSFIT_WODS.filter(w=>w.category==='hero').sort((a,b)=>a.name.localeCompare(b.name,'de'));
  return `
    <div class="card">
      <h2>Workout-Format</h2>
      <div class="row" style="flex-wrap:wrap;gap:8px;">
        ${formats.map(f=>`<button class="btn ${state.tmp.wodFormat===f.id?'btn-primary':'btn-ghost'}" style="flex:1 1 45%;" onclick="setWodFormat('${f.id}')">${f.label}</button>`).join('')}
      </div>
      <div class="note" style="margin-top:8px;margin-bottom:14px;">${current.hint}</div>
      <div class="field" style="margin-bottom:0;">
        <label>Bekanntes WOD laden (optional)</label>
        <select onchange="loadBenchmarkWod(this.value)">
          <option value="">– auswählen –</option>
          <optgroup label="Girls">
            ${girlWods.map(w=>`<option value="${w.id}">${w.name}</option>`).join('')}
          </optgroup>
          <optgroup label="Hero WODs">
            ${heroWods.map(w=>`<option value="${w.id}">${w.name}</option>`).join('')}
          </optgroup>
        </select>
        <div class="note">Übernimmt automatisch Format, Übungen und Rep-Schema.</div>
      </div>
    </div>
  `;
}
function loadBenchmarkWod(wodId){
  if(!wodId) return;
  const wod = CROSSFIT_WODS.find(w=>w.id===wodId);
  if(!wod) return;
  state.tmp.wodName = wod.name;
  state.tmp.wodDate = todayStr();
  if(wod.format==='amrap'){
    state.tmp.wodFormat = 'amrap';
    state.tmp.amrapBuilder = buildAmrapBuilderFromWod(wod);
  } else {
    state.tmp.wodFormat = 'for-time';
    state.tmp.forTimeBuilder = buildForTimeBuilderFromWod(wod);
  }
  render();
}
function setWodFormat(fmt){
  if(state.tmp.wodFormat === fmt) return;
  state.tmp.wodFormat = fmt;
  state.tmp.wodTemplate = null;
  state.tmp.wodMoves = null;
  state.tmp.wodPhase = 'template';
  state.tmp.forTimeBuilder = null;
  state.tmp.amrapBuilder = null;
  state.tmp.forLoadBuilder = null;
  state.tmp.gps = null;
  render();
}
function renderWorkoutHistory(){
  const history = state.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const html = history.length ? history.map(renderWorkoutHistoryEntry).join('') : `<div class="note">Noch keine Workouts gespeichert.</div>`;
  return `
    <div class="card">
      <h2 class="small">Verlauf</h2>
      ${html}
    </div>
  `;
}
function formatMovementLine(m){
  const ex = state.exercises.find(e=>e.id===m.exerciseId);
  const name = ex ? ex.name : '—';
  const type = getExerciseType(ex);
  if(type==='cardio'){
    if(m.unit==='m') return `${toDisplayDistance(m.reps)}${distanceUnitLabel()} ${name}`;
    return `${m.reps||0} kcal ${name}`;
  }
  let line = `${m.reps||0}x ${name}`;
  if(type==='weighted' && m.weight){
    line += ` - ${fmtWeight(m.weight)}`;
  }
  return line;
}
function renderWorkoutHistoryEntry(w){
  const format = w.format || 'strength';
  let body;
  if(format==='for-time'){
    const ft = w.forTime || {};
    const timeLabel = ft.elapsedSec!=null ? fmtClock(ft.elapsedSec*1000,false) : '—';
    body = `<div class="moves">
      <div><span>Zeit</span><span>${timeLabel}${ft.capped?' (Time Cap)':''}</span></div>
      ${ft.roundsCompleted>0 ? `<div><span>Runden</span><span>${ft.roundsCompleted}</span></div>` : ''}
      ${(ft.movements||[]).map(m=>`<div>${escapeHtml(formatMovementLine(m))}</div>`).join('')}
      ${ft.repScheme ? `<div class="note">Schema: ${escapeHtml(ft.repScheme)}</div>` : (ft.rounds>1 ? `<div class="note">${ft.rounds} Runden</div>` : '')}
    </div>`;
  } else if(format==='amrap'){
    const am = w.amrap || {};
    body = `<div class="moves">
      <div><span>Ergebnis</span><span>${am.roundsCompleted||0} Runden${am.extraReps?' + '+am.extraReps+' Wdh.':''}</span></div>
      ${(am.movements||[]).map(m=>`<div>${escapeHtml(formatMovementLine(m))}</div>`).join('')}
      <div class="note">${fmtClock((am.durationSec||0)*1000,false)} Zeitlimit</div>
    </div>`;
  } else if(format==='for-load'){
    const fl = w.forLoad || {};
    const ex = state.exercises.find(e=>e.id===fl.exerciseId);
    body = `<div class="moves">
      <div><span>${ex?ex.name:'—'}</span><span>${fmtWeight(fl.achievedWeight)}</span></div>
      <div><span>Ziel-Wdh.</span><span>${fl.targetReps||'—'}</span></div>
    </div>`;
  } else if(format==='run'){
    const r = w.run || {};
    body = `<div class="moves">
      <div><span>Distanz</span><span>${toDisplayDistance(r.distanceM)}${distanceUnitLabel()}</span></div>
      <div><span>Zeit</span><span>${r.elapsedSec!=null?fmtClock(r.elapsedSec*1000,false):'—'}</span></div>
      <div><span>Ø Pace</span><span>${formatPace(r.distanceM||0, (r.elapsedSec||0)*1000)}</span></div>
    </div>`;
  } else {
    body = `<div class="moves">
      ${w.movements.map(m=>{
        const ex = state.exercises.find(e=>e.id===m.exerciseId);
        const isCardio = getExerciseType(ex)==='cardio';
        const prefix = (m.timing ? `[${escapeHtml(m.timing)}] ` : '') + (m.groupId!=null ? '🔗 ' : '');
        if(isCardio){
          return m.sets.map(s=>{
            const qty = m.unit==='m' ? `${toDisplayDistance(s.reps)}${distanceUnitLabel()}` : `${s.reps||0} kcal`;
            return `<div><span>${prefix}${ex?ex.name:'—'}: ${qty}</span></div>`;
          }).join('');
        }
        return m.sets.map(s=>`<div><span>${prefix}${ex?ex.name:'—'}: ${s.reps}×${s.weight}kg${s.pct? ' ('+s.pct+'% 1RM)':''}</span></div>`).join('');
      }).join('')}
    </div>`;
  }
  return `
    <div class="wod-card">
      <div class="wname">${escapeHtml(w.name)||'Workout'} <span class="wdate">${fmtDate(w.date)}</span></div>
      ${body}
      ${w.note ? `<div class="note">${escapeHtml(w.note)}</div>` : ''}
    </div>
  `;
}

function renderWorkout(){
  if(state.tmp.gps && state.tmp.gps.active) return renderGpsLiveView();
  if(!state.tmp.wodFormat) state.tmp.wodFormat = 'strength';
  const historyHtml = renderWorkoutHistory();
  const formatSelector = isWodInProgress() ? '' : renderFormatSelector();

  if(state.tmp.wodFormat==='for-time') return formatSelector + renderForTimeFlow(historyHtml);
  if(state.tmp.wodFormat==='amrap') return formatSelector + renderAmrapFlow(historyHtml);
  if(state.tmp.wodFormat==='for-load') return formatSelector + renderForLoadFlow(historyHtml);
  if(state.tmp.wodFormat==='run') return formatSelector + renderRunFlow(historyHtml);

  ensureWodTemplate();
  const uniqueNames = [...new Set(state.workouts.map(w=>w.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  const headerFields = buildHeaderFields(uniqueNames);

  if(state.tmp.wodPhase==='live') return renderWodLivePhase();
  return formatSelector + (state.tmp.wodPhase==='rows'
    ? renderWodRowsPhase(headerFields, historyHtml)
    : renderWodTemplatePhase(headerFields, historyHtml));
}

function buildHeaderFields(uniqueNames){
  const disabledAttr = isWodInProgress() ? 'disabled' : '';
  return `
    <div class="row">
      <div class="field"><label>Datum</label><input type="date" id="wodDate" value="${state.tmp.wodDate||todayStr()}" ${disabledAttr} onchange="state.tmp.wodDate=this.value"></div>
      <div class="field">
        <label>Name</label>
        <input type="text" id="wodName" list="wodNameList" value="${escapeHtml(state.tmp.wodName||'')}" ${disabledAttr} onchange="onWodNameChange(this.value)" placeholder="z.B. Fran">
        <datalist id="wodNameList">${uniqueNames.map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist>
      </div>
    </div>
  `;
}

function getEmomIntervalSec(){
  return (parseInt(state.tmp.emomMin)||0)*60 + (parseInt(state.tmp.emomSec)||0);
}
function renderWodTemplatePhase(headerFields, historyHtml){
  const isEmom = state.tmp.wodFormat==='emom';
  const refNote = state.tmp.wodNameMatch
    ? `<div class="note" style="margin-bottom:10px;">Vorlage aus "${escapeHtml(state.tmp.wodNameMatch.name)}" vom ${fmtDate(state.tmp.wodNameMatch.date)} übernommen — passt gerne an.</div>`
    : '';

  const emomFields = isEmom ? `
    <div class="row">
      <div class="field"><label>Intervall Min.</label><input type="number" step="1" min="0" value="${state.tmp.emomMin}" onchange="state.tmp.emomMin=this.value"></div>
      <div class="field"><label>Intervall Sek.</label><input type="number" step="1" min="0" max="59" value="${state.tmp.emomSec}" onchange="state.tmp.emomSec=this.value"></div>
    </div>
    <div class="field"><label>Runden</label><input type="number" step="1" min="1" value="${state.tmp.emomRounds}" onchange="state.tmp.emomRounds=this.value"></div>
  ` : '';

  const moveBlocks = state.tmp.wodTemplate.map((t,mi)=>{
    const ex = state.exercises.find(e=>e.id===t.exerciseId);
    const type = getExerciseType(ex);
    const isWeighted = type==='weighted';
    const isBodyweight = type==='bodyweight';
    const isCardio = type==='cardio';
    const isFollower = isEmom && mi>0 && state.tmp.wodTemplate[mi-1].groupWithNext;
    const variantMatch = matchLibraryVariant(ex);
    const variantSelector = variantMatch ? `
      <div class="field"><label>Variante</label>
        <select onchange="updateTemplateFieldVariant(${mi},this.value)">
          ${variantMatch.base.variants.filter(v=>!v.detail || v.id===variantMatch.variant.id)
            .map(v=>`<option value="${v.id}" ${v.id===variantMatch.variant.id?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>` : '';
    const repsTargetField = (isWeighted || isBodyweight) ? `<div class="field" style="margin-bottom:0;"><label>Ziel-Wiederholungen (optional)</label><input type="number" step="1" value="${escapeHtml(t.repsTarget)}" onchange="updateTemplateField(${mi},'repsTarget',this.value)" placeholder="z.B. 1"></div>` : '';
    const pctField = isWeighted ? `<div class="field" style="margin-bottom:0;"><label>% vom 1RM (optional)</label><input type="text" value="${escapeHtml(t.pctList)}" onchange="updateTemplateField(${mi},'pctList',this.value)" placeholder="z.B. 75 oder 75,80,85"></div>` : '';
    const weightField = isWeighted ? `<div class="row"><div class="field" style="margin-bottom:0;"><label>Gewicht (${weightUnitLabel()}, optional)</label><input type="number" step="0.5" value="${toDisplayWeight(t.weight)}" oninput="updateTemplateFieldWeight(${mi},this.value)" placeholder="alternativ zu % 1RM"></div>${repsTargetField}</div>` : '';
    const unitToggle = isCardio ? `
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ${t.unit==='kcal'?'btn-primary':'btn-ghost'}" onclick="setTemplateMoveUnit(${mi},'kcal')">Kalorien</button>
        <button type="button" class="btn ${t.unit==='m'?'btn-primary':'btn-ghost'}" onclick="setTemplateMoveUnit(${mi},'m')">${distanceUnitLabel()==='mi'?'Meilen':'Meter'}</button>
      </div>` : '';
    const qtyField = isCardio ? `<div class="row"><div class="field" style="margin-bottom:0;"><label>Ziel pro Satz (${t.unit==='m'?distanceUnitLabel():'kcal'}, optional)</label><input type="number" step="1" value="${t.unit==='m'?toDisplayDistance(t.qty):t.qty}" oninput="updateTemplateFieldQty(${mi},this.value)" placeholder="z.B. 500"></div></div>` : '';
    const setsField = isFollower
      ? `<div class="field" style="margin-bottom:0;align-self:center;"><div class="note" style="margin:0;">Teil des Komplexes — Sets siehe oben</div></div>`
      : `<div class="field" style="margin-bottom:0;"><label>Sets ${isEmom?'(Standard: Runden)':'(optional)'}</label><input type="number" step="1" value="${t.setsCount}" onchange="updateTemplateField(${mi},'setsCount',this.value)" placeholder="${isEmom?'z.B. '+state.tmp.emomRounds:'z.B. 5'}"></div>`;
    const groupToggle = (isEmom && mi < state.tmp.wodTemplate.length-1) ? `
      <label style="display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:13px;color:var(--chalk-60);">
        <input type="checkbox" ${t.groupWithNext?'checked':''} onchange="updateTemplateField(${mi},'groupWithNext',this.checked)">
        Mit nächster Übung zu einem Komplex kombinieren
      </label>` : '';
    return `
    <div class="wod-move-row" data-idx="${mi}">
      <div class="top">
        <select onchange="updateTemplateField(${mi},'exerciseId',this.value)">
          ${sortedExercises().map(e=>`<option value="${e.id}" ${e.id===t.exerciseId?'selected':''}>${e.name}</option>`).join('')}
        </select>
        <button type="button" class="btn-sm btn-ghost" style="width:auto;flex:0 0 auto;" onclick="openExerciseModal(exId=>updateTemplateField(${mi},'exerciseId',exId))">➕</button>
        ${state.tmp.wodTemplate.length>1 ? `<button class="remove-row" onclick="removeTemplateMove(${mi})">✕</button>` : ''}
      </div>
      ${variantSelector}
      ${isEmom ? '' : `<div class="field"><label>Zeitliche Angabe (optional)</label><input type="text" value="${escapeHtml(t.timing)}" onchange="updateTemplateField(${mi},'timing',this.value)" placeholder="z.B. Every 2:30"></div>`}
      <div class="row">
        ${setsField}
        ${pctField}
        ${!isWeighted ? repsTargetField : ''}
      </div>
      ${weightField}
      ${unitToggle}
      ${qtyField}
      ${groupToggle}
    </div>
  `;}).join('');

  return `
    <div class="card">
      <h2>Neues Workout</h2>
      ${headerFields}
      ${emomFields}
      ${refNote}
      ${moveBlocks}
      <button class="add-move-btn" onclick="addTemplateMove()">+ Bewegung hinzufügen</button>
      <button class="btn btn-primary" onclick="generateWodRows()">WOD erstellen</button>
    </div>
    ${historyHtml}
  `;
}

function renderWodRowsPhase(headerFields, historyHtml){
  let refBlock = '';
  if(state.tmp.wodNameMatch){
    refBlock += `<div class="note" style="margin-bottom:10px;">Letztes Mal <strong style="color:var(--chalk-50)">"${escapeHtml(state.tmp.wodNameMatch.name)}"</strong> am ${fmtDate(state.tmp.wodNameMatch.date)} gemacht.</div>`;
    refBlock += `<div class="stat-label" style="margin-bottom:6px;">Wie fühlst du dich heute im Vergleich zum letzten Mal?</div>`;
    refBlock += `<div class="feel-grid">`;
    Object.keys(FEELING_LABELS).forEach(f=>{
      refBlock += `<button class="feel-btn ${state.tmp.wodFeeling===f?'active':''}" onclick="pickWodFeeling('${f}')">${FEELING_LABELS[f]}</button>`;
    });
    refBlock += `</div>`;
  }

  const moveBlocks = state.tmp.wodMoves.map((mv,mi)=>{
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    const prescriptionBits = [];
    if(mv.timing) prescriptionBits.push(mv.timing);
    if(mv.setsCountRaw) prescriptionBits.push(mv.setsCountRaw+' Sätze');
    if(mv.repsTarget) prescriptionBits.push(mv.repsTarget+' Wdh.');
    if(mv.pctList) prescriptionBits.push(mv.pctList+'% 1RM');
    const known1rm = bestE1RM(mv.exerciseId);
    const isCardio = getExerciseType(ex)==='cardio';

    const setsHtml = mv.sets.map((s,si)=>{
      if(isCardio){
        const qtyLabel = mv.unit==='m' ? `Distanz (${distanceUnitLabel()})` : 'Kalorien';
        const qtyValue = mv.unit==='m' ? toDisplayDistance(s.reps) : s.reps;
        const gpsButton = isRunExercise(ex) && mv.unit==='m'
          ? `<button type="button" class="btn-sm btn-ghost" onclick="startGpsRun('inline',{flow:'wod',mi:${mi},si:${si}})">📍 Lauf starten</button>` : '';
        return `
      <div class="set-block">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span class="stat-label" style="margin:0;">Satz ${si+1}</span>
          ${mv.sets.length>1 ? `<button class="remove-row" onclick="removeWodSet(${mi},${si})">✕</button>` : ''}
        </div>
        <div class="field" style="margin-bottom:8px;"><label>${qtyLabel}</label><input type="number" step="1" value="${qtyValue}" oninput="updateWodSetQty(${mi},${si},this.value)" placeholder="z.B. 500"></div>
        ${gpsButton}
      </div>`;
      }
      return `
      <div class="set-block">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span class="stat-label" style="margin:0;">Satz ${si+1}${s.pct?' — '+s.pct+'% 1RM':''}</span>
          ${mv.sets.length>1 ? `<button class="remove-row" onclick="removeWodSet(${mi},${si})">✕</button>` : ''}
        </div>
        <div class="row">
          <div class="field" style="margin-bottom:0;"><label>Wiederholungen</label><input type="number" step="1" value="${s.reps}" oninput="updateSetField(${mi},${si},'reps',this.value)" placeholder="z.B. 5"></div>
          <div class="field" style="margin-bottom:0;"><label>kg</label><input type="number" step="0.5" value="${s.weight}" oninput="updateSetField(${mi},${si},'weight',this.value)" placeholder="z.B. 48"></div>
        </div>
      </div>`;
    }).join('');

    return `
    <div class="wod-move-row" data-idx="${mi}">
      <div class="wname" style="font-size:16px;margin-bottom:2px;">${ex?ex.name:'—'}${mv.groupId!=null?' 🔗':''}</div>
      ${mv.groupId!=null ? `<div class="note" style="margin-bottom:4px;">Teil eines Komplexes</div>` : ''}
      ${prescriptionBits.length ? `<div class="note" style="margin-bottom:8px;">Vorgabe: ${escapeHtml(prescriptionBits.join(' · '))}</div>` : ''}
      ${known1rm ? `<div class="note" style="margin-bottom:10px;">bisher bestes 1RM: <strong style="color:var(--chalk-50)">${Math.round(known1rm)}kg</strong></div>` : ''}
      ${setsHtml}
      <button class="add-move-btn" onclick="addWodSet(${mi})">+ Satz hinzufügen</button>
    </div>`;
  }).join('');

  return `
    <div class="card">
      <h2>Neues Workout</h2>
      ${headerFields}
      <button class="btn btn-ghost" style="margin-bottom:14px;" onclick="backToTemplate()">← Vorlage bearbeiten</button>
      ${refBlock}
      ${moveBlocks}
      <div class="field"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Beschreibung, Runden, Zeit-Cap …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
      <button class="btn btn-ghost" style="margin-bottom:10px;" onclick="startLiveWorkout()">▶ Geführt starten</button>
      <button class="btn btn-primary" onclick="saveWod()">Workout speichern</button>
    </div>
    ${historyHtml}
  `;
}

/* ---------- LIVE-MODUS (geführte Trainingsdurchführung) ---------- */
function startLiveWorkout(){
  const moves = state.tmp.wodMoves;
  const flat = [];
  let i = 0;
  while(i < moves.length){
    const gid = moves[i].groupId;
    let j = i;
    if(gid!=null){
      while(j+1 < moves.length && moves[j+1].groupId===gid) j++;
    }
    const groupIdx = [];
    for(let k=i;k<=j;k++) groupIdx.push(k);
    const setsCount = moves[groupIdx[0]].sets.length;
    for(let si=0; si<setsCount; si++){
      flat.push(groupIdx.map(mi=>({mi,si})));
    }
    i = j+1;
  }
  if(!flat.length){ showToast('Keine Sätze vorhanden'); return; }
  state.tmp.live = {
    startedAt: Date.now(),
    flat,
    pos: 0,
    resting: false,
    restRunning: false,
    restRemaining: 0,
    restTotal: 0,
    restStartedAt: null,
    finished: false
  };
  state.tmp.wodPhase = 'live';
  render();
}
function renderWodLivePhase(){
  const live = state.tmp.live;
  if(live.finished) return renderWodSummaryPhase();
  if(live.resting) return renderRestScreen(live);

  const group = live.flat[live.pos];
  const isComplex = group.length>1;
  const blocks = group.map(({mi,si})=>{
    const mv = state.tmp.wodMoves[mi];
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    const s = mv.sets[si];
    const isCardio = getExerciseType(ex)==='cardio';
    const qtyLabel = isCardio ? (mv.unit==='m' ? `Distanz (${distanceUnitLabel()})` : 'Kalorien') : 'Wiederholungen';
    const qtyValue = isCardio ? (mv.unit==='m' ? toDisplayDistance(s.reps) : s.reps) : s.reps;
    const gpsButton = isCardio && isRunExercise(ex) && mv.unit==='m'
      ? `<button type="button" class="btn-sm btn-ghost" style="margin-bottom:10px;" onclick="startGpsRun('inline',{flow:'wod',mi:${mi},si:${si}})">📍 Lauf starten</button>` : '';
    const prescriptionBits = [];
    if(mv.repsTarget) prescriptionBits.push(mv.repsTarget+' Wdh.');
    if(s.pct) prescriptionBits.push(s.pct+'% 1RM');
    return `
      <div style="margin-bottom:16px;">
        <h3 style="margin:0 0 6px;">${ex?ex.name:'—'}</h3>
        ${prescriptionBits.length ? `<div class="note" style="margin-bottom:8px;">Vorgabe: ${escapeHtml(prescriptionBits.join(' · '))}</div>` : ''}
        <div class="row">
          <div class="field"><label>${qtyLabel}</label><input type="number" step="1" id="liveReps_${mi}" value="${qtyValue}" placeholder="z.B. 5"></div>
          ${isCardio ? '' : `<div class="field"><label>kg</label><input type="number" step="0.5" id="liveWeight_${mi}" value="${s.weight}" placeholder="z.B. 48"></div>`}
        </div>
        ${gpsButton}
      </div>`;
  }).join('');
  const timing = state.tmp.wodMoves[group[0].mi].timing;

  return `
    <div class="card">
      <div class="stat-label">${isComplex?'Runde':'Satz'} ${live.pos+1} / ${live.flat.length}</div>
      ${timing ? `<div class="note" style="margin-bottom:10px;">${escapeHtml(timing)}</div>` : ''}
      ${blocks}
      <button class="btn btn-primary" onclick="completeLiveSet()">✓ ${isComplex?'Runde':'Satz'} erledigt</button>
      <button class="btn btn-ghost" style="margin-top:10px;" onclick="exitLiveWorkout()">Geführten Modus verlassen</button>
    </div>
  `;
}
function completeLiveSet(){
  const live = state.tmp.live;
  const group = live.flat[live.pos];
  group.forEach(({mi,si})=>{
    const mv = state.tmp.wodMoves[mi];
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    const isCardio = getExerciseType(ex)==='cardio';
    const rawReps = document.getElementById(`liveReps_${mi}`).value;
    mv.sets[si].reps = (isCardio && mv.unit==='m') ? String(fromDisplayDistance(rawReps)) : rawReps;
    const weightEl = document.getElementById(`liveWeight_${mi}`);
    if(weightEl) mv.sets[si].weight = weightEl.value;
    mv.sets[si].autoFilled = false;
  });

  if(live.pos >= live.flat.length-1){
    live.finished = true;
    render();
    return;
  }
  live.pos += 1;
  const restSec = (state.tmp.wodFormat==='emom' && getEmomIntervalSec()>0) ? getEmomIntervalSec() : 90;
  beginRest(restSec);
}
function beginRest(seconds){
  const live = state.tmp.live;
  live.resting = true;
  live.restTotal = seconds*1000;
  live.restRemaining = live.restTotal;
  live.restStartedAt = Date.now();
  live.restRunning = true;
  startTicking('live', tickRest);
  render();
}
function tickRest(){
  const live = state.tmp.live;
  if(!live || !live.resting){ stopTicking(); return; }
  const remaining = live.restRemaining - (Date.now()-live.restStartedAt);
  const display = document.getElementById('timerBigDisplay');
  if(remaining<=0){
    live.restRemaining = 0;
    live.restRunning = false;
    stopTicking();
    beep();
    finishRest();
    return;
  }
  if(display) display.textContent = fmtClock(remaining,false);
}
function finishRest(){
  state.tmp.live.resting = false;
  render();
}
function setRestPreset(seconds){ beginRest(seconds); }
function pauseRest(){
  const live = state.tmp.live;
  if(live.restRunning){ live.restRemaining = Math.max(0, live.restRemaining - (Date.now()-live.restStartedAt)); }
  live.restRunning = false;
  stopTicking();
  render();
}
function resumeRest(){
  const live = state.tmp.live;
  live.restStartedAt = Date.now();
  live.restRunning = true;
  startTicking('live', tickRest);
  render();
}
function pauseLiveRest(){
  const live = state.tmp.live;
  if(live && live.resting && live.restRunning){ pauseRest(); return; }
  const ft = state.tmp.forTimeBuilder;
  if(ft && ft.phase==='running' && ft.running){ pauseForTimeClock(); return; }
  const am = state.tmp.amrapBuilder;
  if(am && am.phase==='running' && am.running){ pauseAmrapClock(); return; }
  const fl = state.tmp.forLoadBuilder;
  if(fl && fl.phase==='running' && fl.running){ pauseForLoadClock(); return; }
  const g = state.tmp.gps;
  if(g && g.active && g.running){ pauseGpsRun(); return; }
}
function skipRest(){
  stopTicking();
  finishRest();
}
function renderRestScreen(live){
  return `
    <div class="card" style="text-align:center;">
      <div class="stat-label">Pause</div>
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;margin:14px 0;">${fmtClock(live.restRemaining,false)}</div>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn btn-ghost" onclick="setRestPreset(60)">1 Min</button>
        <button class="btn btn-ghost" onclick="setRestPreset(120)">2 Min</button>
        <button class="btn btn-ghost" onclick="setRestPreset(180)">3 Min</button>
      </div>
      <div class="row">
        <button class="btn btn-ghost" onclick="${live.restRunning?'pauseRest()':'resumeRest()'}">${live.restRunning?'Pause':'Weiter'}</button>
        <button class="btn btn-primary" onclick="skipRest()">Weiter zum nächsten Satz</button>
      </div>
    </div>
  `;
}
function exitLiveWorkout(){
  stopTicking();
  state.tmp.wodPhase = 'rows';
  state.tmp.live = null;
  render();
}
function renderWodSummaryPhase(){
  const live = state.tmp.live;
  const durationMs = Date.now() - live.startedAt;
  let totalWeight = 0, totalSets = 0;
  state.tmp.wodMoves.forEach(mv=>{
    mv.sets.forEach(s=>{
      if(s.reps && s.weight){ totalWeight += parseFloat(s.weight)*parseInt(s.reps); totalSets++; }
    });
  });
  return `
    <div class="card" style="text-align:center;">
      <h2>Workout abgeschlossen 🏁</h2>
      <div class="row" style="margin:16px 0;">
        <div><div class="stat-num">${fmtClock(durationMs,false)}</div><div class="stat-label">Dauer</div></div>
        <div><div class="stat-num">${Math.round(totalWeight)}</div><div class="stat-label">kg gesamt</div></div>
        <div><div class="stat-num">${totalSets}</div><div class="stat-label">Sätze</div></div>
      </div>
      <div class="field" style="text-align:left;"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Beschreibung, Runden, Zeit-Cap …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
      <button class="btn btn-primary" onclick="finishAndSaveWorkout()">Workout speichern</button>
    </div>
  `;
}
function finishAndSaveWorkout(){
  stopTicking();
  state.tmp.live = null;
  saveWod();
}

/* ---------- FOR TIME ---------- */
function blankForTimeMove(){
  const ex = state.exercises[0];
  return {exerciseId: ex?.id, reps:'', weight:'', unit: getExerciseType(ex)==='cardio' ? 'kcal' : 'reps'};
}
function ensureForTimeBuilder(){
  if(!state.tmp.forTimeBuilder){
    state.tmp.forTimeBuilder = { phase:'build', movements:[blankForTimeMove()], rounds:'1', repScheme:'', timeCapMin:'', timeCapSec:'', startedAt:null, elapsedMs:0, running:false, timeCapMs:0, capped:false, finalElapsedSec:null, roundsCompleted:0 };
  }
}
function renderForTimeFlow(historyHtml){
  ensureForTimeBuilder();
  const b = state.tmp.forTimeBuilder;
  if(b.phase==='summary') return renderForTimeSummary(b);
  if(b.phase==='running') return renderForTimeRunning(b);

  const uniqueNames = [...new Set(state.workouts.map(w=>w.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  const headerFields = buildHeaderFields(uniqueNames);
  const moveBlocks = b.movements.map((m,mi)=>{
    const ex = state.exercises.find(e=>e.id===m.exerciseId);
    const type = getExerciseType(ex);
    const isCardio = type==='cardio';
    const qtyLabel = isCardio ? (m.unit==='m' ? `Distanz (${distanceUnitLabel()})` : 'Kalorien') : 'Wiederholungen';
    const qtyValue = isCardio && m.unit==='m' ? toDisplayDistance(m.reps) : m.reps;
    const qtyHandler = isCardio ? `updateForTimeMoveQty(${mi},this.value)` : `updateForTimeMove(${mi},'reps',this.value)`;
    const unitToggle = isCardio ? `
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ${m.unit==='kcal'?'btn-primary':'btn-ghost'}" onclick="setForTimeMoveUnit(${mi},'kcal')">Kalorien</button>
        <button type="button" class="btn ${m.unit==='m'?'btn-primary':'btn-ghost'}" onclick="setForTimeMoveUnit(${mi},'m')">${distanceUnitLabel()==='mi'?'Meilen':'Meter'}</button>
      </div>` : '';
    const weightField = type==='weighted' ? `
        <div class="field" style="margin-bottom:0;"><label>Gewicht (${weightUnitLabel()}, optional)</label><input type="number" step="0.5" value="${toDisplayWeight(m.weight)}" oninput="updateForTimeMoveWeight(${mi},this.value)" placeholder="optional"></div>` : '';
    const gpsButton = isRunExercise(ex) && m.unit==='m' ? `<button type="button" class="btn-sm btn-ghost" onclick="startGpsRun('inline',{flow:'for-time',mi:${mi}})">📍 Lauf starten</button>` : '';
    const variantMatch = matchLibraryVariant(ex);
    const variantSelector = variantMatch ? `
      <div class="field"><label>Variante</label>
        <select onchange="updateForTimeMoveVariant(${mi},this.value)">
          ${variantMatch.base.variants.filter(v=>!v.detail || v.id===variantMatch.variant.id)
            .map(v=>`<option value="${v.id}" ${v.id===variantMatch.variant.id?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>` : '';
    return `
    <div class="wod-move-row" data-idx="${mi}">
      <div class="top">
        <select onchange="updateForTimeMove(${mi},'exerciseId',this.value)">
          ${sortedExercises().map(e=>`<option value="${e.id}" ${e.id===m.exerciseId?'selected':''}>${e.name}</option>`).join('')}
        </select>
        <button type="button" class="btn-sm btn-ghost" style="width:auto;flex:0 0 auto;" onclick="openExerciseModal(exId=>updateForTimeMove(${mi},'exerciseId',exId))">➕</button>
        ${b.movements.length>1 ? `<button class="remove-row" onclick="removeForTimeMove(${mi})">✕</button>` : ''}
      </div>
      ${variantSelector}
      ${unitToggle}
      <div class="row">
        <div class="field" style="margin-bottom:0;"><label>${qtyLabel}</label><input type="number" step="1" value="${qtyValue}" oninput="${qtyHandler}" placeholder="z.B. 30"></div>
        ${weightField}
      </div>
      ${gpsButton}
    </div>`;
  }).join('');

  return `
    <div class="card">
      <h2>Neues For Time</h2>
      ${headerFields}
      ${moveBlocks}
      <button class="add-move-btn" onclick="addForTimeMove()">+ Bewegung hinzufügen</button>
      <div class="row">
        <div class="field"><label>Runden (falls kein Rep-Schema)</label><input type="number" step="1" min="1" value="${b.rounds}" oninput="updateForTimeField('rounds',this.value)"></div>
        <div class="field"><label>Rep-Schema (optional)</label><input type="text" value="${escapeHtml(b.repScheme)}" oninput="updateForTimeField('repScheme',this.value)" placeholder="z.B. 21-15-9"></div>
      </div>
      <div class="note" style="margin-bottom:14px;">Rep-Schema überschreibt bei Angabe die Wiederholungen oben — z.B. "21-15-9" erzeugt 3 Runden mit diesen Werten für jede Übung.</div>
      <div class="row">
        <div class="field"><label>Time Cap Min. (optional)</label><input type="number" step="1" min="0" value="${b.timeCapMin}" oninput="updateForTimeField('timeCapMin',this.value)"></div>
        <div class="field"><label>Time Cap Sek. (optional)</label><input type="number" step="1" min="0" max="59" value="${b.timeCapSec}" oninput="updateForTimeField('timeCapSec',this.value)"></div>
      </div>
      <button class="btn btn-primary" onclick="startForTimeWod()">WOD starten</button>
    </div>
    ${historyHtml}
  `;
}
function updateForTimeMove(mi, field, val){
  const b = state.tmp.forTimeBuilder;
  b.movements[mi][field] = val;
  if(field==='exerciseId'){
    const ex = state.exercises.find(e=>e.id===val);
    const type = getExerciseType(ex);
    b.movements[mi].unit = type==='cardio' ? 'kcal' : 'reps';
    if(type!=='weighted') b.movements[mi].weight = '';
    render();
  }
}
function updateForTimeMoveVariant(mi, variantId){
  const b = state.tmp.forTimeBuilder;
  const ex = state.exercises.find(e=>e.id===b.movements[mi].exerciseId);
  const match = matchLibraryVariant(ex);
  if(!match) return;
  const variant = match.base.variants.find(v=>v.id===variantId);
  if(!variant) return;
  const newId = findOrCreateExerciseId(composeVariantName(match.base, variant, ''), variant.type || match.base.type || 'weighted');
  updateForTimeMove(mi, 'exerciseId', newId);
}
function updateForTimeMoveQty(mi, displayVal){
  const b = state.tmp.forTimeBuilder;
  const m = b.movements[mi];
  m.reps = (m.unit==='m' && displayVal!=='') ? String(fromDisplayDistance(displayVal)) : displayVal;
}
function updateForTimeMoveWeight(mi, displayVal){
  const b = state.tmp.forTimeBuilder;
  b.movements[mi].weight = displayVal==='' ? '' : String(fromDisplayWeight(displayVal));
}
function setForTimeMoveUnit(mi, unit){
  state.tmp.forTimeBuilder.movements[mi].unit = unit;
  render();
}
function addForTimeMove(){
  state.tmp.forTimeBuilder.movements.push(blankForTimeMove());
  render();
}
function removeForTimeMove(mi){
  const b = state.tmp.forTimeBuilder;
  b.movements.splice(mi,1);
  if(!b.movements.length) b.movements.push(blankForTimeMove());
  render();
}
function updateForTimeField(field, val){
  state.tmp.forTimeBuilder[field] = val;
}
function startForTimeWod(){
  const b = state.tmp.forTimeBuilder;
  state.tmp.wodDate = document.getElementById('wodDate').value || todayStr();
  state.tmp.wodName = document.getElementById('wodName').value.trim();
  if(!b.movements.length){ showToast('Bitte mindestens eine Übung hinzufügen'); return; }
  b.timeCapMs = (parseInt(b.timeCapMin)||0)*60000 + (parseInt(b.timeCapSec)||0)*1000;
  b.capped = false;
  b.elapsedMs = 0;
  b.roundsCompleted = 0;
  b.startedAt = Date.now();
  b.running = true;
  b.phase = 'running';
  startTicking('live', tickForTime);
  render();
}
function tickForTime(){
  const b = state.tmp.forTimeBuilder;
  if(!b || b.phase!=='running'){ stopTicking(); return; }
  const elapsed = b.elapsedMs + (Date.now()-b.startedAt);
  const display = document.getElementById('timerBigDisplay');
  if(b.timeCapMs>0 && elapsed>=b.timeCapMs){
    b.elapsedMs = b.timeCapMs;
    b.running = false;
    b.capped = true;
    stopTicking();
    beep();
    finishForTime();
    return;
  }
  if(display) display.textContent = fmtClock(elapsed,false);
}
function finishForTime(){
  const b = state.tmp.forTimeBuilder;
  if(b.running){ b.elapsedMs += Date.now()-b.startedAt; b.running=false; }
  stopTicking();
  b.finalElapsedSec = Math.round(b.elapsedMs/1000);
  b.phase = 'summary';
  render();
}
function pauseForTimeClock(){
  const b = state.tmp.forTimeBuilder;
  if(b && b.running){
    b.elapsedMs += Date.now()-b.startedAt;
    b.running = false;
    stopTicking();
  }
  render();
}
function resumeForTimeClock(){
  const b = state.tmp.forTimeBuilder;
  b.startedAt = Date.now();
  b.running = true;
  startTicking('live', tickForTime);
  render();
}
function incrementForTimeRound(delta){
  const b = state.tmp.forTimeBuilder;
  b.roundsCompleted = Math.max(0, b.roundsCompleted + delta);
  render();
}
function renderForTimeRunning(b){
  const displayMs = b.timeCapMs>0 ? Math.max(0, b.timeCapMs-b.elapsedMs) : b.elapsedMs;
  return `
    <div class="card" style="text-align:center;">
      <div class="stat-label">${b.timeCapMs>0?'Verbleibend (Time Cap)':'Zeit läuft'}</div>
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;margin:14px 0;">${fmtClock(displayMs,false)}</div>
      <div class="moves" style="text-align:left;margin-bottom:14px;">
        ${b.movements.map(m=>`<div>${escapeHtml(formatMovementLine(m))}</div>`).join('')}
        ${b.repScheme ? `<div class="note">Schema: ${escapeHtml(b.repScheme)}</div>` : (parseInt(b.rounds)>1 ? `<div class="note">${b.rounds} Runden</div>` : '')}
      </div>
      <div class="stat-num" style="margin:10px 0;">${b.roundsCompleted}<span style="font-size:16px;"> Runden</span></div>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn btn-ghost" onclick="incrementForTimeRound(-1)">-1 Runde</button>
        <button class="btn btn-primary" onclick="incrementForTimeRound(1)">+1 Runde</button>
      </div>
      <div class="row">
        <button class="btn ${b.running?'btn-ghost':'btn-primary'}" onclick="${b.running?'pauseForTimeClock()':'resumeForTimeClock()'}">${b.running?'Pause':'Weiter'}</button>
        <button class="btn btn-primary" onclick="finishForTime()">Fertig</button>
      </div>
    </div>
  `;
}
function renderForTimeSummary(b){
  return `
    <div class="card" style="text-align:center;">
      <h2>Workout abgeschlossen 🏁</h2>
      <div class="stat-num" style="font-size:40px;margin:14px 0;">${fmtClock((b.finalElapsedSec||0)*1000,false)}</div>
      ${b.capped ? `<div class="chip">Time Cap erreicht</div>` : ''}

/* ---------- AMRAP ---------- */
function blankAmrapMove(){
  const ex = state.exercises[0];
  return {exerciseId: ex?.id, reps:'', weight:'', unit: getExerciseType(ex)==='cardio' ? 'kcal' : 'reps'};
}
function ensureAmrapBuilder(){
  if(!state.tmp.amrapBuilder){
    state.tmp.amrapBuilder = { phase:'build', movements:[blankAmrapMove()], durationMin:'20', durationSec:'0', startedAt:null, running:false, remainingMs:0, durationMs:0, roundsCompleted:0, extraReps:'', timedOut:false };
  }
}
function renderAmrapFlow(historyHtml){
  ensureAmrapBuilder();
  const b = state.tmp.amrapBuilder;
  if(b.phase==='summary') return renderAmrapSummary(b);
  if(b.phase==='running') return renderAmrapRunning(b);

  const uniqueNames = [...new Set(state.workouts.map(w=>w.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  const headerFields = buildHeaderFields(uniqueNames);
  const moveBlocks = b.movements.map((m,mi)=>{
    const ex = state.exercises.find(e=>e.id===m.exerciseId);
    const type = getExerciseType(ex);
    const isCardio = type==='cardio';
    const qtyLabel = isCardio ? (m.unit==='m' ? `Distanz (${distanceUnitLabel()})` : 'Kalorien') : 'Wiederholungen pro Runde';
    const qtyValue = isCardio && m.unit==='m' ? toDisplayDistance(m.reps) : m.reps;
    const qtyHandler = isCardio ? `updateAmrapMoveQty(${mi},this.value)` : `updateAmrapMove(${mi},'reps',this.value)`;
    const unitToggle = isCardio ? `
      <div class="row" style="margin-bottom:8px;">
        <button type="button" class="btn ${m.unit==='kcal'?'btn-primary':'btn-ghost'}" onclick="setAmrapMoveUnit(${mi},'kcal')">Kalorien</button>
        <button type="button" class="btn ${m.unit==='m'?'btn-primary':'btn-ghost'}" onclick="setAmrapMoveUnit(${mi},'m')">${distanceUnitLabel()==='mi'?'Meilen':'Meter'}</button>
      </div>` : '';
    const weightField = type==='weighted' ? `
        <div class="field" style="margin-bottom:0;"><label>Gewicht (${weightUnitLabel()}, optional)</label><input type="number" step="0.5" value="${toDisplayWeight(m.weight)}" oninput="updateAmrapMoveWeight(${mi},this.value)" placeholder="optional"></div>` : '';
    const gpsButton = isRunExercise(ex) && m.unit==='m' ? `<button type="button" class="btn-sm btn-ghost" onclick="startGpsRun('inline',{flow:'amrap',mi:${mi}})">📍 Lauf starten</button>` : '';
    const variantMatch = matchLibraryVariant(ex);
    const variantSelector = variantMatch ? `
      <div class="field"><label>Variante</label>
        <select onchange="updateAmrapMoveVariant(${mi},this.value)">
          ${variantMatch.base.variants.filter(v=>!v.detail || v.id===variantMatch.variant.id)
            .map(v=>`<option value="${v.id}" ${v.id===variantMatch.variant.id?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>` : '';
    return `
    <div class="wod-move-row" data-idx="${mi}">
      <div class="top">
        <select onchange="updateAmrapMove(${mi},'exerciseId',this.value)">
          ${sortedExercises().map(e=>`<option value="${e.id}" ${e.id===m.exerciseId?'selected':''}>${e.name}</option>`).join('')}
        </select>
        <button type="button" class="btn-sm btn-ghost" style="width:auto;flex:0 0 auto;" onclick="openExerciseModal(exId=>updateAmrapMove(${mi},'exerciseId',exId))">➕</button>
        ${b.movements.length>1 ? `<button class="remove-row" onclick="removeAmrapMove(${mi})">✕</button>` : ''}
      </div>
      ${variantSelector}
      ${unitToggle}
      <div class="row">
        <div class="field" style="margin-bottom:0;"><label>${qtyLabel}</label><input type="number" step="1" value="${qtyValue}" oninput="${qtyHandler}" placeholder="z.B. 10"></div>
        ${weightField}
      </div>
      ${gpsButton}
    </div>`;
  }).join('');

  return `
    <div class="card">
      <h2>Neues AMRAP</h2>
      ${headerFields}
      ${moveBlocks}
      <button class="add-move-btn" onclick="addAmrapMove()">+ Bewegung hinzufügen</button>
      <div class="row">
        <div class="field"><label>Dauer Min.</label><input type="number" step="1" min="0" value="${b.durationMin}" oninput="updateAmrapField('durationMin',this.value)"></div>
        <div class="field"><label>Dauer Sek.</label><input type="number" step="1" min="0" max="59" value="${b.durationSec}" oninput="updateAmrapField('durationSec',this.value)"></div>
      </div>
      <button class="btn btn-primary" onclick="startAmrapWod()">AMRAP starten</button>
    </div>
    ${historyHtml}
  `;
}
function updateAmrapMove(mi, field, val){
  const b = state.tmp.amrapBuilder;
  b.movements[mi][field] = val;
  if(field==='exerciseId'){
    const ex = state.exercises.find(e=>e.id===val);
    const type = getExerciseType(ex);
    b.movements[mi].unit = type==='cardio' ? 'kcal' : 'reps';
    if(type!=='weighted') b.movements[mi].weight = '';
    render();
  }
}
function updateAmrapMoveVariant(mi, variantId){
  const b = state.tmp.amrapBuilder;
  const ex = state.exercises.find(e=>e.id===b.movements[mi].exerciseId);
  const match = matchLibraryVariant(ex);
  if(!match) return;
  const variant = match.base.variants.find(v=>v.id===variantId);
  if(!variant) return;
  const newId = findOrCreateExerciseId(composeVariantName(match.base, variant, ''), variant.type || match.base.type || 'weighted');
  updateAmrapMove(mi, 'exerciseId', newId);
}
function updateAmrapMoveQty(mi, displayVal){
  const b = state.tmp.amrapBuilder;
  const m = b.movements[mi];
  m.reps = (m.unit==='m' && displayVal!=='') ? String(fromDisplayDistance(displayVal)) : displayVal;
}
function updateAmrapMoveWeight(mi, displayVal){
  const b = state.tmp.amrapBuilder;
  b.movements[mi].weight = displayVal==='' ? '' : String(fromDisplayWeight(displayVal));
}
function setAmrapMoveUnit(mi, unit){
  state.tmp.amrapBuilder.movements[mi].unit = unit;
  render();
}
function addAmrapMove(){
  state.tmp.amrapBuilder.movements.push(blankAmrapMove());
  render();
}
function removeAmrapMove(mi){
  const b = state.tmp.amrapBuilder;
  b.movements.splice(mi,1);
  if(!b.movements.length) b.movements.push(blankAmrapMove());
  render();
}
function updateAmrapField(field, val){
  state.tmp.amrapBuilder[field] = val;
}
function startAmrapWod(){
  const b = state.tmp.amrapBuilder;
  state.tmp.wodDate = document.getElementById('wodDate').value || todayStr();
  state.tmp.wodName = document.getElementById('wodName').value.trim();
  if(!b.movements.length){ showToast('Bitte mindestens eine Übung hinzufügen'); return; }
  b.durationMs = (parseInt(b.durationMin)||0)*60000 + (parseInt(b.durationSec)||0)*1000;
  if(b.durationMs<=0){ showToast('Bitte eine Dauer eingeben'); return; }
  b.remainingMs = b.durationMs;
  b.roundsCompleted = 0;
  b.timedOut = false;
  b.startedAt = Date.now();
  b.running = true;
  b.phase = 'running';
  startTicking('live', tickAmrap);
  render();
}
function tickAmrap(){
  const b = state.tmp.amrapBuilder;
  if(!b || b.phase!=='running'){ stopTicking(); return; }
  const remaining = b.remainingMs - (Date.now()-b.startedAt);
  const display = document.getElementById('timerBigDisplay');
  if(remaining<=0){
    b.remainingMs = 0;
    b.running = false;
    b.timedOut = true;
    stopTicking();
    beep();
    render();
    return;
  }
  if(display) display.textContent = fmtClock(remaining,false);
}
function incrementAmrapRound(delta){
  const b = state.tmp.amrapBuilder;
  b.roundsCompleted = Math.max(0, b.roundsCompleted + delta);
  render();
}
function finishAmrap(){
  const b = state.tmp.amrapBuilder;
  if(b.running){ b.remainingMs = Math.max(0, b.remainingMs - (Date.now()-b.startedAt)); b.running=false; }
  stopTicking();
  b.timedOut = true;
  render();
}
function pauseAmrapClock(){
  const b = state.tmp.amrapBuilder;
  if(b && b.running){
    b.remainingMs = Math.max(0, b.remainingMs - (Date.now()-b.startedAt));
    b.running = false;
    stopTicking();
  }
  render();
}
function resumeAmrapClock(){
  const b = state.tmp.amrapBuilder;
  b.startedAt = Date.now();
  b.running = true;
  startTicking('live', tickAmrap);
  render();
}
function confirmAmrapExtraReps(){
  const b = state.tmp.amrapBuilder;
  b.extraReps = document.getElementById('amrapExtraReps').value || '0';
  b.phase = 'summary';
  render();
}
function renderAmrapRunning(b){
  if(b.timedOut){
    return `
      <div class="card" style="text-align:center;">
        <div class="stat-label">Zeit abgelaufen</div>
        <div class="stat-num accent" style="margin:10px 0;">${b.roundsCompleted} Runden</div>
        <div class="field" style="text-align:left;"><label>Weitere Wiederholungen in der laufenden Runde</label><input type="number" step="1" min="0" id="amrapExtraReps" value="${b.extraReps}" placeholder="z.B. 12"></div>
        <button class="btn btn-primary" onclick="confirmAmrapExtraReps()">Weiter</button>
      </div>
    `;
  }
  return `
    <div class="card" style="text-align:center;">
      <div class="stat-label">Verbleibend</div>
      <div id="timerBigDisplay" class="stat-num" style="font-size:48px;margin:10px 0;">${fmtClock(b.remainingMs,false)}</div>
      <div class="moves" style="text-align:left;margin-bottom:14px;">

      <div class="row" style="margin-bottom:10px;">

        <button class="btn btn-primary" onclick="incrementAmrapRound(1)">+1 Runde</button>

        <button class="btn ${b.running?'btn-ghost':'btn-primary'}" onclick="${b.running?'pauseAmrapClock()':'resumeAmrapClock()'}">${b.running?'Pause':'Weiter'}</button>
        <button class="btn btn-primary" onclick="finishAmrap()">Fertig</button>
      </div>
    </div>
  `;
}
function renderAmrapSummary(b){
  return `
    <div class="card" style="text-align:center;">
      <h2>Workout abgeschlossen 🏁</h2>
      <div class="stat-num" style="font-size:34px;margin:14px 0;">${b.roundsCompleted} Runden${parseInt(b.extraReps)?' + '+b.extraReps+' Wdh.':''}</div>
      <div class="field" style="text-align:left;"><label>Notiz</label><textarea id="wodNote" rows="2" oninput="state.tmp.wodNote=this.value" placeholder="Beschreibung, Runden, Zeit-Cap …">${escapeHtml(state.tmp.wodNote||'')}</textarea></div>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="saveAmrapWorkout()">Workout speichern</button>
    </div>
  `;
}
async function saveAmrapWorkout(){

function startForLoadWod(){

  b.running = true;
  b.phase = 'running';
  startTicking('live', tickForLoad);
  render();
}
function tickForLoad(){
  const b = state.tmp.forLoadBuilder;
  if(!b || b.phase!=='running'){ stopTicking(); return; }

  const display = document.getElementById('timerBigDisplay');
  if(b.timeCapMs>0 && elapsed>=b.timeCapMs){
    b.elapsedMs = b.timeCapMs;
    b.running = false;
    stopTicking();
    beep();
    render();

}
function pauseForLoadClock(){

  if(b && b.running){

  }

}
function resumeForLoadClock(){
  const b = state.tmp.forLoadBuilder;
  b.startedAt = Date.now();
  b.running = true;
  startTicking('live', tickForLoad);
  render();
}
function updateForLoadWeight(val){

}
function finishForLoad(){

}

function generateWodRows(){
  state.tmp.wodDate = document.getElementById('wodDate').value || todayStr();
  state.tmp.wodName = document.getElementById('wodName').value.trim();
  const isEmom = state.tmp.wodFormat==='emom';
  const tmpl = state.tmp.wodTemplate;

  const effectiveSetsCount = tmpl.map((t,ti)=>{
    const isFollower = ti>0 && tmpl[ti-1].groupWithNext;
    if(isFollower) return null;
    const ex = state.exercises.find(e=>e.id===t.exerciseId);
    const isCardio = getExerciseType(ex)==='cardio';
    const pctArr = parsePctList(t.pctList);
    let setsCount = parseInt(t.setsCount) || (isCardio ? 1 : Math.max(pctArr.length,1));
    if(isEmom && !t.setsCount){
      setsCount = parseInt(state.tmp.emomRounds) || setsCount;
    }
    return setsCount;
  });
  for(let ti=1; ti<tmpl.length; ti++){
    if(effectiveSetsCount[ti]==null) effectiveSetsCount[ti] = effectiveSetsCount[ti-1];
  }

  const groupIdArr = new Array(tmpl.length).fill(null);
  let gStart = 0;
  for(let ti=0; ti<tmpl.length; ti++){
    if(ti===tmpl.length-1 || !tmpl[ti].groupWithNext){
      if(ti>gStart){
        const gid = 'g'+gStart;
        for(let k=gStart;k<=ti;k++) groupIdArr[k]=gid;
      }
      gStart = ti+1;
    }
  }

  state.tmp.wodMoves = tmpl.map((t,ti)=>{
    const ex = state.exercises.find(e=>e.id===t.exerciseId);
    const isCardio = getExerciseType(ex)==='cardio';
    const pctArr = parsePctList(t.pctList);
    const setsCount = effectiveSetsCount[ti];
    const known1rm = bestE1RM(t.exerciseId);
    const sets = [];
    for(let si=0; si<setsCount; si++){
      if(isCardio){
        sets.push({reps: t.qty || '', weight:'', pct:null, autoFilled: !!t.qty});
      } else {
        const pct = pctForIndex(pctArr, si);
        let weight='', autoFilled=false;
        if(pct && known1rm){
          weight = roundToIncrement(known1rm*pct/100);
          autoFilled = true;
        } else if(t.weight){
          weight = t.weight;
          autoFilled = true;
        }
        sets.push({reps: t.repsTarget || '', weight, pct: pct||null, autoFilled});
      }
    }
    const timing = isEmom ? `Every ${state.tmp.emomMin}:${String(state.tmp.emomSec).padStart(2,'0')}` : t.timing;
    return { exerciseId:t.exerciseId, timing, pctList: isCardio ? '' : t.pctList, setsCountRaw:t.setsCount, unit: isCardio ? t.unit : null, repsTarget: t.repsTarget||'', groupId: groupIdArr[ti], sets };
  });
  state.tmp.wodPhase = 'rows';
  applyFeelingFillIfNeeded();
  render();
}
function backToTemplate(){
  state.tmp.wodPhase = 'template';
  render();
}
function applyFeelingFillIfNeeded(){
  if(!state.tmp.wodNameMatch || !state.tmp.wodFeeling) return;
  state.tmp.wodMoves.forEach((mv,mi)=>{
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    if(getExerciseType(ex)==='cardio') return;
    const prevMv = state.tmp.wodNameMatch.movements[mi];
    if(!prevMv) return;
    mv.sets.forEach((s,si)=>{
      if(s.weight==='' || s.autoFilled){
        const prevSet = prevMv.sets[si];
        if(prevSet && prevSet.weight){
          s.weight = roundToIncrement(prevSet.weight * FEELING_ADJUST[state.tmp.wodFeeling]);
          s.autoFilled = true;
        }
      }
    });
  });
}
function pickWodFeeling(f){

}
function updateSetField(mi, si, field, val){

async function saveWod(){
  const date = state.tmp.wodDate || todayStr();
  const name = (state.tmp.wodName||'').trim();
  const note = state.tmp.wodNote || '';
  const movements = state.tmp.wodMoves.map(mv=>{
    const ex = state.exercises.find(e=>e.id===mv.exerciseId);
    const isCardio = getExerciseType(ex)==='cardio';
    const sets = isCardio
      ? mv.sets.filter(s=>s.reps).map(s=>({ reps: parseFloat(s.reps), weight: null, pct: null }))
      : mv.sets.filter(s=>s.reps && s.weight).map(s=>({ reps: parseInt(s.reps), weight: parseFloat(s.weight), pct: s.pct || null }));
    return { exerciseId: mv.exerciseId, timing: mv.timing || '', unit: isCardio ? mv.unit : null, repsTarget: mv.repsTarget || '', groupId: mv.groupId ?? null, sets };
  }).filter(mv=>mv.sets.length>0);
  if(!movements.length){ showToast('Bitte mindestens einen Satz mit gültigen Werten eingeben'); return; }
  state.workouts.push({id:uid(), date, name, note, movements});
  await saveKey('workouts', state.workouts);
  state.tmp.wodTemplate = null;
  state.tmp.wodMoves = null;
  state.tmp.wodPhase = 'template';
  state.tmp.wodDate = null;
  state.tmp.wodName = null;
  state.tmp.wodNameMatch = null;
  state.tmp.wodFeeling = null;

  showToast('Workout gespeichert 🏋️');
