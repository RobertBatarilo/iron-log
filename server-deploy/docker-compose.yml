services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    command: ["--migrationsDir=/pb_migrations"]
    volumes:
      - pocketbase_data:/pb_data
      - ./pb_hooks:/pb_hooks
      - ./pb_migrations:/pb_migrations
    networks:
      - n8n-docker-caddy_default

  push-service:
    build: ./push-service
    container_name: push-service
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - n8n-docker-caddy_default

  ai-photo-service:
    build: ./ai-photo-service
    container_name: ai-photo-service
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - n8n-docker-caddy_default

  stripe-webhook-service:
    build: ./stripe-webhook-service
    container_name: stripe-webhook-service
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - n8n-docker-caddy_default

volumes:
  pocketbase_data:

networks:
  n8n-docker-caddy_default:
    external: true
